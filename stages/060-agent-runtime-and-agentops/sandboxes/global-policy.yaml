# Durable complete gateway-global policy; all workspace effects are explicit.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /bin, /lib, /lib64, /etc, /proc, /dev/urandom, /dev/random, /opt/hermes-agent, /opt/hermes-venv, /opt/rhoai3/080.pins, /opt/rhoai3/hermes-api/packaging-evidence.json]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: hard_requirement
network_policies:
  opencode_maas:
    name: opencode-maas
    endpoints:
      - host: __MAAS_COMMON_HOST__
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    binaries:
      - path: /usr/local/bin/opencode
  hermes_maas:
    name: hermes-maas
    endpoints:
      - host: __MAAS_COMMON_HOST__
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
    # The immutable Hermes image's physical ELF; never the shared system Python.
    binaries:
      - path: /opt/hermes-venv/bin/python3.11
