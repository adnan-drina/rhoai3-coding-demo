# Canary rule (SAD §5.1). It must fire on any Java application. Its
# incidents are NOT migration obligations: the planner filters the
# `migration.yaml` `analysis.canary_rule_id` out of the obligation set and
# records only `mta.canary.fired`. A run whose effective ruleset excluded
# this rule (wrong --target label, missing --rules, kantra fallback without
# custom rules) yields ledger BLOCK CANARY_MISSING.
- ruleID: rhoai3-canary-00001
  category: optional
  effort: 0
  description: Stage 080 canary — proves the custom ruleset was in the effective rule selection
  message: rhoai3 canary fired (custom ruleset loaded)
  labels:
    - konveyor.io/target=quarkus
    - konveyor.io/target=jakarta-ee9
    - konveyor.io/target=cloud-readiness
    - konveyor.io/target=openjdk21
  when:
    builtin.filecontent:
      pattern: "class"
      filePattern: ".*\\.java"
