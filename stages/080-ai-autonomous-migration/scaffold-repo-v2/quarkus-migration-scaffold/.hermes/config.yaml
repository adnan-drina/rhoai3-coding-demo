# User-tier Hermes config stub for harness-v2 (AD-019).
#
# Precedence (Managed Scope page, not the Configuration page's 4-tier list):
#   managed ($HERMES_MANAGED_DIR) > user (this file / HERMES_HOME) > defaults.
# Secrets never belong here. Seat model, providers, and API keys are Managed
# Scope + managed .env (${env:MAAS_API_KEY}). Do not author fallback_providers
# (AD-008: Qwen primary; MiniMax exception-only; no silent failover).
#
# Official cites:
#   https://hermes-agent.nousresearch.com/docs/user-guide/managed-scope
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/kanban
#   https://hermes-agent.nousresearch.com/docs/user-guide/features/hooks
#   https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models

# Gateway-embedded dispatcher. Do not run standalone `hermes kanban daemon`
# or `kanban daemon --force` (dual-dispatcher races). No gateway ⇒ ready waits.
kanban:
  dispatch_in_gateway: true
  # Official default review_dispatch: true (spawn assigned reviewer).
  # N-1 (request_review / request_changes) lands with the kernel, not here.

# Non-TTY kanban workers skip newly declared shell hooks unless one of
# --accept-hooks | HERMES_ACCEPT_HOOKS=1 | hooks_auto_accept: true.
# Required before the K2 write fence (pre_tool_call fail_closed) can fire.
hooks_auto_accept: true
