# Migration provenance record — stamped by the app-migration template.
# The legacy application is intentionally NOT registered in the catalog;
# this file is the durable record of where the migration started.
migration:
  legacyRepoUrl: https://github.com/adnan-drina/coolstore-cart-legacy.git
  target: quarkus
  provisionedBy: app-migration golden-path template
  # Package identity — the ONLY place the rename is defined. The harness
  # (harvest-fidelity, plan-lint) and the harvest sed read these; nothing
  # hardcodes a package. A different legacy app sets its own roots here.
  legacyPackage: com.redhat.coolstore
  targetPackage: com.demo
acceptance:
  # The harness supervisor asserts this after deploy (M5 ship success).
  # O-ACCEPTGEN: collection/service/endpointEnv/itemType parameterize the
  # ship-proof shape (sensors G-CAT/G-CATBODY + acceptance-products.py).
  # Bare-array specimens (Poll 81 / B1 — REST petclinic GET /petclinic/api/vets):
  #   collection: _array
  #   getter: getAllVets
  #   service: ClinicService
  #   itemType: VetDto
  #   path: /petclinic/api/vets
  path: /api/cart/acceptance-check
  collection: products
  service: CatalogService
  endpointEnv: CATALOG_ENDPOINT
  itemType: Product
  needsDatabase: false
  # R-83 P2 / O-DEVDBURL: sensors/boot DEV_DB_URL uses dbService/dbName when
  # set; omit → ${PROJECT_KEY}-postgres / ${PROJECT_KEY}. Cart has
  # needsDatabase:false so unused; DB-backed specimens set needsDatabase:true
  # and rely on PROJECT_KEY defaults (or override dbName if needed).
  # dbService:   # omit → ${PROJECT_KEY}-postgres
  # dbName:      # omit → ${PROJECT_KEY}
analysis:
  # MTA rule selection is LABEL FILTERING (targets pick only matching
  # rules; everything else is silently excluded). Decided set (validated
  # 2026-07-27 A/B on the cart legacy): the migration path, the jakarta
  # namespace jump, cloud-readiness (OpenShift deploy), the JDK jump.
  # NO source filter — it only narrows (excludes source-labelless rules
  # incl. custom ones). Applies to IDE analysis AND the harness run.
  # Poll 81 E2 / petclinic PROBE: materialize mode (PROBE: source-only ≡ full).
  mode: source-only
  targets: [quarkus, jakarta-ee9, cloud-readiness, openjdk17]
targetContract:
  # The DECIDED modern contract for REDESIGN classes (services/endpoints).
  # M1 §7 reads this as authoritative instead of a model re-deriving a
  # faithful (defect-preserving) contract. EVERY shape is gated by its flag
  # here — the rubric enforces only the ones set true; MAPPINGS is the
  # catalog of options. Behavior-CHANGING items (getIdempotent/validate/
  # mapErrors) are an explicit operator decision — this demo modernizes the
  # cart API; an app with external consumers may set them false. Behavior-
  # PRESERVING items (thread-safety, cache) are safe to enable but still
  # gated: a stateless service leaves them false.
  getIdempotent: true       # GET returns 404 on missing, never creates state
  validateInput: true       # invalid params (quantity<=0) -> 400 problem-detail
  mapErrors: true           # downstream failures -> 503 via ExceptionMapper (no raw 500)
  threadSafeState: true     # ConcurrentHashMap + compute() on singleton state
  cacheRefreshGuard: true   # no clear-on-miss; bounded refresh
  normalizeBeforeDerive: true  # dedupe/normalize before computing totals (consistent line items vs totals)
preserve:
  # Enforced: plan-lint maps each item to a task; the preflight sensor
  # greps them in src/main|pom|k8s. Populate from the analysis's
  # preserve-candidate findings (demo-env-integration rule) before the
  # run — an erased integration is a functional regression no unit test
  # catches.
  - CATALOG_ENDPOINT
forbidden:
  # Fabrication tripwires: sensors fail any commit introducing these
  # into src/main (hardcoded stand-ins for external services).
  - getMockProducts
  - "Fallback to mock"
