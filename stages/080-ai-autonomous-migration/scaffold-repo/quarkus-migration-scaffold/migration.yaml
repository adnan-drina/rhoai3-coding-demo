# Golden scaffold defaults — per-run repos overwrite provenance via the
# app-migration template stamp. analysis.targets is the harness contract
# (AD-003 amendment A): --target only, never --source.
migration:
  legacyRepoUrl: ""
  target: quarkus
  provisionedBy: quarkus-migration-scaffold
  needsDatabase: false
  # Per-run package stamp (Operator E-20260811T150800Z) — coolstore overwrites
  legacyBasePackage: org.springframework.samples.petclinic
  path_rewrites:
    - from: src/main/java/com/demo/
      to: src/main/java/org/springframework/samples/petclinic/
    - from: src/test/java/com/demo/
      to: src/test/java/org/springframework/samples/petclinic/

analysis:
  targets:
    - quarkus
    - jakarta-ee9
    - cloud-readiness
    - openjdk21
