# Golden scaffold defaults — per-run repos overwrite provenance via the
# app-migration template stamp. analysis.targets is the harness contract
# (AD-003 amendment A): --target only, never --source.
#
# Specimen-agnostic (Deputy E-20260813T184217Z): golden must NOT ship a demo
# legacyBasePackage / path_rewrites / intra_package_maps. Stamp comes from the
# RHDH app-migration template or from M1 inventory derive — never inherit a
# specimen by copy.
migration:
  legacyRepoUrl: ""
  target: quarkus
  provisionedBy: quarkus-migration-scaffold
  needsDatabase: false
  legacyBasePackage: ""
  path_rewrites: []
  intra_package_maps: []

analysis:
  targets:
    - quarkus
    - jakarta-ee9
    - cloud-readiness
    - openjdk21
