# Neutral golden — Quarkus 3.27 Basic + path authz + JDBC identity (H2)
quarkus.http.auth.basic=true

quarkus.http.auth.permission.admin.paths=/api/admin
quarkus.http.auth.permission.admin.policy=authenticated

quarkus.security.jdbc.enabled=true
quarkus.security.jdbc.principal-query.sql=SELECT u.password, u.role FROM test_user u WHERE u.username=?
quarkus.security.jdbc.principal-query.clear-password-mapper=true
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=1
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:authz;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
