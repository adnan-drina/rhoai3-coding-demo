# AD-H §15 + §16 — per-phase kanban_create dispatch seed.
# Every M-phase task must set max_runtime_seconds from this file (native
# recovery: SIGTERM + re-queue, outcome=timed_out). Do not omit.
#
# skills[] = declared preload / intended skill set (AD-H §16) — not Hermes RBAC.
# One Kanban task ⇒ one task type (examining / planning / writing / checking).
# Enforcement: SOUL + write-safe-root + acks + write-fence + lints.
# Spec-kit /speckit-* skills live under ~/.hermes/skills (Path.home()); keep
# that path on skills.external_dirs. Never include /speckit-implement.
#
# workspace_kind / workspace_path / body / parents / idempotency_key land
# with the full phase schema (§15.3). Until then:
#   - workspace_kind defaults to scratch — NEVER rely on it
#   - every phase must eventually set workspace_kind: dir|worktree + absolute
#     workspace_path to the migration repo
#
# Watchdog STUCK_SECONDS (observation, §15.2) must exceed max(budgets).
# Role persona keys (role:/roles:/skills_by_role:) retired — Architect
# E-20260813T144117Z / Operator E-20260813T143534Z.
# C-2(a) single-persona: cards use Hermes profile `default`. Named
# analyzer/planner/implementer/validator profiles are retired (R-V14.10).
# Pillar heads stay Cursor. Do not hermes profile create --clone.
#
# M3 skills[] is the **story attach pool** (B-16), not the park-at-birth card.
# Park-at-birth M3 is the WAVE HOLDER (Architect 102636Z): holder-card-body.md,
# zero --skill pins, path-invoke mint-m3-hermes.md. dispatch-phase.sh clears
# SKILLS=() for that card. Do **not** pin one-three-one-rule (I-11) or
# dispatch-phase (I-10 B / 25a7c1e9). Keep the five names in skills.disabled.
# Do not pin check-spec-readiness on the holder until story bodies exist
# (Architect 094840Z). mint-m3-hermes.md attaches check-spec-readiness plus
# identity.operand_skills on story children after bodies exist.
# Serial law is NOT retired. AD-002E skills_unused stays attached
# as a measured signal (B-17 raised, not retired).

phases:
  M1:
    # ANALYZE — MTA/kantra + inventory + profile authoring
    # files_writable: [] = published empty set (Architect 073040Z). Omit was
    # unpublished/fail-open. Empty list: no worker dest writes; in-window
    # DEST_FILES edits are OOS unless a runtime SR-8 producer is cited.
    skills:
      - derive-legacy-boot3
      - scan-with-mta
      - inventory-entry-points
    # check-spec-readiness not attached (Operator 093930Z): M1 path-invokes
    # scan-with-mta check-findings-handoff; do not preload 23-script skill.
    max_runtime_seconds: 3600
    requires_acks: []
    files_writable: []
  M2:
    # GR2 / Operator E-20260813T211843Z — unified PLAN (partition + Spec Kit).
    # Mint is the wave-holder session: references/mint-m3-hermes.md after M2 done.
    # M2a/M2b split retired; stubs below kept for tip-sync / attach-matrix until F9.
    skills:
      - scan-with-mta
      - speckit-specify
    # Operator 093930Z: drop check-spec-readiness (path-invoke) and
    # derive-story-oracles (zero scripts; M2 skill_view is speckit-*).
    # I-4 / Architect 132530Z / Operator 1411Z / BIND 25a7c1e9: publish
    # the phase-fixed write-set. Omit was unpublished/deny-all. Fence:
    # card/env, else this yaml key, else deny-all.
    files_writable:
      - .specify/
      - specs/
    max_runtime_seconds: 3600
    requires_acks:
      - m1-findings
  M2a:
    # RETIRED GR2 — do not dispatch; use M2. Stub skills mirror M2 for attach-matrix.
    skills:
      - scan-with-mta
      - speckit-specify
    max_runtime_seconds: 3600
    requires_acks:
      - m1-findings
  M2b:
    # RETIRED GR2 — do not dispatch; use M2 + holder mint-m3-hermes.md. Stub for attach-matrix.
    skills:
      - scan-with-mta
    max_runtime_seconds: 3600
    requires_acks:
      - m1-findings
  M3:
    # STORY attach pool only. Park-at-birth card is the WAVE HOLDER (102636Z).
    # IMPLEMENT — per-unit transform (minted story children)
    # Children MUST be created via
    # .hermes/skills/harness/dispatch-phase/references/mint-m3-hermes.md
    # (bare hermes kanban create omits these skills — grounding study 20260809).
    # AD-002F — useful = influence. M3 skills[] is the allow-list pool (B-16).
    # Pool MUST cover OPERAND_CLASS_SKILLS plus check-spec-readiness
    # (check-phase-attach-matrix.py). mint Procedure attaches lint +
    # identity.operand_skills; do not subset attach stdout to this list.
    # Drop zero-touch (check-domain-parity→M4, enforce-authority-boundary/
    # ground-in-harvest/record-run-evidence unread on S-001…S-006).
    # Workers consult via skill_view. Typed skills_unused is a measured
    # signal (B-17 raised to Architect; not retired on the strength of a plan).
    #
    # Architect E-20260813T152211Z / Lead wire-or-retire: do NOT re-attach
    # ground-in-harvest or record-run-evidence to skills[] (opt-in ≠
    # enforcement). They are harness-invoked on create (body digest /
    # checkpoint) and on complete via assert-complete-exit-criteria.py
    # (citation + body-digest + provenance). Physical move → .hermes/skills/harness/
    # at v14 mint with UPLIFT-6.
    #
    # I-4 / BIND 25a7c1e9: do NOT publish files_writable here. Story
    # write-sets are per-card (2–3 paths). A phase union would grant every
    # story ~25 paths and destroy A-5. Fence: card, else yaml, else deny-all.
    skills:
      - check-spec-readiness
      - derive-story-oracles
      - configure-quarkus-profiles
      - form-entity-persistence
      - spring-to-quarkus-patterns
      - manage-quarkus-extensions
      - reference-rh-quarkus-pom
      - bootstrap-quarkus-project
    # AD-H §18 required_checks (validator/sensor matrix)
    required_checks:
      - compile
      - task_scoped_tests
      - g2_if_harvest
    max_runtime_seconds: 2700
    max_retries: 2
    requires_acks:
      - m1-findings
      - brief-identity
  M4:
    # VERIFY — verdict token PROVISIONAL_ACCEPT (AD-H §18.0). G-1 = volume+substance;
    # g1_kill_ratio must be pending_threshold until threshold pinned (option A).
    verdict_token: PROVISIONAL_ACCEPT
    accept_kind: provisional
    # AD-002G matrix: check-spec-readiness + check-domain-parity required; helpers allowed.
    # Wave B: validate-contracts + enforce-authority-boundary are enforcement
    # path-invoke only — never card-attach.
    skills:
      - check-spec-readiness
      - check-domain-parity
      - check-release-readiness
    required_checks:
      - mvn_clean_verify
      - unit_it_contract
      - sonar
      - boot_health
      - g1_characterization
      - g2_if_harvest
    # I-4 / BIND 25a7c1e9: publish the phase-fixed set. VERIFY does not
    # write dest product trees. [] = published empty (not omit).
    files_writable: []
    max_runtime_seconds: 1800
    requires_acks:
      - m1-findings
      - brief-identity
  M5:
    # CLOSE — full ACCEPT (G-4 closes G-1 residue). Kill-ratio PASS+pin
    # required; a waiver cannot author ACCEPT (B-4/C-3(a)). G-4 fail after
    # provisional → reopen that story.
    # Standing entry-point descopes ⇒ SCOPED_ACCEPT only (check-accept-scope.py).
    accept_kind: full
    # AD-002G matrix: check-spec-readiness + check-domain-parity required; helpers allowed.
    # Wave B: enforcement leaves path-invoke only.
    skills:
      - check-spec-readiness
      - scan-with-mta
      - check-domain-parity
      - check-release-readiness
    required_checks:
      - preflight
      - regression_suite
      - sonar
      - mta_rescan
      - g3_findings_delta
      - acceptance_live
      - g4_runtime_parity
      - accept_scope  # check-accept-scope.py — SCOPED_ACCEPT if descopes
    # I-4 / BIND 25a7c1e9: publish the phase-fixed set. CLOSE does not
    # write dest product trees. [] = published empty (not omit).
    files_writable: []
    max_runtime_seconds: 2400
    requires_acks:
      - m1-findings
      - brief-identity
  factory:
    # Candidate SHA → factory green → promote that SHA (§16.3 / §18.1 / finding 4).
    # must_not_contradict_m5_accept = full M5 ACCEPT only (§18.0).
    # Provisional M4 / provisional-labeled M5 must refuse.
    required_checks:
      - compile
      - unit_it_contract
      - sonar
      - security
      - deploy_smoke
      - must_not_contradict_m5_accept
      - candidate_sha_then_promote


watchdog:
  # max(phases)=3600 + 600s grace for "still running after native recovery"
  # Observation only (kanban-stuck-watchdog.py). Hard budget is a separate
  # action layer — AD-009 §3 step 6:
  #   python3 .hermes/home/scripts/enforce-max-runtime-hard.py --apply
  # Silent exit typing — AD-009 §3.1:
  #   python3 .hermes/home/scripts/apply-protocol-untyped-terminal.py --task-id t_… --block
  stuck_seconds: 4200
