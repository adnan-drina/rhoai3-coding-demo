# A-1 overlay — native ingress (Architect E-20260817T061720Z / E-20260817T063500Z).
# Install: copied to .specify/workflows/overlays/speckit/ at provision.
# Inspect: specify workflow resolve speckit
# Run:     specify workflow run speckit
# Never run the stock speckit workflow without this overlay (it ends at implement).
# 163200Z §S.7 / Research 174900Z: stock review-spec and review-plan are type: gate.
# Unattended path must remove those gates as well as implement.
# OBJECT: do not put mint-transcribed HTTP endpoints or "no backticks" in args.
# 192444Z OBJECT: do not lock Dependencies to the US_ALL_DEPS fixture regex.
# Emit pin lives in .specify/templates/overrides/tasks-template.md (full-file override).
id: "stop-before-implement"
extends: "speckit"
priority: 10
edits:
  - remove: implement
  - remove: review-spec
  - remove: review-plan
  - insert_before: plan
    step:
      id: clarify
      command: speckit.clarify
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}"
  - replace: specify
    step:
      id: specify
      command: speckit.specify
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}\n\nM1 evidence (read these files; do not invent endpoints or rule IDs):\nevidence/findings-handoff.json\nevidence/entry-point-inventory.json"
  - replace: tasks
    step:
      id: tasks
      command: speckit.tasks
      integration: "{{ inputs.integration }}"
      input:
        args: "{{ inputs.spec }}\n\nM1 evidence (same files as specify; cover every HTTP row in evidence/entry-point-inventory.json, including http_path: /):\nevidence/findings-handoff.json\nevidence/entry-point-inventory.json\n\nFollow .specify/templates/overrides/tasks-template.md: one creator phase per dest path; Add/Verify remain amend. Destination REST is JAX-RS (constitution III). Do not invent a RestController-to-Resource filename mapper."
