# Project SDD workflow — terminates at tasks. Kanban is the executor.
# Run: specify workflow run .specify/workflows/sdd-to-tasks.yml
# Do NOT run the stock speckit workflow (it ends at implement with no gate).
schema_version: "1.0"
workflow:
  id: "sdd-to-tasks"
  name: "SDD through tasks (Kanban executor)"
  version: "1.0.0"
  author: "rhoai3-coding-demo"
  description: "specify → clarify → plan → tasks. Never implement."

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "hermes"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "hermes"
    prompt: "Integration (hermes)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before clarification."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: handoff-kanban
    type: gate
    message: "Convert tasks.md into hermes kanban_create calls. Do not run speckit.implement. Assign each destination file exactly one owner story after grouping exists."
    options: [approve, reject]
    on_reject: abort
