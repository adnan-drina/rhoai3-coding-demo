# decisions.yaml — the only human input to the migration (SOLUTION-ARCHITECTURE v3 §4).
# Decided by the stage owner on 2026-09-08. Nothing here is written or inferred by a worker.
schema: rhoai3.decisions/v2

adrs:
  - id: ADR-001
    status: accepted
    title: Destination platform is Red Hat build of Quarkus 3.27 on the Spring-compatibility path (BOM from .hermes/pins.json quarkus_platform)
  - id: ADR-002
    status: accepted
    title: A cluster is deferred to a human after 3 rejected (reverted) attempts; the loop stops (admission MANUAL_CLUSTER, nothing mints) until the human clears it, and the run cannot close while it is open
  - id: ADR-003
    status: accepted
    title: Retire the Spring AOP JMX call monitor (CallMonitoringAspect) — Quarkus documents no AOP compatibility, the aspect carries no business behavior and no parity observation; repository timing is a metrics-extension concern, not a migration obligation (pilot specimen spring-petclinic-rest, 2026-09-09)
  - id: ADR-004
    status: accepted
    title: Persistence on Quarkus is the Spring Data JPA implementation (quarkus-spring-data-jpa, the legacy "spring-data-jpa" profile); the profile-selected JDBC ("jdbc") and plain-JPA ("jpa") repository implementations are retired — JdbcTemplate has no Quarkus compatibility, the plain-JPA set duplicates the Spring Data one, and no class outside those two packages references them (spring-petclinic-rest, decided 2026-09-10)
  - id: ADR-005
    status: accepted
    title: The Spring Security configurer classes (WebSecurityConfigurerAdapter subclasses BasicAuthenticationConfig, DisableSecurityConfig) are retired; HTTP basic auth and the JDBC user store are re-established declaratively on Quarkus (quarkus-spring-security keeps the annotations; quarkus.http.auth.* and quarkus-security-jpa carry the store) as a later obligation; Roles stays (decided 2026-09-10)
  - id: ADR-006
    status: accepted
    title: The springfox Swagger configuration (ApplicationSwaggerConfig) is retired; OpenAPI comes from quarkus-smallrye-openapi (compat-mapping remove_dependencies maps the springfox starter to it) (decided 2026-09-10)

destination_platform:
  id: quarkus-rhbq-3.27   # key of .hermes/planning/catalogs/destination-platforms.json
  adr: ADR-001

thresholds:
  max_attempts: 3         # rejected attempts on one cluster before it becomes a manual card
  adr: ADR-002

