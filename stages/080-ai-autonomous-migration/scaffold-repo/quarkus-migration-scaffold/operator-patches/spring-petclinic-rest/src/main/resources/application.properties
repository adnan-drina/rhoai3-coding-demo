# active profiles config
#
# application use two active profiles
#
# one - for select database
# ------------------------------------------------
# When using HSQL, use: hsqldb
# When using MySQL, use: mysql
# When using PostgeSQL, use: postgresql
# ------------------------------------------------
#
# one for select repository layer
# ------------------------------------------------
# When using Spring jpa, use: jpa
# When using Spring JDBC, use: jdbc
# When using Spring Data JPA, use: spring-data-jpa
# ------------------------------------------------

# bootstrap: no Quarkus equivalent for spring.profiles.active (dropped)

# ------------------------------------------------

quarkus.http.port=9966
quarkus.http.root-path=/petclinic/

# Springfox workaround required by Spring Boot 2.6
# See https://github.com/springfox/springfox/issues/3462
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.messages.basename=messages/messages
# bootstrap: no Quarkus equivalent for spring.jpa.open-in-view (dropped)

quarkus.log.category."org.springframework".level=INFO
#quarkus.log.category."org.springframework".level=DEBUG

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# enable the desired authentication type
# by default the authentication is disabled
petclinic.security.enable=false

%hsqldb.spring.sql.init.schema-locations=classpath*:db/hsqldb/initDB.sql
%hsqldb.spring.sql.init.data-locations=classpath*:db/hsqldb/populateDB.sql
%hsqldb.spring.jpa.database=HSQL
%hsqldb.spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

%mysql.spring.jpa.database=MYSQL
%mysql.spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

%postgresql.spring.jpa.database=POSTGRESQL
%postgresql.spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# bootstrap: effective datasource decided in decisions.yaml (ADR-009); credentials are
# environment references, and the engine change from hsqldb is recorded in that ADR.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PETCLINIC_DB_URL}
quarkus.datasource.username=${PETCLINIC_DB_USER}
quarkus.datasource.password=${PETCLINIC_DB_PASSWORD}
quarkus.hibernate-orm.database.generation=none


# bootstrap: the build profiles decided in decisions.yaml (ADR-011); the legacy
# selected implementations with spring.profiles.active=hsqldb,spring-data-jpa
quarkus.profile=prod,spring-data-jpa

# bootstrap[undecided-datasource]: the hsqldb, mysql, postgresql datasource families are not this destination's
# bootstrap[undecided-datasource]: configuration and this run never selects those profiles; the legacy
# bootstrap[undecided-datasource]: copy is preserved verbatim under .derived/frozen-input (ADR-009).

# ------------------------------------------------
# ADR-014: the source's security switch, in both halves.
#
# Method authorization: every @PreAuthorize expression carries the switch as its
# first term (@securityMode.disabled() or <the source's own role expression>), so
# with the switch off nothing is enforced -- as in the source, where
# DisableSecurityConfig permitted every request and method security was not
# enabled at all -- and with it on the source's role expression is the only
# thing that can authorize the call.
#
# Request authorization: the source also had a request-level policy --
# authorizeRequests().anyRequest().authenticated() with the switch on,
# .permitAll() with it off -- which covered the routes that carry no
# @PreAuthorize at all, such as the root redirect. It is NOT expressed with
# quarkus.http.auth.permission.* here, because those keys would have to hold one
# of the two modes; HttpSecuritySwitch registers the matching policy at runtime
# off the same property, scoped to quarkus.http.root-path. The non-application
# root (quarkus.http.non-application-root-path, /q by default and absolute) is
# outside that scope and keeps the platform's defaults.
#
# Authentication: the mechanism follows the same switch, registered by the same
# observer. It is NOT registered from this file, because the platform resolves
# quarkus.http.auth.basic at BUILD time and a build-time key cannot carry a
# runtime switch. The key below keeps the build from registering a mechanism
# unconditionally; the runtime registration still turns basic authentication on,
# because the platform promotes this value to true when a
# BasicAuthenticationMechanism is registered programmatically.
#
# Account status: the source's identity query also read the enabled column and
# refused a disabled account with 401. quarkus-security-jpa has no annotation for
# it, so DisabledAccountAugmentor supplies that term; no key configures it.
quarkus.http.auth.basic=false

# Lazy authentication: with the switch off, an anonymous request must reach the
# resource without being challenged, and a request that happens to carry
# credentials must not be authenticated against them. With the switch on, the
# @PreAuthorize expression is what denies the call, and the mechanism's
# challenge is what answers it.
quarkus.http.auth.proactive=false

# quarkus.http.auth.realm is deliberately NOT set here: the platform refuses a
# programmatic basic-authentication registration when the realm is configured in
# this file ("Cannot configure basic authentication programmatically because the
# authentication realm has already been configured in the 'application.properties'
# file"). The source's realm name travels with the mechanism instead, in
# SourceBasicAuthenticationMechanism.
#
# The switch itself is petclinic.security.enable, declared above with the
# source's own default. No credential appears in this file; the seeded identity
# lives only in the seed data and is referenced by environment-variable name in
# decisions.yaml.
