# Co-deployed catalog stub for STORY_DEPLOY acceptance (O-CATALOGDNS).
# Legacy Feign/REST clients call GET ${CATALOG_ENDPOINT}/api/products and expect
# a JSON array of Product objects. Keep Service name `catalog-service` so
# k8s/app.yaml can use CATALOG_ENDPOINT=http://catalog-service:8080 in the
# same namespace (presence-of-key alone is not enough — this Service must exist).
#
# Specimen seed itemIds align with Coolstore inventory demos; other apps should
# replace the PRODUCT seed in the container args with their own contract.
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
spec:
  selector:
    app.kubernetes.io/name: catalog-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
    spec:
      containers:
        - name: catalog
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/products
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/products
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          command: ["python3", "-u", "-c"]
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json
              PRODUCTS = [
                {"itemId": "100000", "name": "Red Fedora", "desc": "Official Red Hat Fedora", "price": 34.99},
                {"itemId": "329299", "name": "Quarkus T-shirt", "desc": "Quarkus demo tee", "price": 10.00},
                {"itemId": "329199", "name": "Pronounced Kubernetes", "desc": "K8s tee", "price": 9.00},
                {"itemId": "165613", "name": "Knit socks", "desc": "Warm knit socks", "price": 4.15},
              ]
              BODY = json.dumps(PRODUCTS).encode()
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_GET(self):
                      path = self.path.split("?", 1)[0].rstrip("/") or "/"
                      if path == "/api/products":
                          self.send_response(200)
                          self.send_header("Content-Type", "application/json")
                          self.send_header("Content-Length", str(len(BODY)))
                          self.end_headers()
                          self.wfile.write(BODY)
                      else:
                          self.send_response(404)
                          self.end_headers()
              HTTPServer(("0.0.0.0", 8080), H).serve_forever()
