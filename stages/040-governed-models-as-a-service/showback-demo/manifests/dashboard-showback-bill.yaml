# Generated by showback-demo/generate-dashboards.sh; edit dashboard-definitions.json. Offline candidate only.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-7-showback-bill-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-7-showback-bill-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback · bill allocation
      description: One selected closed report. Evidence kind is visible; SYNTHETIC
        fixtures are not a real bill. Snapshots are gauges, never integrated. Time
        picker changes do not recalculate allocation.
    duration: 1h
    variables: []
    panels:
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Selected closed report — read evidence kind before presenting
            description: The series label identifies SYNTHETIC versus live evidence,
              immutable report ID, UTC period and policy. Value 1 means metadata is
              present. The time picker never recalculates this report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      total:
        kind: Panel
        spec:
          display:
            name: Included hosting bill (USD)
            description: Complete priced bill for the selected report. Missing price
              means NO DATA, never zero.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_cost_cents @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))) / 100
                  seriesNameFormat: "{{evidence_kind}}"
      known:
        kind: Panel
        spec:
          display:
            name: Known priced subtotal (USD)
            description: Priced portions only. This is not the full bill when pricing
              completeness is 0.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_known_cost_cents @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100
                  seriesNameFormat: "{{evidence_kind}}"
      pricing:
        kind: Panel
        spec:
          display:
            name: Pricing complete (1=yes)
            description: Every included paid interval has a recorded rate. Evidence
              kind distinguishes synthetic from observed inputs; a public-list estimate
              is not an invoice.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_pricing_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{evidence_kind}}"
      allocation:
        kind: Panel
        spec:
          display:
            name: Allocation complete (1=yes)
            description: 0 means attribution or prices are unresolved; known amounts
              still reconcile.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_allocation_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{evidence_kind}}"
      priceBasis:
        kind: Panel
        spec:
          display:
            name: Report price basis — read label
            description: Basis recorded in this immutable report, not today's price
              configuration. Value 1 denotes metadata presence; unspecified metadata
              is explicitly marked. A public-list estimate is not an account invoice.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_price_basis_info @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{price_basis}} | {{cost_basis}}"
      rateSources:
        kind: Panel
        spec:
          display:
            name: Report rate evidence — read source labels
            description: Only rate IDs used by intervals overlapping this report.
              Value 1 identifies metadata; missing prices stay marked.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_rate_info @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{rate_id}} | {{rate_source}} | {{instance_type}}
                    | {{region}} | {{effective_date}} | {{price_state}}"
      exclusions:
        kind: Panel
        spec:
          display:
            name: Excluded costs — read labels
            description: Exclusions captured with this report. Value 1 denotes an
              exclusion label, not a dollar amount. Unspecified exclusions are not
              assumed empty.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_exclusion_info @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{excluded_cost}}"
      consumers:
        kind: Panel
        spec:
          display:
            name: Known bill allocation by team and platform bucket (USD)
            description: Engineering, Marketing, Support, other_consumers, platform_idle
              and unresolved_allocation. Active-window cost includes quiet capacity.
              A fully idle, covered window belongs to platform_idle.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_allocated_cents @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100
                  seriesNameFormat: "{{consumer}} | {{evidence_kind}}"
      teamModel:
        kind: Panel
        spec:
          display:
            name: Allocated cost by team and model (known USD)
            description: Sum of finalized model/window allocations for Engineering,
              Marketing and Support; no second allocation using whole-report token
              shares. Known costs with incomplete evidence remain unresolved; unpriced
              amounts are absent.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_model_allocated_cents{consumer=~"engineering|marketing|support"}
                    @ end() and on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100
                  seriesNameFormat: "{{consumer}} | {{model}} | prices complete={{pricing_complete}}
                    | usage complete={{usage_complete}}"
      modelTotals:
        kind: Panel
        spec:
          display:
            name: Full hosting cost by model (USD)
            description: Sum of closed-window model costs, including idle windows.
              An incomplete model price is withheld.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_model_cost_cents @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100
                  seriesNameFormat: "{{model}}"
      models:
        kind: Panel
        spec:
          display:
            name: Hosting cost by model and closed window (USD)
            description: Paid instance hours multiplied by verified rate; zero missing-price
              values are never fabricated.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_cost_cents @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))) / 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      detail:
        kind: Panel
        spec:
          display:
            name: Known window allocation detail (USD)
            description: All cents reconcile within each model/window. Unknown coverage
              assigns its known cost to unresolved_allocation.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_allocated_cents @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{consumer}}"
      coverage:
        kind: Panel
        spec:
          display:
            name: Usage coverage (1=complete)
            description: A missing interval is not an idle interval. Read the coverage
              label.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_coverage_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report and evidence
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/reportIdentity"
    - kind: Grid
      spec:
        display:
          title: Report price basis
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/priceBasis"
    - kind: Grid
      spec:
        display:
          title: Rate provenance and exclusions
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/rateSources"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/exclusions"
    - kind: Grid
      spec:
        display:
          title: Bill completeness
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 7
          content:
            "$ref": "#/spec/panels/total"
        - x: 6
          y: 0
          width: 6
          height: 7
          content:
            "$ref": "#/spec/panels/known"
        - x: 12
          y: 0
          width: 6
          height: 7
          content:
            "$ref": "#/spec/panels/pricing"
        - x: 18
          y: 0
          width: 6
          height: 7
          content:
            "$ref": "#/spec/panels/allocation"
    - kind: Grid
      spec:
        display:
          title: Who pays
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/consumers"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/teamModel"
    - kind: Grid
      spec:
        display:
          title: Full model totals
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/modelTotals"
    - kind: Grid
      spec:
        display:
          title: Model and window detail
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/models"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/detail"
    - kind: Grid
      spec:
        display:
          title: Coverage
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/coverage"
