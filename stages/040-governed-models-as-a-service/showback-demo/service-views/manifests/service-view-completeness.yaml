# Generated by service-views/generate-dashboards.sh. Detached platform-only candidate; access is not configured.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: service-view-completeness
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: service-view-completeness
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Services · accounting completeness · platform
      description: PLATFORM ONLY candidate. Platform-only reconciliation. Unknown
        invoice, price or cost is omitted rather than zero. Durable monthly continuity
        is checked by the close/archive workflow, not a time-series extrapolation.
        One selected immutable snapshot; current gauges, never integrate. No dashboard
        filter provides authorization.
    duration: 1h
    variables: []
    panels:
      report:
        kind: Panel
        spec:
          display:
            name: Selected immutable service report
            description: Read evidence, estimate/closed status, period, policy, price
              basis and cost scope before using money. No live authorization is configured
              for these detached platform candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{statement_status}} | {{report_id}}
                    r{{revision}} | {{period_start}} to {{period_end}} | {{currency}}
                    | {{policy_version}} | {{price_basis}} | {{cost_scope}}"
      complete:
        kind: Panel
        spec:
          display:
            name: Evidence complete (1=yes)
            description: Missing evidence is not zero. Completeness does not by itself
              establish invoice reconciliation or accepted task quality.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_complete @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{report_id}} | {{statement_status}}"
      prices:
        kind: Panel
        spec:
          display:
            name: Pricing completeness (1=yes)
            description: No full charge is published for an agreement with incomplete
              price evidence.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_pricing_complete @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}}"
      costs:
        kind: Panel
        spec:
          display:
            name: Cost completeness (1=yes)
            description: Known costs are not a complete cost basis when evidence is
              missing.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_cost_complete @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}}"
      usage:
        kind: Panel
        spec:
          display:
            name: Usage completeness (1=yes)
            description: Sampled traces cannot complete missing usage. Native request
              success is not task acceptance.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_usage_complete @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}}"
      invoice:
        kind: Panel
        spec:
          display:
            name: Provider invoice (USD cents)
            description: Only emitted when invoice evidence exists in this report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_invoice_cents @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}}"
      difference:
        kind: Panel
        spec:
          display:
            name: Invoice difference (USD cents)
            description: A known difference remains visible even when the statement
              is closed. Follow report reconciliation and adjustment evidence.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_invoice_difference_cents @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}}"
      known:
        kind: Panel
        spec:
          display:
            name: Known fleet cost portion (USD cents)
            description: Diagnostic known portion. Incomplete price/cost evidence
              prevents claiming a full total.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_known_cost_cents @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{report_id}}"
      charges:
        kind: Panel
        spec:
          display:
            name: Fleet charges (USD cents)
            description: Total of attributable charge lines, including adjustments;
              not a provider invoice or total infrastructure cost.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_charge_cents @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{report_id}}"
      agreementContext:
        kind: Panel
        spec:
          display:
            name: Agreement cost and contract basis
            description: Invoice, metered estimate and supplied actual costs remain
              distinct. Metadata is retained with this immutable report, not read
              from current configuration.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}} | {{cost_basis}}
                    | {{contract_version}} | {{price_basis}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/agreementContext"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/charges"
        - x: 0
          y: 12
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/complete"
        - x: 0
          y: 18
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/costs"
        - x: 0
          y: 24
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/difference"
        - x: 0
          y: 30
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/invoice"
        - x: 0
          y: 36
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/known"
        - x: 0
          y: 42
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/prices"
        - x: 0
          y: 48
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/report"
        - x: 0
          y: 54
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/usage"
