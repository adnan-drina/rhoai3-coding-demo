# Generated by service-views/generate-dashboards.sh. Detached platform-only candidate; access is not configured.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: service-view-shared
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: service-view-shared
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Services · shared service economics · platform
      description: PLATFORM ONLY candidate. Published tariff recovery is separate
        from proportional infrastructure allocation. Zero-demand under-recovery remains
        visible; ratios are absent when actual cost is zero. One selected immutable
        snapshot; current gauges, never integrate. No dashboard filter provides authorization.
    duration: 1h
    variables: []
    panels:
      report:
        kind: Panel
        spec:
          display:
            name: Selected immutable service report
            description: Read evidence, estimate/closed status, period, policy, price
              basis and cost scope before using money. No live authorization is configured
              for these detached platform candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{statement_status}} | {{report_id}}
                    r{{revision}} | {{period_start}} to {{period_end}} | {{currency}}
                    | {{policy_version}} | {{price_basis}} | {{cost_scope}}"
      complete:
        kind: Panel
        spec:
          display:
            name: Evidence complete (1=yes)
            description: Missing evidence is not zero. Completeness does not by itself
              establish invoice reconciliation or accepted task quality.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_complete @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{report_id}} | {{statement_status}}"
      cost:
        kind: Panel
        spec:
          display:
            name: Shared actual cost (USD cents)
            description: Actual cost scope belongs to the selected report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_cost_cents{offer="shared"} @ end() and
                    on(job, instance) (up{showback_publisher="selected-report"} @
                    end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      charges:
        kind: Panel
        spec:
          display:
            name: Shared tariff/reservation charges (USD cents)
            description: Uses the report's published prices and explicit reservation
              credits. Historical totals are not recalculated here.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_charge_cents{offer="shared"} @ end() and
                    on(job, instance) (up{showback_publisher="selected-report"} @
                    end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      subsidy:
        kind: Panel
        spec:
          display:
            name: Explicit subsidy (USD cents)
            description: Subsidy is an explicit financing input, not hidden usage
              revenue.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_subsidy_cents{offer="shared"} @ end()
                    and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      balance:
        kind: Panel
        spec:
          display:
            name: Shared recovery balance (USD cents)
            description: Charges + subsidy - actual cost, from the closed calculation.
              Negative is under-recovery.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_recovery_balance_cents{offer="shared"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      ratio:
        kind: Panel
        spec:
          display:
            name: Recovery before subsidy (ratio)
            description: Undefined when actual cost is zero; never shown as zero in
              that case.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_recovery_before_subsidy_ratio{offer="shared"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      ratioSubsidy:
        kind: Panel
        spec:
          display:
            name: Recovery after subsidy (ratio)
            description: Includes subsidy once. Ratio 1 means recovery equals actual
              included cost.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_recovery_after_subsidy_ratio{offer="shared"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      agreementContext:
        kind: Panel
        spec:
          display:
            name: Agreement cost and contract basis
            description: Invoice, metered estimate and supplied actual costs remain
              distinct. Metadata is retained with this immutable report, not read
              from current configuration.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}} | {{cost_basis}}
                    | {{contract_version}} | {{price_basis}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/agreementContext"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/balance"
        - x: 0
          y: 12
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/charges"
        - x: 0
          y: 18
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/complete"
        - x: 0
          y: 24
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/cost"
        - x: 0
          y: 30
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/ratio"
        - x: 0
          y: 36
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/ratioSubsidy"
        - x: 0
          y: 42
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/report"
        - x: 0
          y: 48
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/subsidy"
