# Generated by service-views/generate-dashboards.sh. Detached platform-only candidate; access is not configured.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: service-view-quality
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: service-view-quality
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Services · workload quality and sourcing · platform
      description: PLATFORM ONLY candidate. Optional service_advice snapshot for the
        same period/currency/evidence kind. Reuse MLflow GenAI Traces/Sessions for
        instrumented workflow drilldown. These projections are analytical, not invoice
        money. One selected immutable snapshot; current gauges, never integrate. No
        dashboard filter provides authorization.
    duration: 1h
    variables: []
    panels:
      report:
        kind: Panel
        spec:
          display:
            name: Selected immutable service report
            description: Read evidence, estimate/closed status, period, policy, price
              basis and cost scope before using money. No live authorization is configured
              for these detached platform candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{statement_status}} | {{report_id}}
                    r{{revision}} | {{period_start}} to {{period_end}} | {{currency}}
                    | {{policy_version}} | {{price_basis}} | {{cost_scope}}"
      complete:
        kind: Panel
        spec:
          display:
            name: Evidence complete (1=yes)
            description: Missing evidence is not zero. Completeness does not by itself
              establish invoice reconciliation or accepted task quality.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_complete @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{report_id}} | {{statement_status}}"
      advice:
        kind: Panel
        spec:
          display:
            name: Analysis identity and conclusion
            description: Only present when an analysis snapshot was explicitly supplied.
              Request/task identifiers stay in evidence records, not metric labels.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_advice_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{analysis_report_id}} | {{recommendation}} |
                    {{acceptance_definition}} | {{calculation_basis}}"
      accepted:
        kind: Panel
        spec:
          display:
            name: Accepted tasks
            description: Explicit accepted outcomes, not HTTP success. Missing instrumentation
              leaves this panel empty.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_advice_accepted_tasks @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{analysis_report_id}}"
      retries:
        kind: Panel
        spec:
          display:
            name: Corrective retries
            description: Corrective retries are separate from planned multi-turn work.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_advice_corrective_retries @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{analysis_report_id}}"
      turns:
        kind: Panel
        spec:
          display:
            name: Planned turns
            description: Normal multi-turn workflow is not automatically a model failure.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_advice_planned_turns @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{analysis_report_id}}"
      cost:
        kind: Panel
        spec:
          display:
            name: Workflow cost per accepted task (USD cents)
            description: Includes the analysis cohort's failed/retried/fallback attempts.
              Undefined at zero accepted tasks.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_advice_cost_per_accepted_task_cents @ end() and
                    on(job, instance) (up{showback_publisher="selected-report"} @
                    end() == 1))
                  seriesNameFormat: "{{analysis_report_id}}"
      savings:
        kind: Panel
        spec:
          display:
            name: Projected sourcing savings (USD cents)
            description: Only compare capacity-qualified scenarios with matched quality/SLO.
              An infeasible private scenario has no fabricated savings.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_sourcing_savings_cents @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{scenario}} | capacity eligible={{capacity_eligible}}"
      payback:
        kind: Panel
        spec:
          display:
            name: Migration payback (months)
            description: Analytical estimate; undefined when there are no positive
              recurring savings.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_sourcing_payback_months @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{scenario}} | capacity eligible={{capacity_eligible}}"
      agreementContext:
        kind: Panel
        spec:
          display:
            name: Agreement cost and contract basis
            description: Invoice, metered estimate and supplied actual costs remain
              distinct. Metadata is retained with this immutable report, not read
              from current configuration.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}} | {{cost_basis}}
                    | {{contract_version}} | {{price_basis}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/accepted"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/advice"
        - x: 0
          y: 12
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/agreementContext"
        - x: 0
          y: 18
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/complete"
        - x: 0
          y: 24
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/cost"
        - x: 0
          y: 30
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/payback"
        - x: 0
          y: 36
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/report"
        - x: 0
          y: 42
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/retries"
        - x: 0
          y: 48
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/savings"
        - x: 0
          y: 54
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/turns"
