<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Continue local MaaS configuration</title>
  <desc id="desc">Sanitized printscreen-style image showing local Continue configuration for a MaaS model.</desc>
  <rect width="1160" height="650" fill="#1f1f1f"/>
  <rect x="48" y="42" width="1064" height="566" rx="8" fill="#252526" stroke="#4d4d4d" stroke-width="2"/>
  <text x="82" y="98" font-family="Arial, sans-serif" font-size="30" fill="#e6e6e6" font-weight="700">~/.continue/config.yaml</text>
  <rect x="82" y="136" width="996" height="360" rx="6" fill="#111111" stroke="#4d4d4d"/>
  <g font-family="Menlo, Consolas, monospace" font-size="24" fill="#d4d4d4">
    <text x="118" y="190">models:</text>
    <text x="118" y="230">  - title: MaaS Nemotron</text>
    <text x="118" y="270">    provider: openai</text>
    <text x="118" y="310">    model: nemotron-3-nano-30b-a3b</text>
    <text x="118" y="350">    apiBase: https://&lt;maas-gateway&gt;/maas/.../v1</text>
    <text x="118" y="390">    apiKey: &lt;workspace-local-key&gt;</text>
  </g>
  <rect x="82" y="524" width="996" height="48" rx="6" fill="#151515" stroke="#4d4d4d"/>
  <text x="112" y="556" font-family="Arial, sans-serif" font-size="20" fill="#c7c7c7">Real route and key stay in the workspace only. They are never committed.</text>
</svg>
