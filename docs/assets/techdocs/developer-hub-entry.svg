  <text x="82" y="130" font-family="Arial, sans-serif" font-size="48" fill="#ffffff" font-weight="700">Coolstore Inventory Service</text>
  <rect x="48" y="194" width="1064" height="360" rx="8" fill="#242424" stroke="#8a8a8a" stroke-width="2"/>
