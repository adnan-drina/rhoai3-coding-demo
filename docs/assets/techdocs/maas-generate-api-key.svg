<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="792" viewBox="0 0 1600 792" role="img" aria-labelledby="title desc">
  <title id="title">OpenShift AI MaaS generate API key dialog</title>
  <desc id="desc">Sanitized printscreen-style image showing the AI asset endpoints page with the Generate API Key action for the Nemotron MaaS model. Route values are redacted.</desc>
  <rect width="1600" height="792" fill="#151515"/>
  <rect x="300" y="70" width="1280" height="652" rx="16" fill="#282828"/>
  <text x="355" y="118" font-family="Arial, sans-serif" font-size="32" fill="#ffffff" font-weight="700">AI asset endpoints</text>
  <text x="355" y="154" font-family="Arial, sans-serif" font-size="20" fill="#d0d0d0">Browse endpoints for models and MCP servers that are available as AI assets.</text>
  <text x="355" y="224" font-family="Arial, sans-serif" font-size="20" fill="#d0d0d0">Models</text>
  <text x="456" y="224" font-family="Arial, sans-serif" font-size="20" fill="#d0d0d0">MCP servers</text>
  <text x="585" y="224" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700">Models as a service</text>
  <line x1="560" y1="246" x2="705" y2="246" stroke="#9dbdff" stroke-width="4"/>
  <line x1="330" y1="248" x2="1560" y2="248" stroke="#676767"/>
  <text x="355" y="390" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">gpt-oss-20b</text>
  <text x="355" y="465" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">nemotron-3-nano-30b-a3b</text>
  <rect x="565" y="445" width="72" height="34" rx="17" fill="#e6c15d"/>
  <text x="586" y="468" font-family="Arial, sans-serif" font-size="18" fill="#1f1f1f" font-weight="700">MaaS</text>
  <text x="1120" y="465" font-family="Arial, sans-serif" font-size="20" fill="#b8c9ff">View</text>
  <rect x="1088" y="445" width="76" height="42" rx="6" fill="#4a4a4a"/>
  <text x="1110" y="473" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">View</text>
  <rect x="772" y="520" width="335" height="198" rx="14" fill="#3a3a3a" filter="drop-shadow(0 8px 8px rgba(0,0,0,.5))"/>
  <polygon points="772,618 742,638 772,658" fill="#3a3a3a"/>
  <text x="802" y="565" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">Model as a service (MaaS) route</text>
  <rect x="802" y="592" width="250" height="48" rx="6" fill="#303030" stroke="#8a8a8a"/>
  <text x="822" y="623" font-family="Arial, sans-serif" font-size="20" fill="#e0e0e0">https://&lt;maas-gateway&gt;</text>
  <rect x="1058" y="592" width="48" height="48" rx="6" fill="#3b3b3b" stroke="#8a8a8a"/>
  <text x="802" y="685" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700">API Key</text>
  <rect x="802" y="700" width="210" height="42" rx="21" fill="#a9c5ff"/>
  <text x="830" y="727" font-family="Arial, sans-serif" font-size="18" fill="#1f1f1f">Generate API Key</text>
</svg>
