apiVersion: rhoai.demo/v1alpha1
kind: DemoFlow
metadata:
  name: default
  description: Trusted enterprise AI development platform on Red Hat OpenShift AI
stages:
  - id: "010"
    name: OpenShift AI Platform Foundation
    productFocus:
      - Red Hat OpenShift AI
      - Red Hat OpenShift GitOps
      - Red Hat OpenShift
    deployScript: stages/010-openshift-ai-platform-foundation/deploy.sh
    validateScript: stages/010-openshift-ai-platform-foundation/validate.sh
    gitopsApplication: 010-openshift-ai-platform-foundation
    gitopsPath: gitops/stages/010-openshift-ai-platform-foundation/base
    dependsOn: []
  - id: "020"
    name: GPU Infrastructure for Private AI
    productFocus:
      - Red Hat OpenShift
      - Red Hat OpenShift AI
      - Red Hat build of Kueue
      - OpenShift Custom Metrics Autoscaler Operator
      - NVIDIA GPU Operator
    deployScript: stages/020-gpu-infrastructure-private-ai/deploy.sh
    validateScript: stages/020-gpu-infrastructure-private-ai/validate.sh
    gitopsApplication: 020-gpu-infrastructure-private-ai
    gitopsPath: gitops/stages/020-gpu-infrastructure-private-ai/base
    dependsOn:
      - "010"
  - id: "030"
    name: Private Model Serving
    productFocus:
      - Red Hat OpenShift AI
      - KServe
      - vLLM
    deployScript: stages/030-private-model-serving/deploy.sh
    validateScript: stages/030-private-model-serving/validate.sh
    gitopsApplication: 030-private-model-serving
    gitopsPath: gitops/stages/030-private-model-serving/base
    dependsOn:
      - "010"
      - "020"
  - id: "040"
    name: Governed Models-as-a-Service
    productFocus:
      - Red Hat OpenShift AI
      - Red Hat Connectivity Link
      - Red Hat OpenShift GitOps
    deployScript: stages/040-governed-models-as-a-service/deploy.sh
    validateScript: stages/040-governed-models-as-a-service/validate.sh
    gitopsApplication: 040-governed-models-as-a-service
    gitopsPath: gitops/stages/040-governed-models-as-a-service/base
    dependsOn:
      - "030"
  - id: "050"
    name: Advanced Application Platform
    productFocus:
      - Red Hat Advanced Developer Suite
      - Red Hat Developer Hub
      - Red Hat OpenShift Pipelines
      - Red Hat Trusted Artifact Signer
    deployScript: stages/050-advanced-app-platform/deploy.sh
    validateScript: stages/050-advanced-app-platform/validate.sh
    gitopsApplication: 050-advanced-app-platform
    gitopsPath: gitops/stages/050-advanced-app-platform/base
    dependsOn:
      - "040"
    # Transitional: the RHDH PostSync OIDC job brokers through the MTA
    # Keycloak deployed by stage 080 until Phase 2 of the restructure plan
    # lands the platform RHBK here. Re-sync 050 after 080 on fresh clusters.
  - id: "060"
    name: AI-Assisted Development
    productFocus:
      - Red Hat OpenShift Dev Spaces
      - Continue
      - OpenCode
    deployScript: stages/060-ai-assisted-development/deploy.sh
    validateScript: stages/060-ai-assisted-development/validate.sh
    gitopsApplication: 060-ai-assisted-development
    gitopsPath: gitops/stages/060-ai-assisted-development/base
    dependsOn:
      - "040"
      - "050"
  - id: "070"
    name: AI-Agentic Development
    productFocus:
      - Red Hat OpenShift Dev Spaces
      - Red Hat OpenShift AI
    deployScript: stages/070-ai-agentic-development/deploy.sh
    validateScript: stages/070-ai-agentic-development/validate.sh
    gitopsApplication: 070-ai-agentic-development
    gitopsPath: gitops/stages/070-ai-agentic-development/base
    dependsOn:
      - "040"
      - "050"
      - "060"
  - id: "080"
    name: AI-Autonomous Migration
    productFocus:
      - Migration Toolkit for Applications
      - Red Hat Developer Lightspeed for MTA
    deployScript: stages/080-ai-autonomous-migration/deploy.sh
    validateScript: stages/080-ai-autonomous-migration/validate.sh
    gitopsApplication: 080-ai-autonomous-migration
    gitopsPath: gitops/stages/080-ai-autonomous-migration/base
    dependsOn:
      - "040"
      - "050"
