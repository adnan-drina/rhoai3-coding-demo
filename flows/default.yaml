apiVersion: rhoai.demo/v1alpha1
kind: DemoFlow
metadata:
  name: default
  description: Trusted enterprise AI development platform on Red Hat OpenShift AI
stages:
  - id: "010"
    name: OpenShift AI Platform Foundation
    productFocus:
      - Red Hat OpenShift AI
      - Red Hat OpenShift GitOps
      - Red Hat OpenShift
    deployScript: stages/010-openshift-ai-platform-foundation/deploy.sh
    validateScript: stages/010-openshift-ai-platform-foundation/validate.sh
    gitopsApplication: 010-openshift-ai-platform-foundation
    gitopsPath: gitops/stages/010-openshift-ai-platform-foundation/base
    dependsOn: []
  - id: "020"
    name: GPU Infrastructure for Private AI
    productFocus:
      - Red Hat OpenShift
      - Red Hat OpenShift AI
      - Red Hat build of Kueue
      - OpenShift Custom Metrics Autoscaler Operator
      - NVIDIA GPU Operator
    deployScript: stages/020-gpu-infrastructure-private-ai/deploy.sh
    validateScript: stages/020-gpu-infrastructure-private-ai/validate.sh
    gitopsApplication: 020-gpu-infrastructure-private-ai
    gitopsPath: gitops/stages/020-gpu-infrastructure-private-ai/base
    dependsOn:
      - "010"
  - id: "030"
    name: Private Model Serving
    productFocus:
      - Red Hat OpenShift AI
      - KServe
      - vLLM
    deployScript: stages/030-private-model-serving/deploy.sh
    validateScript: stages/030-private-model-serving/validate.sh
    gitopsApplication: 030-private-model-serving
    gitopsPath: gitops/stages/030-private-model-serving/base
    dependsOn:
      - "010"
      - "020"
  - id: "040"
    name: Governed Models-as-a-Service
    productFocus:
      - Red Hat OpenShift AI
      - Red Hat Connectivity Link
      - Red Hat OpenShift GitOps
    deployScript: stages/040-governed-models-as-a-service/deploy.sh
    validateScript: stages/040-governed-models-as-a-service/validate.sh
    gitopsApplication: 040-governed-models-as-a-service
    gitopsPath: gitops/stages/040-governed-models-as-a-service/base
    dependsOn:
      - "030"
  - id: "050"
    name: AI-Assisted Development
    productFocus:
      - Red Hat OpenShift Dev Spaces
      - Continue
      - OpenCode
    deployScript: stages/050-ai-assisted-development/deploy.sh
    validateScript: stages/050-ai-assisted-development/validate.sh
    gitopsApplication: 050-ai-assisted-development
    gitopsPath: gitops/stages/050-ai-assisted-development/base
    dependsOn:
      - "040"
  - id: "060"
    name: Agentic Development
    productFocus:
      - Red Hat OpenShift Dev Spaces
      - Red Hat OpenShift AI
    deployScript: stages/060-ai-agentic-development/deploy.sh
    validateScript: stages/060-ai-agentic-development/validate.sh
    gitopsApplication: 060-ai-agentic-development
    gitopsPath: gitops/stages/060-ai-agentic-development/base
    dependsOn:
      - "050"
  - id: "070"
    name: Autonomous Application Migration
    productFocus:
      - Migration Toolkit for Applications
      - Red Hat Developer Lightspeed for MTA
    deployScript: stages/070-ai-autonomous-migration/deploy.sh
    validateScript: stages/070-ai-autonomous-migration/validate.sh
    gitopsApplication: 070-ai-autonomous-migration
    gitopsPath: gitops/stages/070-ai-autonomous-migration/base
    dependsOn:
      - "050"
  - id: "080"
    name: AI in Trusted Delivery
    productFocus:
      - Red Hat OpenShift Pipelines
      - Red Hat Trusted Artifact Signer
    deployScript: stages/080-ai-trusted-delivery/deploy.sh
    validateScript: stages/080-ai-trusted-delivery/validate.sh
    gitopsApplication: 080-ai-trusted-delivery
    gitopsPath: gitops/stages/080-ai-trusted-delivery/base
    dependsOn:
      - "070"
  - id: "090"
    name: AI Self-Service Portal
    productFocus:
      - Red Hat Advanced Developer Suite
      - Red Hat Developer Hub
      - Developer Lightspeed for Red Hat Developer Hub
    deployScript: stages/090-ai-self-service-portal/deploy.sh
    validateScript: stages/090-ai-self-service-portal/validate.sh
    gitopsApplication: 090-ai-self-service-portal
    gitopsPath: gitops/stages/090-ai-self-service-portal/base
    dependsOn:
      - "070"
