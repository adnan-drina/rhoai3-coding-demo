apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Collection and provider ids are at most 36 characters: EvalHub 1.0 validates them at start-up, and one
# invalid id keeps the new EvalHub pod from starting (the old pod keeps serving the previous set).
resources:
  - agentic-coding-latency-v1.yaml
  - agentic-coding-throughput-v2.yaml
  - agentic-coding-livecodebench-v3.yaml
  - agentic-coding-python-tasks-v1.yaml
  - inspect-coding-provider.yaml
