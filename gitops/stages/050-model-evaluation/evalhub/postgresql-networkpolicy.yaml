apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evalhub-postgresql
  namespace: evalhub
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: evalhub-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.openshift.io/runtime: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: evalhub-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        # Only the native EvalHub API can connect to its database.
        - podSelector:
            matchLabels:
              app: eval-hub
              instance: evalhub
              component: api
      ports:
        - protocol: TCP
          port: 5432
