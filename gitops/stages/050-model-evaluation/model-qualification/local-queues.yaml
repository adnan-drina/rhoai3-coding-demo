---
# Same cluster queues as the other projects (Stage 020 quota): evaluation jobs use the
# CPU queue, the candidate model server a GPU queue (L40S reserved or RTX PRO 6000).
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: lq-cpu-default
  namespace: evaluated-models
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  clusterQueue: cq-cpu-default
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: lq-gpu-reserved-demo
  namespace: evaluated-models
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  clusterQueue: cq-gpu-reserved-demo
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: lq-gpu-rtxpro6000
  namespace: evaluated-models
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  clusterQueue: cq-gpu-rtxpro6000
