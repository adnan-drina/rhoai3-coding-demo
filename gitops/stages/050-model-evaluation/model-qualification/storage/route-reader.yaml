# The Pipelines connection uses the ODF S3 Route instead of the in-cluster service: the pipeline server signs
# artifact download links with its storage host, and the dashboard Artifacts view opens those links in the
# browser ("Working with AI pipelines" 3.5, view or download artifacts). The hook only reads that one Route.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: evaluated-models-s3-route-reader
  namespace: openshift-storage
  labels:
    app.kubernetes.io/name: evaluated-models-storage
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: storage-connections
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
  - apiGroups: [route.openshift.io]
    resources: [routes]
    resourceNames: [s3]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evaluated-models-s3-route-reader
  namespace: openshift-storage
  labels:
    app.kubernetes.io/name: evaluated-models-storage
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: storage-connections
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evaluated-models-s3-route-reader
subjects:
  - kind: ServiceAccount
    name: evaluated-models-s3-connections
    namespace: evaluated-models
