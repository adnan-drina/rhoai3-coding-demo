# Pipeline server for the Evaluated Models project, configured as RHOAI 3.5 "Working with AI pipelines",
# 1.1 Configure a pipeline server, describes it, with the values the dashboard's Configure pipeline server form
# takes from the project's Pipelines connection (storage/). Like the dashboard (odh-dashboard v3.5.0,
# configurePipelinesServer), the Sync hook stores the access and secret key in dashboard-dspa-secret and
# creates the DataSciencePipelinesApplication "dspa" with: dspVersion v2, the connection's endpoint, bucket
# and region, the default database on the cluster (documented as development and test only), pipeline
# definitions stored in Kubernetes, caching configurable per pipeline and task, and no sample pipeline.
# Connection settings cannot be changed on an existing pipeline server, so the hook only creates it and
# fails if an existing server points at a different bucket or endpoint (delete and reconfigure instead).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-server-configurator
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-server-configurator
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [evaluation-models-pipelines-connection]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dashboard-dspa-secret]
    verbs: [get, patch]
  - apiGroups: [datasciencepipelinesapplications.opendatahub.io]
    resources: [datasciencepipelinesapplications]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [ds-pipeline-server-config-dspa, ds-pipeline-server-config-custom]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-server-configurator
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-server-configurator
subjects:
  - kind: ServiceAccount
    name: pipeline-server-configurator
    namespace: evaluated-models
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-pipeline-server
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: pipeline-server-configurator
      restartPolicy: Never
      containers:
        - name: configure
          # Same reviewed OpenShift CLI image as the other Stage 050 jobs.
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              set +x
              umask 077
              NS=evaluated-models; CONN=evaluation-models-pipelines-connection; T=--request-timeout=10s
              val() { oc $T get secret "$CONN" -n "$NS" -o jsonpath="{.data.$1}" | base64 -d; }
              # The storage hook fills the connection earlier in the same sync.
              for i in $(seq 1 60); do [[ -n "$(val AWS_S3_BUCKET 2>/dev/null)" ]] && break; sleep 5; done
              endpoint=$(val AWS_S3_ENDPOINT); bucket=$(val AWS_S3_BUCKET); region=$(val AWS_DEFAULT_REGION)
              [[ -n "$endpoint" && -n "$bucket" ]] || { echo "ERROR: Pipelines connection is not populated" >&2; exit 1; }
              scheme=${endpoint%%://*}; host=${endpoint#*://}; host=${host%/}; region=${region:-us-east-1}
              # Object storage connection keys, stored the way the dashboard stores them.
              oc $T create secret generic dashboard-dspa-secret -n "$NS" \
                --from-literal=AWS_ACCESS_KEY_ID="$(val AWS_ACCESS_KEY_ID)" \
                --from-literal=AWS_SECRET_ACCESS_KEY="$(val AWS_SECRET_ACCESS_KEY)" \
                --dry-run=client -o yaml | oc $T apply -f - >/dev/null
              if oc $T get dspa dspa -n "$NS" >/dev/null 2>&1; then
                current=$(oc $T get dspa dspa -n "$NS" -o jsonpath='{.spec.objectStorage.externalStorage.host} {.spec.objectStorage.externalStorage.bucket}')
                [[ "$current" == "$host $bucket" ]] || { echo "ERROR: pipeline server dspa uses '$current'; delete it and sync again to reconfigure" >&2; exit 1; }
                echo "Pipeline server dspa already configured for $bucket"
              else
                cat <<YAML | oc $T create -f -
              apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
              kind: DataSciencePipelinesApplication
              metadata:
                name: dspa
                namespace: $NS
              spec:
                dspVersion: v2
                objectStorage:
                  externalStorage:
                    host: $host
                    scheme: $scheme
                    bucket: $bucket
                    region: $region
                    s3CredentialsSecret:
                      accessKey: AWS_ACCESS_KEY_ID
                      secretKey: AWS_SECRET_ACCESS_KEY
                      secretName: dashboard-dspa-secret
                apiServer:
                  enableSamplePipeline: false
                  cacheEnabled: true
                  pipelineStore: kubernetes
              YAML
              fi
              wait_ready() {
                for i in $(seq 1 120); do
                  ready=$(oc $T get dspa dspa -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
                  [[ "$ready" == True ]] && { echo "Pipeline server dspa is Ready"; return 0; }
                  sleep 5
                done
                oc $T get dspa dspa -n "$NS" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.message}{"\n"}{end}' >&2
                return 1
              }
              wait_ready
              # Per-step MLflow runs: each step's driver and launcher call MLflow's in-cluster service, whose
              # certificate the service CA signs, but they trust only their image's system CAs; the 3.5 pipeline
              # server passes them no CA bundle for that call, only the MLflow plugin's insecureSkipVerify flag.
              # By operator decision (2026-10-12) the plugin skips TLS verification for those calls. The flag is
              # set in a copy of the operator-generated server config, used through the DSPA's
              # apiServer.customServerConfigMap; delete the copy and the DSPA field to return to the default.
              CUSTOM=ds-pipeline-server-config-custom
              base=$CUSTOM; oc $T get configmap "$CUSTOM" -n "$NS" >/dev/null 2>&1 || base=ds-pipeline-server-config-dspa
              config=$(oc $T get configmap "$base" -n "$NS" -o jsonpath='{.data.config\.json}')
              [[ "$config" == *'"insecureSkipVerify":'* ]] || { echo "ERROR: $base has no MLflow plugin TLS setting" >&2; exit 1; }
              config=${config//'"insecureSkipVerify":false'/'"insecureSkipVerify":true'}
              oc $T create configmap "$CUSTOM" -n "$NS" --from-literal=config.json="$config" --dry-run=client -o yaml | oc $T apply -f - >/dev/null
              if [[ "$(oc $T get dspa dspa -n "$NS" -o jsonpath='{.spec.apiServer.customServerConfigMap.name}')" != "$CUSTOM" ]]; then
                oc $T patch dspa dspa -n "$NS" --type=merge -p "{\"spec\":{\"apiServer\":{\"customServerConfigMap\":{\"name\":\"$CUSTOM\",\"key\":\"config.json\"}}}}" >/dev/null
                echo "Pipeline server uses $CUSTOM (MLflow plugin insecureSkipVerify)"
                sleep 10
                wait_ready
              fi
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
# Qualification pipeline tasks call EvalHub (service-serving certificate) as the pipeline-runner ServiceAccount:
# the service CA for the task containers, and the tenant's EvalHub Role for that ServiceAccount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-tasks-service-ca
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-evalhub-access
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: pipeline-server
    app.kubernetes.io/component: pipelines
  annotations:
    argocd.argoproj.io/sync-wave: "15"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: evalhub-evaluator
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: evaluated-models
