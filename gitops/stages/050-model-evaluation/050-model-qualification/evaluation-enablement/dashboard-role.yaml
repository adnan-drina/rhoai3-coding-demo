apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enable-model-evaluation-dashboard
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: enable-model-evaluation-dashboard
    app.kubernetes.io/component: platform-configuration
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [opendatahub.io]
    resources: [odhdashboardconfigs]
    resourceNames: [odh-dashboard-config]
    verbs: [get, patch]
