# Model auth Secret for candidates served in this project ("Connect EvalHub to protected production model
# servers", pattern 3: api-key plus ca_cert). A candidate InferenceService listens on HTTPS with an OpenShift
# service-serving certificate and authorizes callers with a SubjectAccessReview (get on the
# InferenceService). The job sidecar needs ca_cert to trust that certificate, and an api-key because the
# LightEval and Inspect adapters send their own Authorization header, which the sidecar forwards instead of
# its ServiceAccount token. The api-key is the token of candidate-model-client, a ServiceAccount that may
# only get InferenceServices in this admin-only project; a Sync hook assembles the Secret in the cluster,
# so no credential is stored in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-model-client
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: candidate-model-client-token
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    kubernetes.io/service-account.name: candidate-model-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: candidate-model-client
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: candidate-model-client
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: candidate-model-client
subjects:
  - kind: ServiceAccount
    name: candidate-model-client
    namespace: evaluated-models
---
# Public OpenShift service CA, injected by the service CA operator; source of the Secret's ca_cert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: candidate-model-service-ca
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-model-auth-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: candidate-model-auth-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: candidate-model-auth-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: candidate-model-auth-provisioner
subjects:
  - kind: ServiceAccount
    name: candidate-model-auth-provisioner
    namespace: evaluated-models
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-candidate-model-auth
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-auth
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "13"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: candidate-model-auth-provisioner
      containers:
        - name: provision
          # Same reviewed OpenShift CLI image as the other Stage 050 jobs.
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              umask 077; WORK="$(mktemp -d)"; trap 'rm -rf "${WORK}"' EXIT
              # The service CA operator and the token controller fill their objects shortly after creation.
              for i in $(seq 1 60); do
                grep -q 'BEGIN CERTIFICATE' /service-ca/service-ca.crt 2>/dev/null \
                  && oc get secret candidate-model-client-token -n evaluated-models -o jsonpath='{.data.token}' | base64 -d > "${WORK}/api-key" \
                  && [ -s "${WORK}/api-key" ] && break
                sleep 5
              done
              [ -s "${WORK}/api-key" ] && grep -q 'BEGIN CERTIFICATE' /service-ca/service-ca.crt
              oc create secret generic qualification-model-auth -n evaluated-models \
                --from-file=api-key="${WORK}/api-key" --from-file=ca_cert=/service-ca/service-ca.crt \
                --dry-run=client -o yaml | oc apply --server-side --force-conflicts --field-manager=candidate-model-auth -f -
              oc annotate secret qualification-model-auth -n evaluated-models kubectl.kubernetes.io/last-applied-configuration- >/dev/null 2>&1 || true  # no credential copy in annotations
              echo "qualification-model-auth ready (api-key, ca_cert)"
              # garak-kfp (pipeline execution mode): the adapter pod has no token, so it calls KFP and the
              # Kubernetes API through the job sidecar with ref tokens; an empty *_sa_token makes the sidecar inject
              # the job ServiceAccount token and route to the matching *_url. The garak pipeline pods mount this
              # Secret at /mnt/model-auth (api-key) and call the model directly at the job's kfp_config.model_url
              # (EvalHub rewrites every *_url in the adapter's copy to the sidecar). ca_cert trusts the service CA
              # (model, KFP API) and the cluster CA (Kubernetes API).
              cat /service-ca/service-ca.crt /kube-root-ca/ca.crt > "${WORK}/ca_cert"
              oc create secret generic garak-kfp-model-auth -n evaluated-models \
                --from-file=api-key="${WORK}/api-key" --from-file=ca_cert="${WORK}/ca_cert" \
                --from-literal=kfp_url=https://ds-pipeline-dspa.evaluated-models.svc.cluster.local:8443 \
                --from-literal=kfp_sa_token= \
                --from-literal=k8s_url=https://kubernetes.default.svc:443 \
                --from-literal=k8s_sa_token= \
                --dry-run=client -o yaml | oc apply --server-side --force-conflicts --field-manager=candidate-model-auth -f -
              oc annotate secret garak-kfp-model-auth -n evaluated-models kubectl.kubernetes.io/last-applied-configuration- >/dev/null 2>&1 || true
              echo "garak-kfp-model-auth ready (api-key, ca_cert, kfp_url, kfp_sa_token, k8s_url, k8s_sa_token)"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: service-ca
              mountPath: /service-ca
              readOnly: true
            - name: kube-root-ca
              mountPath: /kube-root-ca
              readOnly: true
      volumes:
        - name: service-ca
          configMap:
            name: candidate-model-service-ca
        - name: kube-root-ca
          configMap:
            name: kube-root-ca.crt
