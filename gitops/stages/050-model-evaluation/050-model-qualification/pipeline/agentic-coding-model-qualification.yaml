apiVersion: pipelines.kubeflow.org/v2beta1
kind: Pipeline
metadata:
  name: agentic-coding-model-qualification
  namespace: evaluated-models
spec:
  description: Evaluates one candidate model on the agentic coding collections and
    the Garak context-aware vulnerability scan, and records the verdict on its model
    registry version.
  displayName: Agentic coding model qualification
