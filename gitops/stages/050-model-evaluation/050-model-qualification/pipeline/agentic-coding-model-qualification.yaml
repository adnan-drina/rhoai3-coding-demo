            command:
            - sh
            - -c
            - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
              \ || python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\
              \nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location\
              \ --index-url https://pypi.org/simple --trusted-host https://pypi.org/simple\
              \ 'eval-hub-sdk[cli]==1.0.5'  &&  python3 -m pip install --quiet --no-warn-script-location\
              \ --index-url https://pypi.org/simple --trusted-host https://pypi.org/simple\
              \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
              3.9\"' && \"$0\" \"$@\"\n"
            - sh
            - -ec
            - 'program_path=$(mktemp -d)


              printf "%s" "$0" > "$program_path/ephemeral_component.py"

              _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef evaluate(\n    model_name: str,\n    collection_id:\
              \ str,\n    benchmark_id: str,\n    auth_secret: str,\n    experiment:\
              \ str,\n    evalhub_url: str,\n    queue: str,\n    risk_model: str,\n\
              \    judge_model: str,\n    intents_timeout: int,\n    intents_garak_config:\
              \ str,\n    intents_target_parameters: str,\n    intents_data: str,\n\
              \    intents_threshold: float,\n    run_name: str,\n    run_id: str,\n\
              \    timeout_seconds: int,\n    skip: bool,\n    guarded: bool,\n  \
              \  guardrails: str,\n    trace_port: int,\n    mlflow_url: str,\n  \
              \  thanos_url: str,\n    previous: dsl.Input[dsl.Dataset],\n    results:\
              \ dsl.Output[dsl.Dataset],\n):\n    \"\"\"Run one EvalHub collection,\
              \ or one garak benchmark, on the candidate and wait for it (a performance\
              \ collection of\n    one benchmark runs as that benchmark, from v41,\
              \ so the dashboard names its primary metric and gate). Reads the results\n\
              \    ledger of the step before, appends this evaluation (job, state,\
              \ each benchmark's metric, value, gate and pass,\n    the job's MLflow\
              \ run) and hands it on, so the run graph shows the intermediate results\
              \ between the steps as\n    garak's datasets do.\n\n    Then completes\
              \ the job's MLflow data (from v39; best effort, an MLflow or Thanos\
              \ error is printed and never fails\n    the step). EvalHub opens one\
              \ run per job (<job name>, tag evaluation_job_id) holding only evaluation-card.json\
              \ and\n    leaves it RUNNING; the adapter logs one run per benchmark\
              \ (<job id>_<n>, the run the dashboard's Compare opens)\n    without\
              \ a parent; GuideLLM logs none. This step logs the job's results to\
              \ the job run (every benchmark metric as\n    <benchmark>.<metric>,\
              \ <benchmark>.primary_score, .threshold and .pass, the job's score;\
              \ parameters: collection,\n    benchmarks, providers, model, target\
              \ and each benchmark's generation settings), the gate to each benchmark\
              \ run\n    (primary_score, threshold, pass and the same settings), the\
              \ candidate's vLLM metrics over the job's time window\n    from Thanos\
              \ (system/*), nests the job run under the pipeline run's MLflow run\
              \ and each benchmark run under the job\n    run (tag mlflow.parentRunId),\
              \ and closes the job run FINISHED, FAILED or KILLED at the job's last\
              \ update.\"\"\"\n    import json\n    what = (collection_id or f\"garak/{benchmark_id}\"\
              ) + (\" (guarded)\" if guarded else \"\")\n    guardrails = guardrails.strip()\
              \ if guarded else \"\"\n    with open(previous.path) as f:\n       \
              \ ledger = json.load(f)\n\n    def hand_on(entry):\n        ledger[\"\
              results\"].append(entry)\n        with open(results.path, \"w\") as\
              \ f:\n            json.dump(ledger, f, indent=1)\n\n    if skip:\n \
              \       print(f\"{what}: skipped by the run's skip parameter; no EvalHub\
              \ job submitted\")\n        hand_on({\"evaluation\": what, \"skipped\"\
              : True})\n        return\n    if guarded and not guardrails:\n     \
              \   print(f\"{what}: no guardrails named in the run's guardrails parameter;\
              \ no EvalHub job submitted\")\n        hand_on({\"evaluation\": what,\
              \ \"skipped\": True, \"no_guardrails\": True})\n        return\n   \
              \ import os\n    import re\n    import ssl\n    import subprocess\n\
              \    import tempfile\n    import urllib.request\n\n    import httpx\n\
              \    import yaml\n\n    sa = \"/var/run/secrets/kubernetes.io/serviceaccount\"\
              \n    tenant = open(f\"{sa}/namespace\").read().strip()\n    token =\
              \ open(f\"{sa}/token\").read().strip()\n    kube_ctx = ssl.create_default_context(cafile=f\"\
              {sa}/ca.crt\")\n\n    def kube(path):\n        req = urllib.request.Request(f\"\
              https://kubernetes.default.svc{path}\", headers={\"Authorization\":\
              \ f\"Bearer {token}\"})\n        with urllib.request.urlopen(req, context=kube_ctx,\
              \ timeout=30) as r:\n            return json.load(r)\n\n    model_url\
              \ = kube(f\"/apis/serving.kserve.io/v1beta1/namespaces/{tenant}/inferenceservices/{model_name}\"\
              )[\n        \"status\"][\"url\"].rstrip(\"/\") + \"/v1\"\n    if guardrails:\n\
              \        # The guardrail's internal Service (NemoGuardrails, port 443\
              \ behind kube-rbac-proxy, service CA certificate).\n        model_url\
              \ = f\"https://{guardrails}.{tenant}.svc:443/v1\"\n    trace_url = \"\
              \"\n    if trace_port:\n        # model-trace-proxy: register this run\
              \ on the step's port, then send the job there. Tracing never fails a\n\
              \        # qualification: when the proxy does not answer, the job calls\
              \ the candidate directly.\n        trace_url = f\"https://model-trace-proxy.{tenant}.svc:{trace_port}\"\
              \n        try:\n            req = urllib.request.Request(f\"{trace_url}/_trace/context\"\
              , method=\"PUT\", data=json.dumps(\n                {\"run_id\": run_id,\
              \ \"run_name\": run_name, \"model\": model_name}).encode(),\n      \
              \          headers={\"Content-Type\": \"application/json\"})\n     \
              \       with urllib.request.urlopen(req, context=ssl.create_default_context(\n\
              \                    cafile=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\"\
              ), timeout=15) as r:\n                print(f\"model-trace-proxy: {r.read().decode()}\"\
              )\n            model_url = f\"{trace_url}/v1\"\n        except Exception\
              \ as exc:\n            print(f\"model-trace-proxy not reachable ({exc});\
              \ the job calls the candidate directly, without MLflow traces\")\n \
              \           trace_url = \"\"\n    client = httpx.Client(base_url=evalhub_url,\
              \ timeout=60, verify=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\"\
              ,\n                          headers={\"Authorization\": f\"Bearer {token}\"\
              , \"X-Tenant\": tenant})\n    work = tempfile.mkdtemp()\n    profile\
              \ = os.path.join(work, \"evalhub.yaml\")\n    with open(profile, \"\
              w\") as f:\n        yaml.safe_dump({\"active_profile\": \"default\"\
              ,\n                        \"profiles\": {\"default\": {\"base_url\"\
              : evalhub_url, \"tenant\": tenant}}}, f)\n    env = dict(os.environ,\
              \ EVALHUB_CONFIG=profile)\n    subprocess.run([\"evalhub\", \"health\"\
              ], env=env, check=True)\n\n    def record_in_mlflow(job, job_id, state,\
              \ terminal, what, tags, target, client):\n        \"\"\"Complete the\
              \ job's MLflow data (see the docstring); returns the job run's id or\
              \ None. Each write is its own\n        best-effort call, so one refused\
              \ write leaves the others.\"\"\"\n        import datetime\n        import\
              \ math\n        import time\n        import urllib.parse\n\n       \
              \ service_ctx = ssl.create_default_context(cafile=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\"\
              )\n\n        def ml(path, data=None):\n            req = urllib.request.Request(f\"\
              {mlflow_url}{path}\", method=\"POST\" if data is not None else \"GET\"\
              ,\n                                         data=json.dumps(data).encode()\
              \ if data is not None else None, headers={\n                       \
              \                      \"Authorization\": f\"Bearer {token}\", \"X-MLflow-Workspace\"\
              : tenant,\n                                             \"Content-Type\"\
              : \"application/json\"})\n            with urllib.request.urlopen(req,\
              \ context=service_ctx, timeout=60) as r:\n                return json.load(r)\n\
              \n        def attempt(name, fn):\n            try:\n               \
              \ return fn()\n            except Exception as exc:\n              \
              \  detail = exc.read().decode(errors=\"replace\")[:300] if hasattr(exc,\
              \ \"read\") else \"\"\n                print(f\"MLflow: {name} failed:\
              \ {exc} {detail}\")\n                return None\n\n        def num(v):\n\
              \            if isinstance(v, bool):\n                return float(v)\n\
              \            return float(v) if isinstance(v, (int, float)) and math.isfinite(v)\
              \ else None\n\n        def mkey(k):\n            # MLflow keys allow\
              \ alphanumerics, _ - . space : and /.\n            return re.sub(r\"\
              [^A-Za-z0-9_\\-. :/]\", \"_\", str(k))[:250]\n\n        def ms(iso):\n\
              \            return int(datetime.datetime.fromisoformat(iso.replace(\"\
              Z\", \"+00:00\")).timestamp() * 1000)\n\n        def settings(parameters):\n\
              \            \"\"\"The generation settings in a benchmark's parameters:\
              \ token_cap, temperature, top_p.\"\"\"\n            found = {}\n\n \
              \           def walk(x):\n                if isinstance(x, dict):\n\
              \                    for k, v in x.items():\n                      \
              \  if k in (\"max_new_tokens\", \"max_tokens\", \"max_gen_toks\") and\
              \ num(v) is not None:\n                            found.setdefault(\"\
              token_cap\", v)\n                        elif k in (\"temperature\"\
              , \"top_p\") and num(v) is not None:\n                            found.setdefault(k,\
              \ v)\n                        elif k == \"data\" and isinstance(v, str)\
              \ and re.search(r\"output_tokens=(\\d+)\", v):\n                   \
              \         found.setdefault(\"token_cap\", int(re.search(r\"output_tokens=(\\\
              d+)\", v).group(1)))\n                        else:\n              \
              \              walk(v)\n\n            walk(parameters)\n           \
              \ return found\n\n        def log_batch(run_uuid, metrics=(), params=(),\
              \ tags=()):\n            # A batch with one key twice at different values\
              \ is refused whole: the first value of a key wins.\n            params\
              \ = list({p[\"key\"]: p for p in reversed(list(params))}.values())[::-1]\n\
              \            tags = list({t[\"key\"]: t for t in reversed(list(tags))}.values())[::-1]\n\
              \            metrics = list(metrics)\n            # One call takes at\
              \ most 1000 metrics, 100 params and 100 tags.\n            while metrics\
              \ or params or tags:\n                attempt(f\"log-batch to run {run_uuid}\"\
              , lambda: ml(\"/api/2.0/mlflow/runs/log-batch\", {\n               \
              \     \"run_id\": run_uuid, \"metrics\": metrics[:1000], \"params\"\
              : params[:100], \"tags\": tags[:100]}))\n                metrics, params,\
              \ tags = metrics[1000:], params[100:], tags[100:]\n\n        experiment_id\
              \ = (job.get(\"resource\") or {}).get(\"mlflow_experiment_id\")\n  \
              \      if not experiment_id:\n            print(f\"MLflow: job {job_id}\
              \ names no MLflow experiment; nothing recorded\")\n            return\
              \ None\n\n        def search(filter_string):\n            return ml(\"\
              /api/2.0/mlflow/runs/search\", {\"experiment_ids\": [experiment_id],\
