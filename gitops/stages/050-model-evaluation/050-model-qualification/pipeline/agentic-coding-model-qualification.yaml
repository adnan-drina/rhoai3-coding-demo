          container:
            args:
            - --executor_input
            - '{{$}}'
            - --function_to_execute
            - evaluate
            command:
            - sh
            - -c
            - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
              \ || python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\
              \nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location\
              \ --index-url https://pypi.org/simple --trusted-host https://pypi.org/simple\
              \ 'eval-hub-sdk[cli]==1.0.5'  &&  python3 -m pip install --quiet --no-warn-script-location\
              \ --index-url https://pypi.org/simple --trusted-host https://pypi.org/simple\
              \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
              3.9\"' && \"$0\" \"$@\"\n"
            - sh
            - -ec
            - 'program_path=$(mktemp -d)


              printf "%s" "$0" > "$program_path/ephemeral_component.py"

              _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef evaluate(\n    model_name: str,\n    collection_id:\
              \ str,\n    benchmark_id: str,\n    auth_secret: str,\n    experiment:\
              \ str,\n    evalhub_url: str,\n    queue: str,\n    risk_model: str,\n\
              \    intents_timeout: int,\n    sdg_num_samples: int,\n    run_name:\
              \ str,\n    run_id: str,\n    timeout_seconds: int,\n    skip: bool,\n\
              \    previous: dsl.Input[dsl.Dataset],\n    results: dsl.Output[dsl.Dataset],\n\
              ):\n    \"\"\"Run one EvalHub collection, or one garak benchmark, on\
              \ the candidate and wait for it. Reads the results\n    ledger of the\
              \ step before, appends this evaluation (job, state, each benchmark's\
              \ metric, value, gate and pass) and\n    hands it on, so the run graph\
              \ shows the intermediate results between the steps as garak's datasets\
              \ do.\"\"\"\n    import json\n    what = collection_id or f\"garak/{benchmark_id}\"\
              \n    with open(previous.path) as f:\n        ledger = json.load(f)\n\
              \n    def hand_on(entry):\n        ledger[\"results\"].append(entry)\n\
              \        with open(results.path, \"w\") as f:\n            json.dump(ledger,\
              \ f, indent=1)\n\n    if skip:\n        print(f\"{what}: skipped by\
              \ the run's skip parameter; no EvalHub job submitted\")\n        hand_on({\"\
              evaluation\": what, \"skipped\": True})\n        return\n    import\
              \ os\n    import re\n    import ssl\n    import subprocess\n    import\
              \ tempfile\n    import urllib.request\n\n    import httpx\n    import\
              \ yaml\n\n    sa = \"/var/run/secrets/kubernetes.io/serviceaccount\"\
              \n    tenant = open(f\"{sa}/namespace\").read().strip()\n    token =\
              \ open(f\"{sa}/token\").read().strip()\n    kube_ctx = ssl.create_default_context(cafile=f\"\
              {sa}/ca.crt\")\n\n    def kube(path):\n        req = urllib.request.Request(f\"\
              https://kubernetes.default.svc{path}\", headers={\"Authorization\":\
              \ f\"Bearer {token}\"})\n        with urllib.request.urlopen(req, context=kube_ctx,\
              \ timeout=30) as r:\n            return json.load(r)\n\n    model_url\
              \ = kube(f\"/apis/serving.kserve.io/v1beta1/namespaces/{tenant}/inferenceservices/{model_name}\"\
              )[\n        \"status\"][\"url\"].rstrip(\"/\") + \"/v1\"\n    client\
              \ = httpx.Client(base_url=evalhub_url, timeout=60, verify=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\"\
              ,\n                          headers={\"Authorization\": f\"Bearer {token}\"\
              , \"X-Tenant\": tenant})\n    work = tempfile.mkdtemp()\n    profile\
              \ = os.path.join(work, \"evalhub.yaml\")\n    with open(profile, \"\
              w\") as f:\n        yaml.safe_dump({\"active_profile\": \"default\"\
              ,\n                        \"profiles\": {\"default\": {\"base_url\"\
              : evalhub_url, \"tenant\": tenant}}}, f)\n    env = dict(os.environ,\
              \ EVALHUB_CONFIG=profile)\n    subprocess.run([\"evalhub\", \"health\"\
              ], env=env, check=True)\n\n    tags = {\"run\": run_id, \"run_name\"\
              : run_name, \"model\": model_name, \"evaluation\": what}\n    body =\
              \ {\n        \"name\": f\"{(collection_id or benchmark_id).replace('_',\
              \ '-')}-{model_name}-{run_name}\"[:120],\n        \"description\": f\"\
              Onboarding qualification run {run_name}: {model_name} on {what}\",\n\
              \        \"tags\": [\"model-onboarding\", f\"run={run_id}\", f\"model={model_name}\"\
              ],\n        \"model\": {\"url\": model_url, \"name\": model_name, \"\
              auth\": {\"secret_ref\": auth_secret}},\n        \"experiment\": {\"\
              name\": experiment, \"tags\": [{\"key\": k, \"value\": v} for k, v in\
              \ tags.items()]},\n        \"queue\": {\"kind\": \"kueue\", \"name\"\
              : queue},\n    }\n    if collection_id:\n        body[\"collection\"\
              ] = {\"id\": collection_id}\n    else:\n        # The provider catalog's\
              \ primary metric, direction and threshold, as the dashboard form sends\
              \ them.\n        catalog = client.get(\"/api/v1/evaluations/providers/garak\"\
              ).raise_for_status().json()\n        bdef = next(b for b in catalog.get(\"\
              benchmarks\") or [] if b.get(\"id\") == benchmark_id)\n        parameters\
              \ = {}\n        if benchmark_id == \"intents\":\n            parameters\
              \ = {\"timeout\": intents_timeout, \"sdg_num_samples\": sdg_num_samples,\n\
              \                          \"intents_models\": {\"judge\": {\"name\"\
              : risk_model},\n                                             \"sdg\"\
              : {\"name\": f\"hosted_vllm/{risk_model}\"}}}\n        body[\"benchmarks\"\
              ] = [{\"id\": benchmark_id, \"provider_id\": \"garak\", \"parameters\"\
              : parameters,\n                               \"primary_score\": bdef[\"\
              primary_score\"], \"pass_criteria\": bdef[\"pass_criteria\"]}]\n   \
              \ path = os.path.join(work, \"eval.yaml\")\n    with open(path, \"w\"\
              ) as f:\n        yaml.safe_dump(body, f, sort_keys=False)\n    print(open(path).read())\n\
              \n    # --wait blocks until the job is terminal and exits 1 when the\
              \ job fails (before printing it), so the job id\n    # comes from the\
              \ \"Job submitted\" line.\n    run = subprocess.run([\"evalhub\", \"\
              eval\", \"run\", \"--config\", path, \"--wait\", \"--timeout\", str(timeout_seconds),\n\
              \                          \"--format\", \"json\"], env=env, capture_output=True,\
              \ text=True)\n    print(run.stderr, end=\"\")\n    submitted = re.search(r\"\
              Job submitted: (\\S+)\", run.stderr)\n    if not submitted:\n      \
              \  raise RuntimeError(f\"evalhub eval run submitted no job (exit {run.returncode})\"\
              )\n    job_id = submitted.group(1)\n    # The SDK job model (1.0.5)\
              \ drops the gate results (results.test, benchmarks[].test), so the job\
              \ is read from\n    # the documented jobs endpoint.\n    job = client.get(f\"\
              /api/v1/evaluations/jobs/{job_id}\").raise_for_status().json()\n   \
              \ state = (job.get(\"status\") or {}).get(\"state\")\n    for b in (job.get(\"\
              results\") or {}).get(\"benchmarks\") or []:\n        t = b.get(\"test\"\
              ) or {}\n        print(f\"  {b.get('id')}: {t.get('primary_score_metric')}\
              \ {t.get('primary_score')} \"\n              f\"(threshold {t.get('threshold')})\
              \ {'pass' if t.get('pass') else 'fail'}\")\n    print(f\"{what}: job\
              \ {job_id} {state} (exit {run.returncode})\")\n    if state not in (\"\
              completed\", \"failed\", \"cancelled\", \"partially_failed\"):\n   \
              \     raise RuntimeError(f\"job {job_id} did not finish within {timeout_seconds}s\
              \ (state {state})\")\n    hand_on({\"evaluation\": what, \"job_id\"\
              : job_id, \"job_name\": body[\"name\"], \"state\": state, \"benchmarks\"\
              : [\n        {\"id\": b.get(\"id\"), \"metric\": (b.get(\"test\") or\
              \ {}).get(\"primary_score_metric\"),\n         \"value\": (b.get(\"\
              test\") or {}).get(\"primary_score\"), \"threshold\": (b.get(\"test\"\
              ) or {}).get(\"threshold\"),\n         \"pass\": (b.get(\"test\") or\
              \ {}).get(\"pass\")}\n        for b in (job.get(\"results\") or {}).get(\"\
              benchmarks\") or []]})\n\n"
            image: registry.redhat.io/rhoai/odh-pipeline-runtime-minimal-cpu-py312-rhel9@sha256:3756f9891a27c2581201fd6696457c9b98ffefd80c88b900740f76e2bf970429
            resources:
              cpuLimit: 0.5
              cpuRequest: 0.1
              memoryLimit: 0.536870912
              memoryRequest: 0.268435456
              resourceCpuLimit: 500m
              resourceCpuRequest: 100m
              resourceMemoryLimit: 512Mi
              resourceMemoryRequest: 256Mi
