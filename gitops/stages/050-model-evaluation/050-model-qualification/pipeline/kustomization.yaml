apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agentic-coding-model-qualification.yaml
# The PipelineVersion webhook requires its Pipeline to exist, so versions sync one wave later. A PipelineVersion syncs
# server-side: from v42 its compiled spec (each evaluation step embeds the evaluate source) is over the 256 KiB a
# client-side apply's last-applied-configuration annotation may hold ("metadata.annotations: Too long").
patches:
  - target:
      kind: Pipeline
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "16"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  - target:
      kind: PipelineVersion
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "17"
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,ServerSideApply=true
