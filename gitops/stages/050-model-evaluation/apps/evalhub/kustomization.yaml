# EvalHub with its PostgreSQL (data), tenant access and the curated prompts project.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: rhoai-platform
      app.kubernetes.io/managed-by: argocd
      demo.rhoai.io/stage: "050"
    includeSelectors: false

resources:
  - ../../base/evalhub
  - ../../base/tenant
  - ../../base/prompts
