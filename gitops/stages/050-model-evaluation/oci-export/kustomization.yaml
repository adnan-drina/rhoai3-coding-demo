# OCI export of evaluation results.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: rhoai-platform
      app.kubernetes.io/managed-by: argocd
      demo.rhoai.io/stage: "050"
    includeSelectors: false

resources:
  - oci-export.yaml
# Repository rule: app.kubernetes.io/name and component on every object (selectors untouched).
labels:
  - pairs:
      app.kubernetes.io/name: evalhub-oci-export
      app.kubernetes.io/component: evaluation-export
    includeSelectors: false
