# Agentic coding serving capacity (GuideLLM): output tokens per second with 8 agent turns in flight
# (8,000 prompt and 256 output tokens each), sized so a request stays inside the 30 s sidecar limit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-collection-agentic-coding-throughput-v1
  namespace: redhat-ods-applications
  labels:
    trustyai.opendatahub.io/evalhub-collection-type: system
    trustyai.opendatahub.io/evalhub-collection-name: agentic-coding-throughput-v1
    app.kubernetes.io/name: evalhub-collection-agentic-coding-throughput-v1
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  agentic-coding-throughput-v1.yaml: |
    id: agentic-coding-throughput-v1
    name: Agentic coding throughput v1
    category: performance
    description: >-
      How much agent traffic does the model's GPU node serve? Output tokens per second with 8 concurrent
      agent turns of 8,000 prompt and 256 output tokens and the Qwen 3.x tokenizer, sized so each request
      stays inside the evaluation sidecar's 30 s request limit. Submit with model.url ending in /v1.
    tags: [performance, throughput, agentic-coding, guidellm, edd]
    benchmarks:
      - id: throughput
        provider_id: guidellm
        weight: 1
        primary_score:
          metric: output_tokens_per_second
          lower_is_better: false
        pass_criteria:
          threshold: 60
        parameters:
          profile: throughput
          # Requests in flight at saturation; GuideLLM's throughput profile requires it.
          rate: 8
          max_seconds: 180
          data: prompt_tokens=8000,output_tokens=256
          # Tokenizer used to size the synthetic prompts; shared by the Qwen 3.x models.
          processor: RedHatAI/Qwen3.8-27B-INT4
          request_type: chat_completions
