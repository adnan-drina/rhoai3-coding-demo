# Evaluation-driven development criteria for agentic coding, capability dimension (RHOAI 3.5 "Evaluating AI
# systems" 2.1 pass criteria and weights, 2.23 collection by ConfigMap). Versioned: change criteria in a new -v2.
# Capability is split in two collections the pipeline runs one after the other: a LiveCodeBench request asks
# for 16 samples and needs all 16 sequence slots of the served model, so a benchmark running beside it pushes
# its requests past the evaluation sidecar's 30 s limit (EvalHub runs a collection's benchmarks in parallel).
# The qualification leaderboard combines both into the weighted capability score (3:2:1, gate 0.50).
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-collection-agentic-coding-python-tasks-v1
  namespace: redhat-ods-applications
  labels:
    trustyai.opendatahub.io/evalhub-collection-type: system
    trustyai.opendatahub.io/evalhub-collection-name: agentic-coding-python-tasks-v1
    app.kubernetes.io/name: evalhub-collection-agentic-coding-python-tasks-v1
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  agentic-coding-python-tasks-v1.yaml: |
    id: agentic-coding-python-tasks-v1
    name: Agentic coding capability - Python tasks v1
    category: code
    description: >-
      Does the model write everyday working Python? MBPP (entry-level tasks, weight 2) and HumanEval (function
      synthesis from docstrings, weight 1), execution-scored, through the inspect-coding provider (512-token cap,
      eight concurrent requests, three retries). The collection gate 0.67 is the weighted mean of the slice gates
      (0.60 and 0.80). Weight 3 of 6 in the leaderboard's capability score. Submit with model.url ending in /v1.
    tags: [code, agentic-coding, execution, edd]
    pass_criteria:
      threshold: 0.67
    benchmarks:
      - id: inspect/mbpp
        provider_id: inspect-coding
        weight: 2
        primary_score:
          metric: verify/accuracy
          lower_is_better: false
        pass_criteria:
          threshold: 0.6
        parameters:
          max_samples: 100
      - id: inspect/humaneval
        provider_id: inspect-coding
        weight: 1
        primary_score:
          metric: verify/accuracy
          lower_is_better: false
        pass_criteria:
          threshold: 0.8
        parameters:
          max_samples: 164
