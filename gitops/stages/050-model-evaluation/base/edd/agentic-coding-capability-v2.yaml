# Evaluation-driven development criteria for agentic coding, capability dimension (RHOAI 3.5 "Evaluating AI
# systems" 2.1 pass criteria and weights, 2.23 collection by ConfigMap). Versioned: change criteria in a new -v2.
apiVersion: v1
kind: ConfigMap
metadata:
  name: evalhub-collection-agentic-coding-capability-v2
  namespace: redhat-ods-applications
  labels:
    trustyai.opendatahub.io/evalhub-collection-type: system
    trustyai.opendatahub.io/evalhub-collection-name: agentic-coding-capability-v2
    app.kubernetes.io/name: evalhub-collection-agentic-coding-capability-v2
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
data:
  agentic-coding-capability-v2.yaml: |
    id: agentic-coding-capability-v2
    name: Agentic coding capability v2
    category: code
    description: >-
      Can the model write working code? Three execution-scored slices, weighted toward the hardest and least
      contaminated: LiveCodeBench v6 (competitive programming after the model cutoff), MBPP (everyday Python
      tasks) and HumanEval (function synthesis from docstrings). The weighted average gates qualification.
      Sized for RHOAI 3.5.1: 16-sample LiveCodeBench requests use a code-only prompt and a 512-token cap to
      stay inside the evaluation sidecar's 30 s request limit, and the Inspect samples are bounded with
      max_samples because the shipped adapter ignores num_examples. Submit with model.url ending in /v1.
      v2 runs MBPP and HumanEval through the inspect-coding provider: a 512-token cap, eight concurrent
      requests and three retries, so no request outlives the sidecar limit; criteria are otherwise unchanged.
    tags: [code, agentic-coding, execution, edd]
    pass_criteria:
      threshold: 0.5
    benchmarks:
      - id: lcb:codegeneration_v6
        provider_id: lighteval
        weight: 3
        primary_score:
          metric: codegen_pass@1
          lower_is_better: false
        pass_criteria:
          threshold: 0.25
        parameters:
          provider: endpoint
          num_few_shot: 0
          num_examples: 100
          parameters:
            concurrent_requests: 1
            api_max_retry: 1
            system_prompt: "Answer with the complete Python program in a single ```python code block and nothing else."
            generation_parameters:
              temperature: 0.7
              top_p: 0.8
              max_new_tokens: 512
      - id: inspect/mbpp
        provider_id: inspect-coding
        weight: 2
        primary_score:
          metric: verify/accuracy
          lower_is_better: false
        pass_criteria:
          threshold: 0.6
        parameters:
          max_samples: 100
      - id: inspect/humaneval
        provider_id: inspect-coding
        weight: 1
        primary_score:
          metric: verify/accuracy
          lower_is_better: false
        pass_criteria:
          threshold: 0.8
        parameters:
          max_samples: 164
