apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: evalhub
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: evalhub
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  replicas: 1
  tenancy: multi
  database:
    type: postgresql
    secret: evalhub-db-credentials
  # Native catalog loading is metadata-only; every actual evaluation is explicit.
  providers:
    - deepeval
    - garak
    - garak-kfp
    - guidellm
    - ibm-clear
    - inspect
    - lighteval
    - lm-evaluation-harness
    - ragas
  collections:
    - coding-v1
    - instruction-following-v1
    - leaderboard-v2
    - long-context-v1
    - model-validation
    - reasoning-v1
    - safety-and-fairness-v1
    - standard-llm-evals-v1
    - toxicity-and-ethical-principles
  env:
    # The deployment helper discovers the native HTTPS address only after
    # MLflow is Available. The operator owns TLS trust and projected tokens.
    - name: MLFLOW_TRACKING_URI
      valueFrom:
        configMapKeyRef:
          name: evalhub-mlflow-connection
          key: tracking-uri
