apiVersion: batch/v1
kind: Job
metadata:
  name: evalhub-credentials-ready
  namespace: evalhub
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: evalhub-credentials-ready
      restartPolicy: Never
      containers:
      - name: wait
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command: [/bin/bash, -ceu]
        args:
        - |
          deadline=$((SECONDS + 570))
          until oc get secret evalhub-db-credentials --request-timeout=10s -o name >/dev/null 2>&1; do
            (( SECONDS < deadline )) || { echo 'Runtime database credential prerequisite timed out' >&2; exit 1; }
            sleep 5
          done
          echo 'Runtime database credential prerequisite present'
