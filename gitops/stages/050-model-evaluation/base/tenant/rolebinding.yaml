apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-evalhub-access
  namespace: demo-sandbox
  labels:
    app.kubernetes.io/name: demo-evalhub-access
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
subjects:
  - kind: Group
    name: rhods-admins
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: rhoai-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: evalhub-evaluator
  apiGroup: rbac.authorization.k8s.io
