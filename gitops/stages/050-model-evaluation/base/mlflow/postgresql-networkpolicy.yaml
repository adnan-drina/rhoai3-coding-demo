apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-postgresql
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: mlflow-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.openshift.io/runtime: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        # Keep the database private to its service namespace.
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
