# Qwen 3.6 27B FP8 as an evaluation candidate in the EvalHub tenant (qualification before promotion).
# The Evaluations page's Start evaluation run form lists InferenceService objects of the selected project
# (RHOAI 3.5 dashboard), so candidates are served here as an InferenceService; models that pass the
# agentic-coding-* collections are promoted to MaaS as an LLMInferenceService in internal-models.
# Same model revision, vLLM build and serving arguments as the MaaS profile (Stage 040). Token
# authentication is on (kube-rbac-proxy), the hardware profile and Kueue queue match the GPU platform, and
# evaluation jobs authenticate with their ServiceAccount token (job-model-access.yaml).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-6-27b
  namespace: demo-sandbox
  labels:
    opendatahub.io/dashboard: "true"
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
  annotations:
    openshift.io/display-name: Qwen3.6 27B FP8 (evaluation candidate)
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "true"
    opendatahub.io/hardware-profile-name: gpu-reserved-demo
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    argocd.argoproj.io/sync-wave: "21"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: Recreate
    model:
      runtime: vllm-cuda-runtime
      modelFormat:
        name: vLLM
      storageUri: hf://RedHatAI/Qwen3.6-27B-FP8:57d986c3ab0397a811e5150190eff67f76fab6e0
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      args:
        - --enable-force-include-usage
        - --disable-uvicorn-access-log
        - --enable-prefix-caching
        - --max-model-len=131072
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.92
        - --language-model-only
        - --max-num-batched-tokens=4096
        - --max-num-seqs=16
        - --override-generation-config={"temperature":0.7,"top_p":0.8,"top_k":20,"min_p":0.0,"presence_penalty":1.5,"repetition_penalty":1.0}
        - --default-chat-template-kwargs={"enable_thinking":false}
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
