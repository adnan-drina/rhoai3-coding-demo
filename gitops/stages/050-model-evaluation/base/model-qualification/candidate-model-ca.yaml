# Model auth Secret for candidates served in this project. A candidate InferenceService listens on HTTPS with
# an OpenShift service-serving certificate, which the EvalHub job sidecar does not trust by default (the
# candidate's auth proxy logs "tls: bad certificate"). Per "Connect EvalHub to protected production model
# servers", a model auth Secret with only the ca_cert key enables TLS verification; the job's implicit
# ServiceAccount token auth (evalhub-job-model-access) still applies. The CA is public; a Sync hook copies
# it from the service-CA-injected ConfigMap because EvalHub reads model credentials from Secrets only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: candidate-model-ca-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-ca
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: candidate-model-ca-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-ca
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: candidate-model-ca-provisioner
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-ca
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "12"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: candidate-model-ca-provisioner
subjects:
  - kind: ServiceAccount
    name: candidate-model-ca-provisioner
    namespace: evaluated-models
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-candidate-model-ca
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: candidate-model-ca
    app.kubernetes.io/component: evaluation
  annotations:
    argocd.argoproj.io/sync-wave: "13"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: candidate-model-ca-provisioner
      containers:
        - name: provision
          # Same reviewed OpenShift CLI image as the other Stage 050 jobs.
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              # The service CA operator fills the ConfigMap shortly after it is created.
              for i in $(seq 1 60); do grep -q 'BEGIN CERTIFICATE' /service-ca/service-ca.crt 2>/dev/null && break; sleep 5; done
              grep -q 'BEGIN CERTIFICATE' /service-ca/service-ca.crt
              oc create secret generic qualification-model-ca -n evaluated-models \
                --from-file=ca_cert=/service-ca/service-ca.crt --dry-run=client -o yaml | oc apply -f -
              oc label secret qualification-model-ca -n evaluated-models --overwrite \
                app.kubernetes.io/name=candidate-model-ca app.kubernetes.io/part-of=rhoai-platform >/dev/null
              echo "qualification-model-ca ready"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: service-ca
              mountPath: /service-ca
              readOnly: true
      volumes:
        - name: service-ca
          configMap:
            name: pipelines-service-ca
