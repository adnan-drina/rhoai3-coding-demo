            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef evaluate_collection(\n    collection_id: str,\n  \
              \  collection_version: str,\n    baseline_model_name: str,\n    baseline_model_url:\
              \ str,\n    baseline_auth_secret: str,\n    candidate_model_name: str,\n\
              \    candidate_model_url: str,\n    candidate_auth_secret: str,\n  \
              \  experiment: str,\n    queue: str,\n    evalhub_url: str,\n    tenant:\
              \ str,\n    qualification_id: str,\n    timeout_seconds: int,\n    results:\
              \ dsl.Output[dsl.Artifact],\n):\n    \"\"\"Run one EvalHub collection\
              \ on the baseline and the candidate in parallel and keep both results.\"\
              \"\"\n    import json\n    import os\n    import re\n    import subprocess\n\
              \    import tempfile\n\n    import httpx\n    import yaml\n\n    work\
              \ = tempfile.mkdtemp()\n    profile = os.path.join(work, \"evalhub.yaml\"\
              )\n    with open(profile, \"w\") as f:\n        yaml.safe_dump({\"active_profile\"\
              : \"default\",\n                        \"profiles\": {\"default\":\
              \ {\"base_url\": evalhub_url, \"tenant\": tenant}}}, f)\n    env = dict(os.environ,\
              \ EVALHUB_CONFIG=profile)\n    subprocess.run([\"evalhub\", \"health\"\
              ], env=env, check=True)\n\n    models = {\"baseline\": (baseline_model_name,\
              \ baseline_model_url, baseline_auth_secret),\n              \"candidate\"\
              : (candidate_model_name, candidate_model_url, candidate_auth_secret)}\n\
              \    bodies, procs = {}, {}\n    for role, (name, url, auth) in models.items():\n\
              \        model = {\"url\": url, \"name\": name}\n        if auth:\n\
              \            model[\"auth\"] = {\"secret_ref\": auth}\n        tags\
              \ = {\"qualification_id\": qualification_id, \"role\": role, \"model\"\
              : name,\n                \"collection\": collection_id, \"collection_version\"\
              : collection_version}\n        bodies[role] = {\n            \"name\"\
              : f\"{collection_id}-{role}-{qualification_id}\"[:120],\n          \
              \  \"description\": f\"Model qualification {qualification_id}: {role}\
              \ {name} on {collection_id}\",\n            \"tags\": [\"model-qualification\"\
              , role, collection_version],\n            \"model\": model,\n      \
              \      \"collection\": {\"id\": collection_id},\n            \"experiment\"\
              : {\"name\": experiment, \"tags\": [{\"key\": k, \"value\": v} for k,\
              \ v in tags.items()]},\n            \"queue\": {\"kind\": \"kueue\"\
              , \"name\": queue},\n        }\n        path = os.path.join(work, f\"\
              eval-{role}.yaml\")\n        with open(path, \"w\") as f:\n        \
              \    yaml.safe_dump(bodies[role], f, sort_keys=False)\n        # The\
              \ gate: --wait blocks until the job is terminal and exits 1 when the\
              \ job fails.\n        procs[role] = subprocess.Popen(\n            [\"\
              evalhub\", \"eval\", \"run\", \"--config\", path, \"--wait\", \"--timeout\"\
              , str(timeout_seconds),\n             \"--format\", \"json\"], env=env,\
              \ stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)\n\n   \
              \ # The CLI exits before printing the job when it fails, so the id comes\
              \ from \"Job submitted\", and the\n    # job is read from the documented\
              \ jobs endpoint because the SDK job model (1.0.5) drops the gate\n \
              \   # results (results.test, benchmarks[].test).\n    with open(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
              ) as f:\n        token = f.read().strip()\n    out, problems = {\"collection_id\"\
              : collection_id, \"qualification_id\": qualification_id}, []\n    for\
              \ role, proc in procs.items():\n        stdout, stderr = proc.communicate()\n\
              \        print(f\"--- {role}\\n{stderr}\", end=\"\")\n        submitted\
              \ = re.search(r\"Job submitted: (\\S+)\", stderr)\n        if not submitted:\n\
              \            problems.append(f\"{role}: no job submitted (exit {proc.returncode})\"\
              )\n            continue\n        job_id = submitted.group(1)\n     \
              \   response = httpx.get(f\"{evalhub_url}/api/v1/evaluations/jobs/{job_id}\"\
              , timeout=60,\n                             headers={\"Authorization\"\
              : f\"Bearer {token}\", \"X-Tenant\": tenant},\n                    \
              \         verify=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\"\
              )\n        response.raise_for_status()\n        job = response.json()\n\
              \        state = (job.get(\"status\") or {}).get(\"state\")\n      \
              \  if state not in (\"completed\", \"failed\", \"cancelled\", \"partially_failed\"\
              ):\n            problems.append(f\"{role}: job {job_id} not finished\
              \ within {timeout_seconds}s (state {state})\")\n        csv = subprocess.run([\"\
              evalhub\", \"eval\", \"results\", job_id, \"--format\", \"csv\"],\n\
              \                             env=env, capture_output=True, text=True).stdout\n\
              \        out[role] = {\"eval_yaml\": bodies[role], \"job\": job, \"\
              results_csv\": csv}\n        print(f\"{role} {models[role][0]}: job\
              \ {job_id} {state} (exit {proc.returncode})\")\n    with open(results.path,\
              \ \"w\") as f:\n        json.dump(out, f, indent=1)\n    if problems:\n\
              \        raise RuntimeError(\"; \".join(problems))\n\n"
