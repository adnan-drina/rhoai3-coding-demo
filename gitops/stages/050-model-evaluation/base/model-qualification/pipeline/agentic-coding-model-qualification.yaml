    deploymentSpec:
      executors:
        exec-leaderboard:
          container:
            args:
            - --executor_input
            - '{{$}}'
            - --function_to_execute
            - leaderboard
            command:
            - sh
            - -c
            - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
              \ || python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\
              \nPIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location\
              \ 'eval-hub-sdk[cli]==1.0.5'  &&  python3 -m pip install --quiet --no-warn-script-location\
              \ 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
              3.9\"' && \"$0\" \"$@\"\n"
            - sh
            - -ec
            - 'program_path=$(mktemp -d)


              printf "%s" "$0" > "$program_path/ephemeral_component.py"

              _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef leaderboard(\n    evalhub_url: str,\n    tenant: str,\n\
              \    qualification_id: str,\n    baseline_model: str,\n    candidate_model:\
              \ str,\n    max_regression: float,\n    r1: dsl.Input[dsl.Artifact],\
              \ r2: dsl.Input[dsl.Artifact], r3: dsl.Input[dsl.Artifact],\n    r4:\
              \ dsl.Input[dsl.Artifact], r5: dsl.Input[dsl.Artifact], r6: dsl.Input[dsl.Artifact],\n\
              \    r7: dsl.Input[dsl.Artifact], r8: dsl.Input[dsl.Artifact],\n   \
              \ report: dsl.Output[dsl.HTML],\n    summary: dsl.Output[dsl.Markdown],\n\
              \    scores: dsl.Output[dsl.Metrics],\n    decision: dsl.Output[dsl.Artifact],\n\
              ) -> str:\n    \"\"\"Compare baseline and candidate per benchmark and\
              \ recommend promote or hold.\"\"\"\n    import html\n    import json\n\
              \    import os\n    import subprocess\n    import tempfile\n\n    import\
              \ yaml\n\n    profile = os.path.join(tempfile.mkdtemp(), \"evalhub.yaml\"\
              )\n    with open(profile, \"w\") as f:\n        yaml.safe_dump({\"active_profile\"\
              : \"default\",\n                        \"profiles\": {\"default\":\
              \ {\"base_url\": evalhub_url, \"tenant\": tenant}}}, f)\n    env = dict(os.environ,\
              \ EVALHUB_CONFIG=profile)\n\n    runs = {}\n    for art in (r1, r2,\
              \ r3, r4, r5, r6, r7, r8):\n        with open(art.path) as f:\n    \
              \        d = json.load(f)\n        runs[(d[\"collection_id\"], d[\"\
              role\"])] = d[\"job\"]\n    collections = list(dict.fromkeys(c for c,\
              \ _ in runs))\n\n    def describe(cid):\n        out = subprocess.run([\"\
              evalhub\", \"collections\", \"describe\", cid, \"--format\", \"json\"\
              ],\n                             env=env, capture_output=True, text=True,\
              \ check=True).stdout\n        return json.loads(out)\n\n    reasons,\
              \ rows_md, sections = [], [], []\n    capability_delta = None\n    for\
              \ cid in collections:\n        col = describe(cid)\n        bench_defs\
              \ = {b[\"id\"]: b for b in col.get(\"benchmarks\") or []}\n        res\
              \ = {role: (runs[(cid, role)].get(\"results\") or {}) for role in (\"\
              baseline\", \"candidate\")}\n        state = {role: (runs[(cid, role)].get(\"\
              status\") or {}).get(\"state\") for role in (\"baseline\", \"candidate\"\
              )}\n        by_bench = {role: {b.get(\"id\"): b for b in res[role].get(\"\
              benchmarks\") or []} for role in res}\n        rows = []\n        for\
              \ bid, bdef in bench_defs.items():\n            primary = bdef.get(\"\
              primary_score\") or {}\n            metric, lower = primary.get(\"metric\"\
              , \"\"), bool(primary.get(\"lower_is_better\"))\n            threshold\
              \ = (bdef.get(\"pass_criteria\") or {}).get(\"threshold\")\n       \
              \     vals, passes = {}, {}\n            for role in (\"baseline\",\
              \ \"candidate\"):\n                b = by_bench[role].get(bid) or {}\n\
              \                t = b.get(\"test\") or {}\n                vals[role]\
              \ = t.get(\"primary_score\", (b.get(\"metrics\") or {}).get(metric))\n\
              \                passes[role] = t.get(\"pass\")\n                if\
              \ passes[role] is None and isinstance(vals[role], (int, float)) and\
              \ threshold is not None:\n                    passes[role] = vals[role]\
              \ <= threshold if lower else vals[role] >= threshold\n            b,\
              \ c = vals[\"baseline\"], vals[\"candidate\"]\n            delta = None\n\
              \            if isinstance(b, (int, float)) and isinstance(c, (int,\
              \ float)) and b:\n                delta = (c - b) / abs(b) * (-1 if\
              \ lower else 1)  # positive = candidate better\n            if passes[\"\
              candidate\"] is not True:\n                reasons.append(f\"{cid}/{bid}:\
              \ candidate does not pass its gate ({metric} {c} vs threshold {threshold})\"\
              )\n            if delta is not None and delta < -max_regression:\n \
              \               reasons.append(f\"{cid}/{bid}: candidate regresses {abs(delta):.0%}\
              \ on {metric}\")\n            if isinstance(c, (int, float)):\n    \
              \            scores.log_metric(f\"candidate.{bid}.{metric}\".replace(\"\
              /\", \"_\"), float(c))\n            if isinstance(b, (int, float)):\n\
              \                scores.log_metric(f\"baseline.{bid}.{metric}\".replace(\"\
              /\", \"_\"), float(b))\n            rows.append((bid, bdef.get(\"weight\"\
              , 1), metric, \"lower\" if lower else \"higher\", threshold,\n     \
              \                    b, passes[\"baseline\"], c, passes[\"candidate\"\
              ], delta))\n        col_test = {role: (res[role].get(\"test\") or {})\
              \ for role in res}\n        col_threshold = (col.get(\"pass_criteria\"\
              ) or {}).get(\"threshold\")\n        if col_threshold is not None:\n\
              \            if col_test[\"candidate\"].get(\"pass\") is not True:\n\
              \                reasons.append(f\"{cid}: candidate collection score\
              \ {col_test['candidate'].get('score')} misses {col_threshold}\")\n \
              \           cb, cc = col_test[\"baseline\"].get(\"score\"), col_test[\"\
              candidate\"].get(\"score\")\n            if col.get(\"category\") ==\
              \ \"code\" and isinstance(cb, (int, float)) and isinstance(cc, (int,\
              \ float)):\n                capability_delta = cc - cb\n        for\
              \ role in (\"baseline\", \"candidate\"):\n            if state[role]\
              \ != \"completed\":\n                reasons.append(f\"{cid}: {role}\
              \ job ended {state[role]}\")\n        sections.append((cid, col, rows,\
              \ col_test, col_threshold, state))\n\n    if capability_delta is None:\n\
              \        reasons.append(\"no capability score comparison available\"\
              )\n    elif capability_delta <= 0:\n        reasons.append(f\"candidate\
              \ does not improve the capability score ({capability_delta:+.3f})\"\
              )\n    verdict = \"PROMOTE\" if not reasons else \"HOLD\"\n\n    def\
              \ fmt(v):\n        return f\"{v:.4g}\" if isinstance(v, (int, float))\
              \ else (\"\u2014\" if v is None else str(v))\n\n    def badge(p):\n\
              \        return {True: \"pass\", False: \"fail\"}.get(p, \"n/a\")\n\n\
              \    h = [f\"<h1>Model qualification {html.escape(qualification_id)}</h1>\"\
              ,\n         f\"<p><b>Baseline (production):</b> {html.escape(baseline_model)}<br>\"\
              \n         f\"<b>Candidate:</b> {html.escape(candidate_model)}</p>\"\
              ,\n         f\"<h2>Recommendation: {verdict}</h2>\"]\n    md = [f\"\
              # Model qualification {qualification_id}\", \"\",\n          f\"Baseline\
              \ (production): `{baseline_model}`  \", f\"Candidate: `{candidate_model}`\"\
              , \"\",\n          f\"## Recommendation: {verdict}\", \"\"]\n    if\
              \ reasons:\n        h.append(\"<ul>\" + \"\".join(f\"<li>{html.escape(r)}</li>\"\
              \ for r in reasons) + \"</ul>\")\n        md += [f\"- {r}\" for r in\
              \ reasons] + [\"\"]\n    else:\n        h.append(\"<p>The candidate\
              \ passes every gate, improves the capability score and does not regress\
              \ \"\n                 f\"more than {max_regression:.0%} on any benchmark.</p>\"\
              )\n    head = (\"<tr><th>Benchmark</th><th>Weight</th><th>Metric</th><th>Better</th><th>Threshold</th>\"\
              \n            \"<th>Baseline</th><th>Candidate</th><th>Candidate vs\
              \ baseline</th></tr>\")\n    for cid, col, rows, col_test, col_threshold,\
              \ state in sections:\n        h.append(f\"<h3>{html.escape(col.get('name')\
              \ or cid)}</h3>\")\n        md += [f\"### {col.get('name') or cid}\"\
              , \"\",\n               \"| Benchmark | Metric | Better | Threshold\
              \ | Baseline | Candidate | \u0394 (candidate better > 0) |\",\n    \
              \           \"|---|---|---|---|---|---|---|\"]\n        body = []\n\
              \        for bid, w, metric, better, thr, b, bp, c, cp, delta in rows:\n\
              \            d = \"\u2014\" if delta is None else f\"{delta:+.1%}\"\n\
              \            body.append(f\"<tr><td>{html.escape(bid)}</td><td>{w}</td><td>{html.escape(metric)}</td><td>{better}</td>\"\
              \n                        f\"<td>{fmt(thr)}</td><td>{fmt(b)} ({badge(bp)})</td><td>{fmt(c)}\
              \ ({badge(cp)})</td>\"\n                        f\"<td>{d}</td></tr>\"\
              )\n            md.append(f\"| {bid} | {metric} | {better} | {fmt(thr)}\
              \ | {fmt(b)} ({badge(bp)}) | {fmt(c)} ({badge(cp)}) | {d} |\")\n   \
              \     if col_threshold is not None:\n            body.append(f\"<tr><td\
              \ colspan=4><b>Collection score (weighted)</b></td><td>{fmt(col_threshold)}</td>\"\
              \n                        f\"<td>{fmt(col_test['baseline'].get('score'))}\
              \ ({badge(col_test['baseline'].get('pass'))})</td>\"\n             \
              \           f\"<td>{fmt(col_test['candidate'].get('score'))} ({badge(col_test['candidate'].get('pass'))})</td>\"\
              \n                        \"<td></td></tr>\")\n            md.append(f\"\
              | **collection score** | weighted | higher | {fmt(col_threshold)} |\
              \ \"\n                      f\"{fmt(col_test['baseline'].get('score'))}\
              \ | {fmt(col_test['candidate'].get('score'))} | |\")\n        h.append(f\"\
              <table>{head}{''.join(body)}</table>\")\n        h.append(f\"<p class=note>Jobs:\
              \ baseline {state['baseline']}, candidate {state['candidate']}.</p>\"\
              )\n        md.append(\"\")\n    h.append(\"<p class=note>Compare the\
              \ individual runs in the dashboard: Develop &amp; train \u2192 Evaluations,\
              \ \"\n             \"select the runs of this qualification and click\
              \ Compare (MLflow experiment \"\n             \"agentic-coding-qualification,\
              \ tag qualification_id). The baseline is reached through the MaaS \"\
              \n             \"gateway and the candidate directly, so latency includes\
              \ the gateway hop for the baseline only.</p>\")\n    style = (\"<style>body{font-family:system-ui,sans-serif;margin:24px;color:#151515}table{border-collapse:collapse;\"\
              \n             \"margin:8px 0 16px}th,td{border:1px solid #d2d2d2;padding:6px\
              \ 10px;text-align:left}\"\n             \"th{background:#f0f0f0}.note{color:#555;font-size:.9em}</style>\"\
              )\n    with open(report.path, \"w\") as f:\n        f.write(f\"<!doctype\
              \ html><html><head><meta charset=utf-8>{style}</head><body>{''.join(h)}</body></html>\"\
              )\n    with open(summary.path, \"w\") as f:\n        f.write(\"\\n\"\
              .join(md))\n    with open(decision.path, \"w\") as f:\n        json.dump({\"\
              qualification_id\": qualification_id, \"verdict\": verdict, \"reasons\"\
              : reasons,\n                   \"baseline\": baseline_model, \"candidate\"\
              : candidate_model}, f, indent=1)\n    print(f\"Recommendation: {verdict}\"\
              )\n    for r in reasons:\n        print(f\"  - {r}\")\n    return verdict\n\
              \n"
            image: registry.redhat.io/rhoai/odh-pipeline-runtime-minimal-cpu-py312-rhel9@sha256:3756f9891a27c2581201fd6696457c9b98ffefd80c88b900740f76e2bf970429
            resources:
              cpuLimit: 0.5
              cpuRequest: 0.1
              memoryLimit: 0.536870912
              memoryRequest: 0.268435456
              resourceCpuLimit: 500m
              resourceCpuRequest: 100m
              resourceMemoryLimit: 512Mi
              resourceMemoryRequest: 256Mi
        exec-run-collection:
          container:
            args:
            - --executor_input
            - '{{$}}'
            - --function_to_execute
            - run_collection
            command:
