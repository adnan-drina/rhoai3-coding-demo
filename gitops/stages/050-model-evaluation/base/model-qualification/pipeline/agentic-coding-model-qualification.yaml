apiVersion: pipelines.kubeflow.org/v2beta1
kind: Pipeline
metadata:
  name: agentic-coding-model-qualification
  namespace: evaluated-models
spec:
  description: Runs the agentic coding EvalHub collections on the production model
    and a candidate, then publishes a leaderboard and a promote/hold recommendation.
  displayName: Agentic coding model qualification
---
