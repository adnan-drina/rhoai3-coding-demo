              \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
              3.9\"' && \"$0\" \"$@\"\n"
            - sh
            - -ec
            - 'program_path=$(mktemp -d)


              printf "%s" "$0" > "$program_path/ephemeral_component.py"

              _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

              '
            - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing\
              \ import *\n\ndef evaluate_collection(\n    model_name: str,\n    model_id:\
              \ str,\n    model_url: str,\n    auth_secret: str,\n    target: str,\n\
              \    tenant: str,\n    collection_id: str,\n    qualification_tag: str,\n\
              \    evalhub_experiment: str,\n    evalhub_url: str,\n    queue: str,\n\
              \    run_name: str,\n    timeout_seconds: int,\n    results: dsl.Output[dsl.Artifact],\n\
              \    scores: dsl.Output[dsl.Metrics],\n):\n    \"\"\"Run one EvalHub\
              \ collection on the model and keep the job body and results.\"\"\"\n\
              \    import json\n    import os\n    import re\n    import subprocess\n\
              \    import tempfile\n\n    import httpx\n    import yaml\n\n    work\
              \ = tempfile.mkdtemp()\n    profile = os.path.join(work, \"evalhub.yaml\"\
              )\n    with open(profile, \"w\") as f:\n        yaml.safe_dump({\"active_profile\"\
              : \"default\",\n                        \"profiles\": {\"default\":\
              \ {\"base_url\": evalhub_url, \"tenant\": tenant}}}, f)\n    env = dict(os.environ,\
              \ EVALHUB_CONFIG=profile)\n    subprocess.run([\"evalhub\", \"health\"\
              ], env=env, check=True)\n\n    version = collection_id.rsplit(\"-\"\
              , 1)[-1]\n    tags = {\"qualification_run\": run_name, \"model\": model_name,\
              \ \"target\": target,\n            \"collection\": collection_id, \"\
              collection_version\": version}\n    body = {\n        \"name\": f\"\
              {collection_id}-{model_name}-{run_name}\"[:120],\n        \"description\"\
              : f\"Model qualification run {run_name}: {target} model {model_name}\
              \ on {collection_id}\",\n        \"tags\": [qualification_tag, f\"target={target}\"\
              , f\"model={model_name}\"],\n        \"model\": {\"url\": model_url,\
              \ \"name\": model_id, \"auth\": {\"secret_ref\": auth_secret}},\n  \
              \      \"collection\": {\"id\": collection_id},\n        \"experiment\"\
              : {\"name\": evalhub_experiment, \"tags\": [{\"key\": k, \"value\":\
              \ v} for k, v in tags.items()]},\n        \"queue\": {\"kind\": \"kueue\"\
              , \"name\": queue},\n    }\n    path = os.path.join(work, \"eval.yaml\"\
              )\n    with open(path, \"w\") as f:\n        yaml.safe_dump(body, f,\
              \ sort_keys=False)\n    print(open(path).read())\n\n    # The gate:\
              \ --wait blocks until the job is terminal and exits 1 when the job fails\
              \ (before printing it),\n    # so the job id comes from the \"Job submitted\"\
              \ line.\n    run = subprocess.run([\"evalhub\", \"eval\", \"run\", \"\
              --config\", path, \"--wait\", \"--timeout\", str(timeout_seconds),\n\
              \                          \"--format\", \"json\"], env=env, capture_output=True,\
              \ text=True)\n    print(run.stderr, end=\"\")\n    submitted = re.search(r\"\
              Job submitted: (\\S+)\", run.stderr)\n    if not submitted:\n      \
              \  raise RuntimeError(f\"evalhub eval run submitted no job (exit {run.returncode})\"\
              )\n    job_id = submitted.group(1)\n\n    # The SDK job model (1.0.5)\
              \ drops the gate results (results.test, benchmarks[].test), so the job\
              \ is read\n    # from the documented jobs endpoint with the same ServiceAccount\
              \ token and service CA.\n    token = open(\"/var/run/secrets/kubernetes.io/serviceaccount/token\"\
              ).read().strip()\n    response = httpx.get(f\"{evalhub_url}/api/v1/evaluations/jobs/{job_id}\"\
              , timeout=60,\n                         headers={\"Authorization\":\
              \ f\"Bearer {token}\", \"X-Tenant\": tenant},\n                    \
              \     verify=\"/etc/pki/ca-trust/source/anchors/service-ca.crt\")\n\
              \    response.raise_for_status()\n    job = response.json()\n    csv\
              \ = subprocess.run([\"evalhub\", \"eval\", \"results\", job_id, \"--format\"\
              , \"csv\"],\n                         env=env, capture_output=True,\
              \ text=True).stdout\n    with open(results.path, \"w\") as f:\n    \
              \    json.dump({\"eval_yaml\": body, \"job\": job, \"results_csv\":\
              \ csv}, f, indent=1)\n    state = (job.get(\"status\") or {}).get(\"\
              state\")\n    # Scalar metrics: logged by the pipeline server's MLflow\
              \ integration to this task's nested run and shown\n    # in the KFP\
              \ and MLflow run comparison views. A benchmark whose metrics are all\
              \ zero had no successful\n    # requests, so it gets no score.\n   \
              \ for b in (job.get(\"results\") or {}).get(\"benchmarks\") or []:\n\
              \        t = b.get(\"test\") or {}\n        numbers = [v for v in (b.get(\"\
              metrics\") or {}).values() if isinstance(v, (int, float))]\n       \
              \ if isinstance(t.get(\"primary_score\"), (int, float)) and any(numbers):\n\
              \            scores.log_metric(f\"{b['id']}.{t.get('primary_score_metric')}\"\
              .replace(\"/\", \"_\").replace(\":\", \"_\"),\n                    \
              \          float(t[\"primary_score\"]))\n            scores.log_metric(f\"\
              {b['id']}.pass\".replace(\"/\", \"_\").replace(\":\", \"_\"), 1.0 if\
              \ t.get(\"pass\") else 0.0)\n    print(f\"{collection_id}: job {job_id}\
              \ {state} (exit {run.returncode})\")\n    if state not in (\"completed\"\
              , \"failed\", \"cancelled\", \"partially_failed\"):\n        raise RuntimeError(f\"\
              job {job_id} did not finish within {timeout_seconds}s (state {state})\"\
              )\n\n"
            image: registry.redhat.io/rhoai/odh-pipeline-runtime-minimal-cpu-py312-rhel9@sha256:3756f9891a27c2581201fd6696457c9b98ffefd80c88b900740f76e2bf970429
            resources:
              cpuLimit: 0.5
