    deploymentSpec:
      executors:
        exec-evaluate-collection:
          container:
            args:
            - --executor_input
            - '{{$}}'
            - --function_to_execute
            - evaluate_collection
            command:
            - sh
            - -c
            - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip\
