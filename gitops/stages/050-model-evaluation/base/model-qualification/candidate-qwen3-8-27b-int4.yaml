---
# vLLM NVIDIA GPU ServingRuntime instantiated from the platform template vllm-cuda-runtime-template
# (RHOAI 3.5 "Deploying models"); same image digest as the MaaS deployments.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda-runtime
  namespace: evaluated-models
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: v0.24.0
    opendatahub.io/template-name: vllm-cuda-runtime-template
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    opendatahub.io/apiProtocol: REST
    openshift.io/display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    argocd.argoproj.io/sync-wave: "20"
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args: [--port=8080, --model=/mnt/models, "--served-model-name={{.Name}}"]
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
---
# Qwen 3.8 27B INT4, the candidate to replace the production coding model (Qwen 3.6 in MaaS). Same
# model revision and serving arguments as its MaaS profile (Stage 040), so a passing qualification
# carries over unchanged on promotion. Token authentication is on; evaluation jobs authenticate with
# their ServiceAccount token (implicit authentication, bindings below).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-8-27b-int4
  namespace: evaluated-models
  labels:
    opendatahub.io/dashboard: "true"
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
  annotations:
    openshift.io/display-name: Qwen3.8 27B INT4 (candidate)
    # Dashboard Stop/Start control. Runs while Qwen 3.8 is stopped in internal-models (two L40S nodes:
    # Qwen 3.6 production + this candidate); set to "true" to hand the GPU back.
    serving.kserve.io/stop: "false"
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "true"
    opendatahub.io/hardware-profile-name: gpu-reserved-demo
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    argocd.argoproj.io/sync-wave: "21"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: Recreate
    model:
      runtime: vllm-cuda-runtime
      modelFormat:
        name: vLLM
      storageUri: hf://RedHatAI/Qwen3.8-27B-INT4:7fb3aaca2d21c0db4716572945208db40cef9966
      env:
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      args:
        - --enable-force-include-usage
        - --disable-uvicorn-access-log
        - --enable-prefix-caching
        - --mamba-cache-mode=align
        - --max-model-len=262144
        - --kv-cache-dtype=fp8
        - --gpu-memory-utilization=0.90
        - --language-model-only
        # One prefill pass for an agent turn of up to 16k prompt tokens, with room for the MTP draft tokens.
        - --max-num-batched-tokens=16384
        - --max-num-seqs=16
        # Model-card speculative decoding (RedHatAI/Qwen3.8-27B-INT4, native MTP, three draft tokens); the
        # checkpoint ships model_mtp.safetensors. The card's DSpark draft is not supported by this vLLM build.
        - --speculative-config={"method":"mtp","num_speculative_tokens":3}
        - --override-generation-config={"temperature":0.7,"top_p":0.8,"top_k":20,"min_p":0.0,"presence_penalty":1.5,"repetition_penalty":1.0}
        - --default-chat-template-kwargs={"enable_thinking":false}
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
# Implicit authentication (Red Hat Developer "Connect EvalHub to protected production model servers",
# pattern 1): the model's view Role, bound to the tenant's EvalHub job ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwen3-8-27b-int4-view-role
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: qwen3-8-27b-int4
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    resourceNames: [qwen3-8-27b-int4]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evalhub-job-model-access
  namespace: evaluated-models
  labels:
    app.kubernetes.io/name: qwen3-8-27b-int4
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: evaluation
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "21"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qwen3-8-27b-int4-view-role
subjects:
  - kind: ServiceAccount
    name: evalhub-evalhub-job
    namespace: evaluated-models
