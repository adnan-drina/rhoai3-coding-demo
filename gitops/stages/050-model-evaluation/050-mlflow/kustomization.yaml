# MLflow enablement and the shared tracking service with its PostgreSQL and artifact bucket (data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: rhoai-platform
      app.kubernetes.io/managed-by: argocd
      demo.rhoai.io/stage: "050"
    includeSelectors: false

resources:
  - postgresql-pvc.yaml
  - postgresql-service.yaml
  - postgresql-statefulset.yaml
  - postgresql-networkpolicy.yaml
  - objectbucketclaim.yaml
  - service-ca.yaml
  - mlflow.yaml
  - dsc-enablement
  - prompts
