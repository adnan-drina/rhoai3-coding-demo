apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# All evaluations run in the Evaluated Models tenant (model-qualification/): its evaluator Role, MaaS key
# and queue serve the qualification pipeline and manual evaluations alike. This directory keeps the
# catalog safety-insights read and the programmatic principal for that tenant.
resources:
  - catalog-insights-role.yaml
  - catalog-insights-rolebinding.yaml
  - automation-principal.yaml
