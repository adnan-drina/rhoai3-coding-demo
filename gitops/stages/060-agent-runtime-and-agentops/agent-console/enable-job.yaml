apiVersion: batch/v1
kind: Job
metadata:
  name: enable-agent-console
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: enable-agent-console
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "060"
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 90
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enable-agent-console
    spec:
      serviceAccountName: enable-agent-console
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enable
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              oc -n redhat-ods-applications patch odhdashboardconfig odh-dashboard-config --request-timeout=10s --type=merge -p '{"spec":{"dashboardConfig":{"agentOps":true}}}'
              test "$(oc -n redhat-ods-applications get odhdashboardconfig odh-dashboard-config --request-timeout=10s -o jsonpath='{.spec.dashboardConfig.agentOps}')" = true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
