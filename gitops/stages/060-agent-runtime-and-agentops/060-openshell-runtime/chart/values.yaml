{
  "fullnameOverride": "openshell",
  "replicaCount": 1,
  "workload": {
    "kind": "statefulset"
  },
  "workspaceResources": {
    "enabled": false
  },
  "agentSandbox": {
    "preflight": {
      "enabled": false
    }
  },
  "gateway": {
    "image": {
      "digest": "sha256:437777e61c20707f9f06dc2b4b8a89b6c95a0b521dec9b00b3829d259fef163d"
    }
  },
  "supervisor": {
    "image": {
      "digest": "sha256:0783c6e10a0ec6871af1698d861cc1542f6ac5c4dd2ed2e550bb66250d82cc02"
    }
  },
  "sandboxRuntime": {
    "image": {
      "digest": "sha256:ecac6542c16de6849c0a279020edcae2390025c90344afb813f0793fc6932167"
    }
  },
  "podSecurityContext": {
    "fsGroup": null,
    "seccompProfile": {
      "type": "RuntimeDefault"
    }
  },
  "securityContext": {
    "runAsUser": null,
    "runAsNonRoot": true,
    "allowPrivilegeEscalation": false,
    "capabilities": {
      "drop": [
        "ALL"
      ]
    }
  },
  "resources": {
    "requests": {
      "cpu": "100m",
      "memory": "256Mi"
    },
    "limits": {
      "cpu": "1",
      "memory": "1Gi"
    }
  },
  "server": {
    "telemetryEnabled": false,
    "disableTls": false,
    "drivers": {
      "kubernetes": {
        "workspaceMode": "operator",
        "operatorNamespaceLabel": "rhoai3.redhat.com/openshell-workspace=true",
        "allowDriverConfig": false
      }
    },
    "credentialStorage": {
      "existingSecret": "openshell-credentials"
    },
    "sandboxJwt": {
      "secretDefaultMode": "0440"
    },
    "oidc": {
      "issuer": "",
      "audience": "openshell-gateway",
      "rolesClaim": "realm_access.roles",
      "adminRole": "openshell-platform-admin",
      "userRole": "openshell-user"
    },
    "auth": {
      "allowUnauthenticatedUsers": false
    }
  },
  "service": {
    "type": "ClusterIP"
  },
  "pkiInitJob": {
    "enabled": true
  },
  "openshiftRoute": {
    "enabled": false
  },
  "grpcRoute": {
    "enabled": false
  }
}
