apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
  labels:
    app.kubernetes.io/component: agent-runtime
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: openshell
    app.kubernetes.io/part-of: rhoai3-coding-demo
  name: openshell-sandbox
  namespace: openshell-developer
rules:
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  - sandboxes/status
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ''
  resources:
  - services
  verbs:
  - create
  - get
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
  - delete
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
