apiVersion: batch/v1
kind: Job
metadata:
  name: openshell-certgen
  namespace: openshell
  annotations:
    helm.sh/hook:
    helm.sh/hook-weight:
    helm.sh/hook-delete-policy:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
