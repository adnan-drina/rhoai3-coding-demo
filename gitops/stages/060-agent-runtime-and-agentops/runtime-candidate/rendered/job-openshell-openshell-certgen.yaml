apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '-10'
  labels:
    app.kubernetes.io/instance: openshell
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openshell
    app.kubernetes.io/version: 12cec59bf4c36c305032143eb90870bd16d8820b
    helm.sh/chart: helm-chart-0.0.0-dev.12cec59bf4c36c305032143eb90870bd16d8820b
  name: openshell-certgen
  namespace: openshell
spec:
  activeDeadlineSeconds: 150
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: certgen
        app.kubernetes.io/instance: openshell
        app.kubernetes.io/name: openshell-certgen
    spec:
      containers:
      - args:
        - generate-certs
        - --server-secret-name=openshell-server-tls
        - --client-secret-name=openshell-client-tls
        - --jwt-secret-name=openshell-jwt-keys
        - --server-san=openshell
        - --server-san=openshell.openshell.svc
        - --server-san=openshell.openshell.svc.cluster.local
        - --server-san=localhost
        - --server-san=openshell.localhost
        - --server-san=*.openshell.localhost
        - --server-san=host.docker.internal
        - --server-san=host.containers.internal
        - --server-san=127.0.0.1
        command:
        - /usr/local/bin/openshell-gateway
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/nvidia/openshell/gateway@sha256:437777e61c20707f9f06dc2b4b8a89b6c95a0b521dec9b00b3829d259fef163d
        imagePullPolicy: IfNotPresent
        name: certgen
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: openshell-certgen
  ttlSecondsAfterFinished: 300
