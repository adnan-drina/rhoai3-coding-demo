# Native installed RHOAI 3.5.1 lifecycle image source:
# red-hat-data-services/mcp-lifecycle-operator cc66894be8cd87d35064e67ec02dbc6e5b5c3c89.
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: openshift-mcp-server
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: registry.redhat.io/openshift-mcp-tech-preview/openshift-mcp-server-rhel9@sha256:855466299c3178f7d9f96a1511005ca6161b8cc6b294df9907c234ce8ecfd0f2
  config:
    port: 8080
    path: /mcp
    arguments: ["--config", "/etc/mcp-config/config.toml"]
    storage:
      - path: /etc/mcp-config
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: openshift-mcp-server
      - path: /tmp
        permissions: ReadWrite
        source:
          type: EmptyDir
          emptyDir:
            sizeLimit: 64Mi
  runtime:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    security:
      serviceAccountName: openshift-mcp-server-ro
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
    health:
      readinessProbe:
        httpGet: {scheme: HTTP, path: /healthz, port: 8080}
        periodSeconds: 10
        timeoutSeconds: 3
      livenessProbe:
        httpGet: {scheme: HTTP, path: /healthz, port: 8080}
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 3
  mcp:
    stateless: true
