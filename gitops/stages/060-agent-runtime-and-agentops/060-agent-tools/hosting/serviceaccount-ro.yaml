# Identity of the token-less read-only server. Requests without a bearer act as this account;
# requests with a caller's OpenShift token are forwarded and act as the caller (passthrough).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-mcp-server-ro
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
automountServiceAccountToken: true
