apiVersion: v1
kind: Namespace
metadata:
  name: ai-agents
  labels:
    opendatahub.io/dashboard: "true"
    rhoai3.redhat.com/openshell-workspace: 'true'
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/name: openshell
    app.kubernetes.io/component: agent-runtime
