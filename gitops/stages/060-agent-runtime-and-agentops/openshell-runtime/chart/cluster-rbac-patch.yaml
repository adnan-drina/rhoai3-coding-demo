{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "openshell-node-reader-openshell"
  },
  "rules": [
    {
      "apiGroups": [
        "node.k8s.io"
      ],
      "resources": [
        "runtimeclasses"
      ],
      "verbs": [
        "get"
      ]
    },
    {
      "apiGroups": [
        "scheduling.k8s.io"
      ],
      "resources": [
        "priorityclasses"
      ],
      "verbs": [
        "get"
      ]
    },
    {
      "apiGroups": [
        "authentication.k8s.io"
      ],
      "resources": [
        "tokenreviews"
      ],
      "verbs": [
        "create"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "namespaces"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "agents.x-k8s.io"
      ],
      "resources": [
        "sandboxes"
      ],
      "verbs": [
        "list",
        "watch"
      ]
    }
  ]
}
