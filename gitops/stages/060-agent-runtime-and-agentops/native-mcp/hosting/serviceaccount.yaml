# Native in-cluster discovery needs the bootstrap CA/token files. This SA has
# no RoleBindings; require_oauth and passthrough prevent credential fallback.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-mcp-server
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
automountServiceAccountToken: true
