# Bounded read scope of the token-less read-only server: "view" in the demo projects (and the MaaS governance
# project, so subscriptions are readable by the playground's OpenShift Ops Assistant) plus cluster-level
# listings and metrics the catalog's core tools summarize. No Secrets (view excludes them; the server also
# denies the GVK), no RBAC objects, no writes. Widen deliberately, per project, if a demo needs more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-mcp-server-ro
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes]
    verbs: [get, list]
  - apiGroups: [project.openshift.io]
    resources: [projects]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-mcp-server-ro
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-mcp-server-ro
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-mcp-server-ro-view
  namespace: demo-sandbox
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-mcp-server-ro-view
  namespace: internal-models
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-mcp-server-ro-view
  namespace: external-models
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-mcp-server-ro-view
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
---
# MaaS subscriptions are deliberately outside the aggregated "view" role (they name owners and budgets). The playground's
# OpenShift Ops Assistant reports who may use which model, so the read-only server may list them, and only them, here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshift-mcp-server-ro-subscriptions
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [maas.opendatahub.io]
    resources: [maassubscriptions]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-mcp-server-ro-subscriptions
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshift-mcp-server-ro-subscriptions
subjects:
  - kind: ServiceAccount
    name: openshift-mcp-server-ro
    namespace: mcp-servers
