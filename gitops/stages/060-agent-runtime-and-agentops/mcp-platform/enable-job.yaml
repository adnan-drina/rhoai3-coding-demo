apiVersion: batch/v1
kind: Job
metadata:
  name: enable-mcp-platform
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: enable-mcp-platform
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "060"
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enable-mcp-platform
    spec:
      serviceAccountName: enable-mcp-platform
      restartPolicy: Never
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: enable
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              oc patch datasciencecluster default-dsc --request-timeout=10s --type=merge -p '{"spec":{"components":{"mcplifecycleoperator":{"managementState":"Managed"}}}}'
              test "$(oc get datasciencecluster default-dsc --request-timeout=10s -o jsonpath='{.spec.components.mcplifecycleoperator.managementState}')" = Managed
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
