# Catalog OpenShift MCP Server 0.4; image-bound source 3ba1f65.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: openshift-mcp-server
    app.kubernetes.io/part-of: agent-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  config.toml: |
    port = "8080"
    stateless = true
    read_only = true
    list_output = "table"
    cluster_provider_strategy = "in-cluster"
    cluster_auth_mode = "passthrough"
    # Token-less by design: without a bearer the server acts as its bounded ServiceAccount; a bearer is forwarded.
    require_oauth = false
    skip_jwt_verification = true
    disable_dynamic_client_registration = true
    # Explicitly approved boundary: HTTPS Route, HTTP bearer inside cluster.
    require_tls = false
    toolsets = ["core", "config"]
    server_instructions = "Use read-only OpenShift and Kubernetes inspection. Without a bearer token the server acts as its bounded service account (view on the demo projects, cluster and node summaries); with the caller's OpenShift token it acts as the caller. Secret resources and write actions are unavailable."
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
    [http]
    read_header_timeout = "10s"
    max_body_bytes = 1048576
    rate_limit_rps = 2
    rate_limit_burst = 4
