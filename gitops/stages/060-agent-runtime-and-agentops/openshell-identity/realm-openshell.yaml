apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: openshell-realm
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "060"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  keycloakCRName: keycloak
  realm:
    realm: openshell
    displayName: Agent Runtime
    enabled: true
    sslRequired: all
    registrationAllowed: false
    resetPasswordAllowed: false
    loginWithEmailAllowed: false
    duplicateEmailsAllowed: false
    editUsernameAllowed: false
    attributes:
      openshell-managed: "rhoai3-coding-demo"
    roles:
      realm:
      - name: openshell-user
      - name: openshell-platform-admin
    authenticationFlows:
    - alias: openshell-prelinked-only
      description: Reject every unlinked broker identity; enrolled immutable identities bypass first login.
      providerId: basic-flow
      topLevel: true
      builtIn: false
      authenticationExecutions:
      - authenticator: deny-access-authenticator
        authenticatorFlow: false
        requirement: REQUIRED
        priority: 0
