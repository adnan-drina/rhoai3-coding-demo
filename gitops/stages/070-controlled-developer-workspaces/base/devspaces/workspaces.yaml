kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: coolstore-inventory-service
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  started: false
  routingClass: che
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
      - name: coolstore-inventory-service
        git:
          remotes:
            origin: https://github.com/adnan-drina/coolstore-inventory-service.git
          checkoutFrom:
            revision: feature/coolstore-inventory-service-plan
    commands:
      - id: init-ai-tools
        exec:
          commandLine: |
            for i in $(seq 1 30); do [ -f /projects/coolstore-inventory-service/.continue/config.yaml ] && break; sleep 2; done
            mkdir -p ~/.continue ~/.config/opencode ~/.opencode
            if [ ! -f ~/.continue/config.yaml ]; then
              cp /projects/coolstore-inventory-service/.continue/config.yaml ~/.continue/config.yaml 2>/dev/null || true
              echo "Created ~/.continue/config.yaml from the repo template."
            else
              echo "Kept existing ~/.continue/config.yaml."
            fi
            if [ ! -f ~/.config/opencode/opencode.json ]; then
              if [ -f ~/.opencode/opencode.json ]; then
                cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
                echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
              else
                cp /projects/coolstore-inventory-service/.opencode/opencode.template.json ~/.config/opencode/opencode.json 2>/dev/null || true
                echo "Created ~/.config/opencode/opencode.json from the repo template."
              fi
            else
              echo "Kept existing ~/.config/opencode/opencode.json."
            fi
            if [ -f ~/.opencode/opencode.json ] && [ ! -f ~/.config/opencode/opencode.json ]; then
              cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
              echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
            fi
            if [ ! -L ~/.opencode/opencode.json ]; then
              rm -f ~/.opencode/opencode.json
              ln -s ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || cp ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || true
              echo "Refreshed compatibility ~/.opencode/opencode.json for the installed OpenCode build."
            else
              echo "Kept compatibility ~/.opencode/opencode.json link."
            fi
            curl -fsSL --max-time 120 -o /tmp/continue.vsix "https://open-vsx.org/api/Continue/continue/linux-x64/1.3.38/file/Continue.continue-1.3.38@linux-x64.vsix" 2>/dev/null || true
          component: tooling-container
    events:
      postStart:
        - init-ai-tools
    components:
      - name: tooling-container
        container:
          image: quay.io/che-incubator/cli-ai-tools:latest
          sourceMapping: /projects
          memoryLimit: 4Gi
          memoryRequest: 1Gi
          cpuLimit: "2"
          cpuRequest: 500m
          env:
            - name: DEFAULT_EXTENSIONS
              value: "/tmp/continue.vsix"
            - name: SHELL
              value: "/usr/bin/bash"
---
kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: mca-coolstore
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  started: false
  routingClass: che
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
      - name: mca-coolstore
        git:
          remotes:
            origin: https://github.com/rhpds/mca-coolstore.git
          checkoutFrom:
            revision: main
    commands:
      - id: init-modernization-tools
        exec:
          commandLine: |
            curl -fsSL --max-time 120 -o /tmp/continue.vsix "https://open-vsx.org/api/Continue/continue/linux-x64/1.3.38/file/Continue.continue-1.3.38@linux-x64.vsix" 2>/dev/null || true
            curl -fsSL --max-time 120 -o /tmp/mta.vsix "https://open-vsx.org/api/redhat/mta-vscode-extension/8.1.1/file/redhat.mta-vscode-extension-8.1.1.vsix" 2>/dev/null || true
            curl -fsSL --max-time 120 -o /tmp/mta-core.vsix "https://open-vsx.org/api/redhat/mta-core/8.1.1/file/redhat.mta-core-8.1.1.vsix" 2>/dev/null || true
            curl -fsSL --max-time 120 -o /tmp/mta-java.vsix "https://open-vsx.org/api/redhat/mta-java/8.1.1/file/redhat.mta-java-8.1.1.vsix" 2>/dev/null || true
          component: tooling-container
    events:
      postStart:
        - init-modernization-tools
    components:
      - name: tooling-container
        container:
          image: quay.io/che-incubator/cli-ai-tools:latest
          sourceMapping: /projects
          memoryLimit: 6Gi
          memoryRequest: 2Gi
          cpuLimit: "2"
          cpuRequest: 500m
          env:
            - name: DEFAULT_EXTENSIONS
              value: "/tmp/continue.vsix,/tmp/mta.vsix,/tmp/mta-core.vsix,/tmp/mta-java.vsix"
            - name: SHELL
              value: "/usr/bin/bash"
