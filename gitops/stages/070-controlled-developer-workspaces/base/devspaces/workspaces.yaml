# Per-user workspace namespaces, RBAC, and DevWorkspaces.
#
# Stage 100 uses one Developer Hub component per repo and one matching
# single-repo Dev Spaces workspace per component. This keeps onboarding,
# golden-path engineering, and modernization work isolated instead of loading
# all source projects into one workspace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: wksp-kubeadmin
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    openshift.io/display-name: "Workspace kubeadmin"
    che.eclipse.org/username: kube:admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-kubeadmin
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "b64:a3ViZTphZG1pbg=="
---
kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: getting-started-ai-coding
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  started: false
  routingClass: che
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
      - name: getting-started-ai-coding
        git:
          remotes:
            origin: https://github.com/adnan-drina/getting-started-ai-coding.git
          checkoutFrom:
            revision: main
    commands:
      - id: init-ai-tools
        exec:
          commandLine: |
            for i in $(seq 1 30); do [ -f /projects/getting-started-ai-coding/.continue/config.yaml ] && break; sleep 2; done
            mkdir -p ~/.continue ~/.config/opencode ~/.opencode
            if [ ! -f ~/.continue/config.yaml ]; then
              cp /projects/getting-started-ai-coding/.continue/config.yaml ~/.continue/config.yaml 2>/dev/null || true
              echo "Created ~/.continue/config.yaml from the repo template."
            else
              echo "Kept existing ~/.continue/config.yaml."
            fi
            if [ ! -f ~/.config/opencode/opencode.json ]; then
              if [ -f ~/.opencode/opencode.json ]; then
                cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
                echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
              else
                cp /projects/getting-started-ai-coding/.opencode/opencode.template.json ~/.config/opencode/opencode.json 2>/dev/null || true
                echo "Created ~/.config/opencode/opencode.json from the repo template."
              fi
            else
              echo "Kept existing ~/.config/opencode/opencode.json."
            fi
            if [ -f ~/.opencode/opencode.json ] && [ ! -f ~/.config/opencode/opencode.json ]; then
              cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
              echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
            fi
            if [ ! -L ~/.opencode/opencode.json ]; then
              rm -f ~/.opencode/opencode.json
              ln -s ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || cp ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || true
              echo "Refreshed compatibility ~/.opencode/opencode.json for the installed OpenCode build."
            else
              echo "Kept compatibility ~/.opencode/opencode.json link."
            fi
            curl -fsSL --max-time 120 -o /tmp/continue.vsix "https://open-vsx.org/api/Continue/continue/linux-x64/1.3.38/file/Continue.continue-1.3.38@linux-x64.vsix" 2>/dev/null || true
          component: tooling-container
    events:
      postStart:
        - init-ai-tools
    components:
      - name: tooling-container
        container:
          image: quay.io/che-incubator/cli-ai-tools:latest
          sourceMapping: /projects
          memoryLimit: 4Gi
          memoryRequest: 1Gi
          cpuLimit: "2"
          cpuRequest: 500m
          env:
            - name: DEFAULT_EXTENSIONS
              value: "/tmp/continue.vsix"
            - name: SHELL
              value: "/usr/bin/bash"
---
