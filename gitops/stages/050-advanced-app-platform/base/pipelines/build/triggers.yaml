# GitHub webhook DISPATCHER for per-project pipelines.
# The GitHub App has a single webhook endpoint, so this EventListener stays
# the shared ingress — but it owns no pipeline: each trigger routes a
# repository's push events to a PipelineRun in that project's OWN namespace,
# where the project-pipeline instance (Pipeline `app-push`) lives.
#
# Two kinds of projects:
# - Platform-owned (coolstore): an explicit trigger with a fixed target
#   namespace; the project stack is a kustomize sub-dir of this stage.
# - Template-scaffolded (stage 070): repos published by the RHDH scaffolder
#   carry the `rhoai3-scaffolded` topic. Their FIRST push (which happens at
#   publish time) hits the bootstrap trigger below, which creates an Argo CD
#   Application instantiating the project stack (namespace with the
#   pipeline-project label + project-pipeline base) in `<repo>-dev`; the
#   project-provisioner CronJob then distributes build credentials within
#   two minutes. Every push also hits the scaffolded push trigger, which
#   routes to an app-push PipelineRun in `<repo>-dev` (the first push's run
#   fails namespace resolution while Argo is still creating the stack —
#   harmless; developer pushes build from then on).
# - Stage 080 migration destinations additionally carry `rhoai3-migration-run`.
#   Their SCAFFOLDING push — the one that creates main, which the signed
#   payload reports as created=true with a zero `before` — also hits the
#   migration-run trigger below. It starts the platform's own
#   provision-migration-run Pipeline, which renders that run's dedicated parity
#   database and fixture credentials into the Dev Spaces namespace before the
#   workspace is ever opened. No repository content is applied; the repository
#   contributes a validated NAME and the commit that names the event.
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: app-platform-push-binding
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: app-platform-push-template
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
    - name: repo-name
    - name: revision
    - name: target-namespace
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.repo-name)-push-
        namespace: $(tt.params.target-namespace)
        labels:
          # RHDH Tekton plugin discovers PipelineRuns by this label; the
          # catalog components carry the matching kubernetes-id.
          backstage.io/kubernetes-id: $(tt.params.repo-name)
          app.kubernetes.io/name: $(tt.params.repo-name)
      spec:
        pipelineRef:
          name: app-push
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: repo-name
            value: $(tt.params.repo-name)
          - name: revision
            value: $(tt.params.revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: basic-auth
            secret:
              secretName: github-basic-auth
          - name: dockerconfig
            secret:
              secretName: quay-push-secret
          - name: maven-cache
            persistentVolumeClaim:
              claimName: maven-cache
---
# Binding for template-scaffolded projects: the target namespace is computed
# by the CEL overlay on the trigger (repo name + "-dev"), not hardcoded.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: scaffolded-target-binding
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: target-namespace
      value: $(extensions.target-namespace)
---
# Bootstrap for template-scaffolded projects: instantiates the per-project
# stack as an Argo CD Application (declarative from then on: self-heal,
# prune, and platform updates to project-pipeline propagate automatically).
# Argo creates the namespace itself (CreateNamespace) and stamps the
# pipeline-project label via managedNamespaceMetadata — the label CANNOT
# come from a synced manifest (see the namespace-label recipe in
# TROUBLESHOOTING). Subsequent pushes fail this template's create with
# AlreadyExists, which the EventListener logs and ignores.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: scaffolded-project-bootstrap-template
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
    - name: repo-name
    - name: revision
  resourcetemplates:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: project-$(tt.params.repo-name)
        namespace: openshift-gitops
        labels:
          rhoai3.redhat.com/scaffolded-project: "true"
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        # Scoped AppProject: platform repo source + *-dev destinations only.
        project: scaffolded-projects
        source:
          repoURL: https://github.com/adnan-drina/rhoai3-coding-demo
          targetRevision: main
          path: gitops/stages/050-advanced-app-platform/base/pipelines/project-pipeline
          kustomize:
            namespace: $(tt.params.repo-name)-dev
        destination:
          server: https://kubernetes.default.svc
          namespace: $(tt.params.repo-name)-dev
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
          managedNamespaceMetadata:
            labels:
              rhoai3.redhat.com/pipeline-project: "true"
              app.kubernetes.io/part-of: $(tt.params.repo-name)
---
# Stage 080 migration runs: the run's OWN resources, rendered by PLATFORM code.
#
# What this is NOT, any more. An earlier shape pointed an Argo CD Application at
# the destination repository's own `k8s-run/` directory. The architect refused
# it on 2026-09-22: an AppProject is not a per-run security boundary (a
# permitted repository Job could select a namespace-wide secret-management
# identity, and creating a workload needs no permission to create RBAC), and a
# branch that migration agents write to all run long is not an execution
# authority.
# Ref: https://kubernetes.io/docs/concepts/security/rbac-good-practices/#workload-creation
#
# What it is. A PipelineRun of the platform's own provision-migration-run
# Pipeline, parameterised by a VALIDATED RUN IDENTITY and nothing else: the
# repository name (which is the run and the DevWorkspace name) and the
# scaffolding commit. Both come from a payload the GitHub interceptor has
# already verified by HMAC against the webhook secret. The task re-validates the
# name as an RFC 1123 label before it becomes an object name.
#
# The run's own manifests live in the platform repository
# (pipelines/build/task-provision-migration-run.yaml). Editing manifests into a
# destination repository now changes nothing, because nothing reads them; the
# receipt the task writes beside the run is the record of what was rendered.
#
# THE SCAFFOLDING EVENT, established rather than assumed. The old filter
# accepted any qualifying main-branch push, so first-creation won and a later
# push could recreate a deleted Application from a different revision. This one
# requires the push that CREATED the branch — `created: true` with a zero
# `before`, which is exactly what publish:github produces and what an ordinary
# agent push never is. The task refuses a second provisioning from a different
# commit, and refuses any provisioning for a run whose receipt says retired, so
# a duplicate, reordered or post-retirement delivery cannot resurrect a run.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: migration-run-resources-template
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    # repo-url is deliberately NOT declared: this template creates nothing that
    # reads the destination repository, and a parameter it does not take is one
    # fewer way for repository-controlled data to reach a cluster object.
    - name: repo-name
    - name: revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: provision-$(tt.params.repo-name)-
        namespace: app-platform-build
        labels:
          rhoai3.redhat.com/migration-run: "$(tt.params.repo-name)"
      spec:
        pipelineRef:
          name: provision-migration-run
        taskRunTemplate:
          # Platform-owned, and deliberately a ServiceAccount of THIS namespace:
          # a workload in wksp-ai-developer cannot reference it, so no workload
          # carrying repository code can borrow its authority.
          serviceAccountName: migration-run-provisioner
        params:
          - name: run-name
            value: $(tt.params.repo-name)
          - name: scaffold-commit
            value: $(tt.params.revision)
          - name: mode
            value: provision
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: app-platform-listener
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  serviceAccountName: pipeline
  triggers:
    - name: coolstore-inventory-service-push
      bindings:
        - ref: app-platform-push-binding
          kind: TriggerBinding
        - name: target-namespace
          value: coolstore-dev
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Platform Coolstore: every main-branch push. GitHub App push
              # payloads often omit commits[].added/modified/removed, so a
              # file-path filter silently drops Stage 060 demo pushes
              # (HMAC OK, CEL Continue:false, no PipelineRun).
              value: >-
                body.ref == 'refs/heads/main'
                && body.after != '0000000000000000000000000000000000000000'
                && body.repository.name == 'coolstore-inventory-service'
      template:
        ref: app-platform-push-template
    - name: scaffolded-project-bootstrap
      bindings:
        - ref: app-platform-push-binding
          kind: TriggerBinding
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Template-published repos only (topic set by publish:github in
              # the agentic-quarkus-scaffold template).
              value: "body.ref == 'refs/heads/main' && body.after != '0000000000000000000000000000000000000000' && ('rhoai3-scaffolded' in body.repository.topics)"
      template:
        ref: scaffolded-project-bootstrap-template
    - name: migration-run-resources-bootstrap
      bindings:
        - ref: app-platform-push-binding
          kind: TriggerBinding
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Stage 080 migration destinations only (topic set by
              # publish:github in the app-migration template), and only their
              # SCAFFOLDING push. body.created with a zero `before` is the
              # push that created main: the scaffolder's publish, and nothing
              # a migration agent later does. Without it the filter accepted
              # any qualifying push, so provisioning was "first one wins" and
              # a later push could re-create a deleted run from another
              # revision. body.forced is excluded so a force-push cannot
              # re-present itself as a creation.
              value: >-
                body.ref == 'refs/heads/main'
                && body.created == true
                && body.forced == false
                && body.before == '0000000000000000000000000000000000000000'
                && body.after != '0000000000000000000000000000000000000000'
                && ('rhoai3-migration-run' in body.repository.topics)
      template:
        ref: migration-run-resources-template
    - name: scaffolded-project-push
      bindings:
        - ref: app-platform-push-binding
          kind: TriggerBinding
        - ref: scaffolded-target-binding
          kind: TriggerBinding
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # V6 P3.4: full build/deploy only when the push touches app
              # surface (src/, pom, k8s, Containerfile, props, migration.yaml).
              # Docs-only / debt-ledger / skill prose pushes must not burn a
              # pipeline round. Empty commits[] still runs (safe default).
              value: >-
                body.ref == 'refs/heads/main'
                && body.after != '0000000000000000000000000000000000000000'
                && ('rhoai3-scaffolded' in body.repository.topics)
                && (size(body.commits) == 0 || body.commits.exists(c,
                     c.added.exists(f, f.startsWith('src/') || f == 'pom.xml' || f.startsWith('k8s/')
                       || f == 'Containerfile' || f.endsWith('application.properties') || f == 'migration.yaml')
                     || c.modified.exists(f, f.startsWith('src/') || f == 'pom.xml' || f.startsWith('k8s/')
                       || f == 'Containerfile' || f.endsWith('application.properties') || f == 'migration.yaml')
                     || c.removed.exists(f, f.startsWith('src/') || f == 'pom.xml' || f.startsWith('k8s/')
                       || f == 'Containerfile' || f.endsWith('application.properties') || f == 'migration.yaml')))
            - name: overlays
              value:
                - key: target-namespace
                  expression: "body.repository.name + '-dev'"
      template:
        ref: app-platform-push-template
---
# The EventListener's ServiceAccount creates PipelineRuns in project
# namespaces (the dispatcher pattern above). Read access on pipelines lets
# Triggers resolve the target.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-platform-dispatcher
  annotations:
    argocd.argoproj.io/sync-wave: "13"
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get", "list"]
  # Scaffolded-project bootstrap: the trigger creates the per-project Argo CD
  # Application (openshift-gitops namespace).
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-platform-dispatcher
  annotations:
    argocd.argoproj.io/sync-wave: "13"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-platform-dispatcher
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: app-platform-build
---
# Route exposing the EventListener for GitHub webhooks
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-platform-listener
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  to:
    kind: Service
    name: el-app-platform-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
