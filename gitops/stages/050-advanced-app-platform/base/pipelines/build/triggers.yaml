# GitHub webhook DISPATCHER for per-project pipelines.
# The GitHub App has a single webhook endpoint, so this EventListener stays
# the shared ingress — but it owns no pipeline: each trigger routes a
# repository's push events to a PipelineRun in that project's OWN namespace,
# where the project-pipeline instance (Pipeline `app-push`) lives.
#
# Two kinds of projects:
# - Platform-owned (coolstore): an explicit trigger with a fixed target
#   namespace; the project stack is a kustomize sub-dir of this stage.
# - Template-scaffolded (stage 070): repos published by the RHDH scaffolder
#   carry the `rhoai3-scaffolded` topic. Their FIRST push (which happens at
#   publish time) hits the bootstrap trigger below, which creates an Argo CD
#   Application instantiating the project stack (namespace with the
#   pipeline-project label + project-pipeline base) in `<repo>-dev`; the
#   project-provisioner CronJob then distributes build credentials within
#   two minutes. Every push also hits the scaffolded push trigger, which
#   routes to an app-push PipelineRun in `<repo>-dev` (the first push's run
#   fails namespace resolution while Argo is still creating the stack —
#   harmless; developer pushes build from then on).
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: app-platform-push-binding
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(body.repository.name)
    - name: revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: app-platform-push-template
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
    - name: repo-name
    - name: revision
    - name: target-namespace
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.repo-name)-push-
        namespace: $(tt.params.target-namespace)
        labels:
          # RHDH Tekton plugin discovers PipelineRuns by this label; the
          # catalog components carry the matching kubernetes-id.
          backstage.io/kubernetes-id: $(tt.params.repo-name)
          app.kubernetes.io/name: $(tt.params.repo-name)
      spec:
        pipelineRef:
          name: app-push
        params:
          - name: repo-url
            value: $(tt.params.repo-url)
          - name: repo-name
            value: $(tt.params.repo-name)
          - name: revision
            value: $(tt.params.revision)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
          - name: basic-auth
            secret:
              secretName: github-basic-auth
          - name: dockerconfig
            secret:
              secretName: quay-push-secret
          - name: maven-cache
            persistentVolumeClaim:
              claimName: maven-cache
---
# Binding for template-scaffolded projects: the target namespace is computed
# by the CEL overlay on the trigger (repo name + "-dev"), not hardcoded.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: scaffolded-target-binding
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: target-namespace
      value: $(extensions.target-namespace)
---
# Bootstrap for template-scaffolded projects: instantiates the per-project
# stack as an Argo CD Application (declarative from then on: self-heal,
# prune, and platform updates to project-pipeline propagate automatically).
# Argo creates the namespace itself (CreateNamespace) and stamps the
# pipeline-project label via managedNamespaceMetadata — the label CANNOT
# come from a synced manifest (see the namespace-label recipe in
# TROUBLESHOOTING). Subsequent pushes fail this template's create with
# AlreadyExists, which the EventListener logs and ignores.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: scaffolded-project-bootstrap-template
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  params:
    - name: repo-url
    - name: repo-name
    - name: revision
  resourcetemplates:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: project-$(tt.params.repo-name)
        namespace: openshift-gitops
        labels:
          rhoai3.redhat.com/scaffolded-project: "true"
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: https://github.com/adnan-drina/rhoai3-coding-demo
          targetRevision: main
          path: gitops/stages/050-advanced-app-platform/base/pipelines/project-pipeline
          kustomize:
            namespace: $(tt.params.repo-name)-dev
        destination:
          server: https://kubernetes.default.svc
          namespace: $(tt.params.repo-name)-dev
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
          managedNamespaceMetadata:
            labels:
              rhoai3.redhat.com/pipeline-project: "true"
              app.kubernetes.io/part-of: $(tt.params.repo-name)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: app-platform-listener
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  serviceAccountName: pipeline
  triggers:
    - name: coolstore-inventory-service-push
      bindings:
        - ref: app-platform-push-binding
        - name: target-namespace
          value: coolstore-dev
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # This project's repo only: main-branch pushes, no deletions.
              value: "body.ref == 'refs/heads/main' && body.after != '0000000000000000000000000000000000000000' && body.repository.name == 'coolstore-inventory-service'"
      template:
        ref: app-platform-push-template
    - name: scaffolded-project-bootstrap
      bindings:
        - ref: app-platform-push-binding
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              # Template-published repos only (topic set by publish:github in
              # the agentic-quarkus-scaffold template).
              value: "body.ref == 'refs/heads/main' && body.after != '0000000000000000000000000000000000000000' && ('rhoai3-scaffolded' in body.repository.topics)"
      template:
        ref: scaffolded-project-bootstrap-template
    - name: scaffolded-project-push
      bindings:
        - ref: app-platform-push-binding
        - ref: scaffolded-target-binding
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: token
            - name: eventTypes
              value:
                - "push"
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main' && body.after != '0000000000000000000000000000000000000000' && ('rhoai3-scaffolded' in body.repository.topics)"
            - name: overlays
              value:
                - key: target-namespace
                  expression: "body.repository.name + '-dev'"
      template:
        ref: app-platform-push-template
---
# The EventListener's ServiceAccount creates PipelineRuns in project
# namespaces (the dispatcher pattern above). Read access on pipelines lets
# Triggers resolve the target.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-platform-dispatcher
  annotations:
    argocd.argoproj.io/sync-wave: "13"
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get", "list"]
  # Scaffolded-project bootstrap: the trigger creates the per-project Argo CD
  # Application (openshift-gitops namespace).
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-platform-dispatcher
  annotations:
    argocd.argoproj.io/sync-wave: "13"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-platform-dispatcher
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: app-platform-build
---
# Route exposing the EventListener for GitHub webhooks
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: app-platform-listener
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  to:
    kind: Service
    name: el-app-platform-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
