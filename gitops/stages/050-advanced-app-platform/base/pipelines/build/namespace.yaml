# Dispatcher namespace: hosts the shared webhook ingress (single GitHub App
# endpoint) that routes push events to per-project pipelines. No pipeline
# runs here — projects own their pipelines (see pipelines/project-pipeline).
# The OpenShift Pipelines operator provisions the `pipeline` ServiceAccount
# used by the EventListener.
---
apiVersion: v1
kind: Namespace
metadata:
  name: app-platform-build
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/description: "Webhook dispatcher for per-project golden-path pipelines"
