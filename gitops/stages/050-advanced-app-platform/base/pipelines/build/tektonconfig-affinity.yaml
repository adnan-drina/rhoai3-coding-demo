# Sync hook: allow multiple PVC-backed workspaces per TaskRun.
# The shared push pipeline binds the per-run source PVC plus the persistent
# maven-cache PVC; with the affinity assistant enabled (default), TaskRuns
# fail validation with "more than one PersistentVolumeClaim is bound"
# (observed live). disable-affinity-assistant is the documented TektonConfig
# field for PVC workspace sharing. Patched by a hook because the operator
# owns the TektonConfig singleton.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-configure-tektonconfig
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-configure-tektonconfig
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["operator.tekton.dev"]
    resources: ["tektonconfigs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-configure-tektonconfig
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-configure-tektonconfig
subjects:
  - kind: ServiceAccount
    name: job-configure-tektonconfig
    namespace: app-platform-build
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-configure-tektonconfig
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "11"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: job-configure-tektonconfig
      restartPolicy: Never
      containers:
        - name: configure
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              for i in $(seq 1 30); do
                if oc get tektonconfig config >/dev/null 2>&1; then break; fi
                echo "waiting for TektonConfig ($i/30)"; sleep 10
              done
              oc patch tektonconfig config --type merge \
                -p '{"spec":{"pipeline":{"disable-affinity-assistant":true}}}'
              echo "disable-affinity-assistant set"
