# Reconciles per-project pipeline credentials: copies the source Secrets
# and registry ConfigMap from app-platform-build (written there by
# deploy.sh and the SonarQube PostSync job) into every namespace labeled
# rhoai3.redhat.com/pipeline-project=true. Runs every 2 minutes so
# namespaces scaffolded by the stage 070 golden-path template become
# build-ready without a platform redeploy; deploy.sh also triggers one
# immediate run before seeding coolstore.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-provisioner
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "13"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
  # Seed-run support: detect scaffolded projects (bootstrap Argo app) and
  # create the birth-certificate PipelineRun where none exists yet.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    verbs: ["get"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: "13"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-provisioner
subjects:
  - kind: ServiceAccount
    name: project-provisioner
    namespace: app-platform-build
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-provisioner
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: project-provisioner
          containers:
            - name: provision
              image: registry.redhat.io/openshift4/ose-cli:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  SOURCE_NS="app-platform-build"
                  SECRETS="github-basic-auth quay-push-secret quay-pull-secret sonarqube-credentials"
                  CONFIGMAPS="app-platform-build-config"

                  NAMESPACES=$(oc get namespaces \
                    -l rhoai3.redhat.com/pipeline-project=true \
                    -o jsonpath='{.items[*].metadata.name}')
                  if [ -z "${NAMESPACES}" ]; then
                    echo "No project namespaces labeled rhoai3.redhat.com/pipeline-project=true"
                    exit 0
                  fi

                  REPO_OWNER="${REPO_OWNER:-adnan-drina}"

                  # Scaffolded projects' publish-time push races namespace
                  # creation, so their first PipelineRun never materializes
                  # (the dispatcher's create fails while Argo is still
                  # provisioning). Seed exactly one run - the project's
                  # birth-certificate build - once credentials and the
                  # pipeline are in place and no run exists yet. Guarded to
                  # scaffolded projects via the bootstrap Argo app, so
                  # platform-owned namespaces (coolstore-dev, seeded by
                  # deploy.sh) are never touched.
                  seed_run() {  # <target-ns>
                    NS="$1"
                    REPO_NAME="${NS%-dev}"
                    oc get application.argoproj.io "project-${REPO_NAME}" -n openshift-gitops >/dev/null 2>&1 || return 0
                    oc get pipeline.tekton.dev app-push -n "${NS}" >/dev/null 2>&1 || return 0
                    oc get secret github-basic-auth -n "${NS}" >/dev/null 2>&1 || return 0
                    RUNS=$(oc get pipelinerun.tekton.dev -n "${NS}" --no-headers 2>/dev/null | wc -l | tr -d " ")
                    [ "${RUNS}" != "0" ] && return 0
                    echo "  seeding birth-certificate PipelineRun for ${REPO_NAME}"
                    cat <<SEEDEOF | oc create -f - >/dev/null
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: ${REPO_NAME}-seed-
                    namespace: ${NS}
                    labels:
                      backstage.io/kubernetes-id: ${REPO_NAME}
                      app.kubernetes.io/name: ${REPO_NAME}
                  spec:
                    pipelineRef:
                      name: app-push
                    params:
                      - name: repo-url
                        value: https://github.com/${REPO_OWNER}/${REPO_NAME}.git
                      - name: repo-name
                        value: ${REPO_NAME}
                      - name: revision
                        value: main
                    workspaces:
                      - name: source
                        volumeClaimTemplate:
                          spec:
                            accessModes: ["ReadWriteOnce"]
                            resources:
                              requests:
                                storage: 1Gi
                      - name: basic-auth
                        secret:
                          secretName: github-basic-auth
                      - name: dockerconfig
                        secret:
                          secretName: quay-push-secret
                      - name: maven-cache
                        persistentVolumeClaim:
                          claimName: maven-cache
                  SEEDEOF
                  }

                  copy() {  # <kind> <name> <target-ns>
                    if ! oc get "$1" "$2" -n "${SOURCE_NS}" >/dev/null 2>&1; then
                      echo "  source $1/$2 missing in ${SOURCE_NS} — skipping"
                      return 0
                    fi
                    oc get "$1" "$2" -n "${SOURCE_NS}" -o json \
                      | python3 -c '
                  import json, sys
                  o = json.load(sys.stdin)
                  o["metadata"] = {"name": o["metadata"]["name"], "namespace": sys.argv[1]}
                  print(json.dumps(o))' "$3" \
                      | oc apply -f - >/dev/null
                    echo "  $1/$2 -> $3"
                  }

                  for NS in ${NAMESPACES}; do
                    [ "${NS}" = "${SOURCE_NS}" ] && continue
                    echo "Provisioning ${NS}:"
                    for S in ${SECRETS}; do copy secret "${S}" "${NS}"; done
                    for C in ${CONFIGMAPS}; do copy configmap "${C}" "${NS}"; done
                    seed_run "${NS}"
                  done
                  echo "Project provisioning complete."
