# Shared push pipeline for golden-path application repositories.
# Generic by design: the repository URL, name, and revision arrive from the
# GitHub webhook payload, so one pipeline serves every repo the portal
# templates provision. Stages: clone -> maven build -> SonarQube quality
# gate -> image build and push.
#
# Image registry: resolved at run time from the app-platform-build-config
# ConfigMap (IMAGE_REGISTRY key, provisioned by deploy.sh from .env). Falls
# back to the internal OpenShift registry when unset — no external
# credentials needed for the default path. TLS verification stays enabled.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-platform-push
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  params:
    - name: repo-url
      type: string
      description: Clone URL of the repository that triggered the run
    - name: repo-name
      type: string
      description: Repository name (used as SonarQube project key and image name)
    - name: revision
      type: string
      description: Git revision to build (webhook head SHA)
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
    - name: maven-cache
  tasks:
    - name: resolve-image-registry
      taskRef:
        name: resolve-image-registry
    - name: clone-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth
    - name: maven-build
      runAfter:
        - clone-source
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: sonar-scan
      runAfter:
        - maven-build
      taskRef:
        name: sonar-scan
      params:
        - name: SONAR_PROJECT_KEY
          value: $(params.repo-name)
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: build-and-push
      runAfter:
        - sonar-scan
        - resolve-image-registry
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: "$(tasks.resolve-image-registry.results.registry)/$(params.repo-name):$(params.revision)"
        - name: DOCKERFILE
          value: Containerfile
        - name: STORAGE_DRIVER
          value: vfs
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
