apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pipelines component: trusted-delivery operators plus the webhook
# DISPATCHER for per-project pipelines. Each project namespace runs its own
# pipeline instantiated from pipelines/project-pipeline (clone -> maven ->
# SonarQube gate -> image build -> :latest retag); the GitHub App's single
# webhook endpoint lands on the shared EventListener here, which routes
# each repository's pushes to a PipelineRun in that project's namespace.
#
# Secrets expected in app-platform-build (provisioned by deploy.sh from
# .env, never committed): github-webhook-secret. Project namespaces
# (labeled rhoai3.redhat.com/pipeline-project=true) get github-basic-auth,
# quay-push-secret, and the registry ConfigMap from deploy.sh, and
# sonarqube-credentials from the SonarQube PostSync job.

resources:
  # Operators (Pipelines, TAS) + InstallPlan approval hook
  - operators/pipelines-subscription.yaml
  - operators/rhtas-subscription.yaml
  - operators/approve-installplans.yaml
  # Dispatcher namespace + persona access
  - build/namespace.yaml
  - build/persona-rbac.yaml
  # TektonConfig hook (wave 11): allow multiple PVC workspaces per TaskRun
  - build/tektonconfig-affinity.yaml
  # Governance boundary for scaffolded-project Applications (wave 12)
  - build/appproject-scaffolded.yaml
  # Webhook dispatcher (wave 13) + Route (wave 14)
  - build/triggers.yaml
  # Per-project credential reconciler (wave 13)
  - build/project-provisioner.yaml
