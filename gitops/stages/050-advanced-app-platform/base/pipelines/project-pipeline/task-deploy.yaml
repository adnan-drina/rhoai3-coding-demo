# Deploys the project's runtime after a successful build: applies the
# repo's k8s/ manifests when present (per-run scaffolded projects carry
# templated Deployment/Service/Route there), pins the deployment image to
# the revision-tagged image from this PipelineRun (V6 P4.1 — immutable pin,
# not floating `:latest` + force-restart), and waits for rollout.
# Projects whose deployment is GitOps-owned (golden coolstore) have no
# k8s/ directory — for them this task is image-pin + rollout-status only.
# The `pipeline` ServiceAccount's operator-granted `edit` role covers all
# of this within the project namespace.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-app
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  params:
    - name: REPO_NAME
      type: string
    - name: IMAGE
      type: string
      description: Fully-qualified immutable image (registry/name:git-sha)
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: registry.redhat.io/openshift4/ose-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -d k8s ]; then
          echo "Applying k8s/ manifests from the repository"
          oc apply -f k8s/
        else
          echo "No k8s/ directory in the repository (GitOps-owned deployment expected)"
        fi
        if oc get deployment "$(params.REPO_NAME)" >/dev/null 2>&1; then
          # Pin to the revision tag from this run. oc set image updates the
          # pod template and triggers a rollout — do NOT also rollout restart
          # (that raced with :latest pulls under imagePullPolicy Always).
          oc set image "deployment/$(params.REPO_NAME)" "$(params.REPO_NAME)=$(params.IMAGE)"
          oc patch "deployment/$(params.REPO_NAME)" --type=json -p='[
            {"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"IfNotPresent"}
          ]' 2>/dev/null || true
          oc rollout status "deployment/$(params.REPO_NAME)" --timeout=300s
          echo "Deployed pinned image $(params.IMAGE)"
        else
          echo "No Deployment named $(params.REPO_NAME) in this namespace — nothing to roll out."
        fi
