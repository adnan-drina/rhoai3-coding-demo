# Resolves the image registry prefix for pipeline runs.
# Reads IMAGE_REGISTRY from the app-platform-build-config ConfigMap in the
# project's own namespace (provisioned by deploy.sh from .env when quay.io
# is configured) and falls back to the internal OpenShift registry under
# the project namespace. Keeps registry selection a deploy-time platform
# decision without templating GitOps manifests.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-image-registry
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  results:
    - name: registry
      description: Registry/namespace prefix for the built image
  steps:
    - name: resolve
      image: registry.redhat.io/openshift4/ose-cli:latest
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        REGISTRY=$(oc get configmap app-platform-build-config \
          -o jsonpath='{.data.IMAGE_REGISTRY}' 2>/dev/null || true)
        if [ -z "${REGISTRY}" ]; then
          REGISTRY="image-registry.openshift-image-registry.svc:5000/${NS}"
          echo "IMAGE_REGISTRY not configured — using internal registry"
        else
          echo "Using external registry: ${REGISTRY}"
        fi
        printf '%s' "${REGISTRY}" > "$(results.registry.path)"
