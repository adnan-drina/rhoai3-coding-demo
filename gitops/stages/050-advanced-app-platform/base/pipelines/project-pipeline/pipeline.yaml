# Per-project delivery pipeline (instantiated from the project-pipeline
# template into each project namespace). Stages: clone -> maven build ->
# SonarQube quality gate -> image build and push -> :latest retag.
# PipelineRuns are created by the shared webhook dispatcher (single GitHub
# App endpoint) in this pipeline's own namespace.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-push
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  params:
    - name: repo-url
      type: string
      description: Clone URL of the repository that triggered the run
    - name: repo-name
      type: string
      description: Repository name (used as SonarQube project key and image name)
    - name: revision
      type: string
      description: Git revision to build (webhook head SHA)
  workspaces:
    - name: source
    - name: basic-auth
    - name: dockerconfig
    - name: maven-cache
  tasks:
    - name: resolve-image-registry
      taskRef:
        name: resolve-image-registry
    - name: clone-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
        - name: basic-auth
          workspace: basic-auth
    - name: maven-build
      runAfter:
        - clone-source
      taskRef:
        name: maven-build
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: sonar-scan
      runAfter:
        - maven-build
      taskRef:
        name: sonar-scan
      params:
        - name: SONAR_PROJECT_KEY
          value: $(params.repo-name)
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
    - name: build-and-push
      runAfter:
        - sonar-scan
        - resolve-image-registry
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: "$(tasks.resolve-image-registry.results.registry)/$(params.repo-name):$(params.revision)"
        - name: DOCKERFILE
          value: Containerfile
        - name: STORAGE_DRIVER
          value: vfs
      workspaces:
        - name: source
          workspace: source
        - name: dockerconfig
          workspace: dockerconfig
    - name: tag-latest
      runAfter:
        - build-and-push
      taskRef:
        name: tag-latest
      params:
        - name: IMAGE
          value: "$(tasks.resolve-image-registry.results.registry)/$(params.repo-name):$(params.revision)"
      workspaces:
        - name: dockerconfig
          workspace: dockerconfig
    - name: deploy
      runAfter:
        - tag-latest
      taskRef:
        name: deploy-app
      params:
        - name: REPO_NAME
          value: "$(params.repo-name)"
        - name: IMAGE
          value: "$(tasks.resolve-image-registry.results.registry)/$(params.repo-name):latest"
      workspaces:
        - name: source
          workspace: source
