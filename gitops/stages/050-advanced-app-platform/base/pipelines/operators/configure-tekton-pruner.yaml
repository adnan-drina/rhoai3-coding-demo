---
# The Pipelines operator's default pruner (keep 100, daily) never fires in
# a demo-scale cluster, so every failed PipelineRun leaves its taskrun
# pods behind as Error husks. Tighten it: hourly, keep the last 10 runs
# per namespace (taskrun pods are owner-cascaded on prune). TektonConfig
# is an operator-owned cluster singleton — patch it with a Sync hook
# instead of fighting the operator over the full spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-tekton-pruner
  namespace: app-platform-build
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: configure-tekton-pruner
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
rules:
  - apiGroups: ["operator.tekton.dev"]
    resources: ["tektonconfigs"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: configure-tekton-pruner
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: configure-tekton-pruner
subjects:
  - kind: ServiceAccount
    name: configure-tekton-pruner
    namespace: app-platform-build
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-tekton-pruner
  namespace: app-platform-build
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: configure-tekton-pruner
      restartPolicy: Never
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              oc patch tektonconfig config --type=merge -p '{
                "spec": {"pruner": {
                  "disabled": false,
                  "keep": 10,
                  "resources": ["pipelinerun"],
                  "schedule": "0 * * * *"
                }}}'
              echo "pruner configured: keep 10, hourly"
