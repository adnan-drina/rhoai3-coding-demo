# Sync hook: generate the rhbk-db credentials Secret if it does not exist.
# Runs before PostgreSQL (wave 5) so the database and Keycloak always find
# credentials without committing any to Git. Same pattern as the sonarqube
# component's sonardb secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-ensure-rhbk-db-secret
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-ensure-rhbk-db-secret
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-ensure-rhbk-db-secret
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-ensure-rhbk-db-secret
subjects:
  - kind: ServiceAccount
    name: job-ensure-rhbk-db-secret
    namespace: rhbk
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-ensure-rhbk-db-secret
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: job-ensure-rhbk-db-secret
      restartPolicy: Never
      containers:
        - name: ensure-secret
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if oc get secret rhbk-db -n rhbk >/dev/null 2>&1; then
                echo "rhbk-db secret already exists"
                exit 0
              fi
              PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 24)
              oc create secret generic rhbk-db -n rhbk \
                --from-literal=username=keycloak \
                --from-literal=password="${PASS}" \
                --from-literal=database=keycloak
              echo "rhbk-db secret created"
