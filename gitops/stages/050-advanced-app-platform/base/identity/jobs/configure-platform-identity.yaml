# PostSync Job: configures OpenShift OAuth federation in the platform RHBK.
#
# Creates an openshift-v4 identity provider in the `platform` realm so demo
# users log in with their cluster credentials, patches the platform-keycloak
# OAuthClient with a generated secret and the live RHBK redirect URI, and
# pre-creates the demo users with identity-provider links so first login
# skips the profile-completion step of the first-broker-login flow.
#
# RHBK 26 serves at the root path (no /auth prefix, unlike the
# MTA-operator-managed Keycloak): realms live under /realms/<realm> and the
# Admin API under /admin/realms/<realm>. The Operator stores the bootstrap
# admin credentials in the <cr-name>-initial-admin Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-configure-platform-identity
  namespace: rhbk
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-configure-platform-identity
  namespace: rhbk
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-configure-platform-identity
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: ["oauth.openshift.io"]
  resources: ["oauthclients"]
  verbs: ["get", "patch"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
- apiGroups: ["user.openshift.io"]
  resources: ["users"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-configure-platform-identity
  namespace: rhbk
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-configure-platform-identity
  namespace: rhbk
roleRef:
  kind: Role
  name: job-configure-platform-identity
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-configure-platform-identity
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-configure-platform-identity
  namespace: rhbk
roleRef:
  kind: ClusterRole
  name: job-configure-platform-identity
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-configure-platform-identity
  namespace: rhbk
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-configure-platform-identity
      containers:
      - name: configure
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          RHBK_URL="http://platform-rhbk-service.rhbk.svc:8080"
          REALM="platform"
          IDP_ALIAS="openshift"
          OAUTH_CLIENT_NAME="platform-keycloak"

          # --- 1. Discover the RHBK route ---
          echo "Discovering RHBK route..."
          RHBK_HOST=""
          for i in {1..30}; do
            RHBK_HOST=$(oc get route platform-rhbk -n rhbk -o jsonpath='{.spec.host}' 2>/dev/null || true)
            if [ -n "$RHBK_HOST" ]; then break; fi
            echo "Waiting for RHBK route... ($i/30)"
            sleep 10
          done
          if [ -z "$RHBK_HOST" ]; then
            echo "ERROR: RHBK route not found"
            exit 1
          fi
          RHBK_EXTERNAL_URL="https://${RHBK_HOST}"
          REDIRECT_URI="${RHBK_EXTERNAL_URL}/realms/${REALM}/broker/${IDP_ALIAS}/endpoint"
          echo "RHBK URL: ${RHBK_EXTERNAL_URL}"
          echo "Redirect URI: ${REDIRECT_URI}"

          # --- 2. Discover OpenShift API URL ---
          echo "Discovering OpenShift API URL..."
          OCP_API=$(oc whoami --show-server 2>/dev/null || true)
          if [ -z "$OCP_API" ]; then
            echo "ERROR: Cannot determine OpenShift API URL"
            exit 1
          fi
          echo "OpenShift API: ${OCP_API}"

          # --- 3. Generate or reuse OAuth client secret ---
          echo "Checking OAuthClient secret..."
          CURRENT_SECRET=$(oc get oauthclient ${OAUTH_CLIENT_NAME} -o jsonpath='{.secret}' 2>/dev/null || echo "")
          if [ -z "$CURRENT_SECRET" ] || [ "$CURRENT_SECRET" = "PLACEHOLDER_WILL_BE_PATCHED" ]; then
            CLIENT_SECRET=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 40)
            echo "Generated new OAuth client secret"
          else
            CLIENT_SECRET="$CURRENT_SECRET"
            echo "Reusing existing OAuth client secret"
          fi

          # --- 4. Patch OAuthClient ---
          echo "Patching OAuthClient..."
          oc patch oauthclient ${OAUTH_CLIENT_NAME} --type=merge \
            -p "{\"secret\":\"${CLIENT_SECRET}\",\"redirectURIs\":[\"${REDIRECT_URI}\"]}"
          echo "OAuthClient patched"

          # --- 5. Get RHBK admin token ---
          echo "Getting RHBK admin token..."
          RHBK_ADMIN_USER=$(oc get secret platform-rhbk-initial-admin -n rhbk \
            -o jsonpath='{.data.username}' | base64 -d)
          RHBK_ADMIN_PASS=$(oc get secret platform-rhbk-initial-admin -n rhbk \
            -o jsonpath='{.data.password}' | base64 -d)

          ADMIN_TOKEN=""
          for i in {1..60}; do
            ADMIN_TOKEN=$(curl -s -X POST \
              "${RHBK_URL}/realms/master/protocol/openid-connect/token" \
              -d "grant_type=password&client_id=admin-cli&username=${RHBK_ADMIN_USER}&password=${RHBK_ADMIN_PASS}" \
              2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null || echo "")
            if [ -n "$ADMIN_TOKEN" ]; then break; fi
            echo "Waiting for RHBK... ($i/60)"
            sleep 10
          done
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ERROR: Cannot get RHBK admin token"
            exit 1
          fi
          echo "Got RHBK admin token"

          AUTH_HEADER="Authorization: Bearer ${ADMIN_TOKEN}"

          # --- 6. Wait for the platform realm (KeycloakRealmImport) ---
          echo "Waiting for realm '${REALM}'..."
          REALM_CODE=""
          for i in {1..30}; do
            REALM_CODE=$(curl -s -H "${AUTH_HEADER}" \
              "${RHBK_URL}/admin/realms/${REALM}" \
              -o /dev/null -w "%{http_code}" 2>/dev/null)
            if [ "$REALM_CODE" = "200" ]; then break; fi
            echo "Waiting for realm import... ($i/30, HTTP ${REALM_CODE})"
            sleep 10
          done
          if [ "$REALM_CODE" != "200" ]; then
            echo "ERROR: realm '${REALM}' not found (HTTP ${REALM_CODE})"
            exit 1
          fi

          # --- 7. Create/update openshift-v4 IdP ---
          echo "Configuring OpenShift IdP in RHBK realm '${REALM}'..."

          EXISTING_IDP=$(curl -s -H "${AUTH_HEADER}" \
            "${RHBK_URL}/admin/realms/${REALM}/identity-provider/instances/${IDP_ALIAS}" \
            -o /dev/null -w "%{http_code}" 2>/dev/null)

          IDP_PAYLOAD=$(cat <<IDPEOF
          {
            "alias": "${IDP_ALIAS}",
            "displayName": "Log in with OpenShift",
            "providerId": "openshift-v4",
            "enabled": true,
            "trustEmail": true,
            "storeToken": false,
            "addReadTokenRoleOnCreate": false,
            "firstBrokerLoginFlowAlias": "first broker login",
            "config": {
              "baseUrl": "${OCP_API}",
              "clientId": "${OAUTH_CLIENT_NAME}",
              "clientSecret": "${CLIENT_SECRET}",
              "syncMode": "IMPORT",
              "defaultScope": "user:info"
            }
          }
          IDPEOF
          )

          if [ "$EXISTING_IDP" = "200" ]; then
            echo "Updating existing IdP '${IDP_ALIAS}'..."
            HTTP_CODE=$(curl -s -X PUT -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
              "${RHBK_URL}/admin/realms/${REALM}/identity-provider/instances/${IDP_ALIAS}" \
              -d "${IDP_PAYLOAD}" -o /dev/null -w "%{http_code}" 2>/dev/null)
          else
            echo "Creating new IdP '${IDP_ALIAS}'..."
            HTTP_CODE=$(curl -s -X POST -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
              "${RHBK_URL}/admin/realms/${REALM}/identity-provider/instances" \
              -d "${IDP_PAYLOAD}" -o /dev/null -w "%{http_code}" 2>/dev/null)
          fi
          echo "IdP response: HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "ERROR: Failed to configure IdP (HTTP ${HTTP_CODE})"
            curl -s -X POST -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
              "${RHBK_URL}/admin/realms/${REALM}/identity-provider/instances" \
              -d "${IDP_PAYLOAD}" 2>&1
            exit 1
          fi

          # --- 8. Pre-create demo users with IdP links ---
          # Pre-creating users (with email/profile) avoids the
          # first-broker-login profile-completion prompt. No realm roles are
          # needed: RHDH resolves identity by preferred_username.

          create_linked_user() {
            local USERNAME="$1" EMAIL="$2" FIRST="$3" LAST="$4"

            # The openshift-v4 provider uses the OpenShift user UID as the
            # federated identity userId, not the username. Look it up.
            OCP_USER_UID=$(oc get user "${USERNAME}" -o jsonpath='{.metadata.uid}' 2>/dev/null || echo "")
            if [ -z "$OCP_USER_UID" ]; then
              echo "WARNING: OpenShift user '${USERNAME}' not found, skipping"
              return
            fi

            EXISTING=$(curl -s -H "${AUTH_HEADER}" \
              "${RHBK_URL}/admin/realms/${REALM}/users?username=${USERNAME}&exact=true" 2>/dev/null)
            EXISTS=$(echo "$EXISTING" | python3 -c "import sys,json; print('yes' if len(json.load(sys.stdin))>0 else 'no')" 2>/dev/null)

            if [ "$EXISTS" != "yes" ]; then
              curl -s -X POST -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
                "${RHBK_URL}/admin/realms/${REALM}/users" \
                -d "{\"username\":\"${USERNAME}\",\"enabled\":true,\"emailVerified\":true,\"email\":\"${EMAIL}\",\"firstName\":\"${FIRST}\",\"lastName\":\"${LAST}\"}" \
                -o /dev/null
              echo "Created user: ${USERNAME}"
            else
              echo "User exists: ${USERNAME}"
            fi

            USER_ID=$(curl -s -H "${AUTH_HEADER}" \
              "${RHBK_URL}/admin/realms/${REALM}/users?username=${USERNAME}&exact=true" 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])" 2>/dev/null)

            # Delete stale link if userId changed, then create with correct UID
            curl -s -X DELETE -H "${AUTH_HEADER}" \
              "${RHBK_URL}/admin/realms/${REALM}/users/${USER_ID}/federated-identity/${IDP_ALIAS}" \
              -o /dev/null 2>/dev/null
            curl -s -X POST -H "${AUTH_HEADER}" -H "Content-Type: application/json" \
              "${RHBK_URL}/admin/realms/${REALM}/users/${USER_ID}/federated-identity/${IDP_ALIAS}" \
              -d "{\"identityProvider\":\"${IDP_ALIAS}\",\"userId\":\"${OCP_USER_UID}\",\"userName\":\"${USERNAME}\"}" \
              -o /dev/null
            echo "  Linked to OpenShift IdP (uid=${OCP_USER_UID})"
          }

          echo "Configuring demo users..."
          create_linked_user "ai-admin" "ai-admin@demo.local" "AI" "Admin"
          create_linked_user "ai-developer" "ai-developer@demo.local" "AI" "Developer"

          echo ""
          echo "=== Platform identity configured ==="
          echo "RHBK URL: ${RHBK_EXTERNAL_URL}"
          echo "Realm: ${REALM} (OIDC discovery: ${RHBK_EXTERNAL_URL}/realms/${REALM})"
          echo "Users see 'Log in with OpenShift' on the realm login page"
