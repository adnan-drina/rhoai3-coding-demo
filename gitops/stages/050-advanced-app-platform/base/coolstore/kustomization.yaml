apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Coolstore dev environment: the deployed Coolstore Inventory Service the
# demo starts from. The image is produced by the shared app-platform-push
# pipeline (seeded by stages/050-advanced-app-platform/deploy.sh, updated
# by every push to adnan-drina/coolstore-inventory-service) and retagged
# :latest by the tag-latest pipeline task. The quay-pull-secret is
# provisioned by deploy.sh from .env — auto-created quay repositories are
# private by default (quay.io has no org-wide visibility setting).

resources:
  - namespace.yaml
  - pipeline
  - deployment.yaml
  - service.yaml
  - route.yaml
  # PostSync hook: repoint the deployment image at the deployer's IMAGE_REGISTRY
  # so the app pulls what its own pipeline builds (portable installs).
  - patch-image-registry.yaml
