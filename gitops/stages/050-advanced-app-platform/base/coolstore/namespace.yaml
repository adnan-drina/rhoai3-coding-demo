apiVersion: v1
kind: Namespace
metadata:
  name: coolstore-dev
  labels:
    app.kubernetes.io/part-of: coolstore
    # Marks this namespace for per-project pipeline provisioning: deploy.sh
    # (github/quay secrets, registry ConfigMap) and the SonarQube PostSync
    # job (scanner credentials) target namespaces carrying this label.
    # NOTE: the 050 Application ignores Namespace label diffs, so this label
    # only lands when Argo first creates the namespace — deploy.sh re-asserts
    # it on existing namespaces (see seed_coolstore step 0).
    rhoai3.redhat.com/pipeline-project: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    openshift.io/description: Deployed Coolstore dev environment for the AI development demo stages
