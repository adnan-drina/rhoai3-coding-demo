# Provisions Dev Spaces git push credentials into the demo workspace
# namespaces by mirroring the pipeline GitHub PAT that deploy.sh already
# places in app-platform-build (Secret github-basic-auth, .git-credentials
# key — https://token:<PAT>@github.com). The DevWorkspace controller
# mounts every Secret labeled controller.devfile.io/git-credential=true
# into workspaces of that namespace, which gives both the stage 060/070
# human exercises (Commit & Push, guide step 8) and the stage 080 harness
# ship step a working `git push` without per-user PAT setup. Skips
# gracefully when the source Secret is absent (fresh env without .env
# GITHUB_TOKEN).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-git-credentials-provisioner
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-git-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["github-basic-auth"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-git-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-git-credentials-source-reader
subjects:
  - kind: ServiceAccount
    name: workspace-git-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-git-credentials-writer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-git-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-git-credentials-writer
subjects:
  - kind: ServiceAccount
    name: workspace-git-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-git-credentials-writer
  namespace: wksp-ai-admin
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-git-credentials-writer
subjects:
  - kind: ServiceAccount
    name: workspace-git-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-git-credentials-writer
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-git-credentials-writer
subjects:
  - kind: ServiceAccount
    name: workspace-git-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-workspace-git-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: workspace-git-credentials-provisioner
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -ceu
            - |
              CREDS="$(oc get secret github-basic-auth -n app-platform-build \
                -o jsonpath='{.data.\.git-credentials}' 2>/dev/null || true)"
              if [ -z "${CREDS}" ]; then
                echo "Source Secret app-platform-build/github-basic-auth not found; skipping (no push credentials provisioned)"
                exit 0
              fi
              for NS in wksp-ai-developer wksp-ai-admin wksp-kubeadmin; do
                cat <<MANIFEST | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: git-credentials
                namespace: ${NS}
                labels:
                  controller.devfile.io/git-credential: "true"
                  controller.devfile.io/watch-secret: "true"
              type: Opaque
              data:
                credentials: ${CREDS}
              MANIFEST
                echo "git-credentials provisioned in ${NS}"
              done
