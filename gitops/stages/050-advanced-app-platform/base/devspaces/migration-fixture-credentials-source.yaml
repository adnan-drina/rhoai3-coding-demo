# The SOURCE of the specimen's fixture identities (ADR-014, per-run amendment).
#
# This Secret is never mounted anywhere. It carries NO
# controller.devfile.io/mount-to-devworkspace label and no automount
# annotations, so no workspace can receive it: DevWorkspace Operator only
# considers secrets its cache holds, and its cache selects on
# controller.devfile.io/watch-secret.
# Ref: https://github.com/devfile/devworkspace-operator/blob/v0.43.0/pkg/cache/cache.go#L43
#
# What reads it is the platform provisioner
# (pipelines/build/task-provision-migration-run.yaml), which copies every key
# into the RUN's own `<run>-parity-credentials` Secret, bound by
# mount-to-devworkspace-include to exactly that run's workspace name. Retiring
# or changing one run's fixture cannot reach another, because each run holds
# its own copy.
#
# The values live here rather than in the provisioner because they are SPECIMEN
# INPUTS, not platform behaviour: the provisioner copies whatever keys this
# Secret has and names none of them. Another specimen changes this file and
# nothing else.
#
# DEMO VALUES ONLY — the specimen's seeded demo identity and a deliberately
# wrong one, both already public in the frozen legacy repository's own seed.
# decisions.yaml records the variable NAMES and never a value, and the
# migration evidence carries neither.
apiVersion: v1
kind: Secret
metadata:
  name: migration-fixture-credentials
  namespace: wksp-ai-developer
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: migration-fixture-credentials
    app.kubernetes.io/component: fixture-credentials-source
    app.kubernetes.io/managed-by: argocd
    rhoai3.io/purpose: stage-080-parity
  annotations:
    argocd.argoproj.io/sync-wave: "17"
type: Opaque
stringData:
  PETCLINIC_ADMIN_CREDENTIAL: "admin:admin"
  PETCLINIC_INVALID_CREDENTIAL: "nobody:wrong"
