# Provisions SonarQube analysis credentials into the developer workspace
# namespace by mirroring the pipeline's sonarqube-credentials Secret from
# app-platform-build (keys: host, token). The stage 080 harness sensors
# run the factory's own Maven sonar plugin locally (factory parity —
# anonymous analysis submission is denied by the server), so workspaces
# need the same token the pipeline uses. Mounted as env into workspaces:
# SONAR_HOST / SONAR_TOKEN. Skips gracefully when the source is absent.
#
# O-SONARMIRROR / W4-029a: CronJob re-mirrors when the platform secret
# rotates (PostSync mint). DevWorkspace watch-secret remounts env; we also
# delete Running tooling pods when the token bytes change so env is refreshed
# without waiting for an operator bounce.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sonar-credentials-provisioner
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sonarqube-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-source-reader
subjects:
  - kind: ServiceAccount
    name: workspace-sonar-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-writer
subjects:
  - kind: ServiceAccount
    name: workspace-sonar-credentials-provisioner
    namespace: wksp-ai-developer
---
# One-shot on Argo sync (wave 18) — first mirror after apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-workspace-sonar-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: workspace-sonar-credentials-provisioner
      restartPolicy: Never
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # shared body with CronJob (keep in sync)
              if ! oc get secret sonarqube-credentials -n app-platform-build >/dev/null 2>&1; then
                echo "source sonarqube-credentials absent — skipping"
                exit 0
              fi
              HOST=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.host}')
              TOKEN=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.token}')
              PREV=""
              if oc get secret workspace-sonar-credentials -n wksp-ai-developer >/dev/null 2>&1; then
                PREV=$(oc get secret workspace-sonar-credentials -n wksp-ai-developer \
                  -o jsonpath='{.data.SONAR_TOKEN}' || true)
              fi
              cat <<EOF | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: workspace-sonar-credentials
                namespace: wksp-ai-developer
                labels:
                  controller.devfile.io/mount-to-devworkspace: "true"
                  controller.devfile.io/watch-secret: "true"
                annotations:
                  controller.devfile.io/mount-as: env
              type: Opaque
              data:
                SONAR_HOST: ${HOST}
                SONAR_TOKEN: ${TOKEN}
              EOF
              echo "workspace-sonar-credentials provisioned"
              if [ -n "${PREV}" ] && [ "${PREV}" != "${TOKEN}" ]; then
                echo "O-SONARMIRROR: token changed — bouncing DevWorkspace pods for env remount"
                oc delete pod -n wksp-ai-developer \
                  -l controller.devfile.io/devworkspace_name \
                  --field-selector=status.phase=Running --wait=false || true
              fi
---
# Periodic re-mirror so PostSync mint + workspace env stay aligned (O-SONARMIRROR).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-workspace-sonar-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: workspace-sonar-credentials-provisioner
          restartPolicy: Never
          containers:
            - name: provision
              image: registry.redhat.io/openshift4/ose-cli:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  if ! oc get secret sonarqube-credentials -n app-platform-build >/dev/null 2>&1; then
                    echo "source sonarqube-credentials absent — skipping"
                    exit 0
                  fi
                  HOST=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.host}')
                  TOKEN=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.token}')
                  PREV=""
                  if oc get secret workspace-sonar-credentials -n wksp-ai-developer >/dev/null 2>&1; then
                    PREV=$(oc get secret workspace-sonar-credentials -n wksp-ai-developer \
                      -o jsonpath='{.data.SONAR_TOKEN}' || true)
                  fi
                  cat <<EOF | oc apply -f -
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: workspace-sonar-credentials
                    namespace: wksp-ai-developer
                    labels:
                      controller.devfile.io/mount-to-devworkspace: "true"
                      controller.devfile.io/watch-secret: "true"
                    annotations:
                      controller.devfile.io/mount-as: env
                  type: Opaque
                  data:
                    SONAR_HOST: ${HOST}
                    SONAR_TOKEN: ${TOKEN}
                  EOF
                  if [ "${PREV}" = "${TOKEN}" ]; then
                    echo "O-SONARMIRROR: workspace token already matches platform — no bounce"
                    exit 0
                  fi
                  echo "O-SONARMIRROR: token changed — bouncing DevWorkspace pods for env remount"
                  oc delete pod -n wksp-ai-developer \
                    -l controller.devfile.io/devworkspace_name \
                    --field-selector=status.phase=Running --wait=false || true
