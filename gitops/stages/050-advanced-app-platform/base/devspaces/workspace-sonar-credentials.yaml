# Provisions SonarQube analysis credentials into the developer workspace
# namespace by mirroring the pipeline's sonarqube-credentials Secret from
# app-platform-build (keys: host, token). The stage 080 harness sensors
# run the factory's own Maven sonar plugin locally (factory parity —
# anonymous analysis submission is denied by the server), so workspaces
# need the same token the pipeline uses. Mounted as env into workspaces:
# SONAR_HOST / SONAR_TOKEN. Skips gracefully when the source is absent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sonar-credentials-provisioner
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sonarqube-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-source-reader
subjects:
  - kind: ServiceAccount
    name: workspace-sonar-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-writer
subjects:
  - kind: ServiceAccount
    name: workspace-sonar-credentials-provisioner
    namespace: wksp-ai-developer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-workspace-sonar-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: workspace-sonar-credentials-provisioner
      restartPolicy: Never
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if ! oc get secret sonarqube-credentials -n app-platform-build >/dev/null 2>&1; then
                echo "source sonarqube-credentials absent — skipping"
                exit 0
              fi
              HOST=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.host}')
              TOKEN=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.token}')
              cat <<EOF | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: workspace-sonar-credentials
                namespace: wksp-ai-developer
                labels:
                  controller.devfile.io/mount-to-devworkspace: "true"
                  controller.devfile.io/watch-secret: "true"
                annotations:
                  controller.devfile.io/mount-as: env
              type: Opaque
              data:
                SONAR_HOST: ${HOST}
                SONAR_TOKEN: ${TOKEN}
              EOF
              echo "workspace-sonar-credentials provisioned"
