# Che Code editor configuration for demo workspace namespaces.
#
# Red Hat OpenShift Dev Spaces applies this ConfigMap at workspace startup.
# It keeps namespace-wide editor recommendations and terminal defaults
# platform-managed. Workspace-specific VSIX extensions, such as Kilo Code
# or the MTA pack, are configured on that DevWorkspace with
# DEFAULT_EXTENSIONS — do not recommend kilocode.kilo-code here or factory
# (OpenCode) workspaces will also install it.
#
# security.workspace.trust.enabled=false: Restricted Mode otherwise leaves
# DEFAULT_EXTENSIONS VSIXes installed-but-disabled until the user clicks
# Enable. These namespaces only run platform-provisioned repos.
# kilo-code.new.model.* must match init-ai-tools.sh (qwen27b / qwen3-6-27b),
# not Kilo Gateway defaults.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vscode-editor-configurations
  namespace: wksp-kubeadmin
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
  annotations:
    argocd.argoproj.io/sync-wave: "17"
data:
  extensions.json: |
    {
      "recommendations": [
        "redhat.fabric8-analytics",
        "redhat.vscode-openshift-connector"
      ]
    }
  settings.json: |
    {
      "terminal.integrated.shellIntegration.enabled": true,
      "terminal.integrated.defaultProfile.linux": "bash",
      "terminal.integrated.profiles.linux": {
        "bash": {
          "path": "/usr/bin/bash",
          "icon": "terminal-bash"
        }
      },
      "terminal.integrated.automationProfile.linux": {
        "path": "/usr/bin/bash"
      },
      "terminal.integrated.inheritEnv": true,
      "security.workspace.trust.enabled": false,
      "kilo-code.new.model.providerID": "qwen27b",
      "kilo-code.new.model.modelID": "qwen3-6-27b"
    }
---
