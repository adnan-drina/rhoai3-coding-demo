# RETIRING — DO NOT EXTEND. This is the SHARED, namespace-wide parity stack
# from before per-run resources: one database, one workspace secret, and a
# `mount-to-devworkspace` label with no include annotation, which injects
# PETCLINIC_DB_* into EVERY workspace in this namespace. That is precisely why
# two runs could not each have their own, and why the v10 design gives each run
# its own database, credentials and fixture identities, rendered at workspace
# initiation by trusted platform code
# (pipelines/build/task-provision-migration-run.yaml).
# See tmp/080-operator/PER-RUN-RESOURCES.md.
#
# It stays only because the RUNNING v9 destination reads
# petclinic-parity-postgres / petclinic-parity-db right now. Adding an include
# or exclude annotation to a live automounted secret makes DWO reconcile the
# workspaces it targets, which can restart v9 mid-run, so it is NOT scoped in
# place. Retirement is sequential and total:
#
#   1. v9 closes (its ADR-014 exits are recorded).
#   2. Delete migration-parity-database.yaml and petclinic-parity-credentials.yaml
#      and their two kustomization.yaml rows; Argo prunes the Deployment,
#      Service, Job, SA, Role, RoleBinding and both secrets.
#   3. Only then scaffold v10. A v10 workspace started while these still carry
#      a namespace-wide mount would receive BOTH this secret and its own, two
#      sources for the same PETCLINIC_DB_* names.
#
# migration-parity-db-provisioner here is superseded by
# migration-run-provisioner, which deliberately lives in app-platform-build
# rather than here (migration-run-resources-rbac.yaml).
#
# DEMO VALUES ONLY — the specimen's seeded demo identity and a deliberately
# wrong one (ADR-014). decisions.yaml records the variable NAMES and never
# a value. These are not a generated password, so they are a Secret rather
# than the parity-database provisioner Job.
#
# Same Dev Spaces automount contract as petclinic-parity-db, with one
# deliberate omission: controller.devfile.io/watch-secret is absent. A
# watched secret restarts every Running workspace in the namespace, which
# would kill a migration already in progress. DWO injects this secret at
# pod creation only, so the workspace has to be started after the secret
# exists. Do not add the watch label later.
#
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/
#      (automounting secrets into workspaces)
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-parity-credentials
  namespace: wksp-ai-developer
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: petclinic-parity-credentials
    app.kubernetes.io/component: fixture-credentials
    app.kubernetes.io/managed-by: argocd
    controller.devfile.io/mount-to-devworkspace: "true"
    rhoai3.io/purpose: stage-080-parity
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    controller.devfile.io/mount-as: env
type: Opaque
stringData:
  PETCLINIC_ADMIN_CREDENTIAL: "admin:admin"
  PETCLINIC_INVALID_CREDENTIAL: "nobody:wrong"
