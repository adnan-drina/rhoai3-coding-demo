# Per-user workspace namespaces, RBAC, and DevWorkspaces.
#
# Stage 060 uses one Developer Hub component per repo and one matching
# single-repo Dev Spaces workspace per component. This keeps onboarding,
# golden-path engineering, and modernization work isolated instead of loading
# all source projects into one workspace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: wksp-kubeadmin
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    openshift.io/display-name: "Workspace kubeadmin"
    che.eclipse.org/username: kube:admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-kubeadmin
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "b64:a3ViZTphZG1pbg=="
---
kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: getting-started-ai-coding
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  started: false
  routingClass: che
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
      - name: getting-started-ai-coding
        git:
          remotes:
            origin: https://github.com/adnan-drina/getting-started-ai-coding.git
          checkoutFrom:
            revision: main
    commands:
      - id: init-ai-tools
        exec:
          commandLine: |
            java21_home="${JAVA_HOME:-}"
            if [ -z "${java21_home}" ] || [ ! -x "${java21_home}/bin/java" ]; then
              for candidate in \
                "${HOME}/.sdkman/candidates/java/21.0.5-tem" \
                /home/tooling/.sdkman/candidates/java/21.0.5-tem \
                /usr/lib/jvm/java-21-openjdk; do
                if [ -x "${candidate}/bin/java" ]; then
                  java21_home="${candidate}"
                  break
                fi
              done
            fi
            if [ -n "${java21_home}" ] && [ -x "${java21_home}/bin/java" ]; then
              export JAVA_HOME="${java21_home}"
              export PATH="${JAVA_HOME}/bin:${PATH}"
              for rc in "${HOME}/.bashrc" "${HOME}/.zshrc"; do
                touch "${rc}"
                if ! grep -q "rhoai3-coding-demo: java 21 default" "${rc}"; then
                  {
                    printf '\n'
                    printf '# rhoai3-coding-demo: java 21 default\n'
                    printf 'export JAVA_HOME="%s"\n' "${java21_home}"
                    printf 'export PATH="${JAVA_HOME}/bin:${PATH}"\n'
                  } >> "${rc}"
                fi
              done
              echo "Configured Java 21 as the default shell runtime."
            else
              echo "Java 21 runtime not found; use a Dev Spaces tooling image with OpenJDK 21."
            fi
            if ls /checode/remote/extensions 2>/dev/null | grep -q "^kilocode.kilo-code-7.4.8"; then
              echo "Kilo Code 7.4.8 already installed; skipping VSIX download."
            else
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 300 -o /tmp/kilo.vsix "https://open-vsx.org/api/kilocode/kilo-code/linux-x64/7.4.8/file/kilocode.kilo-code-7.4.8@linux-x64.vsix"
              test -s /tmp/kilo.vsix
            fi
            for i in $(seq 1 30); do [ -d /projects/getting-started-ai-coding/.git ] && break; sleep 2; done
            if [ -d /projects/getting-started-ai-coding/.opencode ]; then
              mkdir -p ~/.config/opencode ~/.opencode
              if [ ! -f ~/.config/opencode/opencode.json ]; then
                if [ -f ~/.opencode/opencode.json ]; then
                  cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
                  echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
                else
                  cp /projects/getting-started-ai-coding/.opencode/opencode.template.json ~/.config/opencode/opencode.json 2>/dev/null || true
                  echo "Created ~/.config/opencode/opencode.json from the repo template."
                fi
              else
                echo "Kept existing ~/.config/opencode/opencode.json."
              fi
              if [ -f ~/.opencode/opencode.json ] && [ ! -f ~/.config/opencode/opencode.json ]; then
                cp ~/.opencode/opencode.json ~/.config/opencode/opencode.json 2>/dev/null || true
                echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
              fi
              if [ ! -L ~/.opencode/opencode.json ]; then
                rm -f ~/.opencode/opencode.json
                ln -s ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || cp ~/.config/opencode/opencode.json ~/.opencode/opencode.json 2>/dev/null || true
                echo "Refreshed compatibility ~/.opencode/opencode.json for the installed OpenCode build."
              else
                echo "Kept compatibility ~/.opencode/opencode.json link."
              fi
            fi
          component: tooling-container
    events:
      postStart:
        - init-ai-tools
    components:
      - name: tooling-container
        container:
          image: quay.io/che-incubator/cli-ai-tools@sha256:56478aeb73ff761b743432d32ffaa940758ffa862acf37fd044eb7252873c84a
          sourceMapping: /projects
          memoryLimit: 4Gi
          memoryRequest: 1Gi
          cpuLimit: "2"
          cpuRequest: 500m
          env:
            - name: DEFAULT_EXTENSIONS
              value: "/tmp/kilo.vsix"
            - name: SHELL
              value: "/usr/bin/bash"
            - name: JAVA_HOME
              value: /home/tooling/.sdkman/candidates/java/21.0.5-tem
---
