# Per-user workspace namespaces and RBAC.
#
# GitOps pre-provisions only the Stage 060 catalog seat
# (`agentic-workspace.yaml`: `agentic-coolstore` in wksp-ai-developer and
# wksp-ai-admin). Stages 070 and 080 create workspaces from RHDH factory
# templates at demo time. Standing getting-started-ai-coding,
# coolstore-inventory-service, and mca-coolstore DevWorkspaces were retired.
---
apiVersion: v1
kind: Namespace
metadata:
  name: wksp-kubeadmin
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    openshift.io/display-name: "Workspace kubeadmin"
    che.eclipse.org/username: kube:admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-kubeadmin
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "b64:a3ViZTphZG1pbg=="
---
apiVersion: v1
kind: Namespace
metadata:
  name: wksp-ai-admin
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    openshift.io/display-name: "Workspace ai-admin"
    che.eclipse.org/username: ai-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-ai-admin
  namespace: wksp-ai-admin
  annotations:
    argocd.argoproj.io/sync-wave: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ai-admin
---
apiVersion: v1
kind: Namespace
metadata:
  name: wksp-ai-developer
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    openshift.io/display-name: "Workspace ai-developer"
    che.eclipse.org/username: ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-ai-developer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ai-developer
