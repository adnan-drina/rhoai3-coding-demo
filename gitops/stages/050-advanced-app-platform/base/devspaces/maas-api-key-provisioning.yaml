    # Enforce-on-start: rewrite Managed Scope every init; refuse silent drift.
    pin = yaml.safe_load(open(cfg_path))
    m = pin.get("model") or {}
    if m.get("default") != "qwen3-6-27b" or "qwen3-6-27b" not in model_base:
        raise SystemExit(
            f"ERROR: model pin failed after Managed Scope write "
            f"(default={m.get('default')!r} model_base={model_base!r})"
        )
    with open(os.path.join(managed, ".rhoai3-model-pin"), "w") as fh:
        fh.write("default=qwen3-6-27b\nprovider=custom\nbase=platform-maas-qwen27b\nad=AD-008\n")
    print(f"Hermes Managed Scope: wrote {cfg_path} + .env (AD-008 pin qwen3-6-27b).")
    HERMESEOF

      # Architect E-20260808T151907Z / Deputy E-20260808T153444Z —
      # Model binding belongs in Managed Scope, not a human checklist.
      # Wipe every PVC-writable overlay that can silently repoint
      # default/provider/base_url after interactive Hermes setup.
      rm -f "${HOME}/.hermes/config.yaml"
      rm -f "${hermes_home}/config.yaml"
      # Platform must not own the developer-writable user config path.

      # AD-H §14 — SOUL.md authored in scaffold, placed under HERMES_HOME.
      # Hash-verify + abort (parity with auth.json): missing/empty/corrupt
      # placement must not silently fall back to a generic identity — the
      # entire judgement doctrine lives only here (AGENTS.md is convention).
      local soul_src="${PROJECT_DIR}/.hermes/SOUL.md"
      local soul_dst="${hermes_home}/SOUL.md"
      if [ ! -f "${soul_src}" ]; then
        echo "ERROR: ${soul_src} absent — identity slot required (AD-H §14)." >&2
        return
      fi
      if [ ! -s "${soul_src}" ]; then
        echo "ERROR: ${soul_src} empty — Hermes would silently fall back (AD-H §14)." >&2
        return
      fi
      # Reject whitespace-only (Hermes strip() → empty → silent fallback).
