        && grep -E '^[[:space:]]*MAAS_[A-Za-z0-9_]*=' "${hermes_home}/.env" >/dev/null; then
        echo "ERROR: MAAS_* assignment under HERMES_HOME=${hermes_home}/.env; refuse to continue." >&2
        return 1
