---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devspace-maas-key-provisioner
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devspace-maas-key-secret-manager
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devspace-maas-key-provisioner-secret-manager
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devspace-maas-key-secret-manager
subjects:
  - kind: ServiceAccount
    name: devspace-maas-key-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devspace-maas-gateway-reader
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devspace-maas-key-provisioner-gateway-reader
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devspace-maas-gateway-reader
subjects:
  - kind: ServiceAccount
    name: devspace-maas-key-provisioner
    namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devspace-maas-key-reader
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - maas-devspace-api-keys
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - devspace-ai-tools-init
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devspace-maas-key-workspace-readers
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devspace-maas-key-reader
subjects:
  - kind: Group
    name: system:serviceaccounts:wksp-ai-developer
    apiGroup: rbac.authorization.k8s.io
  # ai-admin's workspaces bootstrap from the same Secret + init ConfigMap
  # (workspace devfiles fetch both from wksp-ai-developer by fixed path),
  # so the second demo user gets the identical AI-tooling experience.
  - kind: Group
    name: system:serviceaccounts:wksp-ai-admin
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devspace-ai-tools-init
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "17"
data:
  init-ai-tools.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    PROJECT_DIR="${1:?project directory is required}"
    PROFILE="${2:-default}"

    # The project's .opencode/ directory is the paradigm signal:
    # present  -> OpenCode-only workspace (stage 070 scaffolded repos carry .opencode/skills)
    # absent   -> Kilo-only workspace (stage 060 coolstore, stage 080 migration)
    if [ -d "${PROJECT_DIR}/.opencode" ]; then AI_TOOL="opencode"; else AI_TOOL="kilo"; fi
    echo "AI tool for this workspace: ${AI_TOOL}"

    if [ "${AI_TOOL}" = "kilo" ]; then
      mkdir -p "${HOME}/.config/kilo"
    else
      mkdir -p "${HOME}/.config/opencode" "${HOME}/.opencode"
    fi

    ensure_vscode_shell_integration() {
      local shell_integration=""

      for candidate in \
        /checode/checode-linux-libc/ubi9/out/vs/workbench/contrib/terminal/common/scripts/shellIntegration-bash.sh \
        /checode/checode-linux-libc/ubi8/out/vs/workbench/contrib/terminal/common/scripts/shellIntegration-bash.sh; do
        if [ -r "${candidate}" ]; then
          shell_integration="${candidate}"
          break
        fi
      done

      if [ -z "${shell_integration}" ]; then
        echo "Che Code bash shell integration script not found; skipping ~/.bashrc update."
        return
      fi

      touch "${HOME}/.bashrc"
      if ! grep -q "rhoai3-coding-demo: vscode shell integration" "${HOME}/.bashrc"; then
        {
          printf '\n'
          printf '# rhoai3-coding-demo: vscode shell integration\n'
          printf 'if [ -z "${VSCODE_SHELL_INTEGRATION:-}" ] && [ -r "%s" ]; then\n' "${shell_integration}"
          printf '  . "%s"\n' "${shell_integration}"
          printf 'fi\n'
        } >> "${HOME}/.bashrc"
        echo "Enabled Che Code shell integration from ~/.bashrc."
      else
        echo "Che Code shell integration already configured in ~/.bashrc."
      fi
    }

    ensure_java21_default() {
      local java21_home=""

      for candidate in \
        "${HOME}/.sdkman/candidates/java/21.0.5-tem" \
        /home/tooling/.sdkman/candidates/java/21.0.5-tem \
        /usr/lib/jvm/java-21-openjdk; do
        if [ -x "${candidate}/bin/java" ]; then
          java21_home="${candidate}"
          break
        fi
      done

      if [ -z "${java21_home}" ]; then
        echo "Java 21 runtime not found; leaving Java default unchanged."
        return
      fi

      if [ -d "${HOME}/.sdkman/candidates/java" ]; then
        ln -sfn "${java21_home}" "${HOME}/.sdkman/candidates/java/current" 2>/dev/null || true
      fi

      for rc in "${HOME}/.bashrc" "${HOME}/.zshrc"; do
        touch "${rc}"
        if ! grep -q "rhoai3-coding-demo: java 21 default" "${rc}"; then
          {
            printf '\n'
            printf '# rhoai3-coding-demo: java 21 default\n'
            printf 'export JAVA_HOME="%s"\n' "${java21_home}"
            printf 'export PATH="${JAVA_HOME}/bin:${PATH}"\n'
          } >> "${rc}"
          echo "Configured Java 21 as the default shell runtime in ${rc}."
        else
          echo "Java 21 shell default already configured in ${rc}."
        fi
      done

      export JAVA_HOME="${java21_home}"
      export PATH="${JAVA_HOME}/bin:${PATH}"
    }

    fallback_from_repo() {
      echo "MaaS Secret not ready; ${AI_TOOL} not configured from Secret."

      if [ "${AI_TOOL}" = "opencode" ]; then
        if [ ! -f "${HOME}/.config/opencode/opencode.json" ]; then
          if [ -f "${HOME}/.opencode/opencode.json" ]; then
            cp "${HOME}/.opencode/opencode.json" "${HOME}/.config/opencode/opencode.json" 2>/dev/null || true
            echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
          else
            cp "${PROJECT_DIR}/.opencode/opencode.template.json" "${HOME}/.config/opencode/opencode.json" 2>/dev/null || true
            echo "Created ~/.config/opencode/opencode.json from the repo template."
          fi
        else
          echo "Kept existing ~/.config/opencode/opencode.json."
        fi
      fi
    }

    ensure_opencode_compat_path() {
      if [ -f "${HOME}/.opencode/opencode.json" ] && [ ! -f "${HOME}/.config/opencode/opencode.json" ]; then
        cp "${HOME}/.opencode/opencode.json" "${HOME}/.config/opencode/opencode.json" 2>/dev/null || true
        echo "Migrated existing ~/.opencode/opencode.json to ~/.config/opencode/opencode.json."
      fi
      if [ ! -L "${HOME}/.opencode/opencode.json" ]; then
        rm -f "${HOME}/.opencode/opencode.json"
        ln -s "${HOME}/.config/opencode/opencode.json" "${HOME}/.opencode/opencode.json" 2>/dev/null \
          || cp "${HOME}/.config/opencode/opencode.json" "${HOME}/.opencode/opencode.json" 2>/dev/null \
          || true
        echo "Refreshed compatibility ~/.opencode/opencode.json for the installed OpenCode build."
      else
        echo "Kept compatibility ~/.opencode/opencode.json link."
      fi
    }

    secret_value() {
      local key="$1"
      local value=""

      if [ -n "${KUBERNETES_SERVICE_HOST:-}" ] && [ -n "${KUBERNETES_SERVICE_PORT:-}" ]; then
        local kube_api="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
        local kube_ca="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        local kube_token_file="/var/run/secrets/kubernetes.io/serviceaccount/token"

        if [ -r "${kube_ca}" ] && [ -r "${kube_token_file}" ]; then
          value="$(
            curl -fsS --cacert "${kube_ca}" \
              -H "Authorization: Bearer $(cat "${kube_token_file}")" \
              "${kube_api}/api/v1/namespaces/wksp-ai-developer/secrets/maas-devspace-api-keys" \
              | jq -r --arg key "${key}" '.data[$key] // empty' \
              | base64 -d 2>/dev/null
          )" || true
        fi
      fi

      if [ -z "${value}" ] && command -v oc >/dev/null 2>&1; then
        value="$(
          oc get secret maas-devspace-api-keys -n wksp-ai-developer \
            -o "jsonpath={.data.${key}}" 2>/dev/null | base64 -d 2>/dev/null
        )" || true
      fi

      printf '%s' "${value}"
    }

    for _ in $(seq 1 30); do
      [ -n "$(secret_value MAAS_API_KEY_NEMOTRON)" ] && break
      sleep 2
    done

    ensure_in_cluster_kubeconfig() {
      if [ -z "${KUBERNETES_SERVICE_HOST:-}" ] || [ -z "${KUBERNETES_SERVICE_PORT:-}" ]; then
        echo "Not running in-cluster; skipping kubeconfig generation."
        return
      fi

      local sa_dir="/var/run/secrets/kubernetes.io/serviceaccount"
      if [ ! -r "${sa_dir}/token" ] || [ ! -r "${sa_dir}/ca.crt" ]; then
        echo "Service account credentials not found; skipping kubeconfig generation."
        return
      fi

      local kube_dir="${HOME}/.kube"
      mkdir -p "${kube_dir}"

      if [ -f "${kube_dir}/config" ]; then
        echo "Kept existing ~/.kube/config."
        return
      fi

      local ns
      ns="$(cat "${sa_dir}/namespace" 2>/dev/null || echo "default")"

      cat > "${kube_dir}/config" <<KUBEEOF
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: ${sa_dir}/ca.crt
        server: https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}
      name: in-cluster
    contexts:
    - context:
        cluster: in-cluster
        namespace: ${ns}
        user: devworkspace-sa
      name: in-cluster
    current-context: in-cluster
    users:
    - name: devworkspace-sa
      user:
        tokenFile: ${sa_dir}/token
    KUBEEOF
      chmod 600 "${kube_dir}/config"
      echo "Generated ~/.kube/config from in-cluster service account (namespace: ${ns})."
    }

    ensure_git_identity() {
      if [ -z "$(git config --global user.name 2>/dev/null)" ]; then
        local ws_ns="${DEVWORKSPACE_NAMESPACE:-}"
        local ws_user="${ws_ns#wksp-}"
        git config --global user.name "${ws_user:-developer}"
        git config --global user.email "${ws_user:-developer}@rhoai3-coding-demo.local"
        echo "Configured git identity: ${ws_user:-developer} (fresh volume)."
      else
        echo "Git identity already configured."
      fi
    }

    ensure_vscode_shell_integration
    ensure_java21_default
    ensure_in_cluster_kubeconfig
    ensure_git_identity

    cleanup_stale_assistants() {
      local removed=0
      for d in \
        /checode/remote/extensions/continue.continue-* \
        /checode/remote/extensions/saoudrizwan.claude-dev-* \
        "${HOME}/.continue" \
        "${HOME}/.cline" \
        "${PROJECT_DIR}/.continue"; do
        if [ -e "${d}" ]; then
          rm -rf "${d}"
          echo "Removed stale assistant artifact: ${d}"
          removed=$((removed + 1))
        fi
      done
      [ "${removed}" -eq 0 ] && echo "No stale assistant artifacts found."
    }

    write_kilo_rules() {
      cat > "${HOME}/.config/kilo/AGENTS.md" <<RULESEOF
    You are assisting inside Red Hat OpenShift Dev Spaces for a governed AI
    coding demo. When asked to create or edit files, use IDE file editing
    capabilities and write files to disk. Do not answer with file contents only
    unless file writing is unavailable; if unavailable, say so clearly.

    Use repository-relative paths with no leading slash. Do not edit files
    outside the requested project directory.

    Do not print API keys, tokens, kubeconfigs, concrete route hosts, private
    cluster hostnames, or full environment variables. Use shell variables such
    as ROUTE_HOST in commands instead of printing sensitive values.

    Format chat responses as Markdown: short paragraphs, bullet lists for
    enumerations, and fenced code blocks with a language identifier for any
    code, commands, or file content. Use headings only for long answers.

    When calling a tool, always provide every required argument with a concrete
    value; never emit a tool call with empty or missing arguments. If unsure of
    an argument value, state your assumption and pick one rather than omitting it.
    RULESEOF
      echo "Wrote Kilo Code governance rules."
    }

    write_kilo_config() {
      cat > "${HOME}/.config/kilo/kilo.json" <<KILOEOF
    {
      "model": "qwen/qwen3-6-35b-a3b",
      "disabled_providers": ["kilo", "zai"],
      "provider": {
        "nemotron": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "NVIDIA Nemotron 3 Nano (private MaaS)",
          "options": {
            "apiKey": "${MAAS_API_KEY_NEMOTRON}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/nemotron-3-nano-30b-a3b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          },
          "models": {
            "nemotron-3-nano-30b-a3b": {
              "name": "Nemotron 3 Nano 30B-A3B",
              "limit": { "context": 131072, "output": 16384 }
            }
          }
        },
        "qwen": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.6 35B (private MaaS)",
          "options": {
            "apiKey": "${MAAS_API_KEY_QWEN}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/qwen3-6-35b-a3b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          },
          "models": {
            "qwen3-6-35b-a3b": {
              "name": "Qwen3.6 35B A3B",
              "limit": { "context": 65536, "output": 16384 }
            }
          }
        }
      },
      "mcp": {
        "openshift": {
          "type": "remote",
          "url": "http://openshift-mcp.rhoai-mcp.svc:8080/mcp",
          "enabled": true
        }
      }
    }
    KILOEOF
      echo "Wrote Kilo Code config (default: qwen3-6-35b-a3b)."
    }

    cleanup_stale_assistants
    if [ "${AI_TOOL}" = "kilo" ]; then write_kilo_rules; fi

    MAAS_BASE_URL="$(secret_value MAAS_BASE_URL)"
    MAAS_API_KEY_NEMOTRON="$(secret_value MAAS_API_KEY_NEMOTRON)"
    MAAS_API_KEY_QWEN="$(secret_value MAAS_API_KEY_QWEN)"
    # Optional: external Red Hat models via their direct endpoints. The
    # RHOAI 3.4 MaaS gateway breaks response streaming for these (BACKLOG),
    # so they bypass the gateway. Keys are operator-provisioned into the
    # Secret out of band (not in git); the provider is skipped when absent.
    REDHAT_MODELS_BASE_URL="$(secret_value REDHAT_MODELS_BASE_URL)"
    REDHAT_MODELS_API_KEY="$(secret_value REDHAT_MODELS_API_KEY)"
    OPENCODE_ENABLED='["nemotron", "qwen"]'
    OPENCODE_REDHAT_PROVIDER=""
    if [ -n "${REDHAT_MODELS_BASE_URL}" ] && [ -n "${REDHAT_MODELS_API_KEY}" ]; then
      OPENCODE_ENABLED='["nemotron", "qwen", "redhat"]'
      OPENCODE_REDHAT_PROVIDER="$(cat <<REDHATEOF
    ,
        "redhat": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Red Hat Models (direct)",
          "models": {
            "minimax-m2": {
              "name": "MiniMax M2 (196K)",
              "limit": { "context": 196608, "output": 16384 }
            },
            "qwen3-235b": {
              "name": "Qwen3 235B",
              "limit": { "context": 131072, "output": 16384 }
            }
          },
          "options": {
            "apiKey": "${REDHAT_MODELS_API_KEY}",
            "baseURL": "${REDHAT_MODELS_BASE_URL%/}",
            "timeout": 1200000,
            "chunkTimeout": 120000
          }
        }
    REDHATEOF
    )"
    fi

    if [ -z "${MAAS_BASE_URL}" ] \
      || [ -z "${MAAS_API_KEY_NEMOTRON}" ] \
      || [ -z "${MAAS_API_KEY_QWEN}" ]; then
      echo "MaaS API key Secret is not ready; using repository templates."
      fallback_from_repo
      if [ "${AI_TOOL}" = "opencode" ]; then ensure_opencode_compat_path; fi
      exit 0
    fi

    umask 077
    if [ "${AI_TOOL}" = "kilo" ]; then write_kilo_config; fi

    ensure_opencode_latest() {
      # The image-bundled opencode binary is root-owned and ages with the
      # image; the official installer puts a user-writable copy in HOME
      # (persistent volume), and autoupdate keeps it current afterwards.
      if [ ! -x "${HOME}/.opencode/bin/opencode" ] && [ ! -x "${HOME}/.local/bin/opencode" ]; then
        curl -fsSL --retry 3 --max-time 300 https://opencode.ai/install | bash \
          || echo "opencode installer failed; falling back to the image-bundled binary"
      fi
      for d in "${HOME}/.opencode/bin" "${HOME}/.local/bin"; do
        if [ -x "${d}/opencode" ] && ! grep -q "rhoai3-coding-demo: opencode path" "${HOME}/.bashrc" 2>/dev/null; then
          {
            printf '\n# rhoai3-coding-demo: opencode path\n'
            printf 'export PATH="%s:${PATH}"\n' "${d}"
          } >> "${HOME}/.bashrc"
          echo "opencode on PATH from ${d}."
          break
        fi
      done
      # opencode embeds Bun, and Bun 1.3+ no longer trusts the system CA store
      # by default (oven-sh/bun#23735), so it rejects the MaaS gateway's
      # ingress certificate ("unknown certificate verification error") for
      # every model while Kilo Code / VS Code keep working via the OS trust
      # store. NODE_USE_SYSTEM_CA=1 restores Bun's system-CA trust. Guarded by
      # its OWN marker (not the opencode-path one) so it also lands on existing
      # persistent volumes that already carry the path block above. NOTE:
      # NODE_EXTRA_CA_CERTS does not work on Bun 1.3.x (oven-sh/bun#24581).
      if { [ -x "${HOME}/.opencode/bin/opencode" ] || [ -x "${HOME}/.local/bin/opencode" ]; } \
         && ! grep -q "rhoai3-coding-demo: opencode system-ca" "${HOME}/.bashrc" 2>/dev/null; then
        {
          printf '\n# rhoai3-coding-demo: opencode system-ca\n'
          printf 'export NODE_USE_SYSTEM_CA=1\n'
        } >> "${HOME}/.bashrc"
        echo "NODE_USE_SYSTEM_CA=1 set for opencode (Bun system-CA trust)."
      fi
    }

    ensure_quarkus_agent_mcp() {
      # Official Quarkus MCP for coding agents (app lifecycle, extension
      # skills, doc search). Native binary: no jbang/Java-version needs.
      # Doc search requires a container runtime and degrades gracefully in
      # workspaces. Pinned; bump deliberately.
      local ver="1.2.3"
      local bin="${HOME}/.local/bin/quarkus-agent-mcp"
      if [ ! -x "${bin}" ]; then
        mkdir -p "${HOME}/.local/bin"
        curl -fsSL --retry 3 --max-time 600 -o "${bin}"           "https://github.com/quarkusio/quarkus-agent-mcp/releases/download/${ver}/quarkus-agent-mcp-${ver}-linux-x86_64"           && chmod 755 "${bin}"           && echo "Installed quarkus-agent-mcp ${ver}."           || { rm -f "${bin}"; echo "quarkus-agent-mcp download failed; MCP entry will stay disabled at runtime."; }
      fi
    }

    ensure_hermes() {
      # Stage 080 harness orchestrator (Hermes Agent CLI). The installer is
      # self-contained (bundles Node 22 + Python 3.11 under ~/.hermes) and
      # offers no version pinning yet — same floating pattern as the
      # opencode installer above. --skip-browser keeps the install headless.
      if [ ! -x "${HOME}/.local/bin/hermes" ]; then
        curl -fsSL --retry 3 --max-time 300 -o /tmp/hermes-install.sh \
          https://hermes-agent.nousresearch.com/install.sh \
          && bash /tmp/hermes-install.sh --skip-browser >/tmp/hermes-install.log 2>&1 \
          && echo "Installed Hermes Agent CLI." \
          || { echo "Hermes installer failed (see /tmp/hermes-install.log); harness orchestrator unavailable."; return; }
      fi
      if ! grep -q "rhoai3-coding-demo: hermes path" "${HOME}/.bashrc" 2>/dev/null; then
        {
          printf '\n# rhoai3-coding-demo: hermes path\n'
          printf 'export PATH="${HOME}/.local/bin:${PATH}"\n'
        } >> "${HOME}/.bashrc"
      fi

      # Point Hermes at the same governed MaaS endpoints as OpenCode:
      # orchestrator/planner on Nemotron (131K context), coding worker on
      # Qwen (stage 070 continuity). Rewritten on every init so key
      # rotation propagates. PyYAML comes from Hermes' own venv.
      local venv_py="${HOME}/.hermes/hermes-agent/venv/bin/python"
      if [ ! -x "${venv_py}" ]; then
        echo "Hermes venv python not found; skipping Hermes MaaS config."
        return
      fi
      export MAAS_BASE_URL MAAS_API_KEY_NEMOTRON MAAS_API_KEY_QWEN
      "${venv_py}" - <<'HERMESEOF'
    import os, yaml
    path = os.path.expanduser("~/.hermes/config.yaml")
    cfg = {}
    if os.path.exists(path):
        with open(path) as fh:
            cfg = yaml.safe_load(fh) or {}
    base = os.environ["MAAS_BASE_URL"].rstrip("/")
    cfg["custom_providers"] = [
        {"name": "maas-nemotron",
         "base_url": base + "/models-as-a-service/nemotron-3-nano-30b-a3b/v1",
         "api_key": os.environ["MAAS_API_KEY_NEMOTRON"],
         "api_mode": "chat_completions"},
        {"name": "maas-qwen",
         "base_url": base + "/models-as-a-service/qwen3-6-35b-a3b/v1",
         "api_key": os.environ["MAAS_API_KEY_QWEN"],
         "api_mode": "chat_completions"},
    ]
    model = cfg.get("model") or {}
    model["default"] = "nemotron-3-nano-30b-a3b"
    model["provider"] = "custom:maas-nemotron"
    cfg["model"] = model
    with open(path, "w") as fh:
        yaml.safe_dump(cfg, fh, default_flow_style=False, sort_keys=False)
    print("Hermes config: MaaS providers written (planner nemotron, worker qwen).")
    HERMESEOF
      chmod 600 "${HOME}/.hermes/config.yaml"

      # Repo-versioned Hermes skills (e.g. the migration-harness runbook):
      # platform-seeded and versioned with the repo, not agent-invented.
      # Symlinked so a repo pull updates the skill without re-running init.
      if [ -d "${PROJECT_DIR}/.hermes/skills" ]; then
        mkdir -p "${HOME}/.hermes/skills"
        for d in "${PROJECT_DIR}"/.hermes/skills/*/; do
          [ -d "${d}" ] || continue
          ln -sfn "${d%/}" "${HOME}/.hermes/skills/$(basename "${d}")"
        done
        echo "Linked repo Hermes skills into ~/.hermes/skills."
      fi
    }

    write_kantra_helper() {
      # kantra (containerless Konveyor CLI) is the harness re-analysis
      # sensor. Its release zip is ~690MB (1.6G extracted, mostly a Maven
      # index) — too heavy for postStart and for the home PVC, so install
      # is LAZY: the harness runbook calls kantra-ensure before the sensor
      # step; /tmp caches it for the pod lifetime. Pinned; bump deliberately.
      mkdir -p "${HOME}/.local/bin"
      cat > "${HOME}/.local/bin/kantra-ensure" <<'KANTRAEOF'
    #!/usr/bin/env bash
    set -euo pipefail
    KANTRA_VERSION="v0.10.0-beta.1"
    KANTRA_HOME="${KANTRA_HOME:-/tmp/kantra}"
    if [ -x "${KANTRA_HOME}/kantra" ]; then
      echo "kantra ready: ${KANTRA_HOME}/kantra"
      exit 0
    fi
    echo "Downloading kantra ${KANTRA_VERSION} (~690MB, once per workspace pod)..."
    curl -fsSL --retry 3 --max-time 1200 -o /tmp/kantra.zip \
      "https://github.com/konveyor/kantra/releases/download/${KANTRA_VERSION}/kantra.linux.amd64.zip"
    mkdir -p "${KANTRA_HOME}"
    if command -v unzip >/dev/null 2>&1; then
      unzip -oq /tmp/kantra.zip -d "${KANTRA_HOME}"
    else
      python3 -m zipfile -e /tmp/kantra.zip "${KANTRA_HOME}"
    fi
    rm -f /tmp/kantra.zip
    chmod +x "${KANTRA_HOME}/kantra"
    echo "kantra ready: ${KANTRA_HOME}/kantra"
    KANTRAEOF
      chmod 755 "${HOME}/.local/bin/kantra-ensure"
      echo "Installed kantra-ensure helper (lazy harness sensor install)."
    }

    if [ "${AI_TOOL}" = "opencode" ]; then
      ensure_opencode_latest
      ensure_quarkus_agent_mcp
      cat > "${HOME}/.config/opencode/opencode.json" <<EOF
    {
      "\$schema": "https://opencode.ai/config.json",
      "autoupdate": true,
      "enabled_providers": ${OPENCODE_ENABLED},
      "provider": {
        "nemotron": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "MaaS Nemotron",
          "models": {
            "nemotron-3-nano-30b-a3b": {
              "name": "NVIDIA Nemotron (Local GPU)",
              "limit": { "context": 131072, "output": 16384 }
            }
          },
          "options": {
            "apiKey": "${MAAS_API_KEY_NEMOTRON}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/nemotron-3-nano-30b-a3b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          }
        },
        "qwen": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "MaaS Qwen3.6",
          "models": {
            "qwen3-6-35b-a3b": {
              "name": "Qwen3.6 35B A3B (Local GPU)",
              "temperature": true,
              "limit": { "context": 65536, "output": 16384 }
            }
          },
          "options": {
            "apiKey": "${MAAS_API_KEY_QWEN}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/qwen3-6-35b-a3b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          }
        }${OPENCODE_REDHAT_PROVIDER}
      },
      "model": "qwen/qwen3-6-35b-a3b",
      "small_model": "qwen/qwen3-6-35b-a3b",
      "mcp": {
        "openshift": {
          "type": "remote",
          "url": "http://openshift-mcp.rhoai-mcp.svc:8080/mcp",
          "enabled": true,
          "timeout": 10000
        },
        "quarkus-agent": {
          "type": "local",
          "command": ["${HOME}/.local/bin/quarkus-agent-mcp"],
          "enabled": true
        }
      },
      "permission": {
        "read": "allow",
        "grep": "allow",
        "glob": "allow",
        "edit": "ask",
        "write": "ask",
        "bash": "allow",
        "webfetch": "ask",
        "*_mcp_*": "ask"
      }
    }
    EOF

      ensure_opencode_compat_path
      rm -rf "${HOME}/.config/kilo"
      echo "Kilo config removed — this is an OpenCode workspace."
    else
      rm -rf "${HOME}/.config/opencode" "${HOME}/.opencode"
      echo "OpenCode config removed — this is a Kilo workspace."
    fi

    # Stage 080 migration workspaces (app-migration template + golden
    # scaffold pass PROFILE=modernized): the harness orchestrator (Hermes)
    # and the lazy re-analysis sensor helper (kantra-ensure) ride on top of
    # the OpenCode worker tooling above.
    if [ "${PROFILE}" = "modernized" ]; then
      ensure_hermes
      write_kantra_helper
    fi
    echo "Configured ${AI_TOOL} from the MaaS API key Secret for ${PROFILE}."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-devspace-maas-api-keys
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: devspace-maas-key-provisioner
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -ceu
            - |
              SECRET_NAME="maas-devspace-api-keys"
              SECRET_NAMESPACE="wksp-ai-developer"
              # Developer-tier subscription from the migrated MaaS governance (Stage 040).
              SUBSCRIPTION="devspaces-coding-models"
              SA_PRINCIPAL="system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner"
              MAAS_HOST="$(oc get gateway maas-default-gateway -n openshift-ingress -o jsonpath='{.spec.listeners[0].hostname}')"

              if [ -z "${MAAS_HOST}" ] || echo "${MAAS_HOST}" | grep -q "placeholder"; then
                echo "ERROR: MaaS Gateway hostname is not ready"
                exit 1
              fi

              MAAS_BASE_URL="https://${MAAS_HOST}"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              SECRET_FILE="$(mktemp)"
              trap 'rm -f "${SECRET_FILE}"' EXIT
              chmod 600 "${SECRET_FILE}"

              secret_value() {
                local key="$1"
                oc get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" \
                  -o "jsonpath={.data.${key}}" 2>/dev/null | base64 -d 2>/dev/null || true
              }

              validate_subscription() {
                local key="$1"
                local payload
                payload="$(mktemp)"
                python3 -c 'import json,sys; print(json.dumps({"key": sys.argv[1]}))' "${key}" > "${payload}"
                curl -sk -X POST \
                  -H "Content-Type: application/json" \
                  --data-binary "@${payload}" \
                  "https://maas-api.redhat-ods-applications.svc.cluster.local:8443/internal/v1/api-keys/validate" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("subscription",""))' 2>/dev/null || true
                rm -f "${payload}"
              }

              create_key() {
                local name="$1"
                local response key id expires_at
                response="$(mktemp)"
                curl -sk -X POST \
                  -H "Authorization: Bearer ${SA_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\":\"${name}\",\"subscription\":\"${SUBSCRIPTION}\"}" \
                  "${MAAS_BASE_URL}/maas-api/v1/api-keys" > "${response}"

                key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("key",""))' "${response}" 2>/dev/null || true)"
                id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "${response}" 2>/dev/null || true)"
                expires_at="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("expiresAt",""))' "${response}" 2>/dev/null || true)"
                rm -f "${response}"

                if [ -z "${key}" ] || ! echo "${key}" | grep -q '^sk-oai-'; then
                  echo "ERROR: MaaS API did not return a valid key for ${name}"
                  exit 1
                fi
                printf '%s\n%s\n%s\n' "${key}" "${id}" "${expires_at}"
              }

              write_model_key() {
                local suffix="$1"
                local model="$2"
                local name="devspace-ai-developer-${model}"
                local key id expires_at current_key current_id current_subscription

                current_key="$(secret_value "MAAS_API_KEY_${suffix}")"
                current_id="$(secret_value "MAAS_API_KEY_${suffix}_ID")"
                current_subscription=""
                if [ -n "${current_key}" ]; then
                  current_subscription="$(validate_subscription "${current_key}")"
                fi

                if [ "${current_subscription}" = "${SUBSCRIPTION}" ]; then
                  key="${current_key}"
                  id="${current_id}"
                  expires_at="$(secret_value "MAAS_API_KEY_${suffix}_EXPIRES_AT")"
                  echo "Keeping existing MaaS API key for ${model}"
                else
                  if [ -n "${current_id}" ]; then
                    delete_status=$(curl -sk --retry 3 --retry-delay 3 -o /dev/null -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer ${SA_TOKEN}" \
                      "${MAAS_BASE_URL}/maas-api/v1/api-keys/${current_id}")
                    if [ "${delete_status}" -ge 200 ] && [ "${delete_status}" -lt 300 ]; then
                      echo "Revoked old key ${current_id} for ${name}"
                    else
                      echo "WARNING: failed to revoke old key ${current_id} (${name}), HTTP ${delete_status}; it will linger until TTL"
                    fi
                  fi
                  mapfile -t created < <(create_key "${name}")
                  key="${created[0]}"
                  id="${created[1]}"
                  expires_at="${created[2]}"
                  echo "Provisioned MaaS API key for ${model}"
                fi

                # Search-by-name cleanup: revoke every key with this name except
                # the one we are keeping/just minted. Runs on EVERY invocation so
                # orphans from failed revocations are reaped on the next run, not
                # only when a re-mint happens.
                search_response="$(curl -sk --retry 3 --retry-delay 3 -X POST \
                  -H "Authorization: Bearer ${SA_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\":\"${name}\"}" \
                  "${MAAS_BASE_URL}/maas-api/v1/api-keys/search" 2>/dev/null || echo "[]")"
              orphan_ids="$(echo "${search_response}" | python3 -c 'import json,sys;data=json.load(sys.stdin).get("data",[]);[print(e["id"]) for e in data if e.get("name")==sys.argv[1] and e.get("username")==sys.argv[3] and e.get("status")=="active" and e.get("id","")!=sys.argv[2]]' "${name}" "${id}" "${SA_PRINCIPAL}" 2>/dev/null || true)"
              echo "Searched $(echo "${search_response}" | python3 -c 'import json,sys;d=json.load(sys.stdin).get("data",[]);print(len(d))' 2>/dev/null || echo '?') keys, $(echo -n "${orphan_ids}" | grep -c . || echo 0) matched ${name}"
              if [ -n "${orphan_ids}" ]; then
                  while IFS= read -r orphan_id; do
                    [ -z "${orphan_id}" ] && continue
                    ds=$(curl -sk --retry 3 --retry-delay 3 -o /dev/null -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer ${SA_TOKEN}" \
                      "${MAAS_BASE_URL}/maas-api/v1/api-keys/${orphan_id}")
                    if [ "${ds}" -ge 200 ] && [ "${ds}" -lt 300 ]; then
                      echo "Revoked orphaned key ${orphan_id} (${name})"
                    else
                      echo "WARNING: failed to revoke orphaned key ${orphan_id} (${name}), HTTP ${ds}"
                    fi
                  done <<< "${orphan_ids}"
                else
                  echo "No orphaned keys found for ${name}."
                fi

                {
                  printf 'MAAS_API_KEY_%s=%s\n' "${suffix}" "${key}"
                  printf 'MAAS_API_KEY_%s_ID=%s\n' "${suffix}" "${id}"
                  printf 'MAAS_API_KEY_%s_EXPIRES_AT=%s\n' "${suffix}" "${expires_at}"
                } >> "${SECRET_FILE}"
              }

              {
                printf 'MAAS_BASE_URL=%s\n' "${MAAS_BASE_URL}"
                printf 'MAAS_SUBSCRIPTION=%s\n' "${SUBSCRIPTION}"
              } > "${SECRET_FILE}"

              write_model_key "NEMOTRON" "nemotron-3-nano-30b-a3b"
              write_model_key "QWEN" "qwen3-6-35b-a3b"

              oc create secret generic "${SECRET_NAME}" \
                -n "${SECRET_NAMESPACE}" \
                --from-env-file="${SECRET_FILE}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "MaaS API key Secret ${SECRET_NAMESPACE}/${SECRET_NAME} is ready"
