      if ! grep -q "rhoai3-coding-demo: hermes managed scope" "${HOME}/.bashrc" 2>/dev/null; then
        {
          printf '\n# rhoai3-coding-demo: hermes managed scope (AD-H)\n'
          printf 'export HERMES_MANAGED_DIR=%q\n' "${managed_dir}"
          printf 'export HERMES_HOME=%q\n' "${hermes_home}"
          printf 'export HERMES_WRITE_SAFE_ROOT=%q\n' "${PROJECT_DIR}"
          printf 'export K2_ALLOW_ROOT=%q\n' "${PROJECT_DIR}:/projects/legacy"
          printf 'export HERMES_ACCEPT_HOOKS=1\n'
        } >> "${HOME}/.bashrc"
      else
        # Refresh paths on every init (key/profile may change).
        sed -i.bak \
          -e "s|^export HERMES_MANAGED_DIR=.*|export HERMES_MANAGED_DIR=$(printf %q "${managed_dir}")|" \
          -e "s|^export HERMES_WRITE_SAFE_ROOT=.*|export HERMES_WRITE_SAFE_ROOT=$(printf %q "${PROJECT_DIR}")|" \
          -e "s|^export K2_ALLOW_ROOT=.*|export K2_ALLOW_ROOT=$(printf %q "${PROJECT_DIR}:/projects/legacy")|" \
          "${HOME}/.bashrc" 2>/dev/null || true
        if grep -q '^export HERMES_HOME=' "${HOME}/.bashrc" 2>/dev/null; then
          sed -i.bak \
            -e "s|^export HERMES_HOME=.*|export HERMES_HOME=$(printf %q "${hermes_home}")|" \
