      # Architect 202501ZA: golden must not ship .hermes/home/scripts;
      # dest-init must not copy from that dest path. Overlay watchdog /
      # persist helper is a later named GO. Honest skip until then.
      mkdir -p "${hermes_home}/cron/output"
      echo "WARN: kanban-stuck-watchdog not installed (no dest .hermes/home/scripts; overlay watchdog awaits named GO)."
    }

    write_kantra_helper() {
      # kantra (containerless Konveyor CLI) is the harness re-analysis
      # sensor. Its release zip is ~690MB (1.6G extracted, mostly a Maven
      # index) — too heavy for postStart, so install is LAZY. O-KANTRAPATH
      # (W3-99/W3-145): default home is workspace PVC (/projects/.tools/kantra)
      # so pod restarts do not wipe the binary; /tmp remains a fallback.
      # Pinned; bump deliberately.
      mkdir -p "${HOME}/.local/bin"
      # An executable `kantra` is not a usable kantra: analysis shells out to
      # sibling binaries (java-external-provider, the jdtls launchers), and
      # `python3 -m zipfile` extraction discards Unix modes so those land 644.
      # Check the property, not a list of names — no ELF binary in the tree may
      # be non-executable — so a renamed or added provider needs no edit here.
      # The PVC tree is writable, so repair first and fail closed only if the
      # repair does not take (which is what /opt/kantra does: chown'd to a
      # different uid, so it can only be fixed in the image).
      cat > "${HOME}/.local/bin/kantra-assert-exec" <<'KANTRAEXECEOF'
    #!/usr/bin/env python3
    """Every runnable file under the kantra tree must be executable.

    Runnable means ELF or shebang. ELF alone would miss the jdtls launchers -
    kantra's archive declares jdtls/bin/jdtls (shell) and jdtls.py 0755, and
    neither is ELF, so an ELF-only check silently skips exactly the files the
    Java provider needs after a mode-losing extraction.
    """
    import os
    import sys

    root = sys.argv[1] if len(sys.argv) > 1 else "/projects/.tools/kantra"
    seen, repaired, unfixable, unwalkable = 0, [], [], []
    # os.walk swallows listdir failures by default, so an unreadable directory
    # would be skipped in silence and the check would pass without having seen
    # what is inside it. Collect those and refuse.
    for dirpath, _, filenames in os.walk(root, onerror=lambda e: unwalkable.append(
            getattr(e, "filename", None) or str(e))):
        for name in filenames:
            path = os.path.join(dirpath, name)
            if os.path.islink(path):
                continue
            try:
                with open(path, "rb") as fh:
                    head = fh.read(4)
                if head != b"\x7fELF" and head[:2] != b"#!":
                    continue
                seen += 1
                if os.access(path, os.X_OK):
                    continue
                os.chmod(path, os.stat(path).st_mode | 0o111)
            except OSError:
                unfixable.append(path)
                continue
            (repaired if os.access(path, os.X_OK) else unfixable).append(path)

    if unwalkable:
        sys.stderr.write(
            "kantra-assert-exec: %d directories under %s could not be listed (%s); "
            "the tree was not fully inspected, so a passing result would be "
            "meaningless\n" % (len(unwalkable), root, ", ".join(sorted(unwalkable)[:5])))
        sys.exit(1)
    if not seen:
        sys.stderr.write(
            "kantra-assert-exec: no runnable files (ELF or shebang) found under %s; "
            "this is not a usable kantra tree, so the exec-bit check would pass "
            "vacuously\n" % root)
        sys.exit(1)
    if unfixable:
        sys.stderr.write(
            "kantra-assert-exec: %d runnable files under %s are not executable and "
            "could not be chmod'd (%s); kantra analysis fails when it shells out "
            "to them\n" % (len(unfixable), root, ", ".join(sorted(unfixable)[:5])))
        sys.exit(1)
    if repaired:
        sys.stderr.write(
            "kantra-assert-exec: restored the exec bit on %d runnable files under "
            "%s (the extractor discarded Unix modes)\n" % (len(repaired), root))
    KANTRAEXECEOF
      chmod 755 "${HOME}/.local/bin/kantra-assert-exec"
      cat > "${HOME}/.local/bin/kantra-ensure" <<'KANTRAEOF'
    #!/usr/bin/env bash
    set -euo pipefail
    # Human status on stderr only. mta-analyze-legacy.sh ensure_cli() captures
    # stdout as the CLI path (`CLI="$(ensure_cli)"`); a progress line on stdout
    # becomes the executed command (v30 t_573591fd: "Downloading kantra…").
    KANTRA_VERSION="v0.10.0-beta.1"
    KANTRA_HOME="${KANTRA_HOME:-/projects/.tools/kantra}"
    # An executable `kantra` does not mean a usable kantra: analysis shells out
    # to sibling binaries (java-external-provider, the jdtls launchers), and
    # `python3 -m zipfile` extraction discards Unix modes, so those land 644.
    # Check the property, not a list of names - no ELF binary in the tree may
    # be non-executable - so a renamed or added provider is covered without
    # editing this helper. The tree is on the workspace PVC and writable, so
    # repair first and only fail closed if repair does not take.
    ready() {
      chmod +x "${KANTRA_HOME}/kantra" 2>/dev/null || true
      "${HOME}/.local/bin/kantra-assert-exec" "${KANTRA_HOME}" || exit 1
      echo "kantra ready: ${KANTRA_HOME}/kantra${1:-}" >&2
      exit 0
    }
    if [ -x "${KANTRA_HOME}/kantra" ]; then
      ready
    fi
    # Migrate a prior /tmp install into the durable home when present.
    if [ -x /tmp/kantra/kantra ] && [ "${KANTRA_HOME}" != "/tmp/kantra" ]; then
      mkdir -p "${KANTRA_HOME}"
      cp -a /tmp/kantra/. "${KANTRA_HOME}/" 2>/dev/null || true
      if [ -x "${KANTRA_HOME}/kantra" ]; then
        ready " (migrated from /tmp)"
      fi
    fi
    echo "Downloading kantra ${KANTRA_VERSION} (~690MB, once per workspace)..." >&2
    curl -fsSL --retry 3 --max-time 1200 -o /tmp/kantra.zip \
      "https://github.com/konveyor/kantra/releases/download/${KANTRA_VERSION}/kantra.linux.amd64.zip"
    mkdir -p "${KANTRA_HOME}"
    if command -v unzip >/dev/null 2>&1; then
      unzip -oq /tmp/kantra.zip -d "${KANTRA_HOME}"
    else
      python3 -m zipfile -e /tmp/kantra.zip "${KANTRA_HOME}"
    fi
    rm -f /tmp/kantra.zip
    ready
    KANTRAEOF
      chmod 755 "${HOME}/.local/bin/kantra-ensure"
      echo "Installed kantra-ensure helper (lazy harness sensor install)."
    }

    if [ "${AI_TOOL}" = "opencode" ]; then
      ensure_opencode_latest
      ensure_quarkus_agent_mcp
      # CS-1 (Architect E-20260812T061618Z): pin lives in official managed
      # config /etc/opencode/opencode.json (above user/project in OpenCode
      # precedence). Devfile mounts volume `opencode-managed` at that path
      # so the workspace user can write it. Precedence proven on OpenCode
      # 1.18.16 (OPENCODE_TEST_MANAGED_CONFIG_DIR sentinel model wins over
      # ~/.config). If /etc/opencode is not writable (old seats without the
      # mount), KEEP legacy AD-008 ~/.config + .platform stamp.
      OPENCODE_MANAGED_DIR="/etc/opencode"
      OPENCODE_MANAGED_CFG="${OPENCODE_MANAGED_DIR}/opencode.json"
      OPENCODE_USER_CFG="${HOME}/.config/opencode/opencode.json"
      OPENCODE_PIN_MODE="managed"
      if ! mkdir -p "${OPENCODE_MANAGED_DIR}" 2>/dev/null \
        || ! touch "${OPENCODE_MANAGED_DIR}/.rhoai3-write-test" 2>/dev/null; then
        OPENCODE_PIN_MODE="legacy"
        echo "WARN: CS-1 /etc/opencode not writable — keeping AD-008 legacy pin (add opencode-managed volume mount)."
      else
        rm -f "${OPENCODE_MANAGED_DIR}/.rhoai3-write-test" 2>/dev/null || true
      fi
      OPENCODE_CFG_TARGET="${OPENCODE_USER_CFG}"
      if [ "${OPENCODE_PIN_MODE}" = "managed" ]; then
        OPENCODE_CFG_TARGET="${OPENCODE_MANAGED_CFG}"
      fi
      mkdir -p "$(dirname "${OPENCODE_CFG_TARGET}")" "${HOME}/.config/opencode"
      cat > "${OPENCODE_CFG_TARGET}" <<EOF
    {
      "\$schema": "https://opencode.ai/config.json",
      "autoupdate": true,
      "enabled_providers": ${OPENCODE_ENABLED},
      "provider": {
        "qwen27b": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "MaaS Qwen3.6 27B",
          "models": {
            "qwen3-6-27b": {
              "name": "Qwen3.6 27B (Local GPU)",
              "limit": { "context": 131072, "output": 16384 }
            }
          },
          "options": {
            "apiKey": "${MAAS_API_KEY_QWEN27B}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/qwen3-6-27b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          }
        }${OPENCODE_REDHAT_PROVIDER}
      },
      "model": "qwen27b/qwen3-6-27b",
      "small_model": "qwen27b/qwen3-6-27b",
      "mcp": {
        "openshift": {
          "type": "remote",
          "url": "http://openshift-mcp.rhoai-mcp.svc:8080/mcp",
          "enabled": true,
          "timeout": 10000
        },
        "quarkus-agent": {
          "type": "local",
          "command": ["${HOME}/.local/bin/quarkus-agent-mcp"],
          "enabled": true
        }
      },
      "permission": {
        "read": "allow",
        "grep": "allow",
        "glob": "allow",
        "edit": "ask",
        "write": "ask",
        "bash": "allow",
        "webfetch": "ask",
        "*_mcp_*": "ask"
      }
    }
    EOF

      if [ "${OPENCODE_PIN_MODE}" = "managed" ]; then
        # Mirror into XDG for tools/UI that only look at ~/.config; managed
        # path still wins for model/provider enforcement.
        cp -f "${OPENCODE_MANAGED_CFG}" "${OPENCODE_USER_CFG}"
      fi
      ensure_opencode_compat_path
      # AD-008 / CS-1 — fail-closed if default model is not platform Qwen.
      export PROJECT_DIR OPENCODE_CFG_TARGET OPENCODE_PIN_MODE OPENCODE_MANAGED_CFG
      cat <<'PINOC' | sed -e 's/^      //' | python3 -
          import json, os, sys
          mode = os.environ.get("OPENCODE_PIN_MODE", "legacy")
          cfg = os.environ.get("OPENCODE_CFG_TARGET") or os.path.expanduser("~/.config/opencode/opencode.json")
          try:
              d = json.load(open(cfg))
          except Exception as e:
              print(f"ERROR: AD-008/CS-1 OpenCode pin: cannot read {cfg}: {e}", file=sys.stderr)
              sys.exit(1)
          model = str(d.get("model") or "")
          enabled = d.get("enabled_providers") or []
          if model != "qwen27b/qwen3-6-27b":
              print(f"ERROR: AD-008/CS-1 OpenCode pin failed (model={model!r})", file=sys.stderr)
              sys.exit(1)
          if "qwen27b" not in enabled:
              print(f"ERROR: AD-008/CS-1 OpenCode pin failed (enabled_providers={enabled!r})", file=sys.stderr)
              sys.exit(1)
          stamp_dir = os.environ["PROJECT_DIR"]
          legacy_stamp = os.path.join(stamp_dir, ".platform", "opencode", ".rhoai3-model-pin")
          if mode == "managed":
              # Retire .platform/opencode/ on new base (CS-1).
              import shutil
              legacy_root = os.path.join(stamp_dir, ".platform", "opencode")
              if os.path.isdir(legacy_root):
                  shutil.rmtree(legacy_root)
              managed = os.environ.get("OPENCODE_MANAGED_CFG", "/etc/opencode/opencode.json")
              print(f"CS-1 OpenCode managed pin OK: {managed} (minimax={'on' if 'redhat' in enabled else 'off'})")
          else:
              os.makedirs(os.path.dirname(legacy_stamp), exist_ok=True)
              with open(legacy_stamp, "w") as fh:
                  fh.write("model=qwen27b/qwen3-6-27b\n")
                  fh.write(f"enabled_providers={json.dumps(enabled)}\n")
                  fh.write("ad=AD-008\n")
                  fh.write("cs1=legacy-fallback-no-etc-mount\n")
                  if "redhat" in enabled:
                      fh.write("minimax=escalation-override\n")
                  else:
                      fh.write("minimax=disabled\n")
              print(f"AD-008 OpenCode legacy pin OK: {legacy_stamp} (minimax={'on' if 'redhat' in enabled else 'off'})")
    PINOC
      rm -rf "${HOME}/.config/kilo"
      echo "Kilo config removed — this is an OpenCode workspace."
    else
      rm -rf "${HOME}/.config/opencode" "${HOME}/.opencode"
      echo "OpenCode config removed — this is a Kilo workspace."
    fi

    # Stage 080 migration workspaces (app-migration template + golden
    # scaffold pass PROFILE=modernized): the harness orchestrator (Hermes)
    # and the lazy re-analysis sensor helper (kantra-ensure) ride on top of
    # the OpenCode worker tooling above.
    if [ "${PROFILE}" = "modernized" ]; then
      # Review 152650ZR: ensure_hermes ERROR paths must fail-close this
      # postStart; a status-0 return still started the gateway.
      if ! ensure_hermes; then
        echo "ERROR: ensure_hermes failed; dest-init fail-closed before gateway." >&2
        exit 1
      fi
      write_kantra_helper
      # Architect 145309ZA / 151813ZA: same postStart, after tools+auth.
      # Do not restore supervise-gateway.sh. Not a skippable extra command.
      export HERMES_ACCEPT_HOOKS=1
      export HERMES_HOME="${PROJECT_DIR}/.hermes/home"
      if [ ! -x /usr/local/bin/hermes ]; then
        echo "ERROR: overlay hermes missing after ensure_hermes; cannot start gateway." >&2
        exit 1
      fi
      mkdir -p "${HERMES_HOME}"
      gw_log="${HERMES_HOME}/gateway-run.log"
      nohup /usr/local/bin/hermes gateway run --external-supervisor >> "${gw_log}" 2>&1 &
      gw_pid=$!
      sleep 1
      if ! kill -0 "${gw_pid}" 2>/dev/null; then
        echo "ERROR: hermes gateway run --external-supervisor exited (see ${gw_log})." >&2
        exit 1
      fi
      echo "Started hermes gateway run --external-supervisor pid=${gw_pid}"
      # W1: hermes --version is the proxy class. Mandated invocation is
      # kanban ls (show/create need a task id / would mint). Do not dest-create
      # a card from dest-init.
      if ! /usr/local/bin/hermes kanban ls >/dev/null; then
        echo "ERROR: dest-init hermes kanban ls failed (capability, not --version)." >&2
        exit 1
      fi
      echo "dest-init hermes kanban ls: MATCH"
    fi
    echo "Configured ${AI_TOOL} from the MaaS API key Secret for ${PROFILE}."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-devspace-maas-api-keys
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: devspace-maas-key-provisioner
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -ceu
            - |
              SECRET_NAME="maas-devspace-api-keys"
              SECRET_NAMESPACE="wksp-ai-developer"
              # Developer-tier subscription from the migrated MaaS governance (Stage 040).
              SUBSCRIPTION="devspaces-coding-models"
              SA_PRINCIPAL="system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner"
              MAAS_HOST="$(oc get gateway maas-default-gateway -n openshift-ingress -o jsonpath='{.spec.listeners[0].hostname}')"

              if [ -z "${MAAS_HOST}" ] || echo "${MAAS_HOST}" | grep -q "placeholder"; then
                echo "ERROR: MaaS Gateway hostname is not ready"
                exit 1
              fi

              MAAS_BASE_URL="https://${MAAS_HOST}"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              SECRET_FILE="$(mktemp)"
              trap 'rm -f "${SECRET_FILE}"' EXIT
              chmod 600 "${SECRET_FILE}"

              secret_value() {
                local key="$1"
                oc get secret "${SECRET_NAME}" -n "${SECRET_NAMESPACE}" \
                  -o "jsonpath={.data.${key}}" 2>/dev/null | base64 -d 2>/dev/null || true
              }

              validate_subscription() {
                local key="$1"
                local payload
                payload="$(mktemp)"
                python3 -c 'import json,sys; print(json.dumps({"key": sys.argv[1]}))' "${key}" > "${payload}"
                curl -sk -X POST \
                  -H "Content-Type: application/json" \
                  --data-binary "@${payload}" \
                  "https://maas-api.redhat-ods-applications.svc.cluster.local:8443/internal/v1/api-keys/validate" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("subscription",""))' 2>/dev/null || true
                rm -f "${payload}"
              }

              create_key() {
                local name="$1"
                local response key id expires_at
                response="$(mktemp)"
                curl -sk -X POST \
                  -H "Authorization: Bearer ${SA_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\":\"${name}\",\"subscription\":\"${SUBSCRIPTION}\"}" \
                  "${MAAS_BASE_URL}/maas-api/v1/api-keys" > "${response}"

                key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("key",""))' "${response}" 2>/dev/null || true)"
                id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "${response}" 2>/dev/null || true)"
                expires_at="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("expiresAt",""))' "${response}" 2>/dev/null || true)"
                rm -f "${response}"

                if [ -z "${key}" ] || ! echo "${key}" | grep -q '^sk-oai-'; then
                  echo "ERROR: MaaS API did not return a valid key for ${name}"
                  exit 1
                fi
                printf '%s\n%s\n%s\n' "${key}" "${id}" "${expires_at}"
              }

              write_model_key() {
                local suffix="$1"
                local model="$2"
                local name="devspace-ai-developer-${model}"
                local key id expires_at current_key current_id current_subscription

                current_key="$(secret_value "MAAS_API_KEY_${suffix}")"
                current_id="$(secret_value "MAAS_API_KEY_${suffix}_ID")"
                current_subscription=""
                if [ -n "${current_key}" ]; then
                  current_subscription="$(validate_subscription "${current_key}")"
                fi

                if [ "${current_subscription}" = "${SUBSCRIPTION}" ]; then
                  key="${current_key}"
                  id="${current_id}"
                  expires_at="$(secret_value "MAAS_API_KEY_${suffix}_EXPIRES_AT")"
                  echo "Keeping existing MaaS API key for ${model}"
                else
                  if [ -n "${current_id}" ]; then
                    delete_status=$(curl -sk --retry 3 --retry-delay 3 -o /dev/null -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer ${SA_TOKEN}" \
                      "${MAAS_BASE_URL}/maas-api/v1/api-keys/${current_id}")
                    if [ "${delete_status}" -ge 200 ] && [ "${delete_status}" -lt 300 ]; then
                      echo "Revoked old key ${current_id} for ${name}"
                    else
                      echo "WARNING: failed to revoke old key ${current_id} (${name}), HTTP ${delete_status}; it will linger until TTL"
                    fi
                  fi
                  mapfile -t created < <(create_key "${name}")
                  key="${created[0]}"
                  id="${created[1]}"
                  expires_at="${created[2]}"
                  echo "Provisioned MaaS API key for ${model}"
                fi

                # Search-by-name cleanup: revoke every key with this name except
                # the one we are keeping/just minted. Runs on EVERY invocation so
                # orphans from failed revocations are reaped on the next run, not
                # only when a re-mint happens.
                search_response="$(curl -sk --retry 3 --retry-delay 3 -X POST \
                  -H "Authorization: Bearer ${SA_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "{\"name\":\"${name}\"}" \
                  "${MAAS_BASE_URL}/maas-api/v1/api-keys/search" 2>/dev/null || echo "[]")"
              orphan_ids="$(echo "${search_response}" | python3 -c 'import json,sys;data=json.load(sys.stdin).get("data",[]);[print(e["id"]) for e in data if e.get("name")==sys.argv[1] and e.get("username")==sys.argv[3] and e.get("status")=="active" and e.get("id","")!=sys.argv[2]]' "${name}" "${id}" "${SA_PRINCIPAL}" 2>/dev/null || true)"
              echo "Searched $(echo "${search_response}" | python3 -c 'import json,sys;d=json.load(sys.stdin).get("data",[]);print(len(d))' 2>/dev/null || echo '?') keys, $(echo -n "${orphan_ids}" | grep -c . || echo 0) matched ${name}"
              if [ -n "${orphan_ids}" ]; then
                  while IFS= read -r orphan_id; do
                    [ -z "${orphan_id}" ] && continue
                    ds=$(curl -sk --retry 3 --retry-delay 3 -o /dev/null -w '%{http_code}' -X DELETE \
                      -H "Authorization: Bearer ${SA_TOKEN}" \
                      "${MAAS_BASE_URL}/maas-api/v1/api-keys/${orphan_id}")
                    if [ "${ds}" -ge 200 ] && [ "${ds}" -lt 300 ]; then
                      echo "Revoked orphaned key ${orphan_id} (${name})"
                    else
                      echo "WARNING: failed to revoke orphaned key ${orphan_id} (${name}), HTTP ${ds}"
                    fi
                  done <<< "${orphan_ids}"
                else
                  echo "No orphaned keys found for ${name}."
                fi

                {
                  printf 'MAAS_API_KEY_%s=%s\n' "${suffix}" "${key}"
                  printf 'MAAS_API_KEY_%s_ID=%s\n' "${suffix}" "${id}"
                  printf 'MAAS_API_KEY_%s_EXPIRES_AT=%s\n' "${suffix}" "${expires_at}"
                } >> "${SECRET_FILE}"
              }

              {
                printf 'MAAS_BASE_URL=%s\n' "${MAAS_BASE_URL}"
                printf 'MAAS_SUBSCRIPTION=%s\n' "${SUBSCRIPTION}"
              } > "${SECRET_FILE}"

              write_model_key "QWEN27B" "qwen3-6-27b"

              oc create secret generic "${SECRET_NAME}" \
                -n "${SECRET_NAMESPACE}" \
                --from-env-file="${SECRET_FILE}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "MaaS API key Secret ${SECRET_NAMESPACE}/${SECRET_NAME} is ready"

              # Derived env-mount Secret for Hermes ${env:MAAS_API_*} names.
              # URL from ConfigMap workspace-maas-model-endpoint (in-cluster
              # KServe), never MAAS_BASE_URL (external LB). Server-side apply
              # avoids last-applied-configuration embedding the key.
              # Do not bounce Running DevWorkspace pods (dest-3 stays).
              KSERVE_OPENAI_BASE="$(oc get configmap workspace-maas-model-endpoint -n "${SECRET_NAMESPACE}" -o jsonpath='{.data.MAAS_API_BASE_URL}' 2>/dev/null || true)"
              if [ -z "${KSERVE_OPENAI_BASE}" ]; then
                KSERVE_OPENAI_BASE="https://qwen3-6-27b-kserve-workload-svc.models-as-a-service.svc:8000/v1"
              fi
              python3 - "${SECRET_FILE}" "${KSERVE_OPENAI_BASE}" "${SECRET_NAMESPACE}" <<'DERIVEEOF' | oc apply --server-side --force-conflicts --field-manager=devspace-maas-key-provisioner -f -
              import json
              import sys
              path, url, ns = sys.argv[1], sys.argv[2], sys.argv[3]
              key = ""
              with open(path, encoding="utf-8") as fh:
                  for line in fh:
                      if line.startswith("MAAS_API_KEY_QWEN27B="):
                          key = line.split("=", 1)[1].rstrip("\n")
                          break
              if not key:
                  raise SystemExit("ERROR: MAAS_API_KEY_QWEN27B missing; cannot derive workspace-maas-credentials")
              json.dump({"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "workspace-maas-credentials", "namespace": ns, "labels": {"controller.devfile.io/mount-to-devworkspace": "true", "controller.devfile.io/watch-secret": "true", "app.kubernetes.io/part-of": "maas", "app.kubernetes.io/name": "workspace-maas-credentials", "app.kubernetes.io/component": "credentials", "demo.rhoai.io/stage": "050"}, "annotations": {"controller.devfile.io/mount-as": "env"}}, "type": "Opaque", "stringData": {"MAAS_API_KEY": key, "MAAS_API_BASE_URL": url}}, sys.stdout)
              DERIVEEOF
              echo "workspace-maas-credentials derived (in-cluster KServe base; not MAAS_BASE_URL)"
