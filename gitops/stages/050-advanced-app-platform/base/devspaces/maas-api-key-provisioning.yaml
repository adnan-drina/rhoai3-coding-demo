          -e "s|^export HERMES_WRITE_SAFE_ROOT=.*|export HERMES_WRITE_SAFE_ROOT=$(printf %q "${PROJECT_DIR}")|" \
          "${HOME}/.bashrc" 2>/dev/null || true
        if grep -q '^export HERMES_HOME=' "${HOME}/.bashrc" 2>/dev/null; then
          sed -i.bak \
            -e "s|^export HERMES_HOME=.*|export HERMES_HOME=$(printf %q "${hermes_home}")|" \
            "${HOME}/.bashrc" 2>/dev/null || true
        else
          printf 'export HERMES_HOME=%q\n' "${hermes_home}" >> "${HOME}/.bashrc"
        fi
        rm -f "${HOME}/.bashrc.bak"
      fi
      if [ -e "${HOME}/.hermes/config.yaml" ] || [ -e "${hermes_home}/config.yaml" ]; then
        echo "ERROR: PVC Hermes config overlay still present after pin wipe — refuse drift path." >&2
        return
      fi
      echo "Hermes AD-H: managed_mode=${managed_mode} dir=${managed_dir}; HERMES_HOME=${hermes_home}; WRITE_SAFE_ROOT=${PROJECT_DIR}; external_dirs=${hermes_skills_dir}; model pin=qwen3-6-27b; PVC overlays absent."

      # Demo surface (Architect E-20260808T154612Z exposure A): pre-warm
      # Hermes dashboard UI so the first `hermes dashboard` does not
      # npm-install/build live in front of an audience. Hermes serves
      # packaged UI from hermes_cli/web_dist (vite outDir) — NOT web/dist.
      # --skip-build looks there. Build needs workspace/devDeps (tsc -b
      # pulls vitest types); --omit=dev fails the pre-warm. Viewer path is
      # loopback 127.0.0.1:9119 via Che/VS Code port-forward — not a public
      # Dev Spaces route (Host-header rejects public bind).
      local hermes_agent="${HOME}/.hermes/hermes-agent"
      local hermes_web="${hermes_agent}/web"
      local hermes_dist="${hermes_agent}/hermes_cli/web_dist/index.html"
      if [ -f "${hermes_web}/package.json" ] && [ ! -f "${hermes_dist}" ]; then
        if command -v npm >/dev/null 2>&1 || [ -x "${HOME}/.local/bin/npm" ]; then
          echo "Hermes dashboard: building web UI (pre-warm)…"
          (
            cd "${hermes_agent}"
            # Full install: monorepo web build needs devDeps (vitest types for tsc -b).
            npm ci >/tmp/hermes-web-npm.log 2>&1 \
              || npm install >/tmp/hermes-web-npm.log 2>&1
            (cd "${hermes_web}" && npm run build >>/tmp/hermes-web-npm.log 2>&1)
          ) && [ -f "${hermes_dist}" ] \
            && echo "Hermes dashboard: web dist ready at hermes_cli/web_dist (use: hermes dashboard --skip-build --host 127.0.0.1 --port 9119 --no-open; IDE port-forward)." \
            || echo "WARN: Hermes dashboard web build failed — see /tmp/hermes-web-npm.log (demo first-run download risk remains)."
        else
          echo "WARN: npm absent — cannot pre-warm Hermes dashboard UI."
        fi
      elif [ -f "${hermes_dist}" ]; then
        echo "Hermes dashboard: web dist already present at hermes_cli/web_dist (skip build)."
      fi

      # AD-H §13 / §15.2 — the ONLY cron job: observation watchdog for what
      # survives native max_runtime_seconds recovery (--deliver local).
      # A second job requires an Architect decision.
      mkdir -p "${hermes_home}/scripts" "${hermes_home}/cron/output"
      local watchdog_src="${PROJECT_DIR}/.hermes/home/scripts/kanban-stuck-watchdog.py"
      local watchdog_dst="${hermes_home}/scripts/kanban-stuck-watchdog.py"
      if [ -f "${watchdog_src}" ]; then
        # Ensure the cron sandbox path has the script (scaffolds commit it here).
        if [ "${watchdog_src}" != "${watchdog_dst}" ]; then
          cp -f "${watchdog_src}" "${watchdog_dst}"
        fi
        chmod 755 "${watchdog_dst}" 2>/dev/null || true
        if command -v hermes >/dev/null 2>&1 || [ -x "${HOME}/.local/bin/hermes" ]; then
          local hermes_bin
          hermes_bin="$(command -v hermes 2>/dev/null || echo "${HOME}/.local/bin/hermes")"
          # Idempotent: remove prior job by name if list/remove available, then create.
          if "${hermes_bin}" cron list 2>/dev/null | grep -q 'kanban-stuck-watchdog'; then
            job_id="$("${hermes_bin}" cron list 2>/dev/null | awk '/kanban-stuck-watchdog/{print $1; exit}')"
            if [ -n "${job_id:-}" ]; then
              "${hermes_bin}" cron remove "${job_id}" >/dev/null 2>&1 || true
            fi
          fi
          if "${hermes_bin}" cron create "every 15m" \
            --no-agent \
            --script kanban-stuck-watchdog.py \
            --deliver local \
            --name "kanban-stuck-watchdog" >/tmp/hermes-cron-watchdog.log 2>&1; then
            echo "Hermes AD-H §13: registered kanban-stuck-watchdog (every 15m, deliver=local)."
          else
            echo "WARN: hermes cron create failed for kanban-stuck-watchdog (see /tmp/hermes-cron-watchdog.log); script is in place for manual register."
          fi
        else
          echo "WARN: hermes CLI absent; kanban-stuck-watchdog.py installed under ${hermes_home}/scripts (register with hermes cron create)."
        fi
      else
        echo "WARN: ${watchdog_src} missing — AD-H §13 watchdog not installed."
      fi
    }

    write_kantra_helper() {
      # kantra (containerless Konveyor CLI) is the harness re-analysis
      # sensor. Its release zip is ~690MB (1.6G extracted, mostly a Maven
      # index) — too heavy for postStart, so install is LAZY. O-KANTRAPATH
      # (W3-99/W3-145): default home is workspace PVC (/projects/.tools/kantra)
      # so pod restarts do not wipe the binary; /tmp remains a fallback.
      # Pinned; bump deliberately.
      mkdir -p "${HOME}/.local/bin"
      cat > "${HOME}/.local/bin/kantra-ensure" <<'KANTRAEOF'
    #!/usr/bin/env bash
    set -euo pipefail
    KANTRA_VERSION="v0.10.0-beta.1"
    KANTRA_HOME="${KANTRA_HOME:-/projects/.tools/kantra}"
    if [ -x "${KANTRA_HOME}/kantra" ]; then
      echo "kantra ready: ${KANTRA_HOME}/kantra"
      exit 0
    fi
    # Migrate a prior /tmp install into the durable home when present.
    if [ -x /tmp/kantra/kantra ] && [ "${KANTRA_HOME}" != "/tmp/kantra" ]; then
      mkdir -p "${KANTRA_HOME}"
      cp -a /tmp/kantra/. "${KANTRA_HOME}/" 2>/dev/null || true
      if [ -x "${KANTRA_HOME}/kantra" ]; then
        echo "kantra ready: ${KANTRA_HOME}/kantra (migrated from /tmp)"
        exit 0
      fi
    fi
    echo "Downloading kantra ${KANTRA_VERSION} (~690MB, once per workspace)..."
    curl -fsSL --retry 3 --max-time 1200 -o /tmp/kantra.zip \
      "https://github.com/konveyor/kantra/releases/download/${KANTRA_VERSION}/kantra.linux.amd64.zip"
    mkdir -p "${KANTRA_HOME}"
    if command -v unzip >/dev/null 2>&1; then
      unzip -oq /tmp/kantra.zip -d "${KANTRA_HOME}"
    else
      python3 -m zipfile -e /tmp/kantra.zip "${KANTRA_HOME}"
    fi
    rm -f /tmp/kantra.zip
    chmod +x "${KANTRA_HOME}/kantra"
    echo "kantra ready: ${KANTRA_HOME}/kantra"
    KANTRAEOF
      chmod 755 "${HOME}/.local/bin/kantra-ensure"
      echo "Installed kantra-ensure helper (lazy harness sensor install)."
    }

    if [ "${AI_TOOL}" = "opencode" ]; then
      ensure_opencode_latest
      ensure_quarkus_agent_mcp
      cat > "${HOME}/.config/opencode/opencode.json" <<EOF
    {
      "\$schema": "https://opencode.ai/config.json",
      "autoupdate": true,
      "enabled_providers": ${OPENCODE_ENABLED},
      "provider": {
        "qwen27b": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "MaaS Qwen3.6 27B",
          "models": {
            "qwen3-6-27b": {
              "name": "Qwen3.6 27B (Local GPU)",
              "limit": { "context": 131072, "output": 16384 }
            }
          },
          "options": {
            "apiKey": "${MAAS_API_KEY_QWEN27B}",
            "baseURL": "${MAAS_BASE_URL}/models-as-a-service/qwen3-6-27b/v1",
            "timeout": 1200000,
            "chunkTimeout": 120000
          }
        }${OPENCODE_REDHAT_PROVIDER}
      },
      "model": "qwen27b/qwen3-6-27b",
      "small_model": "qwen27b/qwen3-6-27b",
      "mcp": {
