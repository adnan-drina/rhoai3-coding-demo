        else
          printf 'export HERMES_HOME=%q\n' "${hermes_home}" >> "${HOME}/.bashrc"
        fi
        if ! grep -q '^export K2_ALLOW_ROOT=' "${HOME}/.bashrc" 2>/dev/null; then
          printf 'export K2_ALLOW_ROOT=%q\n' "${PROJECT_DIR}:/projects/legacy" >> "${HOME}/.bashrc"
        fi
        if ! grep -q '^export HERMES_ACCEPT_HOOKS=' "${HOME}/.bashrc" 2>/dev/null; then
