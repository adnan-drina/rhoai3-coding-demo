        fi
      done

      export MAAS_BASE_URL MAAS_API_KEY_QWEN27B
      export HERMES_MANAGED_DIR="${managed_dir}"
      export HERMES_HOME="${hermes_home}"
      export HERMES_WRITE_SAFE_ROOT="${PROJECT_DIR}"
      export HERMES_SKILLS_DIR="${hermes_skills_dir}"
      # Spec-kit Hermes integration hardcodes Path.home()/.hermes/skills
      # (ignores $HERMES_HOME — Research E-20260807T174318Z / upstream
      # spec-kit#3334 closed unmerged). Keep that path on external_dirs so
      # /speckit.* skills remain visible after HERMES_HOME relocation.
      export HERMES_GLOBAL_SKILLS_DIR="${HOME}/.hermes/skills"
      mkdir -p "${HERMES_GLOBAL_SKILLS_DIR}"
      # AD-002 §6: harness launches from PROJECT_DIR (/projects/modernized) —
      # CLI default cwd is correct; do not set terminal.cwd.
      # Dashboard exposure = Architect E-20260808T154612Z option A (loopback
      # + IDE port-forward) — no public-bind auth provider in Managed Scope.
      "${venv_py}" - <<'HERMESEOF'
    import os, yaml
    managed = os.environ["HERMES_MANAGED_DIR"]
    skills_dir = os.environ["HERMES_SKILLS_DIR"]
    global_skills = os.environ["HERMES_GLOBAL_SKILLS_DIR"]
    base = os.environ["MAAS_BASE_URL"].rstrip("/")
    model_base = base + "/models-as-a-service/qwen3-6-27b/v1"
    cfg = {
        "model": {
            "provider": "custom",
            "default": "qwen3-6-27b",
            "base_url": "${MAAS_API_BASE_URL}",
            "api_key": "${MAAS_API_KEY}",
            # Total context ceiling (vLLM --max-model-len). Hermes unset
            # max_tokens defaults to half (=65536), which makes any prompt
            # ≥65537 arithmetically unservable (Deputy E-20260809T180800Z).
            "context_length": 131072,
            "max_tokens": 8192,
        },
        "tool_loop_guardrails": {
            "hard_stop_enabled": True,
        },
        # AD-H §2.2 / §4 — typed Kanban metadata is the handoff channel.
        "memory": {
            "memory_enabled": False,
        },
        # AD-H §1 / §7.3 — gated skill writes (post-run batch approve);
        # no inline shell; scaffold + global (spec-kit) via external_dirs.
        "skills": {
            "write_approval": True,
            "inline_shell": False,
            "external_dirs": [skills_dir, global_skills],
        },
        # AD-H §7 / E-20260808T110515Z — pin documented default in Managed
        # Scope so mid-flight mode=off cannot silently reappear on reprovision
        # (user ~/.hermes/config.yaml is removed below).
        "approvals": {
            "mode": "smart",
            "timeout": 300,
            "cron_mode": "deny",
        },
        # W2 §4.5 / E-20260807T154519Z — engine must not invent untyped
        # subtasks outside our per-phase schema (AD-H §3).
        "kanban": {
            "auto_decompose": False,
        },
        # AD-009 §3.2 / E-20260809T164127Z — Qwen thinking can exceed the
        # default proxy idle / Hermes stale window (~minutes) before the
        # first content token. Class A amplifier; not MiniMax.
        # max_tokens:8192 — Class A output cap so prompt+completion fit
        # context_length (server VLLMValidationError at 65536 out + ≥65537 in).
        "providers": {
            "custom": {
                "models": {
                    "qwen3-6-27b": {
                        "stale_timeout_seconds": 900,
                        "max_tokens": 8192,
                    },
                },
            },
        },
    }
    cfg_path = os.path.join(managed, "config.yaml")
    with open(cfg_path, "w") as fh:
        yaml.safe_dump(cfg, fh, default_flow_style=False, sort_keys=False)
    env_path = os.path.join(managed, ".env")
    with open(env_path, "w") as fh:
        fh.write(f"MAAS_API_BASE_URL={model_base}\n")
        fh.write(f"MAAS_API_KEY={os.environ['MAAS_API_KEY_QWEN27B']}\n")
    os.chmod(cfg_path, 0o644)
    os.chmod(env_path, 0o600)
