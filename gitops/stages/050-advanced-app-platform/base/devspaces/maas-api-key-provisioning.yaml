      local hermes_home="${PROJECT_DIR}/.hermes/home"
      local hermes_skills_dir="${PROJECT_DIR}/.hermes/skills"
      mkdir -p "${hermes_home}"

      # auth.json = Portal onboarding path; incompatible with Managed Scope.
      # Lead:pin-model-binding-managed-scope — wipe residue so Managed Scope
      # can enforce; hard-refuse left workspaces stuck on Portal leftover.
      for _auth in "${hermes_home}/auth.json" "${HOME}/.hermes/auth.json"; do
        if [ -e "${_auth}" ]; then
