  annotations:
    rhoai3.redhat.com/model-id: nemotron-3-nano-30b-a3b
    rhoai3.redhat.com/model-path: private-maas
    rhoai3.redhat.com/data-classification: source-code-context
  links:
    - url: https://docs.redhat.com/en/learn/ai-quickstarts/rh-maas-code-assistant
      title: Getting Started
      icon: docs
  tags:
    - maas
    - private-model
    - source-code
spec:
  type: ai-model
  owner: ai-modernization-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
