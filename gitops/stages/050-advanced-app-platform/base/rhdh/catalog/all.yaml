# Catalog scope (2026-07-13 decision): coolstore-inventory-service is the
# one and only Component — the getting-started-ai-coding onboarding entry
# and the MCA Coolstore brownfield entry were removed; stage 080's entry
# point is the app-migration golden-path template (registered below).
# The MaaS model Resources stay as unattached AI assets.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coolstore-inventory-service
  title: Coolstore Inventory Service
  description: |
    Quarkus inventory service used for AI-assisted engineering and golden-path
    delivery work connected to the Coolstore domain.
  annotations:
    backstage.io/source-location: url:https://github.com/adnan-drina/coolstore-inventory-service
    backstage.io/techdocs-ref: url:https://github.com/adnan-drina/rhoai3-coding-demo/tree/__RHOAI3_DEMO_REVISION__
    github.com/project-slug: adnan-drina/coolstore-inventory-service
    backstage.io/kubernetes-id: coolstore-inventory-service
    janus-idp.io/tekton: coolstore-inventory-service
    argocd/app-name: 050-advanced-app-platform
    rhoai3.redhat.com/current-repository: adnan-drina/coolstore-inventory-service
    rhoai3.redhat.com/repository: adnan-drina/coolstore-inventory-service
    rhoai3.redhat.com/stage-050-role: target-service
  links:
    - url: https://github.com/adnan-drina/coolstore-inventory-service
      title: Source Repo
      icon: github
    - url: "https://coolstore-inventory-route.placeholder.example.com/api/inventory"
      title: Deployed App (dev)
      icon: web
    - url: "https://devspaces-inventory.placeholder.example.com/dashboard/#/ide/wksp-ai-developer/agentic-coolstore"
      title: Dev Spaces
      icon: catalog
    - url: "https://sonarqube.placeholder.example.com/dashboard?id=coolstore-inventory-service"
      title: SonarQube (code quality)
      icon: dashboard
  tags:
    - java
    - quarkus
    - inventory
    - coolstore
    - agentic-engineering
spec:
  type: service
  lifecycle: experimental
  owner: ai-modernization-team
  system: coolstore
  providesApis:
    - inventory-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inventory-api
  title: Coolstore Inventory API
  description: REST API exposing inventory levels for Coolstore catalog items.
  tags:
    - rest
    - quarkus
    - inventory
spec:
  type: openapi
  lifecycle: experimental
  owner: ai-modernization-team
  system: coolstore
  definition: |
    openapi: "3.0.0"
    info:
      title: Coolstore Inventory API
      version: "1.0"
      description: |
        REST API for inventory levels of Coolstore catalog items, provided by
        the Quarkus inventory service and consumed by the Coolstore storefront.
    paths:
      /api/inventory:
        get:
          summary: List inventory for all items
          responses:
            '200':
              description: A JSON array of inventory records
      /api/inventory/{itemId}:
        get:
          summary: Get inventory for an item
          parameters:
            - name: itemId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Inventory record with itemId and quantity
            '404':
              description: Item not found
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: maas-private-code-model-qwen27b
  title: Qwen3.6 27B Orchestrator Model
  description: |
    Private MaaS model path selected for source-code work in the governed
    developer workflow (default model for Kilo Code assisted development).
  annotations:
    rhoai3.redhat.com/model-id: qwen3-6-27b
    rhoai3.redhat.com/model-path: private-maas
    rhoai3.redhat.com/data-classification: source-code-context
  links:
    - url: https://docs.redhat.com/en/learn/ai-quickstarts/rh-maas-code-assistant
      title: Getting Started
      icon: docs
  tags:
    - maas
    - private-model
    - source-code
spec:
  type: ai-model
  owner: ai-modernization-team
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: maas-private-code-model-qwen
  title: Qwen3.6 Private Code Model
  description: |
    Private MaaS model path used alongside Qwen3.6 27B for source-code work,
    enabling side-by-side model comparison in the governed developer workflow
    (default model for OpenCode agentic development).
  annotations:
    rhoai3.redhat.com/model-id: qwen3-6-35b-a3b
    rhoai3.redhat.com/model-path: private-maas
    rhoai3.redhat.com/data-classification: source-code-context
  links:
    - url: https://docs.redhat.com/en/learn/ai-quickstarts/rh-maas-code-assistant
      title: Getting Started
      icon: docs
  tags:
    - maas
    - private-model
    - source-code
spec:
  type: ai-model
  owner: ai-modernization-team
---
# Golden-path templates: Location targets use the Argo Application
# targetRevision (stable branch), not a commit SHA. SHA-pinned blob URLs
# minted a new Location per push while the old one stayed registered
# (entity 200/404 flap; Lead:catalog-location-must-not-accumulate).
# Stage 060 enters through the coolstore-inventory-service component (no
# template); stage 070 = agentic-quarkus-scaffold; stage 080 =
# app-migration (destination repo cataloged, legacy app workspace-only).
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: template-agentic-quarkus-scaffold
  description: Golden-path template for stage 070 AI-agentic development
spec:
  type: url
  target: https://github.com/adnan-drina/rhoai3-coding-demo/blob/__RHOAI3_DEMO_LOCATION_REF__/gitops/stages/050-advanced-app-platform/base/rhdh/templates/agentic-quarkus-scaffold/template.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: template-app-migration
  description: Golden-path template for stage 080 AI-autonomous migration
spec:
  type: url
  target: https://github.com/adnan-drina/rhoai3-coding-demo/blob/__RHOAI3_DEMO_LOCATION_REF__/gitops/stages/050-advanced-app-platform/base/rhdh/templates/app-migration/template.yaml
