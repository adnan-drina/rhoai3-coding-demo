apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }} (legacy migration)
  description: |
    Per-run copy of the legacy Spring Boot sample for the MigIQ multi-agent
    migration, provisioned by the autonomous-migration golden-path template.
  annotations:
    github.com/project-slug: adnan-drina/${{ values.name }}
    backstage.io/source-location: url:https://github.com/adnan-drina/${{ values.name }}
  tags:
    - golden-path
    - migration
    - spring
spec:
  type: service
  lifecycle: experimental
  owner: ai-modernization-team
