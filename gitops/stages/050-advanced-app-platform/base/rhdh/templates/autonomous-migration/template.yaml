# Golden-path template for Stage 080 (AI-Autonomous Migration).
# Copies the legacy Spring Boot golden repository into a fresh per-run repo
# for the MigIQ (MTA + Developer Lightspeed) multi-agent migration. The
# migrated code pushes through the same shared pipeline and quality gate as
# every other golden-path repository.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: autonomous-migration
  title: "AI-Autonomous Migration: legacy Spring Boot application"
  description: |
    Provisions your own copy of the legacy Spring Boot sample (fresh GitHub
    repository, registered in the catalog) as the input for the MigIQ
    multi-agent Spring Boot to Quarkus migration. Analyze it with MTA, run
    the migration agents, and push the migrated code through the shared
    pipeline with SonarQube quality gate.
  tags:
    - golden-path
    - migration
    - spring
    - migiq
spec:
  owner: ai-modernization-team
  type: service

  parameters:
    - title: Migration repository
      required:
        - name
      properties:
        name:
          title: Repository name
          type: string
          description: |
            Name for your migration workspace repo (e.g. legacy-claims-alice).
            Lowercase letters, numbers, and hyphens.
          pattern: "^[a-z][a-z0-9-]{2,40}$"
          ui:autofocus: true

  steps:
    - id: fetch-golden
      name: Fetch legacy Spring Boot golden repository
      action: fetch:plain
      input:
        url: https://github.com/adnan-drina/migiq-spring-boot-sample/tree/main

    - id: add-catalog-info
      name: Add catalog metadata
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?owner=adnan-drina&repo=${{ parameters.name }}
        description: "Legacy Spring Boot app (golden path: MigIQ autonomous migration)"
        repoVisibility: public
        defaultBranch: main
        protectDefaultBranch: false
        topics:
          - rhoai3-golden-path

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: Next steps
        content: |
          Register the repository as an application in the MTA inventory
          (MigIQ stack, deployed by this platform stage), run the analysis,
          then drive the multi-agent migration from the agentic migration
          workspace. The migrated Quarkus code pushes to `main` and exits
          through the shared pipeline and quality gate.
