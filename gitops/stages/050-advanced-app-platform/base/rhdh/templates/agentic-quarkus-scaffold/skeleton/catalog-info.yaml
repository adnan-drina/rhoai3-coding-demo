apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  title: ${{ values.name }}
  description: |
    Brand-new Quarkus application built with spec-driven agentic development,
    provisioned by the agentic-quarkus-scaffold golden-path template.
  annotations:
    github.com/project-slug: adnan-drina/${{ values.name }}
    backstage.io/source-location: url:https://github.com/adnan-drina/${{ values.name }}
  tags:
    - golden-path
    - agentic
    - quarkus
    - spec-driven
spec:
  type: service
  lifecycle: experimental
  owner: ai-modernization-team
