# THIS RUN'S fixture identities (ADR-014). DEMO VALUES ONLY — the specimen's
# seeded demo identity and a deliberately wrong one, both already public in
# the frozen legacy repository's own seed. decisions.yaml records the variable
# NAMES and never a value, and the migration evidence carries neither.
#
# These are literals rather than a generated password, so they are a plain
# Secret and not the provisioner Job's work. They are still PER RUN: a run's
# workspace reads its own secret, so retiring or changing a fixture for one
# run cannot reach another.
#
# Same scoped automount contract as the run's parity database secret:
#   controller.devfile.io/mount-to-devworkspace: "true"   <- the label injects
#   controller.devfile.io/mount-to-devworkspace-include   <- into THIS run only
#   controller.devfile.io/mount-as: env                   <- as env, not a file
#   controller.devfile.io/mount-on-start: "true"          <- never restart a
#                                                            running workspace
# controller.devfile.io/watch-secret is deliberately absent — a watched secret
# re-injects on change and restarts every workspace the pattern matches, which
# would kill a migration already in progress.
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.28
#      (automounting secrets into workspaces)
apiVersion: v1
kind: Secret
metadata:
  name: ${{ values.name }}-parity-credentials
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
    app.kubernetes.io/component: fixture-credentials
    controller.devfile.io/mount-to-devworkspace: "true"
    rhoai3.io/purpose: stage-080-parity
    rhoai3.io/migration-run: ${{ values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    controller.devfile.io/mount-as: env
    controller.devfile.io/mount-on-start: "true"
    # Exact workspace name, plus any suffix Dev Spaces appends on a name
    # collision. A bare "name*" would also match a later run whose name
    # extends this one (v1 matching v10).
    controller.devfile.io/mount-to-devworkspace-include: "${{ values.name }},${{ values.name }}-*"
type: Opaque
stringData:
  PETCLINIC_ADMIN_CREDENTIAL: "admin:admin"
  PETCLINIC_INVALID_CREDENTIAL: "nobody:wrong"
