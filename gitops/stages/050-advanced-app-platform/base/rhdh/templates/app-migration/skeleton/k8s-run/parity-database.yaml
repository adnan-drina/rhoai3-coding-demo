# THIS RUN'S OWN parity database (Stage 080, ADR-009 as amended for per-run
# resources). Every object here is named from the run and belongs to the run:
# a dedicated PostgreSQL 16 server, its server secret, and the workspace
# secret the run's Dev Spaces workspace reads. Nothing is shared with another
# run, and nothing here is created by hand.
#
# WHO APPLIES THIS. Not the project pipeline: `deploy-app` applies `k8s/` into
# `<name>-dev` after a green build, which is the wrong namespace (the
# workspace secret must live beside the workspace) and far too late (M1
# captures source oracles long before the destination builds). The platform
# dispatcher's migration-run bootstrap trigger creates an Argo CD Application
# `run-<name>-resources` on the template's FIRST push, pinned to that commit,
# rendering this directory into the Dev Spaces namespace. So these objects
# exist minutes after the template completes and minutes before the Operator
# opens the workspace — and they never change again, because the Application
# is pinned to the scaffolded revision rather than tracking a branch the
# migration agents write to.
#
# WHY A DEDICATED SERVER PER RUN, not a database on a shared one. The reset
# procedure drops and recreates a schema between scenario runs, and the
# parity comparison is only evidence if the state it starts from is the state
# the corpus declares. A shared server keeps that property at the database
# level but not the others the Operator asked for: one pod is one failure
# domain, one connection limit, one restart window, and one pod eviction that
# ends every concurrent run at once. A dedicated server costs 100m CPU and
# 256Mi of requests on an emptyDir — no PVC, no storage class, no GPU — which
# on this cluster is the cheap side of the trade. Isolation wins.
#
# THE AUTOMOUNT CONTRACT, SCOPED. `mount-to-devworkspace` injects a secret
# into EVERY workspace in the namespace, which is exactly why two runs could
# not have their own. DevWorkspace Operator 0.41.0 (Dev Spaces 3.28) adds
# `mount-to-devworkspace-include`: a comma-separated list of patterns matched
# against the DevWorkspace NAME, so the label still injects but only into the
# workspace this run created. `mount-on-start` defers mounting to the next
# workspace start, so creating these secrets can never restart somebody
# else's running workspace. `watch-secret` is deliberately absent: these
# values are written once, before the workspace exists.
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/3.28
#      (automounting secrets into workspaces)
#
# The namespace is NOT set on any object: Argo CD applies them into the
# Application's destination namespace, which is where the workspace runs.
---
# One generated password, two secrets: what the server is started with, and
# what the workspace reads. They are separate because the key NAMES differ and
# only the second one is automounted into a developer's environment. The
# password is generated in the cluster and never leaves it; decisions.yaml
# references the three variables BY NAME and records no value.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ values.name }}-provision-parity-db
  labels:
    app.kubernetes.io/part-of: ${{ values.name }}
    rhoai3.io/purpose: stage-080-parity
    rhoai3.io/migration-run: ${{ values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        rhoai3.io/migration-run: ${{ values.name }}
    spec:
      restartPolicy: OnFailure
      # Platform-owned identity with secrets create/get/patch/update in the
      # Dev Spaces namespace only (migration-run-resources-rbac.yaml). A
      # self-service repository mints no RBAC of its own.
      serviceAccountName: migration-run-provisioner
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -ceu
            - |
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              RUN="${{ values.name }}"
              # The server is this run's own, so the database and role names
              # carry no isolation duty and stay plain identifiers: a run name
              # with hyphens is not a legal PostgreSQL identifier for the
              # image's POSTGRESQL_DATABASE contract.
              DB_NAME="parity"
              DB_USER="parity"
              SERVER_SECRET="${RUN}-parity-postgres"
              WORKSPACE_SECRET="${RUN}-parity-db"
              HOST="${RUN}-parity-postgres.${NS}.svc"
              # Exact workspace name, plus any suffix Dev Spaces appends on a
              # name collision. A bare "${RUN}*" would also match a later run
              # whose name extends this one (v1 matching v10).
              INCLUDE="${RUN},${RUN}-*"

              # Keep an existing password: regenerating it would orphan the
              # data this run is in the middle of comparing against.
              PASSWORD="$(oc get secret "${SERVER_SECRET}" -n "${NS}" -o jsonpath='{.data.database-password}' 2>/dev/null | base64 -d || true)"
              if [ -z "${PASSWORD}" ]; then
                PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"
                echo "generated a new parity database password for ${RUN}"
              else
                echo "kept the existing parity database password for ${RUN}"
              fi

              oc create secret generic "${SERVER_SECRET}" -n "${NS}" \
                --from-literal=database-name="${DB_NAME}" \
                --from-literal=database-user="${DB_USER}" \
                --from-literal=database-password="${PASSWORD}" \
                --dry-run=client -o yaml | oc apply -f -
              oc label secret "${SERVER_SECRET}" -n "${NS}" \
                "rhoai3.io/migration-run=${RUN}" \
                rhoai3.io/purpose=stage-080-parity --overwrite

              oc create secret generic "${WORKSPACE_SECRET}" -n "${NS}" \
                --from-literal=PETCLINIC_DB_URL="jdbc:postgresql://${HOST}:5432/${DB_NAME}" \
                --from-literal=PETCLINIC_DB_USER="${DB_USER}" \
                --from-literal=PETCLINIC_DB_PASSWORD="${PASSWORD}" \
                --dry-run=client -o yaml | oc apply -f -

              # Scoped automount: the label injects, the include annotation
              # decides WHICH workspace receives it, mount-as makes it env.
              # No watch-secret — this secret is written once, before the
              # workspace exists, and a watched secret restarts every
              # workspace the pattern matches.
              oc label secret "${WORKSPACE_SECRET}" -n "${NS}" \
                controller.devfile.io/mount-to-devworkspace=true \
                "rhoai3.io/migration-run=${RUN}" \
                rhoai3.io/purpose=stage-080-parity --overwrite
              oc annotate secret "${WORKSPACE_SECRET}" -n "${NS}" \
                controller.devfile.io/mount-as=env \
                controller.devfile.io/mount-on-start=true \
                "controller.devfile.io/mount-to-devworkspace-include=${INCLUDE}" --overwrite

              echo "parity resources provisioned for ${RUN}: server ${SERVER_SECRET}, workspace ${WORKSPACE_SECRET} automounted as env into ${INCLUDE} only"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}-parity-postgres
  labels:
    app: ${{ values.name }}-parity-postgres
    app.kubernetes.io/part-of: ${{ values.name }}
    rhoai3.io/purpose: stage-080-parity
    rhoai3.io/migration-run: ${{ values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.name }}-parity-postgres
  template:
    metadata:
      labels:
        app: ${{ values.name }}-parity-postgres
        rhoai3.io/migration-run: ${{ values.name }}
    spec:
      containers:
        - name: postgresql
          # The supported image this cluster already runs elsewhere; ADR-009
          # records PostgreSQL 16 as the destination engine.
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-parity-postgres
                  key: database-name
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-parity-postgres
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ values.name }}-parity-postgres
                  key: database-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        # Deliberately ephemeral: every scenario run restores the schema and
        # the derived baseline the decision names, so durable storage would
        # preserve exactly the state parity must not depend on.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}-parity-postgres
  labels:
    app: ${{ values.name }}-parity-postgres
    app.kubernetes.io/part-of: ${{ values.name }}
    rhoai3.io/purpose: stage-080-parity
    rhoai3.io/migration-run: ${{ values.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: ${{ values.name }}-parity-postgres
  ports:
    - port: 5432
      targetPort: 5432
