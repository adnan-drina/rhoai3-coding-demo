# Migration provenance record — stamped by the app-migration template.
# The legacy application is intentionally NOT registered in the catalog;
# this file is the durable record of where the migration started.
migration:
  legacyRepoUrl: ${{ values.legacyRepoUrl }}
  target: quarkus
  provisionedBy: app-migration golden-path template
acceptance:
  # The harness supervisor asserts this after deploy (M5 ship success).
  path: ${{ values.acceptancePath }}
  needsDatabase: ${{ values.needsDatabase }}
analysis:
  # MTA rule selection is LABEL FILTERING (targets pick only matching
  # rules; everything else is silently excluded). Decided set (validated
  # 2026-07-27 A/B on the cart legacy): the migration path, the jakarta
  # namespace jump, cloud-readiness (OpenShift deploy), the JDK jump.
  # NO source filter — it only narrows (excludes source-labelless rules
  # incl. custom ones). Applies to IDE analysis AND the harness run.
  targets: [quarkus, jakarta-ee9, cloud-readiness, openjdk17]
preserve:
${{ values.preserveItems }}
forbidden:
${{ values.forbiddenPatterns }}
