# Migration provenance record — stamped by the app-migration template.
# The legacy application is intentionally NOT registered in the catalog;
# this file is the durable record of where the migration started.
migration:
  legacyRepoUrl: ${{ values.legacyRepoUrl }}
  target: quarkus
  provisionedBy: app-migration golden-path template
  needsDatabase: ${{ values.needsDatabase }}

# AD-003 amendment A: harness analysis contract (not .konveyor/profiles).
# Rule selection is via --target only — NEVER --source (Track B run evidence
# 2026-07-27: --source drops source-labelless rules and narrows the set).
# Targets match the Track B / coolstore-shaped defaults; adjust deliberately.
analysis:
  targets:
    - quarkus
    - jakarta-ee9
    - cloud-readiness
    - openjdk21
