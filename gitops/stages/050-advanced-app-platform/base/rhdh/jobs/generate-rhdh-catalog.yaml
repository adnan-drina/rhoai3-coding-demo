# Sync hook: generates the RHDH catalog from Git plus cluster-local links.
#
# The Git-tracked catalog template intentionally contains a placeholder Dev
# Spaces URLs. This job replaces those placeholders with current cluster factory
# links and uses relative TechDocs URLs so catalog generation does not depend on
# the RHDH Route that is created later by the Backstage CR.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: Role
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: ClusterRole
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-generate-rhdh-catalog
      containers:
      - name: generate
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "Discovering Dev Spaces route..."
          DEVSPACES_HOST=$(oc get route devspaces -n openshift-devspaces -o jsonpath='{.spec.host}' 2>/dev/null || true)
          if [ -z "$DEVSPACES_HOST" ]; then
            DEVSPACES_HOST=$(oc get route -n openshift-devspaces --no-headers 2>/dev/null \
              | awk '/devspaces/ {print $2; exit}' || true)
          fi
          if [ -z "$DEVSPACES_HOST" ]; then
            echo "ERROR: Dev Spaces route not found"
            exit 1
          fi
          DEVSPACES_URL="https://${DEVSPACES_HOST}"

          # The Backstage CR consumes this ConfigMap and creates the RHDH Route
          # later. Keep TechDocs links relative during catalog bootstrap.
          RHDH_URL=""

          echo "Discovering catalog source from Argo CD..."
          APP_REPO_URL=$(oc get application 050-advanced-app-platform -n openshift-gitops \
            -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)
          APP_TARGET_REVISION=$(oc get application 050-advanced-app-platform -n openshift-gitops \
            -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)
          # Prefer the in-flight operation revision: this Job runs as a Sync
          # hook, and status.sync.revision still holds the PREVIOUS revision
          # until the operation completes (regenerating a stale catalog).
          APP_SYNC_REVISION=$(oc get application 050-advanced-app-platform -n openshift-gitops \
            -o jsonpath='{.status.operationState.operation.sync.revision}' 2>/dev/null || true)
          [ -z "$APP_SYNC_REVISION" ] && APP_SYNC_REVISION=$(oc get application 050-advanced-app-platform -n openshift-gitops \
            -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)
          [ -z "$APP_REPO_URL" ] && APP_REPO_URL="https://github.com/adnan-drina/rhoai3-coding-demo.git"
          [ -z "$APP_TARGET_REVISION" ] && APP_TARGET_REVISION="main"
          [ -z "$APP_SYNC_REVISION" ] && APP_SYNC_REVISION="$APP_TARGET_REVISION"

          REPO_NO_GIT="${APP_REPO_URL%.git}"
          if [[ "$REPO_NO_GIT" =~ ^https://github.com/([^/]+)/([^/]+)$ ]]; then
            REPO_OWNER="${BASH_REMATCH[1]}"
            REPO_NAME="${BASH_REMATCH[2]}"
          SOURCE_REF="${APP_SYNC_REVISION:-$APP_TARGET_REVISION}"
          SOURCE_CATALOG_URL="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${SOURCE_REF}/gitops/stages/050-advanced-app-platform/base/rhdh/catalog/all.yaml"
          else
            echo "ERROR: Unsupported repo URL '${APP_REPO_URL}'"
            exit 1
          fi

          echo "Fetching catalog template..."
          curl -fsSL "${SOURCE_CATALOG_URL}" -o /tmp/catalog-template.yaml

          # Coolstore dev route (deployed-app link on the inventory component);
          # tolerate absence — the wave-21 Route may not exist on first sync.
          COOLSTORE_HOST=$(oc get route coolstore-inventory-service -n coolstore-dev \
            -o jsonpath='{.spec.host}' 2>/dev/null || true)
          COOLSTORE_URL="https://${COOLSTORE_HOST:-coolstore-pending.local}"

          echo "Generating runtime catalog..."
          python3 - /tmp/catalog-template.yaml /tmp/catalog-runtime.yaml "${DEVSPACES_URL}" "${RHDH_URL}" "${APP_SYNC_REVISION}" "${COOLSTORE_URL}" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          devspaces_url = sys.argv[3].rstrip("/")
          rhdh_url = sys.argv[4].rstrip("/")
          revision = sys.argv[5]
          coolstore_url = sys.argv[6].rstrip("/")

          content = source.read_text()
          content = content.replace(
              "https://coolstore-inventory-route.placeholder.example.com", coolstore_url)
          devspaces_links = {
              "https://devspaces.placeholder.example.com": devspaces_url,
              "https://devspaces-inventory.placeholder.example.com": devspaces_url,
          }
          for placeholder, replacement in devspaces_links.items():
              content = content.replace(placeholder, replacement)
          content = content.replace("https://rhdh.placeholder.example.com", rhdh_url)
          content = content.replace("__RHOAI3_DEMO_REVISION__", revision)
          if "devspaces" in content and "placeholder.example.com" in content:
              raise SystemExit("Dev Spaces placeholder was not replaced")
          if "rhdh.placeholder.example.com" in content:
              raise SystemExit("RHDH placeholder was not replaced")
          if "__RHOAI3_DEMO_REVISION__" in content:
              raise SystemExit("Repository revision placeholder was not replaced")
          target.write_text(content)
          PY

          python3 - /tmp/catalog-runtime.yaml /tmp/catalog-patch.json <<'PY'
          import json
          import pathlib
          import sys

          content = pathlib.Path(sys.argv[1]).read_text()
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"data": {"all.yaml": content}}))
          PY

          if oc get configmap catalog-runtime-rhdh -n rhdh >/dev/null 2>&1; then
            oc patch configmap catalog-runtime-rhdh -n rhdh --type=merge -p "$(cat /tmp/catalog-patch.json)"
          else
            oc create configmap catalog-runtime-rhdh -n rhdh --from-file=all.yaml=/tmp/catalog-runtime.yaml
          fi

          echo "Runtime catalog generated with cluster-local Dev Spaces links and relative TechDocs links"
