# RHDH runtime-catalog generation: two consumers of the shared script in
# ConfigMap rhdh-catalog-generator-script:
#   - the Sync-hook Job below (immediate regeneration on FULL syncs), and
#   - the refresh CronJob (convergence within 5 minutes after the
#     selective syncs that skip hooks — the "catalog revision stamp goes
#     stale" fix; it exits fast when the stamped revision is current and
#     no placeholder links remain).
# SA/RBAC are persistent regular resources (they used to be hook-scoped
# and were deleted after every sync, which the CronJob cannot survive).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "7"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "7"
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "7"
rules:
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get"]
# Read the cluster ingress domain to derive the Dev Spaces route host on a
# first-ever sync, before the CheCluster (wave 10) has created that route.
- apiGroups: ["config.openshift.io"]
  resources: ["ingresses"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "7"
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: Role
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "7"
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: ClusterRole
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-generate-rhdh-catalog
      volumes:
        - name: script
          configMap:
            name: rhdh-catalog-generator-script
            defaultMode: 0755
      containers:
      - name: generate
        image: registry.redhat.io/openshift4/ose-cli:latest
        command: ["/bin/bash", "/scripts/generate.sh"]
        volumeMounts:
          - name: script
            mountPath: /scripts
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-generate-rhdh-catalog
          volumes:
            - name: script
              configMap:
                name: rhdh-catalog-generator-script
                defaultMode: 0755
          containers:
          - name: refresh
            image: registry.redhat.io/openshift4/ose-cli:latest
            command: ["/bin/bash", "/scripts/generate.sh"]
            env:
              - name: SKIP_IF_CURRENT
                value: "true"
            volumeMounts:
              - name: script
                mountPath: /scripts
