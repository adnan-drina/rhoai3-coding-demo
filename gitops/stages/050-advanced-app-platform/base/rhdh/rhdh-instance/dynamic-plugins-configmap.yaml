# Dynamic plugins.
# backstage-plugin-scaffolder-backend-module-github is preinstalled in the
# RHDH image but disabled by default (verified against the RHDH dynamic
# plugins reference); it provides publish:github for the golden-path
# templates. Further plugins (Topology, Tekton, ArgoCD) are tracked in the
# restructure plan.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-github-dynamic
        disabled: false
