# Runtime secrets for RHDH — patched by the PostSync Job with real values.
# SESSION_SECRET: random session signing key
# RHDH_OIDC_CLIENT_SECRET: RHBK client secret for the rhdh OIDC client
# RHDH_BASE_URL: cluster-specific RHDH route URL
# RHBK_METADATA_URL: platform RHBK realm OIDC discovery URL (identity component)
# RHDH_CATALOG_URL: runtime catalog file mounted into the RHDH pod
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  SESSION_SECRET: "PLACEHOLDER_WILL_BE_PATCHED"
  RHDH_OIDC_CLIENT_SECRET: "PLACEHOLDER_WILL_BE_PATCHED"
  RHDH_BASE_URL: "https://rhdh.placeholder.example.com"
  RHBK_METADATA_URL: "https://rhbk.placeholder.example.com/realms/platform"
  RHDH_CATALOG_URL: "/opt/app-root/src/catalog/all.yaml"
