apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Red Hat Developer Hub component (from the former portal stage base).
# RHDH 1.9 as the internal developer portal with OIDC auth via the
# identity component's platform RHBK (realm `platform`) and a software
# catalog generated at deploy time.
# Ref: https://docs.redhat.com/en/documentation/red_hat_developer_hub/1.9

resources:
  # Wave 0-2: RHDH Operator
  - rhdh-operator/namespace.yaml
  - rhdh-operator/operatorgroup.yaml
  - rhdh-operator/subscription.yaml
  # Wave 5: RHDH instance prerequisites (ConfigMaps, Secrets)
  - rhdh-instance/app-config-configmap.yaml
  - rhdh-instance/rhdh-secrets.yaml
  - rhdh-instance/dynamic-plugins-configmap.yaml
  - rhdh-instance/catalog-runtime-configmap.yaml
  - rhdh-instance/kubernetes-reader.yaml
  # Runtime catalog generation: the bundle below + Sync hook + refresh CronJob
  - jobs/generate-rhdh-catalog.yaml
  # Wave 10: Backstage CR (RHDH instance)
  - rhdh-instance/backstage.yaml
  # Wave 15: ConsoleLink (OpenShift launcher menu entry)
  - rhdh-instance/consolelink.yaml
  # PostSync: Configure RHDH auth (RHBK client), patch secrets, restart
  - jobs/configure-rhdh.yaml

# B2: the runtime-catalog generator, its renderer, the catalog and EVERY
# template and skeleton file as ONE content-addressed bundle from this
# checkout. The hash suffix makes a catalog-only or template-only change a
# manifest change Argo CD applies (the Job and CronJob references are
# rewritten to the new name), and the generator refuses to publish unless
# the revision it links to holds exactly these bytes. Every file under
# templates/ and catalog/ must be listed here: render_catalog.test.py and
# stage 050 validate.sh refuse a file that is not.
configMapGenerator:
- name: rhdh-catalog-bundle
  namespace: rhdh
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "7"
  files:
  - catalog__all.yaml=catalog/all.yaml
  - jobs__catalog__generate.sh=jobs/catalog/generate.sh
  - jobs__catalog__render_catalog.py=jobs/catalog/render_catalog.py
  - templates__agentic-quarkus-scaffold__skeleton__catalog-info.yaml=templates/agentic-quarkus-scaffold/skeleton/catalog-info.yaml
  - templates__agentic-quarkus-scaffold__skeleton__devfile.yaml=templates/agentic-quarkus-scaffold/skeleton/devfile.yaml
  - templates__agentic-quarkus-scaffold__skeleton__k8s__app.yaml=templates/agentic-quarkus-scaffold/skeleton/k8s/app.yaml
  - templates__agentic-quarkus-scaffold__template.yaml=templates/agentic-quarkus-scaffold/template.yaml
  - templates__app-migration__delivery-path.md=templates/app-migration/delivery-path.md
  - templates__app-migration__skeleton__catalog-info.yaml=templates/app-migration/skeleton/catalog-info.yaml
  - templates__app-migration__skeleton__devfile.yaml=templates/app-migration/skeleton/devfile.yaml
  - templates__app-migration__skeleton__k8s__app.yaml=templates/app-migration/skeleton/k8s/app.yaml
  - templates__app-migration__skeleton__k8s-templates__app-datasource-env.yaml=templates/app-migration/skeleton/k8s-templates/app-datasource-env.yaml
  - templates__app-migration__skeleton__k8s-templates__postgres.yaml=templates/app-migration/skeleton/k8s-templates/postgres.yaml
  - templates__app-migration__skeleton__migration.yaml=templates/app-migration/skeleton/migration.yaml
  - templates__app-migration__skeleton__run-budget.json=templates/app-migration/skeleton/run-budget.json
  - templates__app-migration__template.yaml=templates/app-migration/template.yaml
