# Stage 080 modernization workspaces (mta component).
#
# One mca-coolstore DevWorkspace per persona namespace: the legacy Coolstore
# monolith with the MTA VS Code extension pack wired to the MTA hub. The
# persona namespaces themselves are owned by the devspaces component
# (workspaces.yaml); sync waves order namespace creation (15) before these
# DevWorkspaces (20).
---
kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: mca-coolstore
  labels:
    demo.rhoai.io/stage: '080'
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  started: false
  routingClass: che
  contributions:
    - name: ide
      uri: http://devspaces-dashboard.openshift-devspaces.svc.cluster.local:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  template:
    projects:
      - name: mca-coolstore
        git:
          remotes:
            origin: https://github.com/rhpds/mca-coolstore.git
          checkoutFrom:
            revision: main
    commands:
      - id: init-modernization-tools
        exec:
          commandLine: |
            java21_home="${JAVA_HOME_21:-${JAVA_HOME:-}}"
            if [ -z "${java21_home}" ] || [ ! -x "${java21_home}/bin/java" ]; then
              for candidate in \
                "${HOME}/.sdkman/candidates/java/21.0.5-tem" \
                /home/tooling/.sdkman/candidates/java/21.0.5-tem \
                /usr/lib/jvm/java-21-openjdk; do
                if [ -x "${candidate}/bin/java" ]; then
                  java21_home="${candidate}"
                  break
                fi
              done
            fi
            if [ -n "${java21_home}" ] && [ -x "${java21_home}/bin/java" ]; then
              export JAVA_HOME="${java21_home}"
              export PATH="${JAVA_HOME}/bin:${PATH}"
              for rc in "${HOME}/.bashrc" "${HOME}/.zshrc"; do
                touch "${rc}"
                if ! grep -q "rhoai3-coding-demo: java 21 default" "${rc}"; then
                  {
                    printf '\n'
                    printf '# rhoai3-coding-demo: java 21 default\n'
                    printf 'export JAVA_HOME="%s"\n' "${java21_home}"
                    printf 'export PATH="${JAVA_HOME}/bin:${PATH}"\n'
                  } >> "${rc}"
                fi
              done
              echo "Configured Java 21 as the default shell runtime."
            else
              echo "Java 21 runtime not found; use a Dev Spaces tooling image with OpenJDK 21."
            fi
            if ls /checode/remote/extensions 2>/dev/null | grep -q "^kilocode.kilo-code-7.4.8"; then
              echo "Kilo Code 7.4.8 already installed; skipping VSIX download."
            else
              curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --max-time 300 -o /tmp/kilo.vsix "https://open-vsx.org/api/kilocode/kilo-code/linux-x64/7.4.8/file/kilocode.kilo-code-7.4.8@linux-x64.vsix"
              test -s /tmp/kilo.vsix
            fi
            curl -fsSL --max-time 120 -o /tmp/mta.vsix "https://open-vsx.org/api/redhat/mta-vscode-extension/8.2.0/file/redhat.mta-vscode-extension-8.2.0.vsix"
            curl -fsSL --max-time 120 -o /tmp/mta-core.vsix "https://open-vsx.org/api/redhat/mta-core/8.2.0/file/redhat.mta-core-8.2.0.vsix"
            curl -fsSL --max-time 120 -o /tmp/redhat-java.vsix "https://open-vsx.org/api/redhat/java/1.47.0/file/redhat.java-1.47.0.vsix"
            curl -fsSL --max-time 120 -o /tmp/mta-java.vsix "https://open-vsx.org/api/redhat/mta-java/8.2.0/file/redhat.mta-java-8.2.0.vsix"
            test -s /tmp/mta.vsix
            test -s /tmp/mta-core.vsix
            test -s /tmp/redhat-java.vsix
            test -s /tmp/mta-java.vsix
            # Create kubeconfig from the workspace SA token so the MTA extension
            # can connect to the cluster. OIDC auth to the hub is still interactive.
            if [ ! -f /home/user/.kube/config ]; then
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
              SA_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API_SERVER="https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}"
              if [ -n "${SA_TOKEN}" ]; then
                oc login --token="${SA_TOKEN}" --server="${API_SERVER}" \
                  --certificate-authority="${SA_CA}" 2>/dev/null || true
                echo "kubeconfig created for MTA extension"
              fi
            fi
            # Ensure JDT.LS starts in Standard mode so mta-java registers its
            # analysis provider immediately without requiring the user to open a
            # .java file first. Write into .code-workspace (PVC-backed at
            # /projects) so the setting survives workspace pod restarts.
            if [ -f /projects/.code-workspace ]; then
              python3 -c "import json,sys; f='/projects/.code-workspace'; ws=json.load(open(f)); s=ws.setdefault('settings',{}); s['java.server.launchMode']='Standard'; s['mta-core.genai.enabled']=False; open(f,'w').write(json.dumps(ws,indent=2)); print('Workspace settings: JDT Standard mode, MTA GenAI disabled')" 2>&1 || true
            fi
          component: tooling-container
    events:
      postStart:
        - init-modernization-tools
    components:
      - name: tooling-container
        container:
          image: registry.redhat.io/devspaces/udi-rhel9:3.29.1@sha256:420f18fc64f0d05ccdabafdde946eb1fdff0f1c7e14e1dc4a43fdfb917267bed
          sourceMapping: /projects
          memoryLimit: 6Gi
          memoryRequest: 2Gi
          cpuLimit: "2"
          cpuRequest: 500m
          env:
            - name: DEFAULT_EXTENSIONS
              value: "/tmp/kilo.vsix;/tmp/mta.vsix;/tmp/mta-core.vsix;/tmp/redhat-java.vsix;/tmp/mta-java.vsix"
            - name: SHELL
              value: "/usr/bin/bash"
            - name: JAVA_HOME
              value: /usr/lib/jvm/java-21-openjdk
            # MTA hub connection — uses the stable internal cluster service URL
            # so no PostSync patching or ignoreDifferences is needed.
            - name: HUB_URL
              value: "http://mta-ui.openshift-mta.svc.cluster.local:8080"
            # Force the hub active on first workspace start regardless of prior state.
            - name: FORCE_HUB_ENABLED
              value: "true"
            # Skip TLS verification — OpenShift uses a custom CA not trusted by the extension.
            - name: HUB_INSECURE
              value: "true"
            # Lightspeed/Kai is disabled platform-side — hub AI features off.
            - name: HUB_SOLUTION_SERVER_ENABLED
              value: "false"
            - name: HUB_PROFILE_SYNC_ENABLED
              value: "false"
---
