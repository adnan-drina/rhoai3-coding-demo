apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 050: Advanced Application Platform
# The app-platform layer every dev-arc rung consumes, organized as
# capability components:
#   identity   — platform RHBK (realm `platform`) brokering OpenShift OAuth
#   devspaces  — Dev Spaces + Kilo Code + persona workspaces + MaaS keys
#   pipelines  — Pipelines/TAS operators + shared push pipeline + triggers
#   sonarqube  — static analysis with fail-on-new-issue quality gate
#   rhdh       — Developer Hub portal + runtime catalog + OIDC jobs
#   mta        — MTA + Developer Lightspeed migration stack (single-rung;
#                use overlays/slim to deploy the platform without it)
#   coolstore  — deployed Coolstore Inventory Service dev environment
#                (image seeded by deploy.sh via the shared pipeline)
# Identity note: RHDH OIDC brokers through the identity component's
# platform RHBK; the PostSync jobs wait/retry, so ordering resolves within
# one Application sync. MTA hub auth is disabled (MTA Keycloak unused).

resources:
  - identity
  - devspaces
  - pipelines
  - sonarqube
  - rhdh
  - mta
  - coolstore
