apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stage 050: Advanced Application Platform
# The app-platform layer every dev-arc rung consumes: trusted-delivery
# operators (OpenShift Pipelines, Trusted Artifact Signer) and RHDH 1.9 as
# the internal developer portal with OIDC auth via MTA Keycloak and a
# software catalog. Identity (RHBK), SonarQube, the shared push pipeline,
# and golden-path templates arrive with Phase 2 of
# docs/PLAN-advanced-app-platform-restructure.md.
# Ref: https://docs.redhat.com/en/documentation/red_hat_developer_hub/1.9

resources:
  # Trusted-delivery operators (Pipelines, TAS) + InstallPlan approval hook
  - operators/pipelines-subscription.yaml
  - operators/rhtas-subscription.yaml
  - operators/approve-installplans.yaml
  # Wave 0-2: RHDH Operator
  - rhdh-operator/namespace.yaml
  - rhdh-operator/operatorgroup.yaml
  - rhdh-operator/subscription.yaml
  # Wave 5: RHDH instance prerequisites (ConfigMaps, Secrets)
  - rhdh-instance/app-config-configmap.yaml
  - rhdh-instance/rhdh-secrets.yaml
  - rhdh-instance/dynamic-plugins-configmap.yaml
  - rhdh-instance/catalog-runtime-configmap.yaml
  # Sync hook: Generate runtime catalog with cluster-local Dev Spaces link
  - jobs/generate-rhdh-catalog.yaml
  # Wave 10: Backstage CR (RHDH instance)
  - rhdh-instance/backstage.yaml
  # Wave 15: ConsoleLink (OpenShift launcher menu entry)
  - rhdh-instance/consolelink.yaml
  # PostSync: Configure RHDH auth (RHBK client), patch secrets, restart
  - jobs/configure-rhdh.yaml
