---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-enable-dsc-maas
  labels:
    app.kubernetes.io/name: enable-dsc-maas
    app.kubernetes.io/component: maas
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '13'
rules:
- apiGroups:
  - datasciencecluster.opendatahub.io
  resources:
  - datascienceclusters
  verbs:
  - get
  - patch
  resourceNames:
  - default-dsc
- apiGroups:
  - components.platform.opendatahub.io
  resources:
  - aigateways
  - ogxs
  resourceNames:
  - default-aigateway
  - default-ogx
  verbs:
  - get
- apiGroups:
  - maas.opendatahub.io
  resources:
  - configs
  resourceNames:
  - default
  verbs:
  - get
# Playground custom endpoints: the Job declares the cluster ingress domain internal (genAiStudioConfig).
- apiGroups:
  - config.openshift.io
  resources:
  - ingresses
  resourceNames:
  - cluster
  verbs:
  - get
