# Custom observability dashboard for the OpenShift AI Observability page (rendered as a tab because its name starts with
# dashboard-). Generated by stages/040-governed-models-as-a-service/gen-cost-dashboards.py; edit the generator, not this file.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-6-tokenomics-break-even-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-6-tokenomics-break-even-admin
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  config:
    display:
      name: "Tokenomics \xB7 break-even (live)"
      description: 'Self-hosting economics: infrastructure burn, effective cost per million tokens, and the throughput at which the private models beat a hosted API.'
    duration: 168h
    variables:
    - kind: TextVariable
      spec:
        name: gpu_hourly_cost
        value: '2.24'
        constant: false
        display:
          name: GPU $/hour (per node)
          description: Hourly infrastructure cost of one GPU worker; default is an AWS g6e.2xlarge (one L40S) on-demand list price.
          hidden: false
    - kind: TextVariable
      spec:
        name: gpu_count
        value: '2'
        constant: false
        display:
          name: GPU workers
          description: Number of GPU workers currently paid for.
          hidden: false
    - kind: TextVariable
      spec:
        name: api_price_prompt
        value: '0.15'
        constant: false
        display:
          name: Hosted API $/1M prompt tokens
          description: Reference price of a comparable hosted model for prompt tokens; the break-even is computed against it.
          hidden: false
    - kind: TextVariable
      spec:
        name: api_price_completion
        value: '0.60'
        constant: false
        display:
          name: Hosted API $/1M completion tokens
          description: Reference price of a comparable hosted model for completion tokens.
          hidden: false
    panels:
      burn:
        kind: Panel
        spec:
          display:
            name: Infrastructure burn $/h
            description: GPU workers times hourly cost.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: &id001
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: vector(($gpu_hourly_cost * $gpu_count))
      throughput:
        kind: Panel
        spec:
          display:
            name: Live throughput (tokens/s)
            description: Prompt plus completion tokens per second across the private models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(rate(kserve_vllm:prompt_tokens_total[$__rate_interval])) + sum(rate(kserve_vllm:generation_tokens_total[$__rate_interval]))
      effectiveLive:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens (live)
            description: 'Burn divided by live throughput: what one million tokens cost right now.'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ($gpu_hourly_cost * $gpu_count) / clamp_min((sum(rate(kserve_vllm:prompt_tokens_total[$__rate_interval])) + sum(rate(kserve_vllm:generation_tokens_total[$__rate_interval]))) * 3600
                    / 1e6, 0.001)
      effectiveRange:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens (Range)
            description: Burn over the Range window divided by tokens served in it.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ($gpu_hourly_cost * $gpu_count) * count_over_time(vector(1)[$__range:1h]) / clamp_min((sum(increase(kserve_vllm:prompt_tokens_total[$__range])) + sum(increase(kserve_vllm:generation_tokens_total[$__range])))
                    / 1e6, 0.001)
      breakEven:
        kind: Panel
        spec:
          display:
            name: Break-even throughput (tokens/s)
            description: Tokens per second at which self-hosting matches the hosted API's blended price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: vector(($gpu_hourly_cost * $gpu_count) / (($api_price_prompt + $api_price_completion) / 2) * 1e6 / 3600)
      utilisation:
        kind: Panel
        spec:
          display:
            name: Throughput vs break-even
            description: Live throughput as a percentage of the break-even throughput; above 100% self-hosting is cheaper than the hosted API.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 200
              thresholds:
                steps:
                - value: 0
                  color: '#c9190b'
                - value: 100
                  color: '#3e8635'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(rate(kserve_vllm:prompt_tokens_total[$__rate_interval])) + sum(rate(kserve_vllm:generation_tokens_total[$__rate_interval]))) / (($gpu_hourly_cost * $gpu_count) / (($api_price_prompt
                    + $api_price_completion) / 2) * 1e6 / 3600) * 100
      apiEquivalent:
        kind: Panel
        spec:
          display:
            name: Hosted-API equivalent spend (Range)
            description: What the tokens served in the Range window would have cost at the hosted API prices.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(increase(kserve_vllm:prompt_tokens_total[$__range])) / 1e6 * $api_price_prompt) + (sum(increase(kserve_vllm:generation_tokens_total[$__range])) / 1e6 * $api_price_completion)
      infraSpend:
        kind: Panel
        spec:
          display:
            name: Infrastructure spend (Range)
            description: Burn over the Range window.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ($gpu_hourly_cost * $gpu_count) * count_over_time(vector(1)[$__range:1h])
      savings:
        kind: Panel
        spec:
          display:
            name: Savings vs hosted API (Range)
            description: Hosted-API equivalent spend minus infrastructure spend; negative means the GPUs are under-utilised relative to the reference price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(increase(kserve_vllm:prompt_tokens_total[$__range])) / 1e6 * $api_price_prompt) + (sum(increase(kserve_vllm:generation_tokens_total[$__range])) / 1e6 * $api_price_completion)
                    - ($gpu_hourly_cost * $gpu_count) * count_over_time(vector(1)[$__range:1h])
      throughputTrend:
        kind: Panel
        spec:
          display:
            name: Throughput by model vs break-even
            description: Tokens per second by model against the break-even line.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval]))
                  seriesNameFormat: '{{model_name}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: vector(($gpu_hourly_cost * $gpu_count) / (($api_price_prompt + $api_price_completion) / 2) * 1e6 / 3600)
                  seriesNameFormat: break-even
      gpuUtil:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation from cluster monitoring (DCGM).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: avg by (exported_pod) (accelerator_gpu_utilization)
                  seriesNameFormat: '{{exported_pod}}'
    layouts:
    - kind: Grid
      spec:
        display:
          title: Live
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/burn'
        - x: 6
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/throughput'
        - x: 12
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/effectiveLive'
        - x: 18
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/breakEven'
    - kind: Grid
      spec:
        display:
          title: Break-even
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/utilisation'
        - x: 8
          y: 0
          width: 16
          height: 8
          content:
            $ref: '#/spec/panels/throughputTrend'
    - kind: Grid
      spec:
        display:
          title: Range economics
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/effectiveRange'
        - x: 6
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/infraSpend'
        - x: 12
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/apiEquivalent'
        - x: 18
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/savings'
        - x: 0
          y: 5
          width: 24
          height: 7
          content:
            $ref: '#/spec/panels/gpuUtil'
