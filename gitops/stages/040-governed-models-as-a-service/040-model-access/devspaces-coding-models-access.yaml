apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: devspaces-coding-models
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: devspaces-coding-models
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    # One key owner per Dev Spaces persona, so MaaS attributes usage to each persona (Stage 070 devspaces/maas-keys).
    users:
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
      - system:serviceaccount:wksp-ai-admin:devspace-maas-key-provisioner-admin
  modelRefs:
    # Sized for agentic assistants: one agent turn carries system prompt, rules and file
    # context, so chat-era budgets (100K/h, 1M/h, 5M/h) all hit 429s mid-demo (2026-07).
    # 20M/h throttled the v12 autonomous migration on 2026-09-24: its single
    # worker re-sends a ~90K-token context per call and measured 25M tokens in
    # its busiest hour (Limitador counter 13,338 over at 12:34Z, HTTP 429,
    # card blocked). 60M/h gives ~2.4x the measured peak. Local GPU model:
    # this budget demonstrates governance, not cost control.
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 60000000
          window: 1h
  priority: 100
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: devspaces-coding
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: devspaces-coding-models
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: devspaces-coding-models
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
      - system:serviceaccount:wksp-ai-admin:devspace-maas-key-provisioner-admin
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: devspaces-coding
