# Governed access for all model evaluation (Stage 050, project evaluated-models, the only EvalHub tenant).
# EvalHub authenticates to a model endpoint with an API key stored in a tenant Secret (RHOAI 3.5 "Evaluating
# AI systems", API key authentication), so evaluation traffic goes through the MaaS gateway like every other
# consumer: identity, token quota and usage attribution apply. Candidates are served in evaluated-models
# itself; this subscription reaches the production models (the baseline a candidate would replace, and any
# model evaluated manually) and the external models, which are evaluated like the private ones and serve as
# judges (a judge must differ from the model under test, 3.5 guide chapter 7; Mistral Small 4 is the risk assessment
# judge of the qualification pipeline). The hourly token limit of the
# private models sits above what their single-GPU servers produce, so governance meters evaluation without
# becoming its bottleneck. The key is minted by the evaluated-models provisioner ServiceAccount.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: model-qualification
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: model-qualification
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: governed-access
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  owner:
    users:
      - system:serviceaccount:evaluated-models:evalhub-maas-key-provisioner
  priority: 70
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 5000000
          window: 1h
    # The risk assessment judge and TAP evaluator of the qualification pipeline (Stage 050). Each Garak intents scan
    # sent it about 3,000,000 tokens an hour with 512-token replies (run 20261113-1: 3.2M bare, 2.7M guarded), more with
    # the 2,048-token replies from pipeline v33; the pipeline runs the bare and guarded scans side by side from v32, and
    # its trace-quality step (v34) adds up to about 600 judge calls. Garak counts a failed judge call as a refusal, so
    # a throttled judge would lower the attack success rate; the limit sits well above both scans together.
    - name: mistral-small4-119b
      namespace: internal-models
      tokenRateLimits:
        - limit: 20000000
          window: 1h
    - name: gpt-6-luna
      namespace: external-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: claude-sonnet-5-5
      namespace: external-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: model-qualification
      provider: governed-models
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: model-qualification
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: model-qualification
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: governed-access
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  subjects:
    users:
      - system:serviceaccount:evaluated-models:evalhub-maas-key-provisioner
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
    - name: mistral-small4-119b
      namespace: internal-models
    - name: gpt-6-luna
      namespace: external-models
    - name: claude-sonnet-5-5
      namespace: external-models
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: model-qualification
      provider: governed-models
