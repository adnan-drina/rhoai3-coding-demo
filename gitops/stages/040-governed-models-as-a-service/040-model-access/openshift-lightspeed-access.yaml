# OpenShift Lightspeed's governed access: the private production model (Qwen, its primary) and Nemotron 3 Ultra, the
# approved external model it falls back to while Qwen is parked. Lightspeed's request shape (top_p, frequency_penalty,
# max_completion_tokens) is accepted by Nemotron; GPT-6 Luna rejects top_p. The key is minted by the
# 040-openshift-lightspeed provisioner Job as this ServiceAccount, so Lightspeed traffic has its own quota and metering.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: openshift-lightspeed
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-lightspeed
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - system:serviceaccount:openshift-lightspeed:lightspeed-maas-key-provisioner
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 2000000
          window: 1h
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
      tokenRateLimits:
        - limit: 2000000
          window: 1h
  priority: 60
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: openshift-lightspeed
      provider: governed-models
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: openshift-lightspeed
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-lightspeed
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - system:serviceaccount:openshift-lightspeed:lightspeed-maas-key-provisioner
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: openshift-lightspeed
      provider: governed-models
