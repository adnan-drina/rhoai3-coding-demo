# OpenShift Lightspeed's governed access to the private production model. The key is minted by the
# 040-openshift-lightspeed provisioner Job as this ServiceAccount, so Lightspeed traffic has its own quota and metering.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: openshift-lightspeed
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-lightspeed
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - system:serviceaccount:openshift-lightspeed:lightspeed-maas-key-provisioner
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 2000000
          window: 1h
  priority: 60
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: openshift-lightspeed
      provider: governed-models
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: openshift-lightspeed
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: openshift-lightspeed
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - system:serviceaccount:openshift-lightspeed:lightspeed-maas-key-provisioner
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: openshift-lightspeed
      provider: governed-models
