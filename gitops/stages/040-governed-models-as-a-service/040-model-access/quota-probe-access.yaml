# Quota enforcement probe. `stages/040-governed-models-as-a-service/validate.sh --quota` mints an ephemeral MaaS key as
# this ServiceAccount, sends small Qwen requests until the gateway answers 429 and revokes the key. The tiny per-minute
# budget is reached within a few requests and resets for the next run; no person or workload uses this identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-quota-probe
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quota-probe
    app.kubernetes.io/component: maas-quota-probe
automountServiceAccountToken: false
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: quota-probe
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: quota-probe
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - system:serviceaccount:models-as-a-service:maas-quota-probe
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 100
          window: 1m
  priority: 40
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: quota-probe
      provider: governed-models
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: quota-probe
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: quota-probe
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - system:serviceaccount:models-as-a-service:maas-quota-probe
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      modelSet: quota-probe
      provider: governed-models
