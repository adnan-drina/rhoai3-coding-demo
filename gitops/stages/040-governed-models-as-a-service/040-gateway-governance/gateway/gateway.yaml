---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas-default-gateway
    app.kubernetes.io/component: maas-gateway
    opendatahub.io/managed: 'false'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
    opendatahub.io/managed: 'false'
    security.opendatahub.io/authorino-tls-bootstrap: 'true'
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: maas-gateway-resources
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: '3600'
  listeners:
  - name: api
    port: 443
    protocol: HTTPS
    hostname: maas.placeholder.example.com
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            maas-gateway-access: "true"
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - redhat-ai-gateway-infra
            - external-models
            - internal-models
            - redhat-ods-applications
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        # The cluster's cert-manager wildcard ingress certificate, used directly so renewals reach the gateway
        # (Istio watches referenced Secrets); same namespace, so no ReferenceGrant is needed.
        name: cert-manager-ingress-cert
  - name: qwen3-8
    port: 443
    protocol: HTTPS
    hostname: qwen3-8-maas.placeholder.example.com
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            maas-gateway-access: "true"
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - internal-models
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        # The cluster's cert-manager wildcard ingress certificate, used directly so renewals reach the gateway
        # (Istio watches referenced Secrets); same namespace, so no ReferenceGrant is needed.
        name: cert-manager-ingress-cert
  # The showback dedicated model has its own listener: on RHOAI 3.5.2 a second local model on the shared api
  # listener hands the Qwen route its endpoint picker (known issue RHOAIENG-93709; TROUBLESHOOTING "Qwen Calls Through
  # MaaS Hang, Then Return 503").
  - name: mistral-small4
    port: 443
    protocol: HTTPS
    hostname: mistral-small4-maas.placeholder.example.com
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            maas-gateway-access: "true"
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values:
            - internal-models
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        # The cluster's cert-manager wildcard ingress certificate, used directly so renewals reach the gateway
        # (Istio watches referenced Secrets); same namespace, so no ReferenceGrant is needed.
        name: cert-manager-ingress-cert
