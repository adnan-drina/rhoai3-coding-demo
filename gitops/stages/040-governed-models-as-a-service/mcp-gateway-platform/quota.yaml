apiVersion: v1
kind: ResourceQuota
metadata:
  name: mcp-private-boundary
  namespace: mcp-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  hard:
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/routes.route.openshift.io: "0"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
