apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: rhoai3-coding-demo
      demo.rhoai.io/stage: "040"

resources:
  - prerequisites/lws/base
  - prerequisites/rhcl/base
  - database/base
  - access/base
  - gateway/base
  - governance/base
  - local-models/base
  - tenant/base
  - external-models/base
  - policies/base
  - mcp/base
  - jobs/base
  - monitoring/base

# Optional external-context MCP servers (credential-gated; Secrets are
# provisioned by deploy.sh only when SLACK_BOT_TOKEN / BRIGHTDATA_API_TOKEN
# are set locally; pods start without them via optional secret refs).
components:
  - mcp/components/slack-mcp
  - mcp/components/brightdata-mcp
