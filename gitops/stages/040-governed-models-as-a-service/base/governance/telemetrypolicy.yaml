# Temporary MaaS usage telemetry with older tier labels for the demo dashboard.
# RHOAI 3.4 cleanup should move this to subscription-level MaaS observability
# or another supported OpenShift monitoring path after validation.
# Ref: https://docs.kuadrant.io/dev/kuadrant-operator/doc/overviews/telemetry/
apiVersion: extensions.kuadrant.io/v1alpha1
kind: TelemetryPolicy
metadata:
  name: user-group
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  metrics:
    default:
      labels:
        model: responseBodyJSON("/model")
        tier: auth.identity.tier
        user: auth.identity.userid
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
