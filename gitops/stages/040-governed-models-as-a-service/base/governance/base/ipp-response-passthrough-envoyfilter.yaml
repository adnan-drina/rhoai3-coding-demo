# RHOAI 3.4 workaround — MaaS Ingress Payload Processing (IPP) buffers
# streaming responses (KB "MaaS streaming responses buffered through
# gateway (RHOAI 3.4)"; fixed in RHOAI 3.5 — REMOVE THIS FILE on upgrade;
# BACKLOG tracks it).
#
# The KB workaround removes the ext_proc filter entirely, but that only
# suits internal-models-only clusters: our External Models need IPP's
# request-side plugins (model-provider-resolver, API-key injection). All
# our external providers are OpenAI-compatible, so response translation
# is unnecessary — this filter keeps request processing and disables only
# response body/trailer processing (observed live 2026-07-17: response
# FULL_DUPLEX_STREAMED starves streaming clients ~60s then resets at
# ~310KB; body NONE requires trailer SKIP or the BBR server 504s).
#
# Deliberately a SEPARATE EnvoyFilter: the MaaS controller reverts edits
# to its own payload-processing object. priority 10 > the operator
# filter's default 0, so this merge applies after the bbr filter is
# inserted.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ipp-response-passthrough
  namespace: openshift-ingress
  annotations:
    openshift.io/managed: "false"
    argocd.argoproj.io/sync-wave: "10"
spec:
  priority: 10
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc.bbr
      patch:
        operation: MERGE
        value:
          name: envoy.filters.http.ext_proc.bbr
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            processing_mode:
              request_body_mode: FULL_DUPLEX_STREAMED
              request_header_mode: SEND
              request_trailer_mode: SEND
              response_body_mode: NONE
              response_header_mode: SEND
              response_trailer_mode: SKIP
