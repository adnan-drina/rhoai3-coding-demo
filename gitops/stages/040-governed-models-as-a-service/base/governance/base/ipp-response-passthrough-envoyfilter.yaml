# IPP streaming passthrough for the MaaS gateway (RHOAI 3.4).
#
# PROBLEM: the operator-owned `payload-processing` EnvoyFilter inserts a
# Body-Based Routing (BBR) ext_proc filter (`envoy.filters.http.ext_proc.bbr`)
# whose processing_mode sets `response_body_mode: FULL_DUPLEX_STREAMED`. For
# EXTERNAL upstream models (minimax-m2, qwen3-235b -> maas-rhdp) this buffers
# the streamed SSE response: Envoy returns 200 headers instantly but no body
# bytes flow until the generation completes, so streaming clients (OpenCode's
# Bun fetch, ~60s timeout) give up with "Connection reset by server". Internal
# vLLM models (qwen3-6, nemotron) stream fine; the external endpoints also
# stream fine when hit directly. The buffer is purely this ext_proc stage.
#
# FIX: set `response_body_mode: NONE` so the ext_proc does NOT process the
# response body at all -> chunks pass straight through, streaming works. BBR
# only needs the REQUEST body (request_body_mode unchanged), so routing is
# unaffected.
#
# WHY operation REPLACE (not MERGE): `NONE` is the protobuf zero-value of the
# BodySendMode enum, so a MERGE silently drops it (the field looks "unset")
# and the base FULL_DUPLEX_STREAMED wins — that is exactly why the earlier
# MERGE-based attempt never applied its passthrough AND produced an invalid
# FULL_DUPLEX_STREAMED+SKIP listener that crashlooped the gateway. REPLACE
# supplies the whole ext_proc config, so NONE actually lands. The value below
# is a byte-for-byte copy of the operator's bbr filter with only
# response_body_mode changed; re-verify it against `payload-processing` if the
# RHOAI MaaS operator is upgraded.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ipp-response-passthrough
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    # Not operator-managed; Argo owns it. Kept as a SEPARATE filter so we
    # never edit the operator's payload-processing object directly.
    openshift.io/managed: "false"
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "040"
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc.bbr
      patch:
        # REPLACE the whole bbr ext_proc so response_body_mode: NONE lands
        # (a MERGE cannot set an enum to its zero value).
        operation: REPLACE
        value:
          name: envoy.filters.http.ext_proc.bbr
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            allow_mode_override: true
            failure_mode_allow: false
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|9004||payload-processing.openshift-ingress.svc.cluster.local
            processing_mode:
              # Request side unchanged — BBR routes on the request body.
              request_body_mode: FULL_DUPLEX_STREAMED
              request_header_mode: SEND
              request_trailer_mode: SEND
              # Response side: do NOT process the body -> no buffering, SSE
              # streams straight through. NONE has no trailer-mode constraint
              # (unlike FULL_DUPLEX_STREAMED, which requires SEND).
              response_body_mode: NONE
              response_header_mode: SEND
              response_trailer_mode: SEND
  # Applies after the operator's INSERT_AFTER (priority 0), so the bbr filter
  # exists when this REPLACE runs.
  priority: 10
