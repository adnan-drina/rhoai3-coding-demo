---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-ensure-maas-db
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "13"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-ensure-maas-db
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "13"
rules:
  - apiGroups: [""]
    resources: ["secrets", "endpoints"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-ensure-maas-db
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "13"
subjects:
  - kind: ServiceAccount
    name: job-ensure-maas-db
    namespace: redhat-ods-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-ensure-maas-db
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-ensure-maas-db-crd-reader
  annotations:
    argocd.argoproj.io/sync-wave: "13"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-ensure-maas-db-crd-reader
  annotations:
    argocd.argoproj.io/sync-wave: "13"
subjects:
  - kind: ServiceAccount
    name: job-ensure-maas-db
    namespace: redhat-ods-applications
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-ensure-maas-db-crd-reader
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-ensure-maas-db
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: job-ensure-maas-db
      restartPolicy: Never
      containers:
        - name: ensure
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "Waiting for CloudNativePG CRD..."
              for i in $(seq 1 60); do
                if oc get crd clusters.postgresql.cnpg.io &>/dev/null; then
                  break
                fi
                sleep 5
              done

              if ! oc get secret maas-db-app -n redhat-ods-applications &>/dev/null; then
                password="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
                oc create secret generic maas-db-app \
                  -n redhat-ods-applications \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username=maas \
                  --from-literal=password="${password}"
              fi

              cat <<'YAML' | oc apply -f -
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              metadata:
                name: maas-db
                namespace: redhat-ods-applications
                annotations:
                  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
              spec:
                instances: 1
                bootstrap:
                  initdb:
                    database: maas
                    owner: maas
                    secret:
                      name: maas-db-app
                storage:
                  size: 1Gi
              YAML

              echo "Waiting for maas-db-rw endpoint..."
              for i in $(seq 1 90); do
                endpoint="$(oc get endpoints maas-db-rw -n redhat-ods-applications \
                  -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)"
                if [ -n "$endpoint" ]; then
                  break
                fi
                sleep 5
              done

              password="$(oc get secret maas-db-app -n redhat-ods-applications \
                -o jsonpath='{.data.password}' | base64 --decode)"
              connection_url="postgresql://maas:${password}@maas-db-rw.redhat-ods-applications.svc:5432/maas?sslmode=disable"
              oc create secret generic maas-db-config \
                -n redhat-ods-applications \
                --from-literal=DB_CONNECTION_URL="${connection_url}" \
                --dry-run=client -o yaml | oc apply -f -

              echo "maas-db-config is present for the RHOAI-managed MaaS API."
