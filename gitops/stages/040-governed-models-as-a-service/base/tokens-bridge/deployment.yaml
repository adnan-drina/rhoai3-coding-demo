apiVersion: v1
kind: ConfigMap
metadata:
  name: tokens-bridge-config
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "14"
data:
  proxy.py: |
    import http.server, json, os, ssl, urllib.request
    MAAS_API = "https://maas-api.redhat-ods-applications.svc.cluster.local:8443"
    PLAYGROUND_SUBSCRIPTION = os.environ.get("PLAYGROUND_MAAS_SUBSCRIPTION", "demo-models-subscription")
    ctx = ssl.create_default_context()
    ctx.check_hostname = False
    ctx.verify_mode = ssl.CERT_NONE
    def forwarded_groups(header_value):
        if not header_value:
            return ""
        stripped = header_value.strip()
        if stripped.startswith("["):
            return stripped
        return json.dumps([group.strip() for group in stripped.split(",") if group.strip()])
    class Handler(http.server.BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(length) if length else b'{}'
            try: data = json.loads(body)
            except: data = {}
            bearer = self.headers.get("Authorization", "")
            forwarded_token = self.headers.get("X-Forwarded-Access-Token", "")
            if not bearer and forwarded_token:
                bearer = f"Bearer {forwarded_token}"
            username = (
                self.headers.get("X-MaaS-Username", "")
                or self.headers.get("X-Forwarded-User", "")
            )
            groups = (
                self.headers.get("X-MaaS-Group", "")
                or forwarded_groups(self.headers.get("X-Forwarded-Groups", ""))
            )
            api_key_body = json.dumps({
                "name": f"playground-{data.get('model','auto')}",
                "subscription": data.get("subscription") or PLAYGROUND_SUBSCRIPTION,
            }).encode()
            req = urllib.request.Request(
                f"{MAAS_API}/v1/api-keys", data=api_key_body,
                headers={"Content-Type": "application/json",
                    "Authorization": bearer,
                    "X-MaaS-Username": username,
                    "X-MaaS-Group": groups},
                method="POST")
            try:
                resp = urllib.request.urlopen(req, context=ctx)
                resp_data = json.loads(resp.read())
                api_key = (
                    resp_data.get("key")
                    or resp_data.get("token")
                    or resp_data.get("apiKey")
                    or ""
                )
                token_data = {
                    "key": api_key,
                    "token": api_key,
                    "keyPrefix": resp_data.get("keyPrefix", ""),
                    "id": resp_data.get("id", ""),
                    "expiresAt": resp_data.get("expiresAt", ""),
                    "expiration": resp_data.get("expiresAt") or "720h0m0s",
                }
                result = {**token_data, "data": token_data}
                print(json.dumps({
                    "event": "maas_token_created",
                    "path": self.path,
                    "upstream_fields": sorted(resp_data.keys()),
                    "key_length": len(api_key),
                    "subscription": resp_data.get("subscription", PLAYGROUND_SUBSCRIPTION),
                }), flush=True)
                self.send_response(201)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps(result).encode())
            except Exception as e:
                print(json.dumps({"event": "maas_token_create_failed", "error": str(e)}), flush=True)
                self.send_response(500)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(json.dumps({"error": str(e)}).encode())
        def log_message(self, format, *args): pass
    http.server.HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokens-bridge
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tokens-bridge
  template:
    metadata:
      labels:
        app: tokens-bridge
      annotations:
        demo.rhoai.redhat.com/config-version: "gen-ai-token-compat-v1"
    spec:
      containers:
      - name: proxy
        image: registry.redhat.io/ubi9/python-312:latest
        command: ["python3", "/app/proxy.py"]
        env:
        - name: PLAYGROUND_MAAS_SUBSCRIPTION
          value: demo-models-subscription
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /app
      volumes:
      - name: config
        configMap:
          name: tokens-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: tokens-bridge
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  selector:
    app: tokens-bridge
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-api-tokens-rewrite
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /maas-api/v1/tokens
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /v1/tokens
    backendRefs:
    - name: tokens-bridge
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gen-ai-maas-tokens-compat
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: data-science-gateway
    namespace: openshift-ingress
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /gen-ai/api/v1/maas/tokens
    backendRefs:
    - name: tokens-bridge
      port: 8080
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: maas-api-tokens-auth
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-api-tokens-rewrite
  rules:
    authentication:
      openshift-identities:
        kubernetesTokenReview:
          audiences:
            - https://kubernetes.default.svc
            - maas-default-gateway-sa
        metrics: false
    authorization: {}
    response:
      success:
        headers:
          X-MaaS-Group:
            metrics: false
            plain:
              selector: "auth.identity.user.groups.@tostr"
          X-MaaS-Username:
            metrics: false
            plain:
              selector: "auth.identity.user.username"
