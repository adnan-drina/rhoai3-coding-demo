---
# Sync hook: provision the Gen AI playground custom endpoint "GPT-6 Luna (Playground)" in demo-sandbox.
# Mints (or keeps) a MaaS API key for the playground-sandbox subscription as the provisioner
# ServiceAccount, stores it in the Secret the dashboard BFF expects (endpoint-api-key-<id>, key
# api_key) and writes the BFF's endpoints ConfigMap (gen-ai-aa-custom-model-endpoints, config.yaml)
# with a remote::openai provider pointing at the MaaS gateway (the same public URL the playground's
# own MaaS providers use). Custom endpoints carry no
# provider-level max_tokens default, which reasoning models reject on the MaaS provider path
# (RHOAIENG-90257). The ConfigMap is created only when absent or already ours; a ConfigMap that
# users extended from the UI is left untouched.
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-playground-endpoint
  namespace: demo-sandbox
  labels:
    app.kubernetes.io/name: playground-endpoint-provisioner
    app.kubernetes.io/component: playground-custom-endpoint
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: playground-maas-key-provisioner
      containers:
        - name: provision
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -ceu
            - |
              NS="demo-sandbox"
              SUBSCRIPTION="playground-sandbox"
              PROVIDER_ID="endpoint-gpt-6-luna-maas"
              MODEL_ID="gpt-6-luna"
              DISPLAY_NAME="GPT-6 Luna (Playground)"
              SECRET_NAME="endpoint-api-key-gpt-6-luna-maas"
              CM_NAME="gen-ai-aa-custom-model-endpoints"
              MAAS_HOST="$(oc get gateway maas-default-gateway -n openshift-ingress -o jsonpath='{.spec.listeners[?(@.name=="api")].hostname}')"
              if [ -z "${MAAS_HOST}" ] || echo "${MAAS_HOST}" | grep -q placeholder; then echo "ERROR: MaaS Gateway api hostname is not ready" >&2; exit 1; fi
              MAAS_BASE_URL="https://${MAAS_HOST}"
              SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"

              secret_value() { oc get secret "${SECRET_NAME}" -n "${NS}" -o "jsonpath={.data.$1}" 2>/dev/null | base64 -d 2>/dev/null || true; }
              # The stored key is re-used while the MaaS API still reports it active for this subscription
              # (public GET /maas-api/v1/api-keys/{id} as the owning ServiceAccount); the internal validate
              # endpoint is reachable only from the MaaS namespaces. Keys default to the server maximum
              # (API_KEY_MAX_EXPIRATION_DAYS, 90 days); an expired or revoked key is re-minted on the next sync.
              key_state() {
                curl -sk -m 20 -H "Authorization: Bearer ${SA_TOKEN}" "${MAAS_BASE_URL}/maas-api/v1/api-keys/$1" \
                  | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""), d.get("subscription",""))' 2>/dev/null || true
              }

              current_key="$(secret_value api_key)"; current_id="$(secret_value key_id)"; current_state=""
              [ -n "${current_key}" ] && [ -n "${current_id}" ] && current_state="$(key_state "${current_id}")"
              if [ "${current_state}" = "active ${SUBSCRIPTION}" ]; then
                echo "Keeping the existing MaaS API key for ${SUBSCRIPTION}"
                key="${current_key}"; id="${current_id}"; expires_at="$(secret_value expires_at)"
              else
                if [ -n "${current_id}" ]; then
                  status=$(curl -sk --retry 3 --retry-delay 3 -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${SA_TOKEN}" "${MAAS_BASE_URL}/maas-api/v1/api-keys/${current_id}")
                  echo "Revoked previous key ${current_id} (HTTP ${status})"
                fi
                response="$(mktemp)"; key=""
                # The subscription and its model may still be reconciling in the same sync; retry briefly.
                for attempt in $(seq 1 18); do
                  status=$(curl -sk -o "${response}" -w '%{http_code}' -X POST -H "Authorization: Bearer ${SA_TOKEN}" -H "Content-Type: application/json" \
                    -d "{\"name\":\"playground-sandbox-${MODEL_ID}\",\"subscription\":\"${SUBSCRIPTION}\"}" "${MAAS_BASE_URL}/maas-api/v1/api-keys")
                  key="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("key",""))' "${response}" 2>/dev/null || true)"
                  if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ] && echo "${key}" | grep -q '^sk-oai-'; then break; fi
                  echo "Key creation attempt ${attempt}: HTTP ${status}; retrying in 10s"; key=""; sleep 10
                done
                [ -n "${key}" ] || { echo "ERROR: MaaS API did not return a valid key for ${SUBSCRIPTION}" >&2; exit 1; }
                id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "${response}")"
                expires_at="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("expiresAt",""))' "${response}")"
                rm -f "${response}"
                echo "Provisioned a MaaS API key for ${SUBSCRIPTION} (id ${id}, expires ${expires_at:-unset})"
              fi
              oc create secret generic "${SECRET_NAME}" -n "${NS}" \
                --from-literal=api_key="${key}" --from-literal=key_id="${id}" --from-literal=expires_at="${expires_at}" --from-literal=subscription="${SUBSCRIPTION}" \
                --dry-run=client -o yaml | oc apply -f -

              if oc get configmap "${CM_NAME}" -n "${NS}" >/dev/null 2>&1; then
                if oc get configmap "${CM_NAME}" -n "${NS}" -o jsonpath='{.data.config\.yaml}' | grep -q "provider_id: ${PROVIDER_ID}"; then
                  echo "Custom endpoint ${PROVIDER_ID} already registered in ${CM_NAME}"
                  # Reconcile the display name of our own entry (exact line, scoped to our model block) so a
                  # rename in Git reaches an existing ConfigMap; nothing else in the ConfigMap is touched.
                  oc get configmap "${CM_NAME}" -n "${NS}" -o json | python3 -c '
              import json, re, sys
              cm = json.load(sys.stdin); cfg = cm["data"]["config.yaml"]; pid, mid, name = sys.argv[1:4]
              pat = re.compile(r"(provider_id: " + re.escape(pid) + r"\n\s*model_id: " + re.escape(mid) + r"\n\s*model_type: \w+\n\s*metadata:\n\s*display_name: )(.*)")
              m = pat.search(cfg)
              if not m: sys.exit("ERROR: our model entry was not found in the expected shape; display name not reconciled")
              if m.group(2).strip() == name: print("display name already " + name); sys.exit(0)
              new = cfg[:m.start(2)] + name + cfg[m.end(2):]
              print(json.dumps({"data": {"config.yaml": new}}), file=open("/tmp/cm-patch.json", "w")); print("display name " + m.group(2).strip() + " -> " + name)
              ' "${PROVIDER_ID}" "${MODEL_ID}" "${DISPLAY_NAME}"
                  if [ -s /tmp/cm-patch.json ]; then oc patch configmap "${CM_NAME}" -n "${NS}" --type=merge --patch-file=/tmp/cm-patch.json; fi
                else
                  echo "WARNING: ${CM_NAME} exists with endpoints managed from the UI; not modifying it. Add ${DISPLAY_NAME} (model ${MODEL_ID}, ${MAAS_BASE_URL}/v1) from AI asset endpoints if wanted."
                fi
                exit 0
              fi
              cat <<CMEOF | oc apply -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: ${CM_NAME}
                namespace: ${NS}
                labels:
                  app.kubernetes.io/part-of: rhoai3-coding-demo
              data:
                config.yaml: |
                  providers:
                    inference:
                      - provider_id: ${PROVIDER_ID}
                        provider_type: remote::openai
                        config:
                          base_url: ${MAAS_BASE_URL}/v1
                          allowed_models:
                            - ${MODEL_ID}
                          custom_gen_ai:
                            api_key:
                              secretRef:
                                name: ${SECRET_NAME}
                                key: api_key
                  registered_resources:
                    models:
                      - provider_id: ${PROVIDER_ID}
                        model_id: ${MODEL_ID}
                        model_type: llm
                        metadata:
                          display_name: ${DISPLAY_NAME}
                          custom_gen_ai:
                            use_cases: Reasoning model through the governed MaaS gateway; chat with Temperature 1.
              CMEOF
              echo "Custom endpoint ${DISPLAY_NAME} registered in ${NS}/${CM_NAME}"
