---
# Gen AI Studio playground agent profile for the pre-provisioned custom endpoint "GPT-6 Luna (MaaS)"
# (see playground-endpoint-provisioner-job.yaml). sourceType custom_endpoint selects that endpoint
# rather than the MaaS catalog entry of the same model id; temperature 1 is the only value the
# reasoning model accepts. The playground matches a profile to a model by model id plus source type;
# the uri is informational and uses the gateway's in-cluster Service like the other profiles.
# The uuid is uuid5 of "rhoai3-coding-demo/agent-profile/gpt-6-luna".
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-profile-aafc49ad-cab2-597c-a78e-7a5924005061
  namespace: demo-sandbox
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/agent-profile: "true"
    app.kubernetes.io/name: agent-profile-gpt-6-luna
    app.kubernetes.io/component: playground-agent-profile
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
data:
  profile.yaml: |
    apiVersion: genai.redhat.com/v1alpha1
    kind: AgentProfile
    metadata:
      name: aafc49ad-cab2-597c-a78e-7a5924005061
    spec:
      displayName: GPT-6 Luna
      description: Uses the pre-provisioned "GPT-6 Luna (MaaS)" custom endpoint; the reasoning model accepts only the default temperature (1).
      model:
        id: gpt-6-luna
        uri: https://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local
        sourceType: custom_endpoint
      temperature: 1
      stream: true
