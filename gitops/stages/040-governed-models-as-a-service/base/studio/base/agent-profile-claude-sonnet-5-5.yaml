---
# Gen AI Studio playground agent profile (Technology Preview). The dashboard BFF lists ConfigMaps
# labelled opendatahub.io/agent-profile=true whose name is agent-profile-<uuid>; loading the profile
# in a playground applies the model, temperature and streaming flag. The uuid is a fixed uuid5 of
# "rhoai3-coding-demo/agent-profile/claude-sonnet-5-5" so the object is stable across environments.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-profile-da16726b-d829-5a98-8299-3c06eb9f4dba
  namespace: demo-sandbox
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/agent-profile: "true"
    app.kubernetes.io/name: agent-profile-claude-sonnet-5-5
    app.kubernetes.io/component: playground-agent-profile
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
data:
  profile.yaml: |
    apiVersion: genai.redhat.com/v1alpha1
    kind: AgentProfile
    metadata:
      name: da16726b-d829-5a98-8299-3c06eb9f4dba
    spec:
      displayName: Claude Sonnet 5.5
      description: Claude 5.x accepts only the default temperature (1) and rejects top_p; this preset keeps playground requests valid.
      model:
        id: claude-sonnet-5-5
        uri: https://maas-default-gateway-data-science-gateway-class.openshift-ingress.svc.cluster.local
        sourceType: maas
      temperature: 1
      stream: true
