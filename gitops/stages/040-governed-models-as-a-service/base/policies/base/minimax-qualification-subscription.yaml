---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: minimax-qualification
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: minimax-qualification
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: '18'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
    - ai-admin
  modelRefs:
  - name: minimax-m2
    namespace: external-models
    tokenRateLimits:
    - limit: 10000
      window: 1h
  priority: 100
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: personal-access
