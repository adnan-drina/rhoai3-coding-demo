apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: rhoai-developers-gpt-4o-mini
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: rhoai-developers-gpt-4o-mini
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups:
      - name: rhoai-developers
      - name: rhods-admins
    users:
      - kube:admin
      # Stage 050 workspace key provisioner: creates per-developer MaaS keys
      # for Dev Spaces (Continue/OpenCode) on this subscription.
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
  modelRefs:
    - name: nemotron-3-nano-30b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1h
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1h
    - name: gpt-4o-mini
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 20000
          window: 1h
  priority: 100
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: nemotron-qwen-and-gpt-4o-mini
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: rhoai-developers-gpt-4o-mini
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: rhoai-developers-gpt-4o-mini
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    groups:
      - name: rhoai-developers
      - name: rhods-admins
    users:
      - kube:admin
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
  modelRefs:
    - name: nemotron-3-nano-30b-a3b
      namespace: models-as-a-service
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
    - name: gpt-4o-mini
      namespace: models-as-a-service
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: nemotron-qwen-and-gpt-4o-mini
