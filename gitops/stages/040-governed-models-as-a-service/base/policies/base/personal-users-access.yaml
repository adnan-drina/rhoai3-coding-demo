# Personal subscriptions for interactive users. Priority 150 ensures these win
# subscription selection when a user-token key is created (e.g. GenAI
# Playground), so personal usage is metered separately from service-account
# provisioners.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: personal-kube-admin
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: personal-kube-admin
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - kube:admin
  modelRefs:
    - name: granite-4-0-h-small
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: gpt-4o-mini
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1h
  priority: 150
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: personal-access
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: personal-kube-admin
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: personal-kube-admin
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - kube:admin
  modelRefs:
    - name: granite-4-0-h-small
      namespace: models-as-a-service
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
    - name: gpt-4o-mini
      namespace: models-as-a-service
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: personal-access
---
