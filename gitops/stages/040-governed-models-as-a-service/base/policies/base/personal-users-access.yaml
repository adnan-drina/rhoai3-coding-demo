# Personal subscriptions for interactive users. Priority 150 ensures these win
# subscription selection when a user-token key is created (e.g. GenAI
# Playground), so personal usage is metered separately from service-account
# provisioners.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: personal-kube-admin
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: personal-kube-admin
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - kube:admin
  modelRefs:
    - name: qwen3-6-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: qwen3-8-27b-int4
      namespace: internal-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: gpt-6-luna
      namespace: external-models
      tokenRateLimits:
        - limit: 100000
          window: 1h
    - name: gpt-4-1
      namespace: external-models
      tokenRateLimits:
        - limit: 100000
          window: 1h
    # Native Messages usage is not subscription-token-metered; provider limits apply.
    - name: claude-sonnet-5-5
      namespace: external-models
      tokenRateLimits:
        - limit: 100000
          window: 1h
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
      tokenRateLimits:
        - limit: 100000
          window: 1h
  priority: 160
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: personal-access
---
apiVersion: maas.opendatahub.io/v1alpha1
