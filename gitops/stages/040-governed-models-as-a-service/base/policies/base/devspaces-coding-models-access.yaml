apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: devspaces-coding-models
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: devspaces-coding-models
    app.kubernetes.io/component: maas-subscription
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    users:
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
  modelRefs:
    # Sized for agentic assistants (Kilo Code in 060, OpenCode in 070): a
    # single agent turn carries system prompt + rules + file context, so the
    # old 100K/h chat-era budget exhausted within a few turns (observed live
    # 2026-07-14 as gateway 429s mid-demo). Local models ride our own GPUs;
    # external Red Hat internal models keep a generous demo budget.
    - name: nemotron-3-nano-30b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: qwen3-235b
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: minimax-m2
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: granite-embedding-english-r2
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 500000
          window: 1h
  priority: 100
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: devspaces-coding
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: devspaces-coding-models
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: devspaces-coding-models
    app.kubernetes.io/component: maas-auth-policy
    demo.rhoai.io/provider: governed-models
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  subjects:
    users:
      - system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner
  modelRefs:
    - name: nemotron-3-nano-30b-a3b
      namespace: models-as-a-service
    - name: qwen3-6-35b-a3b
      namespace: models-as-a-service
    - name: qwen3-235b
      namespace: models-as-a-service
    - name: minimax-m2
      namespace: models-as-a-service
    - name: granite-embedding-english-r2
      namespace: models-as-a-service
  meteringMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: devspaces-coding
