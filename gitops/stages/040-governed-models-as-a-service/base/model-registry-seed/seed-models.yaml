apiVersion: batch/v1
kind: Job
metadata:
  name: model-registry-seed
  namespace: rhoai-model-registries
  labels:
    app: model-registry-seed
  annotations:
    argocd.argoproj.io/sync-wave: "22"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: model-registry-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: quay.io/curl/curl:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: REGISTRY_URL
              value: "http://demo-registry.rhoai-model-registries.svc:8080"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              API_BASE="${REGISTRY_URL}/api/model_registry/v1alpha3"

              echo "Waiting for Model Registry API..."
              for i in $(seq 1 30); do
                if curl -sf "${API_BASE}/registered_models" > /dev/null 2>&1; then
                  echo "Model Registry API is ready"
                  break
                fi
                echo "  Attempt $i/30 - waiting..."
                sleep 10
              done

              register_model() {
                local NAME="$1" DESC="$2" VERSION="$3" URI="$4" FORMAT="$5"
                shift 5
                local TAGS="$*"

                echo ""
                echo "Registering model: ${NAME}..."

                EXISTING=$(curl -sf "${API_BASE}/registered_models" 2>/dev/null || echo "{}")
                if echo "$EXISTING" | grep -q "\"name\":\"${NAME}\""; then
                  echo "  Model '${NAME}' already exists - skipping"
                  return 0
                fi

                echo "  [1/3] Creating RegisteredModel..."
                PROPS=""
                for tag in $TAGS; do
                  KEY="${tag%%=*}"
                  VALUE=""
                  [ "$tag" != "$KEY" ] && VALUE="${tag#*=}"
                  PROPS="${PROPS}\"${KEY}\":{\"metadataType\":\"MetadataStringValue\",\"string_value\":\"${VALUE}\"},"
                done
                PROPS="${PROPS%,}"

                RM_RESP=$(curl -sf -X POST "${API_BASE}/registered_models" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "name": "'"${NAME}"'",
                    "description": "'"${DESC}"'",
                    "owner": "ai-admin",
                    "customProperties": {'"${PROPS}"'}
                  }' 2>&1)

                RM_ID=$(echo "$RM_RESP" | sed 's/.*"id":"\([^"]*\)".*/\1/' | head -1)
                echo "  Created RegisteredModel ID: ${RM_ID}"

                echo "  [2/3] Creating ModelVersion..."
                MV_RESP=$(curl -sf -X POST "${API_BASE}/model_versions" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "name": "'"${VERSION}"'",
                    "description": "Deployed via LLMInferenceService in maas namespace",
                    "author": "ai-admin",
                    "registeredModelId": "'"${RM_ID}"'",
                    "customProperties": {
                      "serving_runtime": {"metadataType": "MetadataStringValue", "string_value": "vLLM"},
                      "deployed_on": {"metadataType": "MetadataStringValue", "string_value": "RHOAI 3.4"}
                    }
                  }' 2>&1)

                MV_ID=$(echo "$MV_RESP" | sed 's/.*"id":"\([^"]*\)".*/\1/' | head -1)
                echo "  Created ModelVersion ID: ${MV_ID}"

                echo "  [3/3] Creating ModelArtifact..."
                curl -sf -X POST "${API_BASE}/model_versions/${MV_ID}/artifacts" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "name": "'"${VERSION}"'",
                    "description": "OCI model image",
                    "uri": "'"${URI}"'",
                    "artifactType": "model-artifact",
                    "modelFormatName": "'"${FORMAT}"'",
                    "modelFormatVersion": "1"
                  }' > /dev/null 2>&1

                echo "  Registered: ${NAME} (${VERSION})"
              }

              register_model \
                "qwen3-6-35b-a3b" \
                "Qwen3.6 35B A3B (FP8-dynamic) - Red Hat AI validated mixture-of-experts model (35B total, 3B active parameters) for coding, reasoning, and multimodal tasks. Quantized by Red Hat AI with llm-compressor for single-GPU serving on NVIDIA L40S; deployed with a 32K context window through the private vLLM runtime." \
                "v3.0" \
                "oci://registry.redhat.io/rhai/modelcar-redhatai-qwen3-6-35b-a3b-fp8-dynamic:3.0" \
                "vLLM" \
                provider=Alibaba-Qwen validated_by=RedHatAI source_repo=https://huggingface.co/RedHatAI/Qwen3.6-35B-A3B-FP8-dynamic license=apache-2.0 architecture=MoE-35B-A3B quantization=FP8-dynamic context_window_deployed=32768 primary_use=coding-assistant capabilities=code,reasoning,tool-calling,vision

              register_model \
                "nemotron-3-nano-30b-a3b" \
                "NVIDIA Nemotron 3 Nano 30B A3B (FP8) - long-context reasoning and code assistant with tool calling. 30B mixture-of-experts with 3B active parameters, serving a 131K token context for repository-scale prompts on a single NVIDIA L40S through the private vLLM runtime." \
                "v3.0" \
                "oci://registry.redhat.io/rhai/modelcar-nvidia-nemotron-3-nano-30b-a3b-fp8:3.0" \
                "vLLM" \
                provider=NVIDIA validated_by=RedHatAI source_repo=https://huggingface.co/RedHatAI/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8 license=nvidia-open-model license_note=review-before-production architecture=MoE-30B-A3B quantization=FP8 context_window_deployed=131072 primary_use=long-context-reasoning capabilities=code,reasoning,tool-calling

              echo ""
              echo "Model registration complete."
              echo "Models are visible in: AI hub > Model registry > Demo Registry"
