# Custom observability dashboard for the OpenShift AI Observability page (rendered as a tab because its name starts with
# dashboard-). Generated by stages/040-governed-models-as-a-service/gen-cost-dashboards.py; edit the generator, not this file.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-5-cost-per-token-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-5-cost-per-token-admin
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  config:
    display:
      name: Cost per token
      description: 'Showback: tokens served by the private models and governed MaaS users, priced with editable per-million-token prices.'
    duration: 168h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue: $__all
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model_name
            matchers:
            - kserve_vllm:prompt_tokens_total
    - kind: ListVariable
      spec:
        name: user
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue: $__all
        display:
          name: User
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: user
            matchers:
            - authorized_hits_total{user!=""}
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue: $__all
        display:
          name: Subscription
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: subscription
            matchers:
            - authorized_hits_total{subscription!=""}
    - kind: TextVariable
      spec:
        name: price_prompt
        value: '0.10'
        constant: false
        display:
          name: Price $/1M prompt tokens
          description: Showback price for prompt (input) tokens, USD per million; edit per model or contract.
          hidden: false
    - kind: TextVariable
      spec:
        name: price_completion
        value: '0.40'
        constant: false
        display:
          name: Price $/1M completion tokens
          description: Showback price for generated (output) tokens, USD per million.
          hidden: false
    - kind: TextVariable
      spec:
        name: price_blended
        value: '0.25'
        constant: false
        display:
          name: Blended $/1M tokens (per user)
          description: MaaS counts total tokens per user and subscription without an input/output split; this blended price values them.
          hidden: false
    panels:
      totalCost:
        kind: Panel
        spec:
          display:
            name: Total cost
            description: Prompt and completion tokens served by the private models over the Range window, priced with the dashboard's price variables.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range])) / 1e6 * $price_prompt) + (sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))
                    / 1e6 * $price_completion))
      totalTokens:
        kind: Panel
        spec:
          display:
            name: Total tokens
            description: Prompt plus completion tokens over the Range window.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range]))) + sum(sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range])))
      blendedCost:
        kind: Panel
        spec:
          display:
            name: Observed $/1M tokens
            description: 'Total cost divided by total tokens: the blended price actually realised with the current input/output mix.'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 3
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range])) / 1e6 * $price_prompt) + (sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))
                    / 1e6 * $price_completion)) / clamp_min(sum(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range]))) + sum(sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))),
                    1) * 1e6
      costPer1kRequests:
        kind: Panel
        spec:
          display:
            name: $ per 1K requests
            description: Total cost divided by governed requests (MaaS authorized calls) over the Range window.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 3
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range])) / 1e6 * $price_prompt) + (sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))
                    / 1e6 * $price_completion)) / clamp_min(sum(increase(authorized_calls_total{user!=""}[$__range])), 1) * 1000
      costOverTime:
        kind: Panel
        spec:
          display:
            name: Cost rate by model
            description: Hourly spend by model at the dashboard prices.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum by (model_name) (rate(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__rate_interval])) * 3600 / 1e6 * $price_prompt) + (sum by (model_name) (rate(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__rate_interval]))
                    * 3600 / 1e6 * $price_completion)
                  seriesNameFormat: '{{model_name}} $/h'
      tokensOverTime:
        kind: Panel
        spec:
          display:
            name: Token rate by model
            description: Prompt and completion tokens per second by model.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model_name) (rate(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__rate_interval]))
                  seriesNameFormat: '{{model_name}} prompt'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model_name) (rate(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__rate_interval]))
                  seriesNameFormat: '{{model_name}} completion'
      costByModel:
        kind: Panel
        spec:
          display:
            name: Cost by model
            description: Tokens and cost per model over the Range window.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - align: left
                enableSorting: true
                header: Model
                name: model_name
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  shortValues: true
                  unit: decimal
                header: Prompt tokens
                name: 'value #1'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  shortValues: true
                  unit: decimal
                header: Completion tokens
                name: 'value #2'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 2
                  unit: decimal
                header: Cost ($)
                name: 'value #3'
                sort: desc
              density: compact
              pagination: true
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range]))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum by (model_name) (increase(kserve_vllm:prompt_tokens_total{model_name=~"$model"}[$__range])) / 1e6 * $price_prompt) + (sum by (model_name) (increase(kserve_vllm:generation_tokens_total{model_name=~"$model"}[$__range]))
                    / 1e6 * $price_completion)
      costByUser:
        kind: Panel
        spec:
          display:
            name: Cost by user and subscription
            description: Governed MaaS tokens per user, subscription and model over the Range window, valued at the blended price.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - align: left
                enableSorting: true
                header: User
                name: user
              - align: left
                enableSorting: true
                header: Subscription
                name: subscription
              - align: left
                enableSorting: true
                header: Model
                name: model
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  shortValues: true
                  unit: decimal
                header: Tokens
                name: 'value #1'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Requests
                name: 'value #2'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 2
                  unit: decimal
                header: Cost ($)
                name: 'value #3'
                sort: desc
              density: compact
              pagination: true
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: round(sum by (user, subscription, model) (increase(authorized_hits_total{user!="", user=~"$user", subscription=~"$subscription", model=~"$model"}[$__range])))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: round(sum by (user, subscription, model) (increase(authorized_calls_total{user!="", user=~"$user", subscription=~"$subscription"}[$__range])))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (user, subscription, model) (increase(authorized_hits_total{user!="", user=~"$user", subscription=~"$subscription", model=~"$model"}[$__range])) / 1e6 * $price_blended
    layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/totalCost'
        - x: 6
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/totalTokens'
        - x: 12
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/blendedCost'
        - x: 18
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/costPer1kRequests'
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/costOverTime'
        - x: 12
          y: 0
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/tokensOverTime'
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/costByModel'
        - x: 0
          y: 8
          width: 24
          height: 10
          content:
            $ref: '#/spec/panels/costByUser'
