apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-6-27b
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: qwen3-6-27b
    app.kubernetes.io/component: local-llm
    inference.optimization/acceleratorName: L40S
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
    llm-d.ai/deployment-mode: single-gpu-per-replica
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: Qwen3.6 27B FP8
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
    # Governed GPU quota via the Stage 020 HardwareProfile (Queue-based), so the
    # dashboard shows "GPU Reserved - Demo Team" instead of "Custom". The profile
    # binds lq-gpu-reserved-demo — matching this model's queue-name label above.
    opendatahub.io/hardware-profile-name: gpu-reserved-demo
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  model:
    name: qwen3-6-27b
    uri: hf://RedHatAI/Qwen3.6-27B-FP8
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler:
      # Lean scheduler profile (2026-07-14): prefix-cache scoring picks among
      # REPLICAS - at replicas: 1 it scores nothing, so it is disabled here.
      # NOTE: this operator build stamps the tokenizer + modelcar containers
      # onto the scheduler pod REGARDLESS of the plugin config, so the 30-37
      # GiB modelcar image still lands on a CPU worker (verified live; RFE
      # candidate - container composition should follow the config). Removing
      # them entirely needs a bring-your-own EPP via pool.endpointPickerRef
      # (BACKLOG). Revisit this profile if a model scales beyond one replica.
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: max-score-picker
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: qwen3-6-27b-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen3-6-27b
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
  template:
    containers:
      - name: main
        # No image override: the RHOAI operator supplies the supported vLLM
        # runtime through the versioned kserve-config-llm-template config.
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        # Orchestrator profile per the RedHatAI/Qwen3.6-27B-FP8 model card
        # (vLLM section): reasoning + tool-call parsers as the 35B coder
        # runs today, --language-model-only to skip the vision encoder
        # entirely (the card's documented KV-headroom mode for this
        # multimodal checkpoint), 131072 window (native 262K does not fit
        # 48GB; 131K matches every client's context arithmetic). Hybrid
        # GDN/mamba family like the 35B: mamba-aligned 4096 batched tokens,
        # low seq cap (orchestrator = few long sessions; per-slot state is
        # the cost driver). Weights ~28GB FP8 on the 44.4GiB card.
        # NOTE: served from Hugging Face (hf://) — no official modelcar
        # exists for this model yet (verified 2026-07-25); graduate to a
        # modelcar (own build or official when published) per BACKLOG.
        env:
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --disable-uvicorn-access-log
          - --enable-prefix-caching
          - --max-model-len=131072
          - --kv-cache-dtype=fp8
          - --gpu-memory-utilization=0.92
          - --language-model-only
          - --max-num-batched-tokens=4096
          - --max-num-seqs=8
          # Model-card Best Practices: thinking-mode sampling for general
          # (agentic/orchestration) tasks as the server default; explicit
          # client sampling still wins. The precise-coding profile (0.6)
          # belongs to the 35B worker seat, not here.
          - --override-generation-config={"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
            # One full L40S per model: time-slicing is disabled in Stage 020,
            # so a 1-GPU request is exclusive-card placement by definition.
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
