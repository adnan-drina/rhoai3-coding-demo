apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-8-27b
  namespace: internal-models
  labels:
    app.kubernetes.io/name: qwen3-8-27b
    # Quantization of the served checkpoint; the qwen38-fp8 component sets fp8.
    demo.rhoai.io/quantization: nvfp4
    app.kubernetes.io/component: local-llm
    inference.optimization/acceleratorName: RTX-PRO-6000
    kueue.x-k8s.io/queue-name: lq-gpu-rtxpro6000
    llm-d.ai/deployment-mode: single-gpu-per-replica
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    # Deployments tab on the model card. Ids are assigned by demo-registry.
    # register-model-cards.sh registers the NVFP4 artifact and stamps the ids.
    # register-model-cards.sh restamps these after a fresh registry, and
    # Argo CD ignores drift on the three modelregistry labels.
    modelregistry.opendatahub.io/name: demo-registry
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: Qwen3.8 27B NVFP4
    openshift.io/description: "Qwen 3.8 27B, NVFP4 quantization (RedHatAI/Qwen3.8-27B-NVFP4 @2889ddee), on one NVIDIA RTX PRO 6000 Blackwell; MTP speculative decoding; 262,144-token context. Model id qwen3-8-27b is format-neutral."
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
    # Stage 020 RTX PRO 6000 (g7e.2xlarge) profile; its Kueue flavor places the
    # pod. Chosen by the 2026-10-13 serving study (docs/OPERATIONS.md).
    opendatahub.io/hardware-profile-name: gpu-rtxpro6000
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  model:
    name: qwen3-8-27b
    # Pinned revision. KServe storage-initializer form is
    # hf://owner/model[:revision]. No official OCI modelcar is listed for
    # this checkpoint in the Red Hat validated-model matrix (reviewed
    # 2026-09-22), so the documented Hugging Face URI is the artifact source.
    # This model is not a Red Hat validated model on RHOAI 3.4. A successful
    # local load is compatibility with the installed runtime, not validation.
    uri: hf://RedHatAI/Qwen3.8-27B-NVFP4:2889ddeeda282f17fc9e159a42125e535159a5e5
  # Default coding model since 2026-10-13. Argo ignores replicas; scale with oc.
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
          sectionName: qwen3-8
        - name: maas-default-gateway
          namespace: openshift-ingress
          sectionName: api
    route: {}
    scheduler:
      # Lean single-replica profile: prefix-cache scoring
      # only helps when more than one replica exists. The operator still
      # schedules the picker on CPU capacity.
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: max-score-picker
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: qwen3-8-27b-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen3-8-27b
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
  template:
    containers:
      - name: main
        # No image override: the RHOAI operator supplies the supported vLLM
        # runtime. Do not substitute a nightly image.
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        # RedHatAI/Qwen3.8-27B-NVFP4 on one RTX PRO 6000 Blackwell (96 GB), text-only.
        # Checkpoint: compressed-tensors mixed precision, NVFP4 MLP with FP8
        # attention; vLLM runs it on the native FlashInfer CUTLASS NVFP4 kernel.
        # The MTP head is kept, so MTP speculative decoding runs per the card
        # (3 tokens). Batched tokens 16384 and async scheduling match the
        # measured study profile: 776 ms TTFT at 8k prompts x8, 302.6 tok/s,
        # 6.37 concurrent full-262144-token requests in the KV pool, and a
        # needle recalled at 248K prompt tokens. max-num-seqs is 16 so a
        # Stage 050 evaluation request with 16 samples decodes in one batch.
        # These are measurements on this cluster, not a Red Hat certification.
        # FP8 is the measured fallback; on this GPU (sm120) it needs
        # VLLM_USE_DEEP_GEMM=0 (TROUBLESHOOTING).
        # Hybrid prefix caching uses mamba-cache-mode=align because this
        # runtime rejects mode "all".
        # Use Qwen 3.8's recommended non-thinking sampling and mode together.
        # Ref: https://huggingface.co/Qwen/Qwen3.8-27B#best-practices
        # Hermes also pins these values per run; requests override defaults.
        # Thinking clients must explicitly select both mode and its sampling.
        # Single-node rollout is a Deployment with maxSurge 25%. At one
        # replica that asks for a second pod. When both GPUs are occupied,
        # delete the previous workload pod so the update can take its GPU.
        env:
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --disable-uvicorn-access-log
          - --enable-prefix-caching
          - --mamba-cache-mode=align
          - --max-model-len=262144
          - --kv-cache-dtype=fp8
          - --gpu-memory-utilization=0.90
          - --language-model-only
          - --max-num-batched-tokens=16384
          - --max-num-seqs=16
          - --async-scheduling
          - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
          - --override-generation-config={"temperature":0.7,"top_p":0.8,"top_k":20,"min_p":0.0,"presence_penalty":1.5,"repetition_penalty":1.0}
          - --default-chat-template-kwargs={"enable_thinking":false}
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - effect: NoSchedule
        key: nvidia-gpu-only
        operator: Exists
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
