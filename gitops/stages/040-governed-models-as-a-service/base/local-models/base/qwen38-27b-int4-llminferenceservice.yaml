apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-8-27b-int4
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: qwen3-8-27b-int4
    app.kubernetes.io/component: local-llm
    inference.optimization/acceleratorName: L40S
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
    llm-d.ai/deployment-mode: single-gpu-per-replica
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
    # Deployments tab on the model card. Ids are assigned by demo-registry.
    # This cluster: Qwen3.8-27B-INT4 is registered model 6, version v1.0 is 8.
    # register-model-cards.sh restamps these after a fresh registry, and
    # Argo CD ignores drift on the three modelregistry labels.
    modelregistry.opendatahub.io/name: demo-registry
    modelregistry.opendatahub.io/registered-model-id: "6"
    modelregistry.opendatahub.io/model-version-id: "8"
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: Qwen3.8 27B INT4
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
    # Same Stage 020 HardwareProfile and reserved queue as qwen3-6-27b.
    # One nvidia.com/gpu request is exclusive-card placement: time-slicing
    # is off, so the two models land on different GPU nodes.
    opendatahub.io/hardware-profile-name: gpu-reserved-demo
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  model:
    name: qwen3-8-27b-int4
    # Pinned revision. KServe storage-initializer form is
    # hf://owner/model[:revision]. No official OCI modelcar is listed for
    # this checkpoint in the Red Hat validated-model matrix (reviewed
    # 2026-09-22), so the documented Hugging Face URI is the artifact source.
    # This model is not a Red Hat validated model on RHOAI 3.4. A successful
    # local load is compatibility with the installed runtime, not validation.
    uri: hf://RedHatAI/Qwen3.8-27B-INT4:7fb3aaca2d21c0db4716572945208db40cef9966
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler:
      # Same lean single-replica profile as qwen3-6-27b: prefix-cache scoring
      # only helps when more than one replica exists. The operator still
      # schedules the picker on CPU capacity.
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: max-score-picker
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: qwen3-8-27b-int4-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen3-8-27b-int4
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
  template:
    containers:
      - name: main
        # No image override: the RHOAI operator supplies the supported vLLM
        # runtime. Do not substitute a nightly image.
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        # RedHatAI/Qwen3.8-27B-INT4 on one L40S, text-only.
        # Checkpoint: Qwen3_5ForConditionalGeneration, compressed-tensors
        # pack-quantized W4A16 (group 128). recipe.yaml uses AWQ smoothing
        # only; the export is compressed-tensors, so there is no AWQ loader.
        # FP8 KV scales ship in the artifact (k_scale/v_scale).
        # Speculative decoding is off. The card's dspark-preview drafter is
        # not a supported method on the installed runtime, and the sibling
        # MTP weights are not enabled.
        # 131072 was the starting context. The retained setting is 262144
        # after a 246077-token needle recall with a 512-token output reserve.
        # A 128-token cap was not enough at 222077 tokens because thinking
        # consumed it. These lengths are measured on this cluster, not a
        # Red Hat capacity certification. max-num-seqs stays 2, batched
        # tokens stay 4096, gpu-memory-utilization stays 0.90.
        # Hybrid prefix caching uses mamba-cache-mode=align because this
        # runtime rejects mode "all".
        # Sampling matches generation_config.json at the pinned revision
        # (temperature 1.0, top_p 0.95, top_k 20), not the Qwen 3.6 override.
        # Thinking stays at the chat template default (enabled, effort xhigh).
        # Single-node rollout is a Deployment with maxSurge 25%. At one
        # replica that asks for a second pod. When both GPUs are occupied,
        # delete the previous workload pod so the update can take its GPU.
        env:
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --disable-uvicorn-access-log
          - --enable-prefix-caching
          - --mamba-cache-mode=align
          - --max-model-len=262144
          - --kv-cache-dtype=fp8
          - --gpu-memory-utilization=0.90
          - --language-model-only
          - --max-num-batched-tokens=4096
          - --max-num-seqs=2
          - --override-generation-config={"temperature":1.0,"top_p":0.95,"top_k":20}
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_xml
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      - effect: NoSchedule
        key: nvidia-gpu-only
        operator: Exists
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
