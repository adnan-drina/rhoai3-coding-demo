# The llm-d router-scheduler pod carries the 30-37GiB modelcar image (operator
# RFE: the modelcar + tokenizer containers are stamped onto the CPU scheduler
# pod regardless of the scheduler config). The operator sets NO ephemeral-storage
# request on those containers, so kube-scheduler is disk-blind and co-locates two
# models' schedulers on one worker until its shared image/root disk fills
# (DiskPressure -> eviction churn; both models flap to MinimumReplicasUnavailable).
#
# This LimitRange supplies the missing default request (20Gi per container, ~60Gi
# per 3-container scheduler pod) so kube-scheduler accounts for the modelcar disk
# and spreads the scheduler pods across workers - no two co-locate on an ~88Gi
# node. cq-gpu-reserved-demo (Stage 020) covers ephemeral-storage so Kueue admits
# these pods. This is the anti-affinity-free spread: podAntiAffinity via the CR is
# not viable on this operator build (spec.router.scheduler.template is a full
# pod-template replace that drops the operator-injected containers).
apiVersion: v1
kind: LimitRange
metadata:
  name: modelcar-ephemeral-storage-defaults
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: local-models
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  limits:
    - type: Container
      defaultRequest:
        ephemeral-storage: 20Gi
