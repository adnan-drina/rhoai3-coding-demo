apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-6-35b-a3b
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: qwen3-6-35b-a3b
    app.kubernetes.io/component: local-llm
    inference.optimization/acceleratorName: L40S
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
    llm-d.ai/deployment-mode: single-gpu-per-replica
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: Qwen3.6 35B A3B FP8-dynamic
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
spec:
  model:
    name: qwen3-6-35b-a3b
    uri: oci://registry.redhat.io/rhai/modelcar-redhatai-qwen3-6-35b-a3b-fp8-dynamic:3.0
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler:
      # Lean scheduler profile (2026-07-14): prefix-cache scoring picks among
      # REPLICAS - at replicas: 1 it scores nothing, so it is disabled here.
      # NOTE: this operator build stamps the tokenizer + modelcar containers
      # onto the scheduler pod REGARDLESS of the plugin config, so the 30-37
      # GiB modelcar image still lands on a CPU worker (verified live; RFE
      # candidate - container composition should follow the config). Removing
      # them entirely needs a bring-your-own EPP via pool.endpointPickerRef
      # (BACKLOG). Revisit this profile if a model scales beyond one replica.
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: single-profile-handler
            - type: queue-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: max-score-picker
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: qwen3-6-35b-a3b-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen3-6-35b-a3b
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
  template:
    containers:
      - name: main
        # No image override: the RHOAI operator supplies the supported vLLM
        # runtime through the versioned kserve-config-llm-template config.
        env:
          # Reduce CUDA allocator fragmentation during weight load + graph
          # capture on the tight 35GB-weights/44GiB-card fit.
          - name: PYTORCH_ALLOC_CONF
            value: expandable_segments:True
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --disable-uvicorn-access-log
          - --enable-prefix-caching
          # ~35GB FP8 weights on a 44.4GiB-usable L40S: cap the context,
          # store KV/mamba cache in fp8, and trim the CUDA-graph budget so
          # engine init fits (bf16 KV at 32K OOMed by ~1GiB at graph capture).
          - --max-model-len=32768
          - --kv-cache-dtype=fp8
          - --gpu-memory-utilization=0.92
          # Text/code serving only: dropping image+video inputs removes the
          # multimodal encoder cache (16K-token budget profiled with a
          # max-size image) that consumed the remaining KV headroom.
          - --limit-mm-per-prompt={"image":0,"video":0}
          # 4096: must exceed the mamba-aligned attention block size (2096
          # tokens with fp8 KV) while keeping the MoE prefill workspace small;
          # 8192 pushed the profiling peak past the KV budget on this card.
          - --max-num-batched-tokens=4096
          # Hybrid GDN/mamba models allocate persistent per-slot state for
          # max_num_seqs sequences (~8.5GiB resident at the default): cap
          # concurrency to demo scale so the state cache fits next to 34.4GiB
          # of weights on the 44.4GiB card.
          - --max-num-seqs=64
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --reasoning-parser=qwen3
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 20Gi
            # One full L40S per model: time-slicing is disabled in Stage 020,
            # so a 1-GPU request is exclusive-card placement by definition.
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            # Page cache for the ~36GB modelcar counts against the pod cgroup.
            memory: 48Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
