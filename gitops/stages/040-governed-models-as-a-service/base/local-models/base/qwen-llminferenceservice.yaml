apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3-6-35b-a3b
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: qwen3-6-35b-a3b
    app.kubernetes.io/component: local-llm
    inference.optimization/acceleratorName: L40S
    kueue.x-k8s.io/queue-name: lq-gpu-reserved-demo
    llm-d.ai/deployment-mode: single-gpu-per-replica
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    openshift.io/display-name: Qwen3.6 35B A3B FP8-dynamic
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
spec:
  model:
    name: qwen3-6-35b-a3b
    uri: oci://registry.redhat.io/rhai/modelcar-redhatai-qwen3-6-35b-a3b-fp8-dynamic:3.0
  replicas: 1
  router:
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
    route: {}
    scheduler:
      pool:
        spec:
          endpointPickerRef:
            failureMode: FailOpen
            group: ""
            kind: Service
            name: qwen3-6-35b-a3b-epp-service
            port:
              number: 9002
          selector:
            matchLabels:
              app.kubernetes.io/name: qwen3-6-35b-a3b
              app.kubernetes.io/part-of: llminferenceservice
              kserve.io/component: workload
          targetPorts:
            - number: 8000
  template:
    # One private LLM per physical GPU node: two vLLM runtimes on one
    # time-sliced L40S would both try to allocate ~90% of its VRAM.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: llminferenceservice
                kserve.io/component: workload
            topologyKey: kubernetes.io/hostname
    containers:
      - name: main
        # No image override: the RHOAI operator supplies the supported vLLM
        # runtime through the versioned kserve-config-llm-template config.
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - "--served-model-name={{.Name}}"
          - --model=/mnt/models
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage
          - --disable-uvicorn-access-log
          - --enable-prefix-caching
          # ~36GB FP8 weights on a 48GB L40S: cap the context so the KV cache
          # fits; nemotron remains the long-context option.
          - --max-model-len=32768
          - --max-num-batched-tokens=8192
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --reasoning-parser=qwen3
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 600
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        resources:
          requests:
            cpu: "2"
            memory: 20Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            # Page cache for the ~36GB modelcar counts against the pod cgroup.
            memory: 48Gi
            nvidia.com/gpu: "1"
        volumeMounts:
          - mountPath: /dev/shm
            name: shm
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
    volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: shm
