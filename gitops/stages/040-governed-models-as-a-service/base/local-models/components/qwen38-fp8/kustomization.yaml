# Qwen 3.8 FP8 instead of the default NVFP4, same model id (qwen3-8-27b), GPU and serving args.
# Enable it from ../../base/kustomization.yaml (components:). Measured on the same g7e.2xlarge
# (RTX PRO 6000) in the 2026-10-13 study: 966 ms TTFT at 8k x8, 249.8 tok/s, 5.77 concurrent
# full-262K requests, coding scores equal to NVFP4 (docs/OPERATIONS.md).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: serving.kserve.io
      kind: LLMInferenceService
      name: qwen3-8-27b
    patch: |-
      - op: replace
        path: /metadata/labels/demo.rhoai.io~1quantization
        value: fp8
      - op: replace
        path: /metadata/annotations/openshift.io~1display-name
        value: Qwen3.8 27B FP8
      - op: replace
        path: /metadata/annotations/openshift.io~1description
        value: "Model id: qwen3-8-27b, quantization: FP8, context 262,144-token"
      - op: replace
        path: /spec/model/uri
        value: hf://Qwen/Qwen3.8-27B-FP8:017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      # vLLM's DeepGEMM warm-up has no FP8 recipe for sm120 (RTX PRO 6000) and aborts startup
      # ("Unknown recipe"); the CUTLASS block-scaled FP8 kernel it already selects is used instead.
      - op: add
        path: /spec/template/containers/0/env/-
        value:
          name: VLLM_USE_DEEP_GEMM
          value: "0"
  - target:
      group: maas.opendatahub.io
      kind: MaaSModelRef
      name: qwen3-8-27b
    patch: |-
      - op: replace
        path: /metadata/labels/demo.rhoai.io~1quantization
        value: fp8
      - op: replace
        path: /metadata/annotations/openshift.io~1display-name
        value: Qwen3.8 27B FP8
      - op: replace
        path: /metadata/annotations/openshift.io~1description
        value: "Model id: qwen3-8-27b, quantization: FP8, context 262,144-token"
