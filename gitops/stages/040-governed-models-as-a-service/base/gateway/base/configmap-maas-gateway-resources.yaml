apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-resources
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: maas
    app.kubernetes.io/name: maas-default-gateway
    app.kubernetes.io/component: maas-gateway
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
data:
  # The proxy approached its previous 1Gi limit during long migration sessions.
  # Reserve that working set and add headroom through the generated Deployment.
  # Ref: https://istio.io/latest/docs/tasks/traffic-management/ingress/gateway-api/#automated-deployment
  deployment: |
    spec:
      template:
        metadata:
          annotations:
            # Preserve the observed native matchers; expose only bounded EPP diagnostics.
            proxy.istio.io/config: |
              proxyStatsMatcher:
                inclusionPrefixes:
                  - 'reporter='
                  - cluster_manager
                  - listener_manager
                  - server
                  - cluster.xds-grpc
                  - wasm
                  - component
                  - istio
                inclusionSuffixes:
                  - rbac.allowed
                  - rbac.denied
                  - shadow_allowed
                  - shadow_denied
                inclusionRegexps:
                  - 'vhost\..*\.route\..*'
                  - '^cluster\.outbound\|9002\|\|qwen3-(6-27b|8-27b-int4)-epp-service\.internal-models\.svc\.cluster\.local;\.upstream_rq_(total|completed|2xx|5xx)$'
                  - '^http\..*\.ext_proc\.(streams_started|stream_msgs_sent|stream_msgs_received|streams_failed|failure_mode_allowed|message_timeouts)$'
        spec:
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
