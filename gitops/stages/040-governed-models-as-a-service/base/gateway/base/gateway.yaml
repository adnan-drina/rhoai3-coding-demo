apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: maas-default-gateway
    app.kubernetes.io/component: maas-gateway
    opendatahub.io/managed: "false"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: data-science-gateway-class
  infrastructure:
    annotations:
      # AWS Classic ELB defaults to a 60s idle timeout, which cut LLM streams
      # mid-generation: vLLM's qwen3_coder tool parser buffers a whole tool
      # call before emitting, so long file-writing turns send no bytes for
      # >60s and the ELB closes the socket (observed 2026-07-21 as exact-60s
      # stream drops during stage 070 /speckit.implement runs).
      service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "3600"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: maas.placeholder.example.com
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: maas.placeholder.example.com
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: maas-gateway-tls
