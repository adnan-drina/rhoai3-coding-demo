---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-maas-db-credentials
  namespace: models-as-a-service-db
  labels:
    app.kubernetes.io/name: wait-maas-db-credentials
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '7'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wait-maas-db-credentials
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: rhoai3-coding-demo
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: wait-maas-db-credentials
      restartPolicy: Never
      containers:
      - name: wait
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - "/bin/bash"
        - "-c"
        - |
          set -euo pipefail
          for _ in $(seq 1 120); do
           uid="$(oc --request-timeout=10s get secret maas-postgres-credentials -n models-as-a-service-db --ignore-not-found -o jsonpath='{.metadata.uid}')"
           if [[ -n "$uid" ]]; then echo 'PASS Runtime database credential exists; storage wave may proceed.';exit 0;fi
           sleep 5
          done
          echo 'ERROR: Runtime database credential was not supplied before storage.' >&2;exit 1
