apiVersion: batch/v1
kind: Job
metadata:
  name: prepare-maas-route-access
  labels: &id001
    app.kubernetes.io/name: prepare-maas-route-access
    app.kubernetes.io/component: maas
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '9'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  namespace: redhat-ods-applications
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 720
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: prepare-maas-route-access
      restartPolicy: Never
      containers:
      - name: label
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - /bin/bash
        - -c
        - "set -euo pipefail\n# Own only this label; retain native Namespace ownership\
          \ and other fields.\nfor ns in redhat-ods-applications redhat-ai-gateway-infra;\
          \ do\n  found=false\n  for _ in $(seq 1 60); do\n    identity=\"$(oc --request-timeout=10s\
          \ get namespace \"$ns\" --ignore-not-found -o go-template='{{.metadata.uid}}|{{.metadata.resourceVersion}}|{{.metadata.deletionTimestamp}}')\"\
          \n    if [[ -n \"$identity\" ]]; then found=true; break; fi\n    sleep 5\n\
          \  done\n  [[ \"$found\" == true ]] || { echo \"ERROR: native namespace\
          \ $ns unavailable\" >&2; exit 1; }\n  IFS='|' read -r uid rv deleting <<<\
          \ \"$identity\"\n  [[ \"$uid\" =~ ^[a-f0-9-]{36}$ && \"$rv\" =~ ^[0-9]+$\
          \ && \"$deleting\" == '<no value>' ]] || { echo 'ERROR: native namespace\
          \ identity/lifecycle invalid' >&2; exit 1; }\n  oc --request-timeout=10s\
          \ patch namespace \"$ns\" --type=merge -p \"{\\\"metadata\\\":{\\\"uid\\\
          \":\\\"$uid\\\",\\\"resourceVersion\\\":\\\"$rv\\\",\\\"labels\\\":{\\\"\
          maas-gateway-access\\\":\\\"true\\\"}}}\" >/dev/null\n  [[ \"$(oc --request-timeout=10s\
          \ get namespace \"$ns\" -o jsonpath='{.metadata.labels.maas-gateway-access}')\"\
          \ == true ]] || exit 1\ndone\n"
