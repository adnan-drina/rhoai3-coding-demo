---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-enable-dsc-maas
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: enable-dsc-maas
    app.kubernetes.io/component: maas
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '14'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: job-enable-dsc-maas
      restartPolicy: Never
      containers:
      - name: patch
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - "/bin/bash"
        - "-c"
        - |
          set -euo pipefail
          oc --request-timeout=10s get datasciencecluster default-dsc >/dev/null
          oc --request-timeout=10s patch datasciencecluster default-dsc --type=merge -p \
            '{"spec":{"components":{"aigateway":{"managementState":"Managed","modelsAsAService":{"managementState":"Managed"},"batchGateway":{"managementState":"Removed"}},"ogx":{"managementState":"Managed"}}}}'
          test "$(oc --request-timeout=10s get datasciencecluster default-dsc -o jsonpath='{.spec.components.aigateway.modelsAsAService.managementState}')" = Managed
          test "$(oc --request-timeout=10s get datasciencecluster default-dsc -o jsonpath='{.spec.components.ogx.managementState}')" = Managed
          oc --request-timeout=10s patch odhdashboardconfig odh-dashboard-config -n redhat-ods-applications --type=merge -p '{"spec":{"dashboardConfig":{"genAiStudio":true,"genAiTracing":true,"modelAsService":true,"vLLMDeploymentOnMaaS":true,"externalModels":true,"llmdTemplates":true,"guardrails":true,"agentConfigManagement":true,"promptManagement":true}}}'
          for field in genAiStudio genAiTracing modelAsService vLLMDeploymentOnMaaS externalModels llmdTemplates guardrails agentConfigManagement promptManagement; do
            [[ "$(oc --request-timeout=10s get odhdashboardconfig odh-dashboard-config -n redhat-ods-applications -o "jsonpath={.spec.dashboardConfig.$field}")" == true ]] || { echo 'ERROR: Stage040 dashboard configuration readback failed'; exit 1; }
          done
          for component in aigateways:default-aigateway ogxs:default-ogx; do
           resource="${component%%:*}.components.platform.opendatahub.io";name="${component#*:}"
           ready=false
           for _ in $(seq 1 100); do
            status="$(oc --request-timeout=10s get "$resource" "$name" --ignore-not-found -o go-template='{{.metadata.generation}}|{{.status.observedGeneration}}|{{.status.phase}}|{{range .status.conditions}}{{if eq .type "Ready"}}{{.status}}{{end}}{{end}}')"
            if [[ -n "$status" ]]; then
             IFS='|' read -r generation observed phase condition <<< "$status"
             if [[ "$generation" =~ ^[1-9][0-9]*$ && "$observed" == "$generation" && "$phase" == Ready && "$condition" == True ]]; then ready=true;break;fi
            fi
            sleep 5
           done
           [[ "$ready" == true ]] || { echo 'ERROR: native AIGateway/OGX current readiness timed out; inspect native component conditions.' >&2;exit 1; }
          done
          # Configure the customer CR; retain the native Config ownership and generated policies.
          config_uid="$(oc --request-timeout=10s get configs.maas.opendatahub.io default -o jsonpath='{.metadata.uid}')"
          [[ "$config_uid" =~ ^[a-f0-9-]{36}$ ]] || { echo 'ERROR: native MaaS Config identity missing' >&2;exit 1; }
          tenant=''
          for _ in $(seq 1 60); do
            tenant="$(oc --request-timeout=10s get maastenantconfigs.maas.opendatahub.io default-tenant -n models-as-a-service --ignore-not-found -o go-template='{{.metadata.uid}}|{{.metadata.resourceVersion}}|{{.metadata.deletionTimestamp}}|{{index .metadata.annotations "argocd.argoproj.io/tracking-id"}}|{{len .metadata.ownerReferences}}|{{range .metadata.ownerReferences}}{{.apiVersion}}|{{.kind}}|{{.name}}|{{.uid}}{{end}}')"
            [[ -n "$tenant" ]] && break
            sleep 5
          done
          IFS='|' read -r uid rv deleting tracking owners owner_api owner_kind owner_name owner_uid <<< "$tenant"
          [[ "$uid" =~ ^[a-f0-9-]{36}$ && "$rv" =~ ^[0-9]+$ && "$deleting" == '<no value>' && "$tracking" == '<no value>' && "$owners" == 1 && "$owner_api" == maas.opendatahub.io/v1alpha1 && "$owner_kind" == Config && "$owner_name" == default && "$owner_uid" == "$config_uid" ]] || { echo 'ERROR: unexpected native MaaS tenant ownership or lifecycle' >&2;exit 1; }
          # UID is immutable; resourceVersion rejects concurrent replacement/configuration updates.
          oc --request-timeout=10s patch maastenantconfigs.maas.opendatahub.io default-tenant -n models-as-a-service --type=merge -p "{\"metadata\":{\"uid\":\"$uid\",\"resourceVersion\":\"$rv\"},\"spec\":{\"telemetry\":{\"enabled\":true,\"metrics\":{\"captureOrganization\":true,\"captureUser\":true,\"captureGroup\":false,\"captureModelUsage\":true}}}}" >/dev/null
          echo 'PASS Native MaaS attributed telemetry configured; usage samples require separately verified requests.'
          echo 'PASS Current native AIGateway and OGX controllers; project playground and functional inference remain separate.'
    metadata:
      labels:
        app.kubernetes.io/name: enable-dsc-maas
        app.kubernetes.io/component: maas
        app.kubernetes.io/part-of: rhoai3-coding-demo
        app.kubernetes.io/managed-by: argocd
