# Stage 040 owns the transition from Stage 010's MaaS-disabled baseline to
# the managed Models-as-a-Service component. The RHOAI operator requires the
# maas-default-gateway (wave 13) to exist before it reconciles MaaS, so this
# job runs at wave 14 — after the gateway, before MaaSModelRefs and policies.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-enable-rhoai-maas
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "14"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-enable-rhoai-maas
  annotations:
    argocd.argoproj.io/sync-wave: "14"
rules:
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-enable-rhoai-maas
  annotations:
    argocd.argoproj.io/sync-wave: "14"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-enable-rhoai-maas
subjects:
  - kind: ServiceAccount
    name: job-enable-rhoai-maas
    namespace: redhat-ods-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-enable-rhoai-maas
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "14"
data:
  job.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "Enabling Red Hat OpenShift AI Models-as-a-Service component"

    oc patch datasciencecluster default-dsc \
      --type='merge' \
      --patch '{"spec":{"components":{"kserve":{"modelsAsService":{"managementState":"Managed"}}}}}'

    echo "Waiting for ModelsAsServiceReady on the DataScienceCluster..."
    for attempt in $(seq 1 60); do
      STATUS=$(oc get datasciencecluster default-dsc \
        -o jsonpath='{.status.conditions[?(@.type=="ModelsAsServiceReady")].status}' 2>/dev/null || echo "")
      if [ "$STATUS" = "True" ]; then
        echo "Models-as-a-Service component is ready"
        exit 0
      fi
      echo "ModelsAsServiceReady=$STATUS; waiting... ($attempt/60)"
      sleep 10
    done

    echo "ERROR: Models-as-a-Service component did not become ready in time"
    oc get datasciencecluster default-dsc \
      -o jsonpath='{.status.conditions[?(@.type=="ModelsAsServiceReady")].message}{"\n"}'
    exit 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-enable-rhoai-maas
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "14"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: job-enable-rhoai-maas
      restartPolicy: Never
      containers:
        - name: enable-rhoai-maas
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - /scripts/job.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: job-enable-rhoai-maas
            defaultMode: 0755
