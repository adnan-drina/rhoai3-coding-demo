# Adds the MaaS discovery labels to the product-generated RHOAI observability
# dashboards so the MaaS dashboard UI shows the documented Cluster, Models,
# and Usage tabs for the demo admin persona.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-label-observability-dashboard-tabs
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "18"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-label-observability-dashboard-tabs
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "18"
rules:
  - apiGroups:
      - perses.dev
    resources:
      - persesdashboards
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-label-observability-dashboard-tabs
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "18"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: job-label-observability-dashboard-tabs
subjects:
  - kind: ServiceAccount
    name: job-label-observability-dashboard-tabs
    namespace: redhat-ods-monitoring
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-label-observability-dashboard-tabs
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 8
  template:
    spec:
      serviceAccountName: job-label-observability-dashboard-tabs
      restartPolicy: Never
      containers:
        - name: label
          image: registry.redhat.io/openshift4/ose-cli
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              dashboards=(
                dashboard-0-cluster-admin
                dashboard-1-model
              )

              echo "Waiting for product observability dashboards..."
              for dashboard in "${dashboards[@]}"; do
                for i in $(seq 1 60); do
                  if oc get persesdashboard "${dashboard}" -n redhat-ods-monitoring &>/dev/null; then
                    break
                  fi
                  if [[ "$i" == "60" ]]; then
                    echo "Timed out waiting for PersesDashboard ${dashboard}"
                    exit 1
                  fi
                  sleep 10
                done
              done

              for dashboard in "${dashboards[@]}"; do
                oc label persesdashboard "${dashboard}" \
                  -n redhat-ods-monitoring \
                  app.opendatahub.io/modelsasservice=true \
                  maas.opendatahub.io/tenant-name=default-tenant \
                  maas.opendatahub.io/tenant-namespace=models-as-a-service \
                  --overwrite
              done

              echo "Cluster and Models observability dashboards are discoverable by the MaaS dashboard UI."
