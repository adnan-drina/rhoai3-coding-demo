# Permit only the project MaaS gateway to reach native payload processing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payload-processing-maas-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: payload-processing-maas-gateway
    app.kubernetes.io/component: maas-gateway
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "040"
    opendatahub.io/managed: "false"
  annotations:
    # After the Gateway (wave 10) so the pods it selects exist, and before the
    # LLMInferenceService (wave 16) that serves traffic through it.
    argocd.argoproj.io/sync-wave: "11"
spec:
  # Same pods the operator policy selects.
  podSelector:
    matchLabels:
      app: payload-processing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: maas-default-gateway
      ports:
        - port: 9004
          protocol: TCP
