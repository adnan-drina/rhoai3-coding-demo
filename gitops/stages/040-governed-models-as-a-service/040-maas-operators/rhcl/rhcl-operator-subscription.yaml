---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/name: rhcl-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    env:
    # Kuadrant WASM auth call to Authorino. The 200 ms default with failureMode deny turns slow authentication under
    # concurrent load into HTTP 500/503 (RHOAIENG-71638); the RHOAI MaaS guide sets 10s.
    - name: AUTH_SERVICE_TIMEOUT
      value: 10s
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: '2'
        memory: 1Gi
