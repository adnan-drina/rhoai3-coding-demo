apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maas-postgres
  namespace: models-as-a-service-db
  labels:
    app.kubernetes.io/name: maas-postgres
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  serviceName: maas-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16@sha256:510ac645787b2ba27f6ab8bb8488656d025d8c2ddcbf8cc5b15447dac941687b
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: maas-postgres-credentials
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U "${POSTGRESQL_USER}" -d "${POSTGRESQL_DATABASE}"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: maas-postgres
          app.kubernetes.io/component: database
      spec:
        storageClassName: gp3-csi
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
