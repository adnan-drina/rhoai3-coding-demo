# External offering: metered list-price spend per team, subscription and model.
# Model-agnostic: subscriptions map to teams in offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-4-external-model-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-4-external-model-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 4 · External model
      description: 'External models reached through MaaS: every response is metered and priced at the provider''s published list price.'
    duration: 24h
    variables:
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_external_metering_events
    - kind: TextVariable
      spec:
        name: subscription
        value: ".*"
        constant: true
        display:
          name: subscription
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
    panels:
      spendByTeam:
        kind: Panel
        spec:
          display:
            name: Spend by team (in range, EUR)
            description: List-price spend of each team in the time range. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: BarChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
              sort: desc
              mode: value
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[$__range]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[$__range]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))
                  seriesNameFormat: "{{team}}"
      spendByModel:
        kind: Panel
        spec:
          display:
            name: Use by model (tokens, in range)
            description: Input and output tokens per external model in the time range, free models included.
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: true
              mode: value
              radius: 70
              showLabels: true
              sort: desc
              colorPalette:
              - "#0066CC"
              - "#5E40BE"
              - "#37A3A3"
              - "#CA6C0F"
              - "#B98412"
              - "#92C5F9"
              - "#B6A6E9"
              legend:
                position: right
                mode: list
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (((sum by (subscription, model) (increase(showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}[$__range])) + sum by (subscription, model) (increase(showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}[$__range]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}[$__range])) + sum by (subscription, model) (increase(showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}[$__range]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))
                  seriesNameFormat: "{{model}}"
      trend:
        kind: Panel
        spec:
          display:
            name: Daily spend by team (EUR)
            description: List-price spend of each team over the trailing 24 hours, stacked by team. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.5
                connectNulls: false
                display: line
                lineWidth: 1.5
                stack: all
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: decimal
                min: 0
              querySettings:
              - queryIndex: 0
                colorMode: fixed
                colorValue: "#5E40BE"
              - queryIndex: 1
                colorMode: fixed
                colorValue: "#0066CC"
              - queryIndex: 2
                colorMode: fixed
                colorValue: "#CA6C0F"
              - queryIndex: 3
                colorMode: fixed
                colorValue: "#37A3A3"
              - queryIndex: 4
                colorMode: fixed
                colorValue: "#A3A3A3"
              - queryIndex: 5
                colorMode: fixed
                colorValue: "#707070"
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) and on(team) label_replace(vector(1), "team", "engineering", "", "")
                  seriesNameFormat: "{{team}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) and on(team) label_replace(vector(1), "team", "marketing", "", "")
                  seriesNameFormat: "{{team}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) and on(team) label_replace(vector(1), "team", "platform", "", "")
                  seriesNameFormat: "{{team}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) and on(team) label_replace(vector(1), "team", "support", "", "")
                  seriesNameFormat: "{{team}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) and on(team) label_replace(vector(1), "team", "unassigned", "", "")
                  seriesNameFormat: "{{team}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[1d]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))) unless on(team) (label_replace(vector(1), "team", "engineering", "", "") or label_replace(vector(1), "team", "marketing", "", "") or label_replace(vector(1), "team", "platform", "", "") or label_replace(vector(1), "team", "support", "", "") or label_replace(vector(1), "team", "unassigned", "", ""))
                  seriesNameFormat: "{{team}}"
      requestBars:
        kind: Panel
        spec:
          display:
            name: Requests by model
            description: Metered responses per time bucket, stacked by external model.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                display: bar
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__interval]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__interval]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))
                  seriesNameFormat: "{{model}}"
                  minStep: 15m
      statement:
        kind: Panel
        spec:
          display:
            name: Statement by team, subscription and model (EUR)
            description: In-range requests, tokens and spend, the projected month and the month to date. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: team
                header: Team
                align: left
                enableSorting: true
                width: 100
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
                width: 180
              - name: model
                header: Model
                align: left
                enableSorting: true
                width: 190
              - name: 'value #1'
                header: Requests (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 100
              - name: 'value #2'
                header: Active hours
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 100
              - name: 'value #3'
                header: Tokens (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 100
              - name: 'value #4'
                header: Spend (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                sort: desc
                width: 100
              - name: 'value #5'
                header: Spend / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                width: 100
              - name: 'value #6'
                header: Month to date
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                width: 100
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range])) * 0 + on(subscription, model) group_left() count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h])) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range])) * 0 + on(subscription, model) group_left() count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h])) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (increase(showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}[$__range])) + sum by (subscription, model) (increase(showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}[$__range]))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription, model) (increase(showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}[$__range])) + sum by (subscription, model) (increase(showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}[$__range]))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[$__range]))) or (sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range]))) * 0) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace(((sum by (subscription, model) (increase(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}[$__range]))) or (sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__range]))) * 0) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
