# External offering: month-to-date captured usage at list prices.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-external-model-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-external-model-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · External model
      description: 'External models reached through MaaS: every response is metered and priced at the provider''s published list price. Month-to-date estimates by subscription and model.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_external_metering_rate_usd_per_million
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Subscription
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: subscription
            matchers:
            - showback_external_metering_events
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the external offering is priced
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: |-
                An **external model** is a provider service reached through the MaaS gateway, with no local GPU or idle cost. The gateway's metering plugin records every response with its input and output tokens and prices it once at the provider's **published list price** in force; later price changes never reprice earlier usage. Consumers pay the provider charge.

                Figures are month-to-date estimates (UTC) until reconciled with the provider invoice. Requests without usage or without a catalog price stay visible as unpriced. The **projected** column scales the spend in the selected time range to a month (usage hours × users per team).
          queries: []
      spend:
        kind: Panel
        spec:
          display:
            name: Provider spend this month (USD)
            description: List-price estimate of captured usage.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"})
      requests:
        kind: Panel
        spec:
          display:
            name: Requests this month
            description: Responses captured by the metering ledger.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(showback_external_metering_events{subscription=~"$subscription", model=~"$model"})
      input:
        kind: Panel
        spec:
          display:
            name: Input tokens this month
            description: ''
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"})
      output:
        kind: Panel
        spec:
          display:
            name: Output tokens this month
            description: ''
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"})
      unpriced:
        kind: Panel
        spec:
          display:
            name: Unpriced requests
            description: Responses with missing usage or no catalog price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(showback_external_metering_events{subscription=~"$subscription", model=~"$model"} unless on(user, subscription, provider, model, usage_state, price_state, price_version, catalog_sha256) showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}) or vector(0)
      statement:
        kind: Panel
        spec:
          display:
            name: Statement by subscription and model · this month
            description: Captured requests, tokens and list-price estimate.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Requests
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #2'
                header: Input tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #3'
                header: Output tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #4'
                header: Estimate ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                sort: desc
              - name: 'value #5'
                header: Monthly estimate (proj.)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (showback_external_metering_events{subscription=~"$subscription", model=~"$model"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) ((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users
      rates:
        kind: Panel
        spec:
          display:
            name: Provider list prices · USD per 1M tokens
            description: Price catalog applied to new events.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: category
                header: Category
                align: left
                enableSorting: true
              - name: context_band
                header: Context
                align: left
                enableSorting: true
              - name: value
                header: "$/1M"
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                sort: desc
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: max by (model, category, context_band) (showback_external_metering_rate_usd_per_million{model=~"$model"})
      spendOverTime:
        kind: Panel
        spec:
          display:
            name: Month-to-date spend by subscription (USD)
            description: ''
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"})
                  seriesNameFormat: "{{subscription}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Token rate by subscription and model
            description: Governed tokens per second on external models.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (rate(authorized_hits_total{limitador_namespace=~"external-models/.*", subscription=~"$subscription"}[$__rate_interval]))
                  seriesNameFormat: "{{subscription}} · {{model}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this offering is priced
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/about"
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/spend"
        - x: 5
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/requests"
        - x: 10
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/input"
        - x: 15
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/output"
        - x: 20
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/unpriced"
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/spendOverTime"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/throughput"
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/statement"
        - x: 0
          y: 6
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/rates"
