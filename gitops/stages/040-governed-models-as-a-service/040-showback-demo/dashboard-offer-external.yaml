# External offering: metered list-price spend per team, subscription and model.
# Model-agnostic: subscriptions map to teams in offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-4-external-model-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-4-external-model-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 4 · External model
      description: 'External models reached through MaaS: every response is metered and priced at the provider''s published list price.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_external_metering_events
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Subscription
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: subscription
            matchers:
            - showback_external_metering_events
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the external offering is priced
          plugin:
            kind: Markdown
            spec:
              text: |-
                An **external model** is a provider service reached through the MaaS gateway, with no local GPU or idle cost. The gateway's metering plugin records every response with its input and output tokens and prices it once at the provider's **published list price** in force; later price changes never reprice earlier usage. Consumers pay the provider charge.

                The ledger keeps month-to-date totals (UTC); **in range** figures are the change of those totals over the time range, and *month to date* ignores the time picker. Figures are estimates until reconciled with the provider invoice. **In range** figures follow the time picker. **Per month** figures are projections: usage in the time range × usage hours per month × users per team, and private workers × GPU hours per month.
          queries: []
      spend:
        kind: Panel
        spec:
          display:
            name: Spend (in range, USD)
            description: List-price estimate of the responses in the time range.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))) or vector(0)
      requests:
        kind: Panel
        spec:
          display:
            name: Requests (in range)
            description: Responses captured by the metering ledger in the time range.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (subscription, model) (clamp_min((showback_external_metering_events{subscription=~"$subscription", model=~"$model"} - showback_external_metering_events{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_events{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_events{subscription=~"$subscription", model=~"$model"} - showback_external_metering_events{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_events{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))) or vector(0)
      tokens:
        kind: Panel
        spec:
          display:
            name: Tokens (in range)
            description: Input and output tokens of those responses.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (subscription, model) (clamp_min((showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}, 0)) + sum by (subscription, model) (clamp_min((showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}, 0)) + sum by (subscription, model) (clamp_min((showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))) or vector(0)
      projected:
        kind: Panel
        spec:
          display:
            name: Spend / month (USD)
            description: Spend in the time range scaled to a month.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0)) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users)) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace(((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0)) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users)) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))) or vector(0)
      spendByTeam:
        kind: Panel
        spec:
          display:
            name: Spend by team (in range, USD)
            description: List-price spend of each team in the time range.
          plugin:
            kind: BarChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
              sort: desc
              mode: value
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (team) (((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d))))
                  seriesNameFormat: "{{team}}"
      spendByModel:
        kind: Panel
        spec:
          display:
            name: Spend by model (in range, USD)
            description: List-price spend per external model in the time range.
          plugin:
            kind: BarChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
              sort: desc
              mode: value
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d))))
                  seriesNameFormat: "{{model}}"
      trend:
        kind: Panel
        spec:
          display:
            name: Month-to-date spend by team (USD)
            description: The ledger's running monthly total, stacked by team; it restarts on the 1st (UTC).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.5
                connectNulls: false
                display: line
                lineWidth: 1.5
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (team) (((sum by (subscription, model) (showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"})) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"})) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d))))
                  seriesNameFormat: "{{team}}"
      requestBars:
        kind: Panel
        spec:
          display:
            name: Requests by team
            description: Metered responses per time bucket, stacked by team.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                display: bar
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (team) (((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__interval]))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (increase(showback_external_metering_events{subscription=~"$subscription", model=~"$model"}[$__interval]))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d))))
                  seriesNameFormat: "{{team}}"
                  minStep: 15m
      statement:
        kind: Panel
        spec:
          display:
            name: Statement by team, subscription and model
            description: In-range requests, tokens and spend, the projected month and the month to date.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: team
                header: Team
                align: left
                enableSorting: true
                width: 100
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
                width: 180
              - name: model
                header: Model
                align: left
                enableSorting: true
                width: 190
              - name: 'value #1'
                header: Requests (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 115
              - name: 'value #2'
                header: Tokens (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 115
              - name: 'value #3'
                header: Spend (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                sort: desc
                width: 115
              - name: 'value #4'
                header: Spend / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                width: 115
              - name: 'value #5'
                header: Month to date
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                width: 115
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (clamp_min((showback_external_metering_events{subscription=~"$subscription", model=~"$model"} - showback_external_metering_events{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_events{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_events{subscription=~"$subscription", model=~"$model"} - showback_external_metering_events{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_events{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (clamp_min((showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}, 0)) + sum by (subscription, model) (clamp_min((showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_input_tokens{subscription=~"$subscription", model=~"$model"}, 0)) + sum by (subscription, model) (clamp_min((showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} - showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_output_tokens{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace((sum by (subscription, model) (clamp_min((showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} - showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"} offset $__range) or showback_external_metering_estimated_usd{subscription=~"$subscription", model=~"$model"}, 0))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~"$team"} @ end() or last_over_time(showback_team_info{team=~"$team"}[30d] offset -30d)))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
