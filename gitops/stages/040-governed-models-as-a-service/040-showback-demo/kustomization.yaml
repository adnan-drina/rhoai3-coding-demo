apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Showback demo: Engineering and Support team access, live offer dashboards and external metering. The dedicated
# Mistral offer (Marketing) is opt-in: add `- dedicated` below, publish and redeploy (see the showback README).
resources:
  - team-engineering-subscription.yaml
  - team-engineering-auth-policy.yaml
  - team-support-subscription.yaml
  - team-support-auth-policy.yaml
  - offer-catalog.yaml
  - dashboard-offer-external.yaml
  - dashboard-offer-dedicated.yaml
  - dashboard-offer-shared.yaml
  - metering
