# Dedicated private offering: sponsor charges for reserved capacity.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-dedicated-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-dedicated-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · Dedicated private
      description: 'Private models reserved for one sponsoring team: the sponsor pays the full running cost, busy or idle. Models, sponsors and prices come from the showback offer catalog; the time range is the billing period.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info{offer="dedicated"}
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the dedicated offering is priced
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: |-
                A **dedicated private model** runs on GPU capacity reserved for one sponsoring team. The sponsor pays the **full running cost** of that capacity for every hour the model is up, whether it is busy or idle. Usage does not change the charge; it changes the effective cost per token. A low busy share is paid idle capacity: a reason to schedule the model, right-size it or move it to the shared offering.

                Running cost = serving hours × GPU worker price from the offer catalog.
          queries: []
      charge:
        kind: Panel
        spec:
          display:
            name: Sponsor charges (USD)
            description: Serving hours × worker price, all selected dedicated models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour))
      hours:
        kind: Panel
        spec:
          display:
            name: Serving hours
            description: Hours the selected dedicated models were up.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"})
      tokens:
        kind: Panel
        spec:
          display:
            name: Tokens
            description: Governed tokens through MaaS on the selected models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"})
      perMillion:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens
            description: Charges divided by tokens used.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour)) / sum((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * 1e6
      busy:
        kind: Panel
        spec:
          display:
            name: Busy share %
            description: Share of serving minutes with at least one request running.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: 100 * sum((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) and on(model) showback_offer_info{offer="dedicated", model=~"$model"}) / (sum((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) and on(model) showback_offer_info{offer="dedicated", model=~"$model"}) * 60)
      idle:
        kind: Panel
        spec:
          display:
            name: Paid idle (USD)
            description: Charges for serving minutes with no request running.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour)) * (1 - (((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) or (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 0) / on(model) ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"})))
      byModel:
        kind: Panel
        spec:
          display:
            name: Charges by model
            description: One row per dedicated model and its sponsoring subscription.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: sponsor
                header: Sponsor
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Serving hours
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #2'
                header: Charge ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                sort: desc
              - name: 'value #3'
                header: Tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: true
              - name: 'value #4'
                header: "$/1M tokens"
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #5'
                header: Busy %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 1
              - name: 'value #6'
                header: Paid idle ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour)) / ((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * 1e6
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: 100 * (((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) or (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 0) / on(model) ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour)) * (1 - (((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) or (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 0) / on(model) ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 60) * on(model) group_left(sponsor) showback_offer_info{offer="dedicated", model=~"$model"}))
      throughput:
        kind: Panel
        spec:
          display:
            name: Token rate by model
            description: Input plus output tokens per second.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval])), "model", "$1", "model_name", "(.+)") and on(model) showback_offer_info{offer="dedicated", model=~"$model"}
                  seriesNameFormat: "{{model}}"
      load:
        kind: Panel
        spec:
          display:
            name: Requests running by model
            description: vLLM requests in flight.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(sum by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)") and on(model) showback_offer_info{offer="dedicated", model=~"$model"}
                  seriesNameFormat: "{{model}}"
      gpu:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation of each dedicated model pod.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(avg by (exported_pod) (accelerator_gpu_utilization), "model", "$1", "exported_pod", "(.+)-kserve-[a-z0-9]+-[a-z0-9]+") and on(model) showback_offer_info{offer="dedicated", model=~"$model"}
                  seriesNameFormat: "{{model}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this offering is priced
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/about"
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/charge"
        - x: 4
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/hours"
        - x: 8
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/tokens"
        - x: 12
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/perMillion"
        - x: 16
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/busy"
        - x: 20
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/idle"
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/throughput"
        - x: 8
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/load"
        - x: 16
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/gpu"
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/byModel"
