# Dedicated private offering: sponsor charges for reserved capacity.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-dedicated-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-dedicated-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · Dedicated private
      description: 'Private models reserved for one sponsoring team: the sponsor pays the full running cost, busy or idle. Models, sponsors and prices come from the showback offer catalog; the time range is the billing period.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info{offer="dedicated"}
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker runs (730 = always on, 168 = working hours only).
          hidden: false
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the dedicated offering is priced
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: |-
                A **dedicated private model** runs on GPU capacity reserved for one sponsoring team. The sponsor pays the **full running cost** of that capacity for every hour the model is up, whether it is busy or idle. Usage does not change the charge; it changes the effective cost per token. A low busy share is paid idle capacity: a reason to schedule the model, right-size it or move it to the shared offering.

                Running cost = serving hours × GPU worker price from the offer catalog. **Projected** columns scale the usage in the time range to a month (usage hours × users per team) and charge GPU hours per month.
          queries: []
      charge:
        kind: Panel
        spec:
          display:
            name: Sponsor charges (USD)
            description: Serving hours × worker price, all selected dedicated models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end()))
      idle:
        kind: Panel
        spec:
          display:
            name: Paid idle (USD)
            description: Charges for serving minutes with no request running.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end())) * (1 - (((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) or (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 0) / on(model) ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end()))))
      perMillion:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens
            description: Charges divided by tokens used.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end())) / sum((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * 1e6
      monthly:
        kind: Panel
        spec:
          display:
            name: Monthly charge (projected)
            description: Worker price × GPU hours per month, all selected dedicated models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end()))
      gpu:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation of each dedicated model; gaps are paid idle.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(avg by (exported_pod) (accelerator_gpu_utilization), "model", "$1", "exported_pod", "(.+)-kserve-[a-z0-9]+-[a-z0-9]+") and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())
                  seriesNameFormat: "{{model}}"
      byModel:
        kind: Panel
        spec:
          display:
            name: Charges by model
            description: One row per dedicated model and its sponsoring subscription.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: sponsor
                header: Sponsor
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Charge ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                sort: desc
              - name: 'value #2'
                header: "$/1M tokens"
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: 'value #3'
                header: Monthly charge (proj.)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #4'
                header: "$/1M (proj.)"
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end())
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end())) / ((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) * 1e6
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) / (((sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) * 1e6
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this offering is priced
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/about"
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/charge"
        - x: 6
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/idle"
        - x: 12
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/perMillion"
        - x: 18
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/monthly"
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/gpu"
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/byModel"
