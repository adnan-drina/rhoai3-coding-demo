# Dedicated private offering: charge per use case of the sponsoring team, and its load.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-3-dedicated-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-3-dedicated-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 3 · Dedicated private
      description: 'Private models reserved for one sponsoring team: the team pays the full running cost, busy or idle, split over its use cases by their tokens. Models, sponsors and prices come from the showback offer catalog.'
    duration: 24h
    variables:
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info{offer="dedicated"}
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: worker_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
    panels:
      busy:
        kind: Panel
        spec:
          display:
            name: Load
            description: The sponsor's projected tokens as a share of what the worker can serve in its GPU hours, at demonstrated capacity.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 100
              thresholds:
                defaultColor: "#C9190B"
                steps:
                - value: 30
                  color: "#EC7A08"
                - value: 50
                  color: "#3E8635"
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * sum(clamp_max(sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * on(subscription, model) group_left() clamp_min($usage_hours * $users / count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h]) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60))) / on(model) (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600 * $worker_hours), 1))
      paidCapacity:
        kind: Panel
        spec:
          display:
            name: Paid capacity / month (EUR)
            description: 'The monthly charge split by load: capacity the sponsor''s tokens use, and capacity it pays for without using. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).'
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
              mode: value
              radius: 70
              showLabels: true
              sort: desc
              colorPalette:
              - "#0066CC"
              - "#EC7A08"
              - "#3E8635"
              - "#5752D1"
              - "#009596"
              - "#F0AB00"
              - "#8F4700"
              legend:
                position: right
                mode: list
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(((max by (model) ((last_over_time(showback_offer_worker_usd_per_hour[60d] offset -60d) or showback_offer_worker_usd_per_hour @ end())) * $worker_hours * scalar(max((last_over_time(showback_platform_coefficient[60d] offset -60d) or showback_platform_coefficient @ end())))) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(model) group_left() clamp_max(sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * on(subscription, model) group_left() clamp_min($usage_hours * $users / count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h]) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60))) / on(model) (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600 * $worker_hours), 1))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))
                  seriesNameFormat: Used
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(((max by (model) ((last_over_time(showback_offer_worker_usd_per_hour[60d] offset -60d) or showback_offer_worker_usd_per_hour @ end())) * $worker_hours * scalar(max((last_over_time(showback_platform_coefficient[60d] offset -60d) or showback_platform_coefficient @ end())))) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(model) group_left() (1 - clamp_max(sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * on(subscription, model) group_left() clamp_min($usage_hours * $users / count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h]) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60))) / on(model) (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600 * $worker_hours), 1)))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))
                  seriesNameFormat: Unused
      tokenUse:
        kind: Panel
        spec:
          display:
            name: Tokens by use case (in range)
            description: The sponsor's tokens on its dedicated models, one subscription per use case.
          plugin:
            kind: BarChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
              sort: desc
              mode: value
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (subscription) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")))
                  seriesNameFormat: "{{subscription}}"
      utilisation:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation of each dedicated model; gaps are paid idle.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.5
                connectNulls: false
                display: line
                lineWidth: 1.5
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: avg by (model) (label_replace(accelerator_gpu_utilization, "model", "$1", "exported_pod", "(.+)-kserve-[a-z0-9]+-[a-z0-9]+")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))
                  seriesNameFormat: "{{model}}"
      consumerRate:
        kind: Panel
        spec:
          display:
            name: Tokens by use case
            description: Governed tokens per time bucket on the dedicated models, stacked by subscription (use case).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                display: bar
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (subscription) (increase(authorized_hits_total[$__interval]) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
      byModel:
        kind: Panel
        spec:
          display:
            name: Charges by model (EUR)
            description: One row per dedicated model and its sponsoring team. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: sponsor
                header: Sponsor team
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Charge / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                sort: desc
                width: 130
              - name: 'value #2'
                header: Active hours
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 130
              - name: 'value #3'
                header: Sponsor tokens / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 130
              - name: 'value #4'
                header: Load %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 130
              - name: 'value #5'
                header: Sponsor €/1M
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                width: 130
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (((max by (model) ((last_over_time(showback_offer_worker_usd_per_hour[60d] offset -60d) or showback_offer_worker_usd_per_hour @ end())) * $worker_hours * scalar(max((last_over_time(showback_platform_coefficient[60d] offset -60d) or showback_platform_coefficient @ end())))) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end())))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: max by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * 0 + on(subscription, model) group_left() count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h])) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * on(subscription, model) group_left() clamp_min($usage_hours * $users / count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h]) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60))) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * clamp_max(sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")) * on(subscription, model) group_left() clamp_min($usage_hours * $users / count_over_time((sum by (subscription, model) (increase(authorized_hits_total[1h])) > 0)[$__range:1h]) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60))) / on(model) (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600 * $worker_hours), 1) * on(model) group_left(sponsor) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
