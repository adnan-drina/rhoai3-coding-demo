                and Utilization for that model once qualified. GPU activity cannot
                assign team GPU-seconds. Shared Qwen performance is deliberately not
                substituted. Accepted-task cost also requires measured outcomes.
          queries: []
      audit:
        kind: Panel
        spec:
          display:
            name: Monthly agreement audit
            description: Historical report/model/contract identity. Not measured until
              an observed agreement is selected. Hover long audit values.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model ID
                width: 140
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: report_id
                header: Report ID
                width: 140
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: report_sha256
                header: SHA-256
                width: 140
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: contract_version
                header: Contract
                width: 130
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms:
              - kind: MergeIndexedColumns
                spec:
                  column: contract_version
              - kind: MergeIndexedColumns
                spec:
                  column: instance
              - kind: MergeIndexedColumns
                spec:
                  column: job
              - kind: MergeIndexedColumns
                spec:
                  column: model
              - kind: MergeIndexedColumns
                spec:
                  column: report_id
              - kind: MergeIndexedColumns
                spec:
                  column: report_sha256
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace((service_agreement_info{offer="dedicated",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))), "status", "Observed", "", "")
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(label_replace((absent(((service_agreement_info{offer="dedicated",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))))) and on() (up{showback_publisher="selected-report"}
                    @ end() == 1)), "evidence_kind", "unavailable", "", ""), "status",
                    "Not measured", "", "") or label_replace(label_replace(absent(up{showback_publisher="selected-report"}
                    @ end() == 1), "evidence_kind", "unavailable", "", ""), "status",
                    "Publisher unavailable", "", "")
