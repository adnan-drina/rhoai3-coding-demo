# Dedicated private offering: charge per use case of the sponsoring team, and its load.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-3-dedicated-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-3-dedicated-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 3 · Dedicated private
      description: 'Private models reserved for one sponsoring team: the team pays the full running cost, busy or idle, split over its use cases by their tokens. Models, sponsors and prices come from the showback offer catalog.'
    duration: 24h
    variables:
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info{offer="dedicated"}
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: worker_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
    panels:
      usedCapacity:
        kind: Panel
        spec:
          display:
            name: Capacity utilisation (in range)
            description: 'Share of what the dedicated workers could serve while they ran in the range (demonstrated capacity × serving time): each use case (subscription) and the capacity left idle.'
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              mode: percentage
              radius: 70
              showLabels: true
              sort: desc
              colorPalette:
              - "#C7C7C7"
              - "#92C5F9"
              - "#0066CC"
              - "#004D99"
              legend:
                position: right
                mode: list
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: label_replace(sum by (subscription) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)"))), "slice", "$1", "subscription", "(.+)") or label_replace(clamp_min(sum((sum by (model) (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) * 60 * on(model) group_left() max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end()))) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) - (sum(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)"))) or vector(0)), 0), "slice", "Idle", "", "")
                  seriesNameFormat: "{{slice}}"
      tokenUse:
        kind: Panel
        spec:
          display:
            name: Tokens by use case (in range)
            description: The sponsor's tokens on its dedicated models, one subscription per use case.
          plugin:
            kind: BarChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: true
              sort: desc
              mode: value
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (subscription) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) and on(model, team) label_replace(((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")), "team", "$1", "sponsor", "(.+)")))
                  seriesNameFormat: "{{subscription}}"
      utilisation:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation of each dedicated model; gaps are paid idle.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.5
                connectNulls: false
                display: line
                lineWidth: 1.5
                stack: all
                palette:
                  mode: categorical
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: avg by (model) (label_replace(accelerator_gpu_utilization, "model", "$1", "exported_pod", "(.+)-kserve-[a-z0-9]+-[a-z0-9]+")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))
                  seriesNameFormat: "{{model}}"
      consumerRate:
        kind: Panel
        spec:
          display:
            name: Tokens by use case
            description: Governed tokens per time bucket on the dedicated models, stacked by subscription (use case).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                display: bar
                stack: all
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: decimal
                min: 0
              querySettings:
              - queryIndex: 0
                colorMode: fixed
                colorValue: "#92C5F9"
              - queryIndex: 1
                colorMode: fixed
                colorValue: "#0066CC"
              - queryIndex: 2
                colorMode: fixed
                colorValue: "#004D99"
              - queryIndex: 3
                colorMode: fixed
                colorValue: "#707070"
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription) (increase(authorized_hits_total[$__interval]) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on(subscription) label_replace(vector(1), "subscription", "marketing-campaigns", "", "")
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription) (increase(authorized_hits_total[$__interval]) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on(subscription) label_replace(vector(1), "subscription", "marketing-content", "", "")
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription) (increase(authorized_hits_total[$__interval]) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on(subscription) label_replace(vector(1), "subscription", "marketing-rag", "", "")
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription) (increase(authorized_hits_total[$__interval]) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) unless on(subscription) (label_replace(vector(1), "subscription", "marketing-campaigns", "", "") or label_replace(vector(1), "subscription", "marketing-content", "", "") or label_replace(vector(1), "subscription", "marketing-rag", "", ""))
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
      windows:
        kind: Panel
        spec:
          display:
            name: Utilisation by time window
            description: 'One row per window over the selected period (UTC): hours the model served, the share of demonstrated capacity used while it served (red below 30%, green 30% to 80%, orange above 80%), served hours under 10%, tokens a month the window can still take before 80%, and a suggestion that follows the same bands.'
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: false
              columnSettings:
              - name: timestamp
                hide: true
              - name: window
                header: Window
                align: left
                enableSorting: true
                width: 260
                sort: asc
              - name: model
                header: Model
                align: left
                enableSorting: true
                hide: true
              - name: 'value #1'
                header: Hours served
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 150
              - name: 'value #2'
                header: Utilisation %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 150
                cellSettings: &id002
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 29.999
                  textColor: "#F0561D"
                - condition:
                    kind: Range
                    spec:
                      min: 30
                      max: 80
                  textColor: "#63993D"
                - condition:
                    kind: Range
                    spec:
                      min: 80.001
                      max: 1000
                  textColor: "#CA6C0F"
              - name: 'value #3'
                header: Idle hours (<10%)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 150
              - name: 'value #4'
                header: Room to 80% (M tokens / month)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 150
              - name: 'value #5'
                header: Suggestion
                align: left
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 300
                cellSettings:
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 14.999
                  text: 'Mostly idle: candidate to park the model'
                  textColor: "#F0561D"
                - condition:
                    kind: Range
                    spec:
                      min: 15
                      max: 29.999
                  text: Room for more interactive use cases
                  textColor: "#F0561D"
                - condition:
                    kind: Range
                    spec:
                      min: 30
                      max: 70
                  text: Balanced
                  textColor: "#63993D"
                - condition:
                    kind: Range
                    spec:
                      min: 70.001
                      max: 80
                  text: 'Busy: plan before adding jobs'
                  textColor: "#63993D"
                - condition:
                    kind: Range
                    spec:
                      min: 80.001
                      max: 1000
                  text: 'Near capacity: move batch work elsewhere'
                  textColor: "#CA6C0F"
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: count_over_time((label_replace(((sum by (model) (increase(authorized_hits_total[1h])) or (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * 0) / on(model) group_left() (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600) and on(model) (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on() (hour(vector(time() - 1800)) >= 7 < 19 and on() day_of_week(vector(time() - 1800)) > 0 < 6), "window", "Office hours (weekdays 07-19 UTC)", "", "") or label_replace(((sum by (model) (increase(authorized_hits_total[1h])) or (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * 0) / on(model) group_left() (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600) and on(model) (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on() ((hour(vector(time() - 1800)) < 7 or hour(vector(time() - 1800)) >= 19) and on() day_of_week(vector(time() - 1800)) > 0 < 6), "window", "Weeknights (19-07 UTC)", "", "") or label_replace(((sum by (model) (increase(authorized_hits_total[1h])) or (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)"))) * 0) / on(model) group_left() (max by (model) ((last_over_time(showback_offer_capacity_tokens_per_second[60d] offset -60d) or showback_offer_capacity_tokens_per_second @ end())) * 3600) and on(model) (count by (model) (label_replace(kserve_vllm:num_requests_running, "model", "$1", "model_name", "(.+)")) and on(model) ((last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model=~"$model"} @ end()) and on(sponsor) label_replace(max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())), "sponsor", "$1", "team", "(.+)")))) and on() (day_of_week(vector(time() - 1800)) == 0 or day_of_week(vector(time() - 1800)) == 6), "window", "Weekends", "", ""))[$__range:1h])
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
