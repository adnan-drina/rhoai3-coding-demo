# Dedicated private offering: sponsor charges, busy share and other consumers.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-dedicated-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-dedicated-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 3 · Dedicated private
      description: 'Private models reserved for one sponsoring team: the sponsor pays the full running cost, busy or idle. Models, sponsors and prices come from the showback offer catalog.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info{offer="dedicated"}
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker runs (730 = always on, 168 = working hours only).
          hidden: false
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the dedicated offering is priced
          plugin:
            kind: Markdown
            spec:
              text: |-
                A **dedicated private model** runs on GPU capacity reserved for one sponsoring team. The sponsor pays the **full running cost** of that capacity for every hour the model is up, whether it is busy or idle. Usage does not change the charge; it changes the effective cost per token. A low busy share is paid idle capacity: a reason to schedule the model, right-size it or move it to the shared offering.

                Other teams may be granted the model too (the quality judge uses it to grade the shared model). They pay nothing for it: the sponsor's effective cost counts only the sponsor's tokens, and *other consumers' share* shows how much of the paid capacity went elsewhere.

                Running cost = serving hours × GPU worker price from the offer catalog. **In range** figures follow the time picker. **Per month** figures are projections: usage in the time range × usage hours per month × users per team, and private workers × GPU hours per month.
          queries: []
      charge:
        kind: Panel
        spec:
          display:
            name: Sponsor charge (in range, USD)
            description: Serving hours × worker price, selected dedicated models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)) * on(model) group_left max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d)))))
      busy:
        kind: Panel
        spec:
          display:
            name: Busy share %
            description: Serving minutes with at least one request running.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * sum(sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)")) and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) / sum(sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)))
      idle:
        kind: Panel
        spec:
          display:
            name: Paid idle (in range, USD)
            description: Charges for serving minutes with no request running.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)) * on(model) group_left max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d)))) * on(model) group_left() (1 - ((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)")) or sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) * 0) / on(model) sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")))))
      effective:
        kind: Panel
        spec:
          display:
            name: Sponsor $/1M tokens (in range)
            description: Charges divided by the sponsor's own tokens.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)) * on(model) group_left max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))))) / sum(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)"))) * 1e6
      others:
        kind: Panel
        spec:
          display:
            name: Other consumers' share %
            description: Tokens on the dedicated models used by subscriptions other than the sponsor.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * (sum(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) unless on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)"))) or vector(0)) / sum((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))))
      monthly:
        kind: Panel
        spec:
          display:
            name: Charge / month (USD)
            description: Worker price × GPU hours per month, selected dedicated models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(((max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))))
      utilisation:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation of each dedicated model; gaps are paid idle.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: label_replace(avg by (exported_pod) (accelerator_gpu_utilization), "model", "$1", "exported_pod", "(.+)-kserve-[a-z0-9]+-[a-z0-9]+") and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))
                  seriesNameFormat: "{{model}}"
      consumerRate:
        kind: Panel
        spec:
          display:
            name: Token rate by consumer
            description: Governed tokens per second on the dedicated models, per subscription.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (subscription) (rate(authorized_hits_total[$__rate_interval]) and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)))
                  seriesNameFormat: "{{subscription}}"
      byModel:
        kind: Panel
        spec:
          display:
            name: Charges by model
            description: One row per dedicated model and its sponsoring subscription.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: sponsor
                header: Sponsor
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Charge (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                sort: desc
              - name: 'value #2'
                header: Busy %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #3'
                header: Sponsor $/1M (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: 'value #4'
                header: Charge / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #5'
                header: Sponsor $/1M / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)) * on(model) group_left max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * ((sum by (model) (label_replace(count_over_time((sum by (model_name) (kserve_vllm:num_requests_running) > 0)[$__range:1m]), "model", "$1", "model_name", "(.+)")) or sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) * 0) / on(model) sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)"))) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)) * on(model) group_left max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d)))) / on(model) group_left sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)"))) * 1e6
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))) * $worker_hours) * on(model) group_left(sponsor) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) / on(model) group_left() (sum by (model) (((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)"))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) * 1e6
      consumers:
        kind: Panel
        spec:
          display:
            name: Consumers of dedicated models
            description: Tokens in the time range per model and subscription; only the sponsor pays.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: role
                header: Role
                align: left
                enableSorting: true
              - name: team
                header: Team
                align: left
                enableSorting: true
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Tokens (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                sort: desc
              - name: 'value #2'
                header: Share %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (((label_replace(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)")), "role", "sponsor", "", "") or label_replace(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) unless on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)")), "role", "other consumer", "", ""))) * on(subscription) group_left(team) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))) or label_replace(((label_replace(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)")), "role", "sponsor", "", "") or label_replace(((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) unless on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)")), "role", "other consumer", "", ""))) unless on(subscription) max by (subscription, team) ((showback_subscription_team @ end() or last_over_time(showback_subscription_team[30d] offset -30d))), "team", "unassigned", "", "")) and on(team) max by (team) ((showback_team_info{team=~".*"} @ end() or last_over_time(showback_team_info{team=~".*"}[30d] offset -30d)))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
