apiVersion: v1
kind: ConfigMap
metadata:
  name: showback-report-httpd
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-report-publisher
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
data:
  httpd.conf: |
    Include /etc/httpd/conf/httpd.conf
    DocumentRoot /selected
    <Directory /selected>
      Require all granted
      Options -Indexes
      AllowOverride None
      ForceType text/plain
    </Directory>
