# DEMO VALUES ONLY: isolated showback ledger, no provider or user credentials.
apiVersion: v1
kind: Secret
metadata:
  namespace: redhat-ods-monitoring
  name: showback-external-metering-db
  labels:
    app.kubernetes.io/name: showback-external-metering-db
type: Opaque
stringData:
  POSTGRESQL_USER: showback
  POSTGRESQL_PASSWORD: showback-demo-only
  POSTGRESQL_DATABASE: showback
  DATABASE_URL: postgresql://showback:showback-demo-only@showback-external-metering-db:5432/showback?sslmode=disable
