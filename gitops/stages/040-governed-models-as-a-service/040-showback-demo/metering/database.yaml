apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: redhat-ods-monitoring
  name: showback-external-metering-db
  labels:
    app.kubernetes.io/name: showback-external-metering-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: showback-external-metering-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showback-external-metering-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-16@sha256:510ac645787b2ba27f6ab8bb8488656d025d8c2ddcbf8cc5b15447dac941687b
        envFrom:
        - secretRef:
            name: showback-external-metering-db
        ports:
        - name: postgres
          containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/pgsql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: showback-external-metering-db
