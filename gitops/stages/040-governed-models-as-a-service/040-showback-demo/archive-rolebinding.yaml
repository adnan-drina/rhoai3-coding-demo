# Only platform administrators can write the separate evidence workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: showback-mlflow-edit
  namespace: showback-reporting
  labels:
    app.kubernetes.io/name: showback-mlflow-edit
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: "040"
subjects:
  - kind: Group
    name: rhods-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
