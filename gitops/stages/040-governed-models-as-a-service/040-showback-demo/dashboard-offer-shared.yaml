# Shared private offering: tariff charges, running cost and balance.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-shared-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-shared-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · Shared private
      description: 'Private models shared by many teams: on-demand or committed tariffs per token; the platform pays the running cost and carries the balance. Models, tariffs and commitments come from the showback offer catalog.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info{offer="shared"}
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Subscription
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: subscription
            matchers:
            - authorized_hits_total{subscription!=""}
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker runs (730 = always on, 168 = working hours only).
          hidden: false
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the shared offering is priced
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: |-
                A **shared private model** runs on platform-owned GPU capacity and serves many teams. Teams choose a tier:

                - **On demand:** the published tariff per million tokens, no commitment.
                - **Committed:** a monthly token volume at a lower tariff, paid whether used or not; usage above it is billed on demand. The team's MaaS token-rate limit is sized so it can use its commitment.

                The platform pays the running cost (GPU hours × worker price). Commitments give it a **revenue floor**; *cost coverage* is that floor as a share of the monthly running cost. All values are monthly projections: usage in the time range × usage hours × users per team, against GPU hours per month.
          queries: []
      cost:
        kind: Panel
        spec:
          display:
            name: Monthly running cost (USD)
            description: GPU hours per month × worker price, selected shared models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
      floor:
        kind: Panel
        spec:
          display:
            name: Committed revenue floor (USD)
            description: Monthly commitments × committed tariff, paid whether used or not.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_committed_tariff_usd_per_million @ end()) / 1e6)
      coverage:
        kind: Panel
        spec:
          display:
            name: Cost coverage %
            description: Committed revenue floor as a share of the monthly running cost.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: 100 * sum((max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_committed_tariff_usd_per_million @ end()) / 1e6) / sum(max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
      balanceCommitted:
        kind: Panel
        spec:
          display:
            name: Monthly balance · with commitments (USD)
            description: Projected revenue with commitments minus running cost; negative is the platform shortfall.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum(((max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_committed_tariff_usd_per_million @ end()) / 1e6 + on(subscription, model) ((clamp_min(((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) - on(subscription, model) (max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())), 0)) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million @ end()) / 1e6 or (max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * 0)) or ((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million @ end()) / 1e6) or vector(0)) - sum(max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
      balancePayg:
        kind: Panel
        spec:
          display:
            name: Monthly balance · all on demand (USD)
            description: Projected revenue if every team paid the on-demand tariff, minus running cost.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum(((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million @ end()) / 1e6) or vector(0)) - sum(max by (model) (showback_offer_worker_usd_per_hour @ end()) * $worker_hours and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
      throughput:
        kind: Panel
        spec:
          display:
            name: Token rate by consumer
            description: Governed tokens per second per subscription.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (rate(authorized_hits_total{subscription=~"$subscription"}[$__rate_interval]) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
                  seriesNameFormat: "{{subscription}}"
      consumers:
        kind: Panel
        spec:
          display:
            name: Charges by consumer
            description: Tokens in the time range, monthly commitment, projected monthly use and charge per subscription and model.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #2'
                header: Commitment / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #3'
                header: Projected tokens / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #4'
                header: Commitment used %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #5'
                header: Monthly charge (proj.)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                sort: desc
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: 100 * ((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) / on(subscription, model) (max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end()))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * on(model) group_left max by (model) (showback_offer_committed_tariff_usd_per_million @ end()) / 1e6 + on(subscription, model) ((clamp_min(((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) - on(subscription, model) (max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())), 0)) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million @ end()) / 1e6 or (max by (subscription, model) (showback_offer_commitment_tokens{subscription=~"$subscription"} @ end()) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) * 0)) or ((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end())) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million @ end()) / 1e6
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this offering is priced
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/about"
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/cost"
        - x: 5
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/floor"
        - x: 10
          y: 0
          width: 4
          height: 4
          content:
            "$ref": "#/spec/panels/coverage"
        - x: 14
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/balanceCommitted"
        - x: 19
          y: 0
          width: 5
          height: 4
          content:
            "$ref": "#/spec/panels/balancePayg"
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/throughput"
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/consumers"
