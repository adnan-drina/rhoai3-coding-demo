                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
      consumers:
        kind: Panel
        spec:
          display:
            name: Charges by consumer (EUR)
            description: 'Per subscription and model: tokens in the time range, commitment, projected use and monthly charge. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).'
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: team
                header: Team
                align: left
                enableSorting: true
                width: 110
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
                width: 200
              - name: model
                header: Model
                align: left
                enableSorting: true
                width: 120
              - name: 'value #1'
                header: Tokens (in range)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 110
              - name: 'value #2'
                header: Commitment / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 110
              - name: 'value #3'
                header: Active hours
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 110
              - name: 'value #4'
                header: Projected tokens / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 110
              - name: 'value #5'
                header: Commitment used %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                width: 110
              - name: 'value #6'
                header: Charge / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                sort: desc
                width: 110
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))
