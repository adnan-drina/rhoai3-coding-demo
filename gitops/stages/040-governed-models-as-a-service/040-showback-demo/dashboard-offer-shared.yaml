# Shared private offering: tariff charges, running cost and balance.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-2-shared-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-2-shared-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 2 · Shared private
      description: 'Private models shared by many teams: on-demand or committed tariffs per token, including the platform coefficient; the platform pays the running cost and carries the balance. Models, tariffs, commitments and teams come from the showback offer catalog.'
    duration: 24h
    variables:
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: false
        allowMultiple: false
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info{offer="shared"}
    - kind: TextVariable
      spec:
        name: subscription
        value: ".*"
        constant: true
        display:
          name: subscription
          hidden: true
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: worker_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
    panels:
      tokensByTeam:
        kind: Panel
        spec:
          display:
            name: Total tokens by team
            description: Tokens per team on the shared models in the time range. Test traffic is not counted.
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 1
                shortValues: true
              mode: value
              radius: 70
              showLabels: true
              sort: desc
              colorPalette: &id002
              - "#0066CC"
              - "#EC7A08"
              - "#3E8635"
              - "#5752D1"
              - "#009596"
              - "#F0AB00"
              - "#8F4700"
              legend:
                position: right
                mode: list
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (team) (((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))
                  seriesNameFormat: "{{team}}"
      commitUsed:
        kind: Panel
        spec:
          display:
            name: Commitment used in the selected period (%)
            description: 'Tokens on the committed subscriptions of each team, measured in the time range, as a share of the commitment for that period (the monthly commitment in brackets × the range ÷ 730 hours). Commitments are billed per subscription, so the table below shows each one. Red, below 50%: most of the commitment is paid for and not used. Orange, 50 to 80%. Green, above 80%. Above 100% the team pays the commitment plus the on-demand tariff for the rest.'
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 120
              thresholds:
                defaultColor: "#C9190B"
                steps:
                - value: 50
                  color: "#EC7A08"
                - value: 80
                  color: "#3E8635"
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (label_replace(label_replace(100 * sum by (team) ((((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end()))) and on(subscription, model) (max by (subscription, model) ((last_over_time(showback_offer_commitment_tokens{subscription=~"$subscription"}[60d] offset -60d) or showback_offer_commitment_tokens{subscription=~"$subscription"} @ end())) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace(((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end()))) and on(subscription, model) (max by (subscription, model) ((last_over_time(showback_offer_commitment_tokens{subscription=~"$subscription"}[60d] offset -60d) or showback_offer_commitment_tokens{subscription=~"$subscription"} @ end())) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) / on(team) (sum by (team) ((((max by (subscription, model) ((last_over_time(showback_offer_commitment_tokens{subscription=~"$subscription"}[60d] offset -60d) or showback_offer_commitment_tokens{subscription=~"$subscription"} @ end())) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace(((max by (subscription, model) ((last_over_time(showback_offer_commitment_tokens{subscription=~"$subscription"}[60d] offset -60d) or showback_offer_commitment_tokens{subscription=~"$subscription"} @ end())) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) * scalar(count_over_time(vector(1)[$__range:1m]) / 60) / 730), "name", "Engineering (1.63B)", "team", "engineering"), "name", "Support (250M)", "team", "support")) unless on(team) label_replace(vector(1), "team", "platform", "", "")
                  seriesNameFormat: "{{name}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Tokens by team
            description: Governed tokens per time bucket on the selected shared models, stacked by team.
