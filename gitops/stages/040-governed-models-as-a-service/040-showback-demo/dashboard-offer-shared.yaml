# Shared private offering: tariff charges, running cost and balance.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-shared-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-shared-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · Shared private
      description: 'Private models shared by many teams: consumers pay a published tariff per token, the platform pays the running cost and carries the balance. Models and tariffs come from the showback offer catalog.'
    duration: 1h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info{offer="shared"}
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Subscription
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: subscription
            matchers:
            - authorized_hits_total{subscription!=""}
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the shared offering is priced
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: |-
                A **shared private model** runs on platform-owned GPU capacity and serves many teams. Each consumer pays the published **tariff per million tokens** for what it uses. The platform pays the running cost and prices idle capacity into the tariff: when demand is below forecast the platform carries the shortfall, above forecast it keeps the surplus.

                Running cost = serving hours × GPU worker price; charge = tokens × tariff. *Cost share* splits the running cost by token share, for comparison with the tariff.
          queries: []
      cost:
        kind: Panel
        spec:
          display:
            name: Running cost (USD)
            description: Serving hours × worker price, selected shared models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour) and on(model) showback_offer_info{offer="shared", model=~"$model"})
      tokens:
        kind: Panel
        spec:
          display:
            name: Tokens served
            description: Governed tokens on the selected models, all consumers.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: true
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum((sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"})
      revenue:
        kind: Panel
        spec:
          display:
            name: Tariff revenue (USD)
            description: Tokens × published tariff.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum(((sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million) / 1e6)
      balance:
        kind: Panel
        spec:
          display:
            name: Platform balance (USD)
            description: Tariff revenue minus running cost; negative is a shortfall.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum(((sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million) / 1e6) or vector(0)) - (sum((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour) and on(model) showback_offer_info{offer="shared", model=~"$model"}) or vector(0))
      consumers:
        kind: Panel
        spec:
          display:
            name: Charges by consumer
            description: Tokens, tariff charge, token share and cost share per subscription and model.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: subscription
                header: Subscription
                align: left
                enableSorting: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: true
                sort: desc
              - name: 'value #2'
                header: Tariff charge ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #3'
                header: Token share %
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 1
              - name: 'value #4'
                header: Cost share ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) and on(model) showback_offer_info{offer="shared", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) and on(model) showback_offer_info{offer="shared", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million) / 1e6
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: 100 * (sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) and on(model) showback_offer_info{offer="shared", model=~"$model"}) / on(model) group_left (sum by (model) (increase(authorized_hits_total[$__range])))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) and on(model) showback_offer_info{offer="shared", model=~"$model"}) / on(model) group_left (sum by (model) (increase(authorized_hits_total[$__range]))) * on(model) group_left ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour) and on(model) showback_offer_info{offer="shared", model=~"$model"})
      models:
        kind: Panel
        spec:
          display:
            name: Economics by model
            description: Running cost, tariff revenue and balance per shared model.
          plugin:
            kind: Table
            spec:
              density: compact
              pagination: true
              columnSettings:
              - name: timestamp
                hide: true
              - name: model
                header: Model
                align: left
                enableSorting: true
              - name: 'value #1'
                header: Serving hours
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #2'
                header: Running cost ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #3'
                header: Tokens
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: true
              - name: 'value #4'
                header: Revenue ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              - name: 'value #5'
                header: Balance ($)
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 2
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) and on(model) showback_offer_info{offer="shared", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour) and on(model) showback_offer_info{offer="shared", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million) / 1e6
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (((sum by (model) (increase(authorized_hits_total[$__range]))) and on(model) showback_offer_info{offer="shared", model=~"$model"}) * on(model) group_left max by (model) (showback_offer_tariff_usd_per_million) / 1e6) - on(model) ((sum by (model) (label_replace(count_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)")) / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour) and on(model) showback_offer_info{offer="shared", model=~"$model"})
      throughput:
        kind: Panel
        spec:
          display:
            name: Token rate by consumer
            description: Governed tokens per second per subscription.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (rate(authorized_hits_total{subscription=~"$subscription"}[$__rate_interval]) and on(model) showback_offer_info{offer="shared", model=~"$model"})
                  seriesNameFormat: "{{subscription}}"
      load:
        kind: Panel
        spec:
          display:
            name: Requests running and waiting
            description: vLLM scheduler load on the selected shared models.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(sum by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)") and on(model) showback_offer_info{offer="shared", model=~"$model"}
                  seriesNameFormat: "{{model}} running"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(sum by (model_name) (kserve_vllm:num_requests_waiting), "model", "$1", "model_name", "(.+)") and on(model) showback_offer_info{offer="shared", model=~"$model"}
                  seriesNameFormat: "{{model}} waiting"
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this offering is priced
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/about"
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/cost"
        - x: 6
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/tokens"
        - x: 12
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/revenue"
        - x: 18
          y: 0
          width: 6
          height: 4
          content:
            "$ref": "#/spec/panels/balance"
    - kind: Grid
      spec:
        display:
          title: Trends
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/throughput"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/load"
    - kind: Grid
      spec:
        display:
          title: Breakdown
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/consumers"
        - x: 0
          y: 7
          width: 24
          height: 5
          content:
            "$ref": "#/spec/panels/models"
