# Shared private offering: tariff charges, running cost and balance.
# Model-agnostic: models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-2-shared-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-2-shared-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 2 · Shared private
      description: 'Private models shared by many teams: on-demand or committed tariffs per token, including the platform coefficient; the platform pays the running cost and carries the balance. Models, tariffs, commitments and teams come from the showback offer catalog.'
    duration: 24h
    variables:
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: false
        allowMultiple: false
        display:
          name: Model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info{offer="shared"}
    - kind: TextVariable
      spec:
        name: subscription
        value: ".*"
        constant: true
        display:
          name: subscription
          hidden: true
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: worker_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
    panels:
      tokensByTeam:
        kind: Panel
        spec:
          display:
            name: Total tokens by team
            description: Tokens per team on the shared models in the time range. Test traffic is not counted.
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 1
                shortValues: true
              mode: value
              radius: 70
              showLabels: true
              sort: desc
              colorPalette:
              - "#5E40BE"
              - "#CA6C0F"
              - "#37A3A3"
              - "#A3A3A3"
              legend:
                position: right
                mode: list
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (team) (((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((((sum by (subscription, model) (increase(authorized_hits_total{subscription=~"$subscription"}[$__range])) > 0 and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end())) unless on(subscription) max by (subscription) ((last_over_time(showback_subscription_test_traffic[60d] offset -60d) or showback_subscription_test_traffic @ end())))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end())))
                  seriesNameFormat: "{{team}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Tokens by subscription
            description: 'Governed tokens per time bucket on the selected shared models, stacked by subscription: each subscription with a commitment, and all others together (the Team filter above narrows it to one team).'
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: right
                values: []
              visual:
                display: bar
                stack: all
                palette:
                  mode: auto
              yAxis:
                format:
                  unit: decimal
                min: 0
              querySettings:
              - queryIndex: 0
                colorMode: fixed
                colorValue: "#3D2785"
              - queryIndex: 1
                colorMode: fixed
                colorValue: "#876FD4"
              - queryIndex: 2
                colorMode: fixed
                colorValue: "#37A3A3"
              - queryIndex: 3
                colorMode: fixed
                colorValue: "#9E4A06"
              - queryIndex: 4
                colorMode: fixed
                colorValue: "#F8AE54"
              - queryIndex: 5
                colorMode: fixed
                colorValue: "#A3A3A3"
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) and on(subscription) label_replace(vector(1), "subscription", "team-engineering", "", "")
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) and on(subscription) label_replace(vector(1), "subscription", "team-engineering-ci", "", "")
                  seriesNameFormat: "{{subscription}}"
                  minStep: 15m
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (subscription) (((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) and on(subscription) label_replace(vector(1), "subscription", "team-support", "", "")
                  seriesNameFormat: "{{subscription}}"
