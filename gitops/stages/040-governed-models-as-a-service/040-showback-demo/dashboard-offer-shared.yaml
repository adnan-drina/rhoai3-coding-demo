                  query: sum by (subscription) (((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) * on(subscription) group_left(team) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())) or label_replace((sum by (subscription) (increase(authorized_hits_total{subscription=~"$subscription"}[$__interval]) and on(model) (last_over_time(showback_offer_info{offer="shared", model=~"$model"}[60d] offset -60d) or showback_offer_info{offer="shared", model=~"$model"} @ end()))) unless on(subscription) max by (subscription, team) ((last_over_time(showback_subscription_team[60d] offset -60d) or showback_subscription_team @ end())), "team", "unassigned", "", "")) and on(team) max by (team) ((last_over_time(showback_team_info{team=~"$team"}[60d] offset -60d) or showback_team_info{team=~"$team"} @ end()))) and on(subscription) label_replace(vector(1), "subscription", "maas-quality-judge", "", "")
                  seriesNameFormat: "{{subscription}}"
