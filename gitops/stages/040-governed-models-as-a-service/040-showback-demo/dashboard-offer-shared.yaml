# Generated by showback-demo/generate-dashboards.sh; edit offer-dashboard-definitions.json instead.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-shared-private-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-shared-private-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Offer · Shared private
      description: Observed bounded Qwen usage and hosting allocation, separately
        from unknown monthly tariffs, customer charges and service recovery.
    duration: 1h
    variables: []
    panels:
      contract:
        kind: Panel
        spec:
          display:
            name: Shared private · tariff and idle ownership
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: A shared offer uses a **prospective input/output tariff**, with
                any reservation fees, included-use credits and subsidy disclosed separately.
                The platform owns demand shortfall under the default contract. The
                observed Qwen tables below are a **closed, six-minute hosting allocation**,
                not monthly customer charges and not a dedicated service. Costs split
                within each window; fully idle windows stay with Platform idle. Monthly
                tariffs, revenue and recovery remain Unknown until a service report
                is selected.
          queries: []
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Observed bounded Qwen report · UTC
            description: Observed closed allocation only. This UTC period is not a
              calendar month or a customer charging period.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: evidence_kind
                header: Evidence
                width: 95
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: observed
                  text: Observed
                - condition:
                    kind: Value
                    spec:
                      value: synthetic_fixture
                  text: SYNTHETIC
              - name: period_start
                header: From (UTC)
                width: 175
              - name: period_end
                header: To (UTC)
                width: 175
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1)) and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info{evidence_kind="observed"}
                    @ end()))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      allocation:
        kind: Panel
        spec:
          display:
            name: Bounded hosting allocation · USD
            description: Observed model/window cost allocation, including team use,
              Platform idle, other consumers and unresolved costs. Not monthly tariff
              revenue.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: consumer
                header: Team / platform
                width: 190
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: engineering
                  text: Engineering
                - condition:
                    kind: Value
                    spec:
                      value: marketing
                  text: Marketing
                - condition:
                    kind: Value
                    spec:
                      value: support
                  text: Support
                - condition:
                    kind: Value
                    spec:
                      value: platform_idle
                  text: Platform idle
                - condition:
                    kind: Value
                    spec:
                      value: other_consumers
                  text: Other consumers
                - condition:
                    kind: Value
                    spec:
                      value: unresolved_allocation
                  text: Unresolved
                - condition:
                    kind: Value
                    spec:
                      value: team-engineering
                  text: Engineering
                - condition:
                    kind: Value
                    spec:
                      value: team-marketing
                  text: Marketing
                - condition:
                    kind: Value
                    spec:
                      value: team-support
                  text: Support
              - name: value
                header: USD
                width: 110
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_report_allocated_cents @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100 and on(report_id, report_sha256, job, instance)
                    (showback_selected_report_info{evidence_kind="observed"} @ end()))
                  seriesNameFormat: "{{consumer}} | {{evidence_kind}}"
      usage:
        kind: Panel
        spec:
          display:
            name: Bounded Qwen use · exact tokens
            description: Sum of closed-window tokens using the report's subscription/team
              mapping. Withheld for a model if any window has incomplete usage coverage.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: team
                header: Team
                width: 125
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: engineering
                  text: Engineering
                - condition:
                    kind: Value
                    spec:
                      value: marketing
                  text: Marketing
                - condition:
                    kind: Value
                    spec:
                      value: support
                  text: Support
                - condition:
                    kind: Value
                    spec:
                      value: platform_idle
                  text: Platform idle
                - condition:
                    kind: Value
                    spec:
                      value: other_consumers
                  text: Other consumers
                - condition:
                    kind: Value
                    spec:
                      value: unresolved_allocation
                  text: Unresolved
                - condition:
                    kind: Value
                    spec:
                      value: team-engineering
                  text: Engineering
                - condition:
                    kind: Value
                    spec:
                      value: team-marketing
                  text: Marketing
                - condition:
                    kind: Value
                    spec:
                      value: team-support
                  text: Support
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: value
                header: Tokens
                width: 110
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_report_team_model_tokens @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) and on(report_id, report_sha256, job, instance)
                    (showback_selected_report_info{evidence_kind="observed"} @ end()))
                  seriesNameFormat: "{{team}} | {{model}}"
      capacity:
        kind: Panel
        spec:
          display:
            name: Bounded allocated capacity and cost
            description: Allocated instance-hours, hosting cost estimate and dated
              worker rate for the observed allocation windows. AWS billed lifecycle
              is unverified; this does not qualify full monthly service cost or customer
              charges.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: phase
                header: Window
                width: 65
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: busy
                  text: Busy
                - condition:
                    kind: Value
                    spec:
                      value: quiet
                  text: Quiet
                - condition:
                    kind: Value
                    spec:
                      value: idle
                  text: Idle
              - name: 'value #1'
                header: Cost USD
                width: 85
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #2'
                header: Allocated hours
                width: 110
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #3'
                header: USD/hour
                width: 110
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 6
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms:
              - kind: MergeIndexedColumns
                spec:
                  column: model
              - kind: MergeIndexedColumns
                spec:
                  column: phase
              - kind: MergeIndexedColumns
                spec:
                  column: window_start
              - kind: MergeIndexedColumns
                spec:
                  column: report_id
              - kind: MergeIndexedColumns
                spec:
                  column: report_sha256
              - kind: MergeIndexedColumns
                spec:
                  column: job
              - kind: MergeIndexedColumns
                spec:
                  column: instance
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - model
                  - phase
                  - window_start
                  - report_id
                  - report_sha256
                  - job
                  - instance
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_model_cost_cents @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))) / 100 and on(report_id, report_sha256, job, instance) (showback_selected_report_info{evidence_kind="observed"}
                    @ end()))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_model_instance_hours @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) and on(report_id, report_sha256, job, instance)
                    (showback_selected_report_info{evidence_kind="observed"} @ end()))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: ((showback_model_effective_worker_usd_per_hour @ end() and
                    on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) and on(report_id, report_sha256, job, instance)
                    (showback_selected_report_info{evidence_kind="observed"} @ end()))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Live Qwen throughput · separate time range
            description: Live operational token throughput for the existing Qwen model.
              The time picker does not recalculate the closed allocation, prove SLOs
              or create monthly revenue.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:prompt_tokens_total{model_name=~"qwen3-8-27b"}[5m]))
                  seriesNameFormat: "{{model_name}} input tokens/s"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:generation_tokens_total{model_name=~"qwen3-8-27b"}[5m]))
                  seriesNameFormat: "{{model_name}} output tokens/s"
      availability:
        kind: Panel
        spec:
          display:
            name: Evidence availability
            description: Publisher health, an observed monthly statement and this
              offer's agreement are separate checks. Metadata values are hidden; no
              missing amount is replaced by zero.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: signal
                header: Evidence source
                width: 175
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: status
                header: Evidence
                width: 230
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms: []
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (label_replace(label_replace((up{showback_publisher="selected-report"}
                    @ end() == 1), "status", "Healthy", "", ""), "signal", "Report
                    publisher", "", "") or label_replace(label_replace(absent(up{showback_publisher="selected-report"}
                    @ end() == 1), "status", "Publisher unavailable", "", ""), "signal",
                    "Report publisher", "", "")) or (label_replace(label_replace((service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)), "status", "Observed statement", "", ""), "signal",
                    "Monthly report", "", "") or label_replace((label_replace(label_replace((absent(((service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))) and on() (up{showback_publisher="selected-report"}
                    @ end() == 1)), "evidence_kind", "unavailable", "", ""), "status",
                    "No observed report", "", "") or label_replace(label_replace(absent(up{showback_publisher="selected-report"}
                    @ end() == 1), "evidence_kind", "unavailable", "", ""), "status",
                    "Publisher unavailable", "", "")), "signal", "Monthly report",
                    "", "")) or (label_replace(label_replace((service_agreement_info{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))), "status", "Observed agreement", "", ""), "signal",
                    "Offer agreement", "", "") or label_replace((label_replace(label_replace((absent(((service_agreement_info{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))))) and on() (up{showback_publisher="selected-report"}
                    @ end() == 1)), "evidence_kind", "unavailable", "", ""), "status",
                    "Not measured", "", "") or label_replace(label_replace(absent(up{showback_publisher="selected-report"}
                    @ end() == 1), "evidence_kind", "unavailable", "", ""), "status",
                    "Publisher unavailable", "", "")), "signal", "Offer agreement",
                    "", ""))
      recovery:
        kind: Panel
        spec:
          display:
            name: Monthly shared recovery · USD
            description: Full monthly service cost, customer charges, explicit subsidy
              and recovery balance belong to an observed shared agreement. The six-minute
              allocation is not a substitute for this monthly ledger.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 160
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
                - condition:
                    kind: Value
                    spec:
                      value: nemotron-3-ultra-550b-a55b
                  text: Nemotron 3 Ultra 550B
                - condition:
                    kind: Value
                    spec:
                      value: claude-sonnet-5-5
                  text: Claude Sonnet 5.5
                - condition:
                    kind: Value
                    spec:
                      value: gpt-6-luna
                  text: GPT-6 Luna
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: 'value #1'
                header: Full cost
                width: 75
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: 'value #2'
                header: Charges
                width: 75
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: 'value #3'
                header: Subsidy
                width: 70
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: 'value #4'
                header: Balance
                width: 70
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
              - name: status
                header: Evidence
                width: 100
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms:
              - kind: MergeIndexedColumns
                spec:
                  column: agreement
              - kind: MergeIndexedColumns
                spec:
                  column: instance
              - kind: MergeIndexedColumns
                spec:
                  column: job
              - kind: MergeIndexedColumns
                spec:
                  column: model
              - kind: MergeIndexedColumns
                spec:
                  column: report_id
              - kind: MergeIndexedColumns
                spec:
                  column: report_sha256
              - kind: MergeIndexedColumns
                spec:
                  column: status
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - agreement
                  - model
                  - report_id
                  - report_sha256
                  - job
                  - instance
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace((service_agreement_cost_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100, "status", "Observed", "", "")
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace((service_agreement_charge_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100, "status", "Observed", "", "")
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace((service_agreement_subsidy_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100, "status", "Observed", "", "")
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace((service_agreement_recovery_balance_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100, "status", "Observed", "", "")
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: label_replace(label_replace((absent(((service_agreement_cost_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100) or ((service_agreement_charge_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100) or ((service_agreement_subsidy_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100) or ((service_agreement_recovery_balance_cents{offer="shared",evidence_kind="observed"}
                    @ end() and on(report_id, report_sha256, job, instance) (service_report_info{evidence_kind="observed"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) / 100)) and on() (up{showback_publisher="selected-report"}
                    @ end() == 1)), "evidence_kind", "unavailable", "", ""), "status",
                    "Not measured", "", "") or label_replace(label_replace(absent(up{showback_publisher="selected-report"}
                    @ end() == 1), "evidence_kind", "unavailable", "", ""), "status",
                    "Publisher unavailable", "", "")
      tariffs:
        kind: Panel
        spec:
          display:
