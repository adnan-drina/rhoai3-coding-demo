  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-8-showback-usage-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback · usage
      description: Exact certified team usage, request receipts and configured access.
        The closed report and configuration snapshots retain separate evidence.
    duration: 1h
    variables: []
    panels:
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Closed report · UTC
            description: Evidence type and immutable report period. The time picker
              does not recalculate this closed allocation.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: evidence_kind
                header: Evidence
                width: 95
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: observed
                  text: Observed
                - condition:
                    kind: Value
                    spec:
                      value: synthetic_fixture
                  text: SYNTHETIC
              - name: period_start
                header: From (UTC)
                width: 175
              - name: period_end
                header: To (UTC)
                width: 175
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      guide:
        kind: Panel
        spec:
          display:
            name: Usage and governance
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: These are **closed-report counts**, not a live time-picker total.
                Certified metering and runner receipts remain separate evidence. Access
                and allowances are configuration snapshots; they do not prove enforcement
                or reserve a share of the hosting bill. Missing receipt or policy
                evidence remains **Unknown**.
          queries: []
