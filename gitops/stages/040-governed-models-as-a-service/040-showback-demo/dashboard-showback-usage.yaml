# Generated by showback-demo/generate-dashboards.sh; edit dashboard-definitions.json. Offline candidate only.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-8-showback-usage-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-8-showback-usage-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback · usage and governance
      description: Actual report consumption and the published configuration snapshot
        are separate. No reserved GPU capacity or fixed cost split is implied.
    duration: 1h
    variables: []
    panels:
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Selected closed report — read evidence kind before presenting
            description: The series label identifies SYNTHETIC versus live evidence,
              immutable report ID, UTC period and policy. Value 1 means metadata is
              present. The time picker never recalculates this report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      teamModelTokens:
        kind: Panel
        spec:
          display:
            name: Certified report tokens by team and model
            description: Sum of closed-window tokens using the report's subscription/team
              mapping. Withheld for a model if any window has incomplete usage coverage.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_team_model_tokens @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{team}} | {{model}}"
      tokens:
        kind: Panel
        spec:
          display:
            name: Certified tokens by subscription, model and window
            description: Input plus output tokens from canonical MaaS accounting.
              Partial observations are withheld from this panel.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_subscription_tokens @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      shares:
        kind: Panel
        spec:
          display:
            name: Actual token share within each model/window (%)
            description: These shares determine active-window cost shares. They are
              independent of configured token allowances.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_subscription_token_share_ratio @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) * 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      access:
        kind: Panel
        spec:
          display:
            name: Configured model access (1=allowed, 0=denied)
            description: 'Scenario captured when this snapshot was published: Engineering/Qwen,
              Marketing/Mistral, Support/both. Four allowed cells, two denied. This
              is configuration, not live policy or proof that enforcement passed.'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_config_model_access @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{team}} | {{model}} | {{configuration_status}}"
      allowance:
        kind: Panel
        spec:
          display:
            name: Configured token allowance
            description: Scenario captured when this snapshot was published, with
              quota-window label. Values remain illustrative until calibrated. A short
              report is not an aligned quota counter, so remaining quota headroom
              is deliberately not inferred.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_config_allowance_tokens @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{team}} | {{model}} | {{quota_window}} | {{configuration_status}}"
      allowanceShare:
        kind: Panel
        spec:
          display:
            name: Configured allowance ratio (%)
            description: Qwen Engineering/Support 70/30 is an allowance proposal.
              It neither reserves GPU time nor fixes the cost split. Mistral values
              are independent placeholders.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_config_allowance_share_ratio @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)) * 100
                  seriesNameFormat: "{{team}} | {{model}} | {{quota_window}}"
      coverage:
        kind: Panel
        spec:
          display:
            name: Usage coverage (1=complete)
            description: Request/error/denial counts need separately reconciled runner
              receipts. Native request counters do not prove a model dimension. Denied
              attempts count as zero inference tokens only after pre-inference enforcement
              is proved.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_coverage_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      receiptInputs:
        kind: Panel
        spec:
          display:
            name: Runner receipt input tokens
            description: Optional closed-window runner receipts, not native Limitador
              per-model counters. Absent receipt data stays NO DATA. Receipt input/output
              split is a cross-check, not the allocation denominator. Denied attempts
              add no separate cost charge. The bounded runner disables retries.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_receipt_input_tokens @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      receiptOutputs:
        kind: Panel
        spec:
          display:
            name: Runner receipt output tokens
            description: Optional closed-window runner receipts, not native Limitador
              per-model counters. Absent receipt data stays NO DATA. Receipt input/output
              split is a cross-check, not the allocation denominator. Denied attempts
              add no separate cost charge. The bounded runner disables retries.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_receipt_output_tokens @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      receiptRequests:
        kind: Panel
        spec:
          display:
            name: Runner receipt requests
            description: Optional closed-window runner receipts, not native Limitador
              per-model counters. Absent receipt data stays NO DATA. Receipt input/output
              split is a cross-check, not the allocation denominator. Denied attempts
              add no separate cost charge. The bounded runner disables retries.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_receipt_requests @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      receiptErrors:
        kind: Panel
        spec:
          display:
            name: Runner receipt errors
            description: Optional closed-window runner receipts, not native Limitador
              per-model counters. Absent receipt data stays NO DATA. Receipt input/output
              split is a cross-check, not the allocation denominator. Denied attempts
              add no separate cost charge. The bounded runner disables retries.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_receipt_errors @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      receiptQuota:
        kind: Panel
        spec:
          display:
            name: Runner receipt quota rejections
            description: Optional closed-window runner receipts, not native Limitador
              per-model counters. Absent receipt data stays NO DATA. Receipt input/output
              split is a cross-check, not the allocation denominator. Denied attempts
              add no separate cost charge. The bounded runner disables retries.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_receipt_quota_rejections @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report and evidence
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/reportIdentity"
    - kind: Grid
      spec:
        display:
          title: Actual team/model usage
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/teamModelTokens"
    - kind: Grid
      spec:
        display:
          title: Actual window usage
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/tokens"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/shares"
    - kind: Grid
      spec:
        display:
          title: Optional bounded runner receipts
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/receiptInputs"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/receiptOutputs"
    - kind: Grid
      spec:
        display:
          title: Optional runner outcomes
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/receiptRequests"
        - x: 8
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/receiptErrors"
        - x: 16
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/receiptQuota"
    - kind: Grid
      spec:
        display:
          title: Published access configuration — not enforcement proof
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/access"
    - kind: Grid
      spec:
        display:
          title: Published allowance configuration — not remaining quota
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/allowance"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/allowanceShare"
    - kind: Grid
      spec:
        display:
          title: Evidence boundaries
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/coverage"
