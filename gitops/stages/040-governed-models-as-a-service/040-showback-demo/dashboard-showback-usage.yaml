                  - instance
                  - subscription
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_subscription_tokens @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_subscription_token_share_ratio @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))) * 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}
                    | {{subscription}}"
      coverage:
        kind: Panel
        spec:
          display:
            name: Usage evidence by window
            description: Request/error/denial counts need separately reconciled runner
              receipts. Native request counters do not prove a model dimension. Denied
              attempts count as zero inference tokens only after pre-inference enforcement
              is proved.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: phase
                header: Window
                width: 65
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: busy
                  text: Busy
                - condition:
                    kind: Value
                    spec:
                      value: quiet
                  text: Quiet
                - condition:
                    kind: Value
                    spec:
                      value: idle
                  text: Idle
              - name: window_start
                header: Start (UTC)
                width: 165
              - name: value
                header: Usage evidence
                width: 110
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Complete
                - condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: Incomplete
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_coverage_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      reportAudit:
        kind: Panel
        spec:
          display:
            name: Report audit identity
            description: Full report ID, scope, policy and canonical hash are retained.
              Hover truncated audit cells to read their complete values.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: report_id
                header: Report ID
                width: 175
              - name: scope
                header: Scope
                width: 125
              - name: policy_version
                header: Policy
                width: 100
              - name: report_sha256
                header: SHA-256
                width: 100
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Closed report
          collapse:
