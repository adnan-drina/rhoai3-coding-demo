# The nightly quality scorer (CronJob maas-quality-scorer). MLflow online judges need the MLflow AI Gateway and server
# job execution, which OpenShift AI 3.5 ships disabled; this batch job does the same work with the MLflow SDK: for each
# model experiment it samples the previous day's unscored request traces, asks a private judge model through MaaS and
# logs the verdicts as MLflow feedback on the traces (the experiment Overview's Quality tab).
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-quality-scorer
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quality-scorer
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  score.py: |
    import json, os, random, socket, ssl, sys, time, urllib.request

    import mlflow
    from mlflow.entities import AssessmentSource, Feedback
    from mlflow.genai.judges import make_judge
    from mlflow.genai.scorers import list_scorers

    WINDOW_MIN = int(os.environ.get("WINDOW_MINUTES", "1500"))
    SAMPLE = float(os.environ.get("SAMPLE_RATE", "1.0"))
    LIMIT = int(os.environ.get("MAX_TRACES_PER_EXPERIMENT", "2000"))
    # MLflow judges retry a failed call up to ten times with backoff; the budget bounds a run when a judge is slow or
    # rate-limited. Unscored traces are picked up by the next run.
    DEADLINE = time.time() + int(os.environ.get("RUN_BUDGET_SECONDS", "9000"))
    ENDPOINT = "/etc/maas-quality/endpoint/"
    SHARED_HOST = open(ENDPOINT + "host").read().strip()
    MISTRAL_HOST = open(ENDPOINT + "mistral_host").read().strip()

    # The judges are reached on their public MaaS hostnames (TLS and route matching unchanged) through the internal
    # gateway Service, the in-process equivalent of the Dev Spaces hostAlias.
    INTERNAL = socket.gethostbyname("maas-gateway-internal.openshift-ingress.svc.cluster.local")
    _getaddrinfo = socket.getaddrinfo
    socket.getaddrinfo = lambda host, *a, **k: _getaddrinfo(
        INTERNAL if host in (SHARED_HOST, MISTRAL_HOST) else host, *a, **k)

    KEY = open("/etc/maas-quality/key/api-key").read().strip()
    os.environ["OPENAI_API_KEY"] = KEY  # the provider config requires one; the header below is what is sent
    JUDGE, SELF_JUDGE = os.environ["JUDGE_MODEL"], os.environ["SELF_JUDGE_MODEL"]
    # The private judges: MaaS model name, endpoint (Mistral has its own Gateway listener) and inference parameters.
    # Qwen runs with thinking off, as the coding clients use it.
    JUDGES_BY_MODEL = {
        "qwen3-8-27b": (f"https://{SHARED_HOST}/v1/chat/completions",
                        {"max_tokens": 2000, "temperature": 0, "chat_template_kwargs": {"enable_thinking": False}}),
        # 2000: a rationale that counts words (marketing length limits) cut the JSON verdict off at 1000.
        "mistral-small4-119b": (f"https://{MISTRAL_HOST}/v1/chat/completions", {"max_tokens": 1000, "temperature": 0}),
    }

    def serving(model):
        """One short request: a judge whose model is stopped (GPUs scaled down) skips the run instead of retrying."""
        url, _ = JUDGES_BY_MODEL[model]
        body = json.dumps({"model": f"publishers/internal-models/models/{model}", "max_tokens": 1,
                           "messages": [{"role": "user", "content": "ping"}]}).encode()
        req = urllib.request.Request(url, data=body, headers={"Authorization": f"Bearer {KEY}",
                                                              "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=60, context=ssl.create_default_context()) as r:
                return r.status == 200
        except Exception as e:
            print(f"judge {model} not serving: {type(e).__name__}: {str(e)[:120]}", flush=True)
            return False

    if not (serving(JUDGE) and serving(SELF_JUDGE)):
        print("skipped: start the private judge models (Qwen and Mistral) and run the scorer again", flush=True)
        sys.exit(0)

    # What a good answer is for each team (the trace's subscription tag).
    GUIDELINES = {
        "team-engineering": "The answer names the concrete defect or risk in the code or design it was given and proposes "
                            "a specific, correct fix or test. Generic advice that ignores the given code fails.",
        "team-support": "The answer is a reply a support agent could send: empathetic, polite, addresses the customer's "
                        "actual problem and gives concrete next steps. It does not invent policies or promise refunds.",
        "team-marketing": "The answer delivers exactly the requested marketing artefact (format, count and length), is on "
                          "brief for the product and audience named in the request, and makes no unverifiable claims.",
    }
    def judges_for(judge_model):
        url, params = JUDGES_BY_MODEL[judge_model]
        # Boolean verdicts, so the Quality tab shows each scorer's average (the pass rate).
        kw = dict(model=f"openai:/publishers/internal-models/models/{judge_model}", base_url=url,
                  extra_headers={"Authorization": f"Bearer {KEY}"}, feedback_value_type=bool, inference_params=params)
        relevance = make_judge(name="relevance", description="The response addresses the request.", instructions=(
            "Request: {{ inputs }}\nResponse: {{ outputs }}\n"
            "Return true if the response directly addresses what the request asks for, false if it is off-topic, "
            "evasive or answers a different question."), **kw)
        completeness = make_judge(name="completeness", description="The response covers every part of the request.",
            instructions=("Request: {{ inputs }}\nResponse: {{ outputs }}\n"
            "Return true if the response covers every part of the request, false if a requested part is missing. "
            "Judge the content only: whether the text was cut off is checked separately from the model's stop "
            "reason."), **kw)
        team = {sub: make_judge(name="team_guidelines", description="The response meets the team's quality guideline.",
            instructions=("Request: {{ inputs }}\nResponse: {{ outputs }}\nGuideline: " + rules + "\n"
            "Return true if the response meets the guideline, false if it does not."), **kw)
            for sub, rules in GUIDELINES.items()}
        return relevance, completeness, team

    JUDGE_SETS = {m: judges_for(m) for m in (JUDGE, SELF_JUDGE)}


    def register_judges(exp_id, judge_set):
        """Show what grades this experiment on its Judges page: register the LLM judges when missing or changed (the
        finished code check cannot be registered: MLflow allows custom code scorers only on Databricks). Registration stores name, instructions, judge model and verdict type, never the endpoint or the key.
        The definitions live in Git (this ConfigMap); the page mirrors them. Display only: MLflow cannot run them
        itself on OpenShift AI 3.5 (no AI Gateway, no server job execution); this job runs them."""
        relevance, completeness, team = judge_set
        wanted = {"relevance": relevance, "completeness": completeness}
        wanted.update({"team_guidelines_" + sub.removeprefix("team-"): judge for sub, judge in team.items()})
        try:
            have = {s.name: s for s in list_scorers(experiment_id=exp_id)}
        except Exception as e:
            print(f"  judges not listed ({type(e).__name__}: {str(e)[:120]})", flush=True)
            return
        for name, judge in wanted.items():
            current = have.get(name)
            if current is not None and getattr(current, "instructions", None) == getattr(judge, "instructions", None) \
                    and getattr(current, "model", None) == getattr(judge, "model", None):
                continue
            try:
                judge.register(name=name, experiment_id=exp_id)
                print(f"  registered judge {name}", flush=True)
            except Exception as e:
                print(f"  judge {name} not registered ({type(e).__name__}: {str(e)[:120]})", flush=True)

    def root_io(trace):
        root = next(s for s in trace.data.spans if s.parent_id is None)
        return (root.inputs or {}).get("prompt"), (root.outputs or {}).get("response")

    client = mlflow.MlflowClient()

    # One experiment per MaaS model, created before its first request: internal-<model> for model references in
    # internal-models, external-<model> for those in external-models. Offering and provider are refreshed each run, so
    # an offering change shows without renaming the experiment.
    from kubernetes import client as k8s, config as k8s_config
    k8s_config.load_incluster_config()
    co = k8s.CustomObjectsApi()
    try:
        catalog = co.get_namespaced_custom_object("monitoring.rhobs", "v1", "redhat-ods-monitoring", "prometheusrules",
                                                  "showback-offer-catalog")
        offers = {r["labels"]["model"]: r["labels"]["offer"] for g in catalog["spec"]["groups"] for r in g["rules"]
                  if r.get("record") == "showback_offer_info"}
    except Exception as e:
        print(f"offer catalog unreadable ({type(e).__name__}); private offerings tagged unlisted", flush=True)
        offers = {}
    # What an MLflow cost figure means per offering: the shared tariff, the dedicated worker cost per token at
    # demonstrated capacity (the sponsor pays the worker, busy or idle), or the provider list price.
    BASIS = {"shared": "tariff", "dedicated": "capacity-equivalent", "external": "list-price"}
    for ns, prefix in (("internal-models", "internal"), ("external-models", "external")):
        for ref in co.list_namespaced_custom_object("maas.opendatahub.io", "v1alpha1", ns, "maasmodelrefs")["items"]:
            model = ref["metadata"]["name"]
            if prefix == "internal":
                offering, provider = offers.get(model, "unlisted"), "openshift-ai"
            else:
                ext = co.get_namespaced_custom_object("inference.opendatahub.io", "v1alpha1", ns, "externalmodels",
                                                      ref["spec"]["modelRef"]["name"])
                offering, provider = "external", ext["spec"]["externalProviderRefs"][0]["ref"]["name"]
            name = f"{prefix}-{model}"
            exp = client.get_experiment_by_name(name)
            if exp is not None and exp.lifecycle_stage != "active":
                print(f"{name}: deleted experiment holds the name; skipped", flush=True)
                continue
            exp_id = exp.experiment_id if exp else client.create_experiment(name)
            for key, value in {"offering": offering, "provider": provider, "model": model, "cost_basis":
                               BASIS.get(offering, "list-price"), "mlflow.note.content": f"Requests to the MaaS model {model} ({offering} offering, provider {provider}). Costs here are indicative unit "
                               f"costs per request ({BASIS.get(offering, 'list-price')} basis); charges per subscription are on "
                               f"the OpenShift AI Observability Offer dashboards."}.items():
                client.set_experiment_tag(exp_id, key, value)

    cutoff = int((time.time() - WINDOW_MIN * 60) * 1000)
    scored = failed = 0
    # One experiment per MaaS model: internal-<model> (served in internal-models) and external-<model>.
    experiments = [e for prefix in ("internal-", "external-")
                   for e in client.search_experiments(filter_string=f"name LIKE '{prefix}%'")]
    for exp in experiments:
        # No model grades its own answers: the second judge takes the main judge model's experiment.
        own = exp.name == "internal-" + JUDGE
        RELEVANCE, COMPLETENESS, TEAM_JUDGES = JUDGE_SETS[SELF_JUDGE if own else JUDGE]
        register_judges(exp.experiment_id, JUDGE_SETS[SELF_JUDGE if own else JUDGE])
        # Every trace of the window, page by page (a busy experiment holds more than one page).
        traces, token = [], None
        while True:
            page = client.search_traces(locations=[exp.experiment_id], max_results=500, page_token=token,
                                        filter_string=f"trace.timestamp_ms > {cutoff} AND trace.status = 'OK'")
            traces += list(page)
            token = page.token
            if not token:
                break
        # Only traces that record why the answer stopped (generator since 2026-10-27) and still miss a verdict;
        # each trace gets only the verdicts it does not have yet, so a half-scored trace is completed, never doubled.
        def missing(t):
            tags, have = t.info.tags or {}, {a.name for a in (t.info.assessments or [])}
            want = {"finished", "relevance", "completeness"} | ({"team_guidelines"} if tags.get("subscription") in GUIDELINES else set())
            return want - have if tags.get("finish_reason") else set()
        todo = [t for t in traces if missing(t)]
        # The finished check is a tag lookup: every unscored trace gets it, whatever the sample or the time budget.
        for trace in todo:
            if "finished" in missing(trace):
                reason = trace.info.tags["finish_reason"]
                mlflow.log_assessment(trace_id=trace.info.trace_id, assessment=Feedback(
                    name="finished", value=reason != "length",
                    rationale=f"The model's stop reason is '{reason}'" + (": the max-tokens cap cut the answer off."
                                                                         if reason == "length" else "."),
                    source=AssessmentSource(source_type="CODE", source_id="finish_reason")))
                scored += 1
        picked = [t for t in todo if random.random() < SAMPLE][:LIMIT]
        print(f"{exp.name}: {len(traces)} recent, {len(todo)} unscored, {len(picked)} sampled", flush=True)
        for trace in picked:
            if time.time() > DEADLINE:
                print("run budget reached; the remaining traces wait for the next run", flush=True)
                break
            prompt, response = root_io(trace)
            if not prompt or response is None:
                continue
            need = missing(trace)
            team_judge = TEAM_JUDGES.get((trace.info.tags or {}).get("subscription"))
            for judge in [RELEVANCE, COMPLETENESS] + ([team_judge] if team_judge else []):
                if judge.name not in need:
                    continue
                try:
                    feedback = judge(inputs={"request": prompt}, outputs={"response": response})
                    mlflow.log_assessment(trace_id=trace.info.trace_id, assessment=feedback)
                    scored += 1
                except Exception as e:  # one failed verdict never stops the run
                    failed += 1
                    print(f"  {trace.info.trace_id} {judge.name}: {type(e).__name__}: {str(e)[:200]}", flush=True)
    print(f"verdicts logged={scored} failed={failed}", flush=True)
    sys.exit(1 if failed and not scored else 0)
