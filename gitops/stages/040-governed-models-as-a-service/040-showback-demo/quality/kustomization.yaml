apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Quality scoring of the team request traces: an LLM judge (Claude Sonnet 5.5 through MaaS, its own subscription)
# grades a sample of each hour's traces and writes MLflow feedback, which fills the experiments' Overview Quality tab.
resources:
  - serviceaccount.yaml
  - access.yaml
  - rbac.yaml
  - key-provisioner-job.yaml
  - scorer-configmap.yaml
  - cronjob.yaml
