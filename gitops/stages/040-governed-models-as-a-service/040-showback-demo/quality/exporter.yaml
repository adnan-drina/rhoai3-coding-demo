# Quality exporter: publishes the judges' verdicts from MLflow as Prometheus gauges for the showback dashboards, which
# read Prometheus only. Every 6 hours (scores change once a day) it counts the verdicts of the last WINDOW_DAYS days per model experiment,
# judge, subscription and result, plus a running total of all verdicts so a dashboard can read any time range (how much
# the total grew); the dashboards turn the counts into pass rates and join the team from the offer catalog. It runs beside the metering backend in redhat-ods-monitoring, the namespace the monitoring stack scrapes,
# and reads the MLflow workspace models-as-a-service through the in-cluster Service. It reads small pages with a pause
# between them: a full scan in large pages kept MLflow too busy to answer its 1-second health checks.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: showback-quality-exporter
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
---
# Read-only MLflow access: the workspace authorizes trace reads by get and list on its experiments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: showback-quality-exporter
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
rules:
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: showback-quality-exporter
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: showback-quality-exporter
subjects:
  - kind: ServiceAccount
    name: showback-quality-exporter
    namespace: redhat-ods-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showback-quality-exporter
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
data:
  exporter.py: |
    import collections, os, threading, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import mlflow

    WINDOW_DAYS = int(os.environ.get("WINDOW_DAYS", "7"))
    REFRESH = int(os.environ.get("REFRESH_SECONDS", "21600"))
    RETRY = int(os.environ.get("RETRY_SECONDS", "60"))
    PAGE_SIZE = int(os.environ.get("PAGE_SIZE", "100"))
    PAGE_PAUSE = float(os.environ.get("PAGE_PAUSE_SECONDS", "2"))
    PASS = {"yes", "true", "pass"}
    state = {"body": "", "ok": False}

    def esc(v):
        return str(v).replace("\\", "\\\\").replace('"', '\\"')

    def collect():
        client = mlflow.MlflowClient()
        cutoff = int((time.time() - WINDOW_DAYS * 86400) * 1000)
        counts, totals = collections.Counter(), collections.Counter()
        for prefix, offer in (("internal-", "private"), ("external-", "external")):
            for exp in client.search_experiments(filter_string=f"name LIKE '{prefix}%'"):
                model, token = exp.name[len(prefix):], None
                while True:
                    page = client.search_traces(locations=[exp.experiment_id], max_results=PAGE_SIZE, page_token=token,
                                                include_spans=False)  # verdicts travel in the trace info
                    for t in page:
                        sub = (t.info.tags or {}).get("subscription", "")
                        for a in t.info.assessments or []:
                            value = getattr(a, "value", None)
                            if value is None:
                                continue
                            result = "pass" if value is True or str(value).lower() in PASS else "fail"
                            totals[(model, offer, a.name, sub, result)] += 1
                            if t.info.timestamp_ms > cutoff:
                                counts[(model, offer, a.name, sub, result)] += 1
                    token = page.token
                    if not token:
                        break
                    time.sleep(PAGE_PAUSE)  # leave MLflow room for other requests and its probes
        lines = ["# HELP showback_quality_verdicts Judge verdicts of the request traces in the window (MLflow feedback).",
                 "# TYPE showback_quality_verdicts gauge"]
        lines += [f'showback_quality_verdicts{{model="{esc(m)}",offer="{o}",judge="{esc(j)}",subscription="{esc(s)}",'
                  f'result="{r}"}} {n}' for (m, o, j, s, r), n in sorted(counts.items())]
        lines += ["# HELP showback_quality_verdicts_total All judge verdicts in MLflow so far.",
                  "# TYPE showback_quality_verdicts_total counter"]
        lines += [f'showback_quality_verdicts_total{{model="{esc(m)}",offer="{o}",judge="{esc(j)}",subscription="{esc(s)}",'
                  f'result="{r}"}} {n}' for (m, o, j, s, r), n in sorted(totals.items())]
        lines += ["# HELP showback_quality_window_days Days of traces the verdict counts cover.",
                  "# TYPE showback_quality_window_days gauge", f"showback_quality_window_days {WINDOW_DAYS}",
                  "# HELP showback_quality_last_refresh_timestamp_seconds When the counts were last read from MLflow.",
                  "# TYPE showback_quality_last_refresh_timestamp_seconds gauge",
                  f"showback_quality_last_refresh_timestamp_seconds {int(time.time())}"]
        return "\n".join(lines) + "\n"

    def refresh():
        while True:
            delay = REFRESH
            try:
                state["body"], state["ok"] = collect(), True
                print(f"refreshed: {state['body'].count('showback_quality_verdicts{')} series", flush=True)
            except Exception as e:  # keep serving the last counts; retry soon, MLflow may still be starting after a lab start
                print(f"refresh failed: {type(e).__name__}: {e}", flush=True)
                delay = RETRY
            time.sleep(delay)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics" or not state["ok"]:
                self.send_response(404 if self.path != "/metrics" else 503)
                self.end_headers()
                return
            body = state["body"].encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    threading.Thread(target=refresh, daemon=True).start()
    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showback-quality-exporter
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: showback-quality-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: showback-quality-exporter
    spec:
      serviceAccountName: showback-quality-exporter
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # The scorer's image: it carries the MLflow SDK with the Kubernetes workspace auth plugin.
          image: registry.redhat.io/rhoai/odh-pipeline-runtime-datascience-cpu-py312-rhel9@sha256:6552d90818c098ce2b1cd057684c3dd832035cfb71f6ccf2ab207b701f536b18
          command: [python3, /etc/showback-quality/exporter.py]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WINDOW_DAYS
              value: '7'
            - name: REFRESH_SECONDS
              value: '21600'
            - name: PAGE_SIZE
              value: '100'
            - name: PAGE_PAUSE_SECONDS
              value: '2'
            - name: MLFLOW_TRACKING_URI
              value: https://mlflow.redhat-ods-applications.svc:8443/mlflow
            - name: MLFLOW_TRACKING_AUTH
              value: kubernetes-namespaced
            - name: MLFLOW_WORKSPACE
              value: models-as-a-service
            - name: MLFLOW_TRACKING_SERVER_CERT_PATH
              value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
            - name: MLFLOW_DISABLE_TELEMETRY
              value: 'true'
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - name: exporter
              mountPath: /etc/showback-quality
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: exporter
          configMap:
            name: showback-quality-exporter
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: showback-quality-exporter
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  selector:
    app.kubernetes.io/name: showback-quality-exporter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: showback-quality-exporter
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-quality-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
    monitoring.opendatahub.io/scrape: 'true'
  annotations:
    argocd.argoproj.io/sync-wave: '40'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: showback-quality-exporter
  namespaceSelector:
    matchNames:
      - redhat-ods-monitoring
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
