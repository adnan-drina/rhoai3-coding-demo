# The judge's own MaaS access, owned by the scoring ServiceAccount, so judging shows up as its own subscription (cost
# centre ai-platform) and never consumes a team's allowance. Nemotron 3 Ultra (free through the NVIDIA provider) judges
# every model except itself; Qwen judges Nemotron's answers, so no model grades its own.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: maas-quality-judge
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quality-judge
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  owner:
    users:
      - system:serviceaccount:models-as-a-service:maas-quality-judge
  priority: 60
  modelRefs:
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
      tokenRateLimits:
        - limit: 1000000
          window: 1h
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 200000
          window: 1h
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: quality-judge
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: maas-quality-judge
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quality-judge
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  subjects:
    users:
      - system:serviceaccount:models-as-a-service:maas-quality-judge
  modelRefs:
    - name: nemotron-3-ultra-550b-a55b
      namespace: external-models
    - name: qwen3-8-27b
      namespace: internal-models
