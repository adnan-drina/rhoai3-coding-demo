# The judge's own MaaS access, owned by the scoring ServiceAccount, so judging shows up as its own subscription (cost
# centre ai-platform, team Platform) and never consumes a team's allowance. Qwen 3.8 grades every model except itself;
# GPT-6 Luna grades Qwen, so no model grades its own answers and Marketing's dedicated Mistral serves only its sponsor.
# Grading Qwen sends its prompts and answers to Luna's provider, billed to Platform at list price.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: maas-quality-judge
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quality-judge
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  owner:
    users:
      - system:serviceaccount:models-as-a-service:maas-quality-judge
  priority: 60
  modelRefs:
    # Sized so a daily run grades a busy day's traces without 429s (1M stopped the 2026-10-28 run).
    - name: qwen3-8-27b
      namespace: internal-models
      tokenRateLimits:
        - limit: 4000000
          window: 1h
    - name: gpt-6-luna
      namespace: external-models
      tokenRateLimits:
        - limit: 3000000
          window: 1h
  tokenMetadata:
    organizationId: rhoai3-coding-demo
    costCenter: ai-platform
    labels:
      environment: demo
      provider: governed-models
      modelSet: quality-judge
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: maas-quality-judge
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/name: maas-quality-judge
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: quality-scoring
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  subjects:
    users:
      - system:serviceaccount:models-as-a-service:maas-quality-judge
  modelRefs:
    - name: qwen3-8-27b
      namespace: internal-models
    - name: gpt-6-luna
      namespace: external-models
