# Generated by service-views/generate-dashboards.sh. Platform-only candidate; consumer access is not configured.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: service-view-dedicated
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: service-view-dedicated
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Services · dedicated service efficiency · platform
      description: PLATFORM ONLY candidate. Financial context for dedicated capacity.
        Reuse native LLM Utilization, Performance and Traffic for GPU, queue, TTFT/ITL
        and errors. No request/team GPU-time attribution is inferred. One selected
        immutable snapshot; current gauges, never integrate. No dashboard filter provides
        authorization.
    duration: 1h
    variables: []
    panels:
      report:
        kind: Panel
        spec:
          display:
            name: Selected immutable service report
            description: Read evidence, estimate/closed status, period, policy, price
              basis and cost scope before using money. No live authorization is configured
              for these detached platform candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{statement_status}} | {{report_id}}
                    r{{revision}} | {{period_start}} to {{period_end}} | {{currency}}
                    | {{policy_version}} | {{price_basis}} | {{cost_scope}}"
      complete:
        kind: Panel
        spec:
          display:
            name: Evidence complete (1=yes)
            description: Missing evidence is not zero. Completeness does not by itself
              establish invoice reconciliation or accepted task quality.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_complete @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{report_id}} | {{statement_status}}"
      cost:
        kind: Panel
        spec:
          display:
            name: Dedicated actual full cost (USD cents)
            description: Use with paid availability evidence and native operational
              views. The sponsor owns idle capacity under the agreement.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_cost_cents{offer="dedicated"} @ end()
                    and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}} | {{owner_team}}"
      charge:
        kind: Panel
        spec:
          display:
            name: Dedicated sponsor charge (USD cents)
            description: 'Charges and actual cost remain separate: a fixed quote does
              not become actual infrastructure cost.'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_charge_cents{offer="dedicated"} @ end()
                    and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}} | {{owner_team}}"
      variance:
        kind: Panel
        spec:
          display:
            name: Dedicated recovery balance (USD cents)
            description: Report-defined charges plus subsidy minus actual cost; negative
              means under-recovery. No cost is inferred from GPU utilization.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_recovery_balance_cents{offer="dedicated"}
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      components:
        kind: Panel
        spec:
          display:
            name: Dedicated cost components (USD cents)
            description: Only included cost components from the immutable report.
              Fullness depends on declared scope and evidence.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_cost_component_cents{offer="dedicated"} @ end()
                    and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{category}} | {{owner_team}}"
      tokens:
        kind: Panel
        spec:
          display:
            name: Dedicated measured total tokens
            description: Zero use does not remove paid availability cost. Use native
              serving metrics for performance and the task view for instrumented accepted
              outcomes.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_total_tokens{offer="dedicated"} @ end()
                    and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{model}}"
      agreementContext:
        kind: Panel
        spec:
          display:
            name: Agreement cost and contract basis
            description: Invoice, metered estimate and supplied actual costs remain
              distinct. Metadata is retained with this immutable report, not read
              from current configuration.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}} | {{cost_basis}}
                    | {{contract_version}} | {{price_basis}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/agreementContext"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/charge"
        - x: 0
          y: 12
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/complete"
        - x: 0
          y: 18
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/components"
        - x: 0
          y: 24
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/cost"
        - x: 0
          y: 30
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/report"
        - x: 0
          y: 36
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/tokens"
        - x: 0
          y: 42
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/variance"
