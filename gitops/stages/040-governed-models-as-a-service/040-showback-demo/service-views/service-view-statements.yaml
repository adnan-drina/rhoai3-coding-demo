# Generated by service-views/generate-dashboards.sh. Platform-only candidate; consumer access is not configured.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: service-view-statements
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: service-view-statements
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Services · consumption and team statements · platform
      description: PLATFORM ONLY candidate. Platform reconciliation by attributed
        user/team. Consumer delivery uses an explicitly scoped offline statement;
        native self-only MaaS views remain a separate qualified capability. One selected
        immutable snapshot; current gauges, never integrate. No dashboard filter provides
        authorization.
    duration: 1h
    variables: []
    panels:
      report:
        kind: Panel
        spec:
          display:
            name: Selected immutable service report
            description: Read evidence, estimate/closed status, period, policy, price
              basis and cost scope before using money. No live authorization is configured
              for these detached platform candidates.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{statement_status}} | {{report_id}}
                    r{{revision}} | {{period_start}} to {{period_end}} | {{currency}}
                    | {{policy_version}} | {{price_basis}} | {{cost_scope}}"
      complete:
        kind: Panel
        spec:
          display:
            name: Evidence complete (1=yes)
            description: Missing evidence is not zero. Completeness does not by itself
              establish invoice reconciliation or accepted task quality.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_report_complete @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{report_id}} | {{statement_status}}"
      charges:
        kind: Panel
        spec:
          display:
            name: Attributed charges (USD cents)
            description: Charges by user, team, model, offer and category. Unattributed
              user rows can be legitimate team availability or reservation charges.
              Never redistribute them through a dashboard filter.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_consumer_charge_cents @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{team}} / {{user}} | {{offer}} / {{model}} |
                    {{category}} | {{charge_kind}} | {{rate_version}}"
      known:
        kind: Panel
        spec:
          display:
            name: Known charges, possibly incomplete (USD cents)
            description: Known portions are diagnostic and must not be presented as
              full totals when completeness is false.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_consumer_known_charge_cents @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))
                  seriesNameFormat: "{{team}} / {{user}} | {{model}} | {{category}}"
      quantities:
        kind: Panel
        spec:
          display:
            name: Billable quantities in their own units
            description: Do not add unlike units or overlapping provider categories.
              Rates and categories are taken from this report snapshot.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_consumer_quantity @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{user}} / {{team}} | {{category}} | {{unit}}
                    | {{rate_usd}} USD | {{rate_version}}"
      rates:
        kind: Panel
        spec:
          display:
            name: Snapshot rate provenance
            description: Value 1 identifies a retained rate/source, not a monetary
              value. Editable dashboard defaults are not pricing authority.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_rate_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{offer}} | {{category}} | {{rate_version}} |
                    {{rate_usd}} USD/{{unit}} | {{rate_source}}"
      agreementContext:
        kind: Panel
        spec:
          display:
            name: Agreement cost and contract basis
            description: Invoice, metered estimate and supplied actual costs remain
              distinct. Metadata is retained with this immutable report, not read
              from current configuration.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (service_agreement_info @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1))
                  seriesNameFormat: "{{agreement}} | {{offer}} | {{model}} | {{cost_basis}}
                    | {{contract_version}} | {{price_basis}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/agreementContext"
        - x: 0
          y: 6
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/charges"
        - x: 0
          y: 12
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/complete"
        - x: 0
          y: 18
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/known"
        - x: 0
          y: 24
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/quantities"
        - x: 0
          y: 30
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/rates"
        - x: 0
          y: 36
          width: 24
          height: 6
          content:
            "$ref": "#/spec/panels/report"
