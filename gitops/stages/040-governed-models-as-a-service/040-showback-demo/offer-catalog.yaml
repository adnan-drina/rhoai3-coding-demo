# Offer catalog for the showback dashboards: which private models are offered as dedicated or shared, who sponsors a
# dedicated model, the GPU worker price behind each model and the published shared tariff. The dashboards read only
# these series; onboarding another model or changing a price is an edit here, not a dashboard change.
# Worker price: AWS g7e.2xlarge (one RTX PRO 6000) on-demand list price in us-east-2, saved 2026-10-15.
# Capacity: tokens per second one worker sustained in the 2026-10-20 demo run (Qwen 3.8 NVFP4: 304 at 6 concurrent
# requests; Mistral Small 4: 253 at 3). Projections size the private worker count from it.
# Shared commitments: a subscription commits to monthly tokens at the committed tariff, paid whether used or not;
# usage above it is billed at the on-demand tariff. Its MaaS token-rate limit must allow the commitment in working hours.
# Teams: every MaaS subscription belongs to the team of its owner; Platform carries the platform's own services. The
# MaaS usage counters carry the subscription but not its cost centre, so the dashboards join on this mapping. A
# subscription missing here shows as "unassigned" on the showback tabs.
apiVersion: monitoring.rhobs/v1
kind: PrometheusRule
metadata:
  name: showback-offer-catalog
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: showback-offer-catalog
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  groups:
    - name: showback-offer-catalog
      interval: 1m
      rules:
        # Shared private: consumers pay the tariff; the platform pays the worker.
        - record: showback_offer_info
          expr: vector(1)
          labels: {offer: shared, model: qwen3-8-27b, sponsor: platform}
        - record: showback_offer_worker_usd_per_hour
          expr: vector(3.36312)
          labels: {offer: shared, model: qwen3-8-27b, instance_type: g7e.2xlarge}
        - record: showback_offer_tariff_usd_per_million
          expr: vector(4)
          labels: {offer: shared, model: qwen3-8-27b}
        - record: showback_offer_capacity_tokens_per_second
          expr: vector(300)
          labels: {offer: shared, model: qwen3-8-27b}
        - record: showback_offer_committed_tariff_usd_per_million
          expr: vector(3)
          labels: {offer: shared, model: qwen3-8-27b}
        - record: showback_offer_commitment_tokens
          expr: vector(150000000)
          labels: {offer: shared, model: qwen3-8-27b, subscription: team-engineering}
        - record: showback_offer_commitment_tokens
          expr: vector(30000000)
          labels: {offer: shared, model: qwen3-8-27b, subscription: team-support}
        # Dedicated private: the sponsoring subscription pays the worker, busy or idle.
        - record: showback_offer_info
          expr: vector(1)
          labels: {offer: dedicated, model: mistral-small4-119b, sponsor: team-marketing}
        - record: showback_offer_worker_usd_per_hour
          expr: vector(3.36312)
          labels: {offer: dedicated, model: mistral-small4-119b, instance_type: g7e.2xlarge}
        - record: showback_offer_capacity_tokens_per_second
          expr: vector(250)
          labels: {offer: dedicated, model: mistral-small4-119b}
    - name: showback-teams
      interval: 1m
      rules:
        - record: showback_team_info
          expr: vector(1)
          labels: {team: engineering}
        - record: showback_team_info
          expr: vector(1)
          labels: {team: support}
        - record: showback_team_info
          expr: vector(1)
          labels: {team: marketing}
        - record: showback_team_info
          expr: vector(1)
          labels: {team: platform}
        - record: showback_team_info
          expr: vector(1)
          labels: {team: unassigned}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: team-engineering, team: engineering}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: devspaces-coding-models, team: engineering}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: personal-ai-developer, team: engineering}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: opencode-developer-qwen38, team: engineering}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: mta-migration-ai, team: engineering}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: team-support, team: support}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: personal-ai-admin, team: support}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: hermes-private-qwen38, team: support}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: opencode-private-qwen38, team: support}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: team-marketing, team: marketing}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: maas-quality-judge, team: platform}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: openshift-lightspeed, team: platform}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: model-qualification, team: platform}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: quota-probe, team: platform}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: playground-sandbox, team: platform}
        - record: showback_subscription_team
          expr: vector(1)
          labels: {subscription: personal-kube-admin, team: platform}
    # Hourly token limit of each subscription and model, copied from the MaaSSubscriptions (tokenRateLimits, 1h window)
    # because MaaS does not publish its limits as metrics. Stage 040 validate.sh fails when a live limit differs.
    # quota-probe (100 tokens a minute) has no hourly limit and is not listed.
