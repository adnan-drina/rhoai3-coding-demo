# Platform administrators write and read the traces. ClusterRole admin aggregates the MLflow operator's
# mlflow-edit and mlflow-view roles (experiments, traces) for this workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhods-admins-maas-observability-admin
  namespace: maas-observability
  labels:
    app.kubernetes.io/name: rhods-admins-maas-observability-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: tracing
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhods-admins
