# Generated by showback-demo/generate-dashboards.sh; edit dashboard-definitions.json. Offline candidate only.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-9-showback-efficiency-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-9-showback-efficiency-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback · model cost and efficiency
      description: Closed-report cost efficiency followed by clearly separate live
        vLLM/DCGM context. No per-team GPU cost model.
    duration: 1h
    variables: []
    panels:
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Selected closed report — read evidence kind before presenting
            description: The series label identifies SYNTHETIC versus live evidence,
              immutable report ID, UTC period and policy. Value 1 means metadata is
              present. The time picker never recalculates this report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      fullCost:
        kind: Panel
        spec:
          display:
            name: Full hosting cost by model/window (USD)
            description: Complete model/window cost includes paid quiet and idle capacity.
              Missing price stays NO DATA.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_cost_cents @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))) / 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      workerRate:
        kind: Panel
        spec:
          display:
            name: Effective worker USD per paid instance-hour
            description: Unrounded model/window hosting cost divided by evidenced
              paid instance-hours. This is a time-weighted worker rate when interval
              prices differ. Missing price or zero hours stays NO DATA.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 6
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_effective_worker_usd_per_hour @ end() and
                    on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      reportWorkerRate:
        kind: Panel
        spec:
          display:
            name: Effective worker rate across the report (USD/hour)
            description: Unrounded hosting cost divided by summed paid instance-hours
              for each model, with no dashboard price variables.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 6
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_model_effective_worker_usd_per_hour @ end()
                    and on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}}"
      declaredRates:
        kind: Panel
        spec:
          display:
            name: Recorded worker rates (USD/hour)
            description: Numeric rates and provenance come from the selected report.
              Unknown rates are withheld.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 6
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_rate_usd_per_hour @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{rate_id}} | {{instance_type}} | {{region}}"
      hours:
        kind: Panel
        spec:
          display:
            name: Paid instance hours by model/window
            description: Hosting hours from the report's instance evidence, including
              idle capacity.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 4
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_instance_hours @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      tokens:
        kind: Panel
        spec:
          display:
            name: Certified tokens by model/window
            description: Missing usage is NO DATA; covered idle is zero.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_tokens @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      effective:
        kind: Panel
        spec:
          display:
            name: Hosting USD per million actual tokens
            description: Full model/window hosting cost divided by measured tokens.
              Covered idle is undefined/NO DATA, not $0. Compare busy and quiet windows
              to show idle capacity's effect.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_effective_usd_per_million_tokens @ end()
                    and on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      coverage:
        kind: Panel
        spec:
          display:
            name: Usage coverage (1=complete)
            description: Coverage applies to the selected closed report.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
              legendMode: 'on'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_coverage_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Live model throughput — separate from the closed report
            description: Native vLLM model-wide input/output rates over the visible
              time picker. Not per-team GPU accounting.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:prompt_tokens_total{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m]))
                  seriesNameFormat: "{{model_name}} input tokens/s"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:generation_tokens_total{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m]))
                  seriesNameFormat: "{{model_name}} output tokens/s"
      latency:
        kind: Panel
        spec:
          display:
            name: Live model TTFT and inter-token latency (seconds)
            description: Native model histograms. Missing series stay empty; no zero-error
              or zero-latency fallback. End-to-end request latency awaits a verified
              runtime histogram.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: histogram_quantile(0.95, sum by (model_name, le) (rate(kserve_vllm:time_to_first_token_seconds_bucket{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m])))
                  seriesNameFormat: "{{model_name}} p95 TTFT"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: histogram_quantile(0.95, sum by (model_name, le) (rate(kserve_vllm:inter_token_latency_seconds_bucket{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m])))
                  seriesNameFormat: "{{model_name}} p95 ITL"
      gpu:
        kind: Panel
        spec:
          display:
            name: Live GPU utilization by model (%)
            description: NVIDIA DCGM utilization via the repository's ServiceMonitor
              model_name mapping. No GPU usage is attributed to teams. Power and model-specific
              errors await verified series and units.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: avg by (model_name) (accelerator_gpu_utilization{model_name=~"qwen3-8-27b|mistral-small4-119b"})
                  seriesNameFormat: "{{model_name}}"
      queue:
        kind: Panel
        spec:
          display:
            name: Live model queue depth (requests)
            description: Raw UWM vLLM waiting-request gauge, as used by the repository's
              VLLMRequestQueueBacklog rule. Missing metrics remain empty; this is
              operational context, not closed-report billing evidence.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: sum by (model_name) (vllm:num_requests_waiting{model_name=~"qwen3-8-27b|mistral-small4-119b",namespace="internal-models"})
                  seriesNameFormat: "{{model_name}} waiting"
      memory:
        kind: Panel
        spec:
          display:
            name: Live GPU framebuffer used (exporter MB)
            description: Raw DCGM_FI_DEV_FB_USED with the MB display convention in
              the repository's NVIDIA console dashboard. No byte conversion or per-team/model
              attribution. Labels identify the exporter host/instance, consuming pod
              and GPU. Runtime label/scrape compatibility still requires qualification.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: max by (Hostname, instance, gpu, exported_pod) (DCGM_FI_DEV_FB_USED{exported_pod=~"(qwen3-8-27b|mistral-small4-119b)-kserve-.*"})
                  seriesNameFormat: "{{Hostname}} | {{instance}} | {{exported_pod}}
                    | GPU {{gpu}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Selected report and evidence
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/reportIdentity"
    - kind: Grid
      spec:
        display:
          title: Recorded and effective worker rates
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/declaredRates"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/reportWorkerRate"
    - kind: Grid
      spec:
        display:
          title: Closed-window hosting cost
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/hours"
        - x: 8
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/workerRate"
        - x: 16
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/fullCost"
    - kind: Grid
      spec:
        display:
          title: Closed report efficiency
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/tokens"
        - x: 8
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/effective"
        - x: 16
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/coverage"
    - kind: Grid
      spec:
        display:
          title: Live operational context — dashboard time picker
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/throughput"
        - x: 8
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/latency"
        - x: 16
          y: 0
          width: 8
          height: 7
          content:
            "$ref": "#/spec/panels/queue"
    - kind: Grid
      spec:
        display:
          title: Live GPU context
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/gpu"
        - x: 12
          y: 0
          width: 12
          height: 7
          content:
            "$ref": "#/spec/panels/memory"
