# Generated by showback-demo/generate-dashboards.sh; edit dashboard-definitions.json instead.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-9-showback-efficiency-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-9-showback-efficiency-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback · efficiency
      description: Closed-report capacity economics and a separate live operational
        time range. Missing observations stay unknown.
    duration: 1h
    variables: []
    panels:
      reportIdentity:
        kind: Panel
        spec:
          display:
            name: Closed report · UTC
            description: Evidence type and immutable report period. The time picker
              does not recalculate this closed allocation.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: evidence_kind
                header: Evidence
                width: 95
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: observed
                  text: Observed
                - condition:
                    kind: Value
                    spec:
                      value: synthetic_fixture
                  text: SYNTHETIC
              - name: period_start
                header: From (UTC)
                width: 175
              - name: period_end
                header: To (UTC)
                width: 175
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
      guide:
        kind: Panel
        spec:
          display:
            name: Capacity economics and live performance
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: The tables use the **closed report** above. The charts use the
                **live time picker** and do not recalculate that report. Cost per
                million tokens is unavailable for zero usage or incomplete evidence.
                Idle capacity still costs money; GPU utilization explains efficiency
                and does not establish team ownership of GPU-seconds.
          queries: []
      capacity:
        kind: Panel
        spec:
          display:
            name: Paid capacity by window
            description: Hosting cost, paid instance hours and effective worker rate.
              Paid hours and hosting cost are retained even at zero use.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: phase
                header: Window
                width: 65
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: busy
                  text: Busy
                - condition:
                    kind: Value
                    spec:
                      value: quiet
                  text: Quiet
                - condition:
                    kind: Value
                    spec:
                      value: idle
                  text: Idle
              - name: 'value #1'
                header: Cost USD
                width: 85
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #2'
                header: Hours
                width: 85
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 4
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #3'
                header: USD/hour
                width: 110
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 6
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms:
              - kind: MergeIndexedColumns
                spec:
                  column: model
              - kind: MergeIndexedColumns
                spec:
                  column: phase
              - kind: MergeIndexedColumns
                spec:
                  column: window_start
              - kind: MergeIndexedColumns
                spec:
                  column: report_id
              - kind: MergeIndexedColumns
                spec:
                  column: report_sha256
              - kind: MergeIndexedColumns
                spec:
                  column: job
              - kind: MergeIndexedColumns
                spec:
                  column: instance
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - model
                  - phase
                  - window_start
                  - report_id
                  - report_sha256
                  - job
                  - instance
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_cost_cents @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1))) / 100
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_instance_hours @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_effective_worker_usd_per_hour @ end() and
                    on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      efficiency:
        kind: Panel
        spec:
          display:
            name: Token efficiency by window
            description: Certified tokens, hosting USD per million tokens and usage
              completeness. Unknown cost per million is not zero.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: phase
                header: Window
                width: 65
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: busy
                  text: Busy
                - condition:
                    kind: Value
                    spec:
                      value: quiet
                  text: Quiet
                - condition:
                    kind: Value
                    spec:
                      value: idle
                  text: Idle
              - name: 'value #1'
                header: Tokens
                width: 90
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #2'
                header: USD / 1M
                width: 105
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 2
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: 'value #3'
                header: Usage evidence
                width: 110
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: '1'
                  text: Complete
                - condition:
                    kind: Value
                    spec:
                      value: '0'
                  text: Incomplete
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              transforms:
              - kind: MergeIndexedColumns
                spec:
                  column: model
              - kind: MergeIndexedColumns
                spec:
                  column: phase
              - kind: MergeIndexedColumns
                spec:
                  column: window_start
              - kind: MergeIndexedColumns
                spec:
                  column: report_id
              - kind: MergeIndexedColumns
                spec:
                  column: report_sha256
              - kind: MergeIndexedColumns
                spec:
                  column: job
              - kind: MergeIndexedColumns
                spec:
                  column: instance
              - kind: JoinByColumnValue
                spec:
                  columns:
                  - model
                  - phase
                  - window_start
                  - report_id
                  - report_sha256
                  - job
                  - instance
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_tokens @ end() and on(report_id, report_sha256,
                    job, instance) (showback_selected_report_info @ end() and on(job,
                    instance) (up{showback_publisher="selected-report"} @ end() ==
                    1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_effective_usd_per_million_tokens @ end()
                    and on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_model_coverage_complete @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}} | {{phase}} | {{window_start}} | {{coverage}}"
      throughput:
        kind: Panel
        spec:
          display:
            name: Live token throughput
            description: Native vLLM model-wide input/output rates over the visible
              time picker. Not per-team GPU accounting.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:prompt_tokens_total{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m]))
                  seriesNameFormat: "{{model_name}} input tokens/s"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: sum by (model_name) (rate(kserve_vllm:generation_tokens_total{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m]))
                  seriesNameFormat: "{{model_name}} output tokens/s"
      latency:
        kind: Panel
        spec:
          display:
            name: Live latency · seconds
            description: Native model histograms. Missing series stay empty; no zero-error
              or zero-latency fallback. End-to-end request latency awaits a verified
              runtime histogram.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: histogram_quantile(0.95, sum by (model_name, le) (rate(kserve_vllm:time_to_first_token_seconds_bucket{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m])))
                  seriesNameFormat: "{{model_name}} p95 TTFT"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: histogram_quantile(0.95, sum by (model_name, le) (rate(kserve_vllm:inter_token_latency_seconds_bucket{model_name=~"qwen3-8-27b|mistral-small4-119b"}[5m])))
                  seriesNameFormat: "{{model_name}} p95 ITL"
      gpu:
        kind: Panel
        spec:
          display:
            name: Live GPU utilization · %
            description: NVIDIA DCGM utilization via the repository's ServiceMonitor
              model_name mapping. No GPU usage is attributed to teams. Power and model-specific
              errors await verified series and units.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: avg by (model_name) (accelerator_gpu_utilization{model_name=~"qwen3-8-27b|mistral-small4-119b"})
                  seriesNameFormat: "{{model_name}}"
      queue:
        kind: Panel
        spec:
          display:
            name: Live waiting requests
            description: Raw UWM vLLM waiting-request gauge, as used by the repository's
              VLLMRequestQueueBacklog rule. Missing metrics remain empty; this is
              operational context, not closed-report billing evidence.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: sum by (model_name) (vllm:num_requests_waiting{model_name=~"qwen3-8-27b|mistral-small4-119b",namespace="internal-models"})
                  seriesNameFormat: "{{model_name}} waiting"
      memory:
        kind: Panel
        spec:
          display:
            name: Live GPU memory · MB
            description: Raw DCGM_FI_DEV_FB_USED with the MB display convention in
              the repository's NVIDIA console dashboard. No byte conversion or per-team/model
              attribution. Labels identify the exporter host/instance, consuming pod
              and GPU. Runtime label/scrape compatibility still requires qualification.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: max by (Hostname, instance, gpu, exported_pod) (DCGM_FI_DEV_FB_USED{exported_pod=~"(qwen3-8-27b|mistral-small4-119b)-kserve-.*"})
                  seriesNameFormat: GPU {{gpu}} · {{exported_pod}}
      reportWorkerRate:
        kind: Panel
        spec:
          display:
            name: Worker rate across the report
            description: Unrounded hosting cost divided by summed paid instance-hours
              for each model, with no dashboard price variables.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: model
                header: Model
                width: 115
                cellSettings:
                - condition:
                    kind: Value
                    spec:
                      value: qwen3-8-27b
                  text: Qwen3.8 27B
                - condition:
                    kind: Value
                    spec:
                      value: mistral-small4-119b
                  text: Mistral Small 4
              - name: value
                header: USD/hour
                width: 120
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 6
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_model_effective_worker_usd_per_hour @ end()
                    and on(report_id, report_sha256, job, instance) (showback_selected_report_info
                    @ end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{model}}"
      declaredRates:
        kind: Panel
        spec:
          display:
            name: Recorded worker rate
            description: Numeric rates and provenance come from the selected report.
              Unknown rates are withheld.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: instance_type
                header: Worker
                width: 105
              - name: region
                header: Region
                width: 100
              - name: value
                header: USD/hour
                width: 120
                align: right
                format:
                  unit: decimal
                  decimalPlaces: 6
                  shortValues: false
                cellSettings:
                - condition:
                    kind: Misc
                    spec:
                      value: 'null'
                  text: Unknown
                - condition:
                    kind: Misc
                    spec:
                      value: NaN
                  text: Unknown
              - name: rate_id
                header: Rate ID
                width: 175
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_report_rate_usd_per_hour @ end() and on(report_id,
                    report_sha256, job, instance) (showback_selected_report_info @
                    end() and on(job, instance) (up{showback_publisher="selected-report"}
                    @ end() == 1)))
                  seriesNameFormat: "{{rate_id}} | {{instance_type}} | {{region}}"
      reportAudit:
        kind: Panel
        spec:
          display:
            name: Report audit identity
            description: Full report ID, scope, policy and canonical hash are retained.
              Hover truncated audit cells to read their complete values.
          plugin:
            kind: Table
            spec:
              density: compact
              enableFiltering: false
              pagination: false
              defaultColumnHidden: true
              columnSettings:
              - name: report_id
                header: Report ID
                width: 175
              - name: scope
                header: Scope
                width: 125
              - name: policy_version
                header: Policy
                width: 100
              - name: report_sha256
                header: SHA-256
                width: 100
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: data-science-prometheus-datasource
                  query: (showback_selected_report_info @ end() and on(job, instance)
                    (up{showback_publisher="selected-report"} @ end() == 1))
                  seriesNameFormat: "{{evidence_kind}} | {{scope}} | {{report_id}}
                    | {{period_start}} to {{period_end}} | {{policy_version}}"
    layouts:
    - kind: Grid
      spec:
        display:
          title: Closed report
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 3
          content:
            "$ref": "#/spec/panels/reportIdentity"
        - x: 0
          y: 3
          width: 24
          height: 5
          content:
            "$ref": "#/spec/panels/guide"
    - kind: Grid
      spec:
        display:
          title: Capacity economics
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/capacity"
        - x: 0
          y: 7
          width: 24
          height: 7
          content:
            "$ref": "#/spec/panels/efficiency"
    - kind: Grid
      spec:
        display:
          title: Live performance · time picker
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 24
          height: 9
          content:
            "$ref": "#/spec/panels/throughput"
        - x: 0
          y: 9
          width: 24
          height: 9
          content:
            "$ref": "#/spec/panels/latency"
        - x: 0
          y: 18
          width: 24
          height: 9
          content:
            "$ref": "#/spec/panels/gpu"
        - x: 0
          y: 27
          width: 24
          height: 9
          content:
            "$ref": "#/spec/panels/queue"
        - x: 0
          y: 36
          width: 24
          height: 9
          content:
            "$ref": "#/spec/panels/memory"
    - kind: Grid
      spec:
        display:
          title: Rate and report evidence
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 5
          content:
            "$ref": "#/spec/panels/reportWorkerRate"
        - x: 0
          y: 5
          width: 24
          height: 5
          content:
            "$ref": "#/spec/panels/declaredRates"
        - x: 0
          y: 10
          width: 24
          height: 4
          content:
            "$ref": "#/spec/panels/reportAudit"
