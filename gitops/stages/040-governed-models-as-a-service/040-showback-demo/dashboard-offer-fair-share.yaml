# Fair share: an alternative to the tariffs that charges the whole running cost of the private workers to the teams using them.
# Model-agnostic: teams, tiers, prices and capacity come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-6-fair-share-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-6-fair-share-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 6 · Fair share
      description: 'An alternative to the tariffs: every private worker is paid in full by the teams that use it, split by usage and by share of the busiest hour. Models, prices and capacity come from the showback offer catalog.'
    duration: 1h
    variables:
    - kind: TextVariable
      spec:
        name: model
        value: ".*"
        constant: true
        display:
          name: Model
          hidden: true
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker runs (730 = always on, 168 = working hours only).
          hidden: false
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: Users per team
          hidden: true
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How a fair-share bill is built
          plugin:
            kind: Markdown
            spec:
              text: |-
                An **alternative** to the tariffs on tabs 1 and 2: it charges the whole running cost of the private workers to the teams that use them, so the platform carries no shortfall.

                **Bill = usage + capacity.**

                - **Usage:** projected tokens × tier multiplier × model weight × base rate. The base rate is what a token costs on a full worker, and the model weight is that cost relative to the cheapest model.
                - **Capacity:** the running cost usage does not cover. On a shared worker it is split by each subscription's share of tokens in the worker's busiest hour; a dedicated sponsor pays all of its own worker.

                Off-peak earns its low bill by staying out of the busiest hour. External models are not included: they pay the provider list price (tab 4). **In range** figures follow the time picker. **Per month** figures are projections: usage in the time range × usage hours per month × users per team, and private workers × GPU hours per month.

                Amounts are in euros: prices are kept in USD, as AWS and the providers charge them, and converted at the rate in the offer catalog (1 EUR = 1.1179 USD, ECB reference rate of 2026-11-03).
          queries: []
      running:
        kind: Panel
        spec:
          display:
            name: Running cost / month (EUR)
            description: Worker price × GPU hours per month for every private model in the offer catalog. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum((max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))) * $worker_hours and on(model) max by (model) ((showback_offer_info @ end() or last_over_time(showback_offer_info[30d] offset -30d)))))) / scalar(max((showback_usd_per_eur @ end() or last_over_time(showback_usd_per_eur[30d] offset -30d))))
      bills:
        kind: Panel
        spec:
          display:
            name: Team bills / month (EUR)
            description: Usage plus capacity, every team. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
