_tier @ end() or last_over_time(showback_subscription_tier[30d] offset -30d))))) / 1e6 * on(model) group_left() (max by (model) ((showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d))) / on(model) (max by (model) ((showback_offer_capacity_tokens_per_second @ end() or last_over_time(showback_offer_capacity_tokens_per_second[30d] offset -30d))) * 3600) * 1e6)), "part", "usage", "", "") or label_replace(((((max_over_time(((sum by (subscription, model) (increase(authorized_hits_total[1h])) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d))) and on(model) (sum by (model) ((sum by (subscription, model) (increase(authorized_hits_total[1h])) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d)))) >= on(model) group_left() (max_over_time(sum by (model) ((sum by (subscription, model) (increase(authorized_hits_total[1h])) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d))))[$__range:5m] @ end()) * 0.9999)))[$__range:5m] @ end()) > 0) / on(model) group_left() sum by (model) ((max_over_time(((sum by (subscription, model) (increase(authorized_hits_total[1h])) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d))) and on(model) (sum by (model) ((sum by (subscription, model) (increase(authorized_hits_total[1h])) and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d)))) >= on(model) group_left() (max_over_time(sum by (model) ((sum by (subscription, model) (increase(auth