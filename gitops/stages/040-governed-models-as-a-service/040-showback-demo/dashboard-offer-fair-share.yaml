      busy:
        kind: Panel
        spec:
          display:
            name: Fleet busy share
            description: Projected tokens as a share of what the workers could serve in their GPU hours, at demonstrated capacity.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * sum((((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="shared", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="shared", model=~"$model"}[30d] offset -30d))) or ((sum by (subscription, model) (increase(authorized_hits_total[$__range])) > 0 and on(model) (showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d))) and on(model, subscription) label_replace((showback_offer_info{offer="dedicated", model=~"$model"} @ end() or last_over_time(showback_offer_info{offer="dedicated", model=~"$model"}[30d] offset -30d)), "subscription", "$1", "sponsor", "(.+)"))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users)) / sum(max by (model) ((showback_offer_capacity_tokens_per_second @ end() or last_over_time(showback_offer_capacity_tokens_per_second[30d] offset -30d))) * 3600 * $worker_hours and on(model) max by (model) ((showback_offer_info @ end() or last_over_time(showback_offer_info[30d] offset -30d))))
