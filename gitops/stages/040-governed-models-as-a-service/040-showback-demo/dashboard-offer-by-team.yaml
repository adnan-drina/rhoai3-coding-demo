# Opening showback tab: what each team costs across the three offerings.
# Model-agnostic: teams, models, sponsors and prices come from offer-catalog.yaml; queries are live.
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-1-by-team-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-1-by-team-admin
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
spec:
  config:
    display:
      name: Showback 1 · By team
      description: 'What each team costs across the three offerings: projected monthly charges and the platform balance on shared capacity. Teams, models and prices come from the showback offer catalog.'
    duration: 24h
    variables:
    - kind: TextVariable
      spec:
        name: model
        value: ".*"
        constant: true
        display:
          name: Model
          hidden: true
    - kind: ListVariable
      spec:
        name: team
        allowAllValue: true
        allowMultiple: true
        customAllValue: ".*"
        defaultValue: "$__all"
        display:
          name: Team
          hidden: false
          description: Team that owns the subscription (offer catalog).
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: team
            matchers:
            - showback_team_info
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker runs (730 = always on, 168 = working hours only).
          hidden: false
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168). A team that also runs overnight projects at the pace of the whole range instead.
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; 1 is the usage as measured; raise it to ask what if the team grew.
          hidden: false
    panels:
      teamCost:
        kind: Panel
        spec:
          display:
            name: AI cost by team / month (EUR)
            description: Projected monthly charges of each team, all offerings. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).
          plugin:
            kind: PieChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
              mode: value
              radius: 70
              showLabels: true
              sort: desc
              colorPalette:
              - "#0066CC"
              - "#EC7A08"
              - "#3E8635"
              - "#5752D1"
              - "#009596"
              - "#F0AB00"
              - "#8F4700"
              legend:
                position: right
                mode: list
