          hidden: true
    - kind: TextVariable
      spec:
        name: team
        value: ".*"
        constant: true
        display:
          name: team
          hidden: true
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: worker_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: usage_hours
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: users
          hidden: true
