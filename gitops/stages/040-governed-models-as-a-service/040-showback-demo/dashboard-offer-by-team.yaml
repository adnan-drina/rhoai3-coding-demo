                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #4'
                header: External / month
                align: right
                enableSorting: true
                format:
                  unit: decimal
                  decimalPlaces: 0
                  shortValues: false
              - name: 'value #5'
                header: Total / month
                align: right
                enableSorting: true
                format:
