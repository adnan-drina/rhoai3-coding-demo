                    model=~"$reference|$private"}[1h])) > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m])
                    / 60)))) * (((sum(increase(showback_external_metering_estimated_usd{subscription="$usecase", model="$reference"}[$__range]))) / (((sum(increase(showback_external_metering_input_tokens{subscription="$usecase",
                    model="$reference"}[$__range])) + sum(increase(showback_external_metering_output_tokens{subscription="$usecase", model="$reference"}[$__range])))) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 2)) / 1e6)) - (((sum(increase(authorized_hits_total{subscription="$usecase",
                    model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours * $users / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[1h]))
                    > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60)))) * (max((last_over_time(showback_offer_tariff_usd_per_million{model="$private"}[60d]
                    offset -60d) or showback_offer_tariff_usd_per_million{model="$private"} @ end())) * scalar(max((last_over_time(showback_platform_coefficient[60d] offset -60d) or showback_platform_coefficient
                    @ end())))) / 1e6)) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end()))), "option", "shared", "", "") or label_replace((((((sum(increase(authorized_hits_total{subscription="$usecase",
                    model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours * $users / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[1h]))
                    > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60)))) * (((sum(increase(showback_external_metering_estimated_usd{subscription="$usecase",
                    model="$reference"}[$__range]))) / (((sum(increase(showback_external_metering_input_tokens{subscription="$usecase", model="$reference"}[$__range])) + sum(increase(showback_external_metering_output_tokens{subscription="$usecase",
                    model="$reference"}[$__range])))) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2)) / 1e6)) - (((clamp_min(ceil(((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours
                    * $users / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[1h])) > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m])
                    / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60)))) / ((max((last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[60d] offset
                    -60d) or showback_offer_capacity_tokens_per_second{model="$private"} @ end())) * 3600 * $worker_hours) * $planning_load / 100)), 1)) * max((last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[60d]
                    offset -60d) or showback_offer_worker_usd_per_hour{model="$private"} @ end())) * $worker_hours) unless on() (count(label_replace((last_over_time(showback_offer_info{offer="dedicated",
                    model="$private"}[60d] offset -60d) or showback_offer_info{offer="dedicated", model="$private"} @ end()), "team", "$1", "sponsor", "(.+)") and on(team) (last_over_time(showback_subscription_team{subscription="$usecase"}[60d]
                    offset -60d) or showback_subscription_team{subscription="$usecase"} @ end())) > 0))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end()))),
                    "option", "worker", "", "") or label_replace((((((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours
                    * $users / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[1h])) > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m])
                    / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60)))) * (((sum(increase(showback_external_metering_estimated_usd{subscription="$usecase", model="$reference"}[$__range])))
                    / (((sum(increase(showback_external_metering_input_tokens{subscription="$usecase", model="$reference"}[$__range])) + sum(increase(showback_external_metering_output_tokens{subscription="$usecase",
                    model="$reference"}[$__range])))) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2)) / 1e6)) - (vector(0) and on() (count(label_replace((last_over_time(showback_offer_info{offer="dedicated", model="$private"}[60d] offset -60d) or showback_offer_info{offer="dedicated",
                    model="$private"} @ end()), "team", "$1", "sponsor", "(.+)") and on(team) (last_over_time(showback_subscription_team{subscription="$usecase"}[60d] offset -60d) or showback_subscription_team{subscription="$usecase"}
                    @ end())) > 0))) / scalar(max((last_over_time(showback_usd_per_eur[60d] offset -60d) or showback_usd_per_eur @ end()))), "option", "own", "", ""))
      workload:
        kind: Panel
        spec:
          display:
            name: Workload vs break-even
            description: 'Monthly tokens of the use case as a share of the break-even volume of a dedicated private worker: its monthly cost divided by the external price per million tokens at this use
              case mix. 100% is break-even. Red below 90% (the external model is cheaper), yellow from 90% to 110% (about even), green above 110% (a dedicated worker pays off). The shared private model
              at its tariff has no break-even volume: it is cheaper at any volume when its tariff is below the external price.'
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 200
              thresholds:
                defaultColor: '#F0561D'
                steps:
                - value: 90
                  color: '#FFCC17'
                - value: 110
                  color: '#63993D'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * ((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours * $users / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase",
                    model=~"$reference|$private"}[1h])) > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m]) / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m])
                    / 60)))) / (((clamp_min(ceil(((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range]))) * scalar(clamp_min(vector($usage_hours * $users
                    / scalar(count_over_time((sum(increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[1h])) > 0)[$__range:1h]) or vector(1)) * (scalar(count_over_time(vector(1)[$__range:1m])
                    / 60) < bool 168)), 730 * $users / scalar(count_over_time(vector(1)[$__range:1m]) / 60)))) / ((max((last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[60d] offset
                    -60d) or showback_offer_capacity_tokens_per_second{model="$private"} @ end())) * 3600 * $worker_hours) * $planning_load / 100)), 1)) * max((last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[60d]
                    offset -60d) or showback_offer_worker_usd_per_hour{model="$private"} @ end())) * $worker_hours) / (((sum(increase(showback_external_metering_estimated_usd{subscription="$usecase", model="$reference"}[$__range])))
                    / (((sum(increase(showback_external_metering_input_tokens{subscription="$usecase", model="$reference"}[$__range])) + sum(increase(showback_external_metering_output_tokens{subscription="$usecase",
                    model="$reference"}[$__range])))) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2)) * 1e6)
                  seriesNameFormat: Break-even at 100%
      usecaseTable:
        kind: Panel
        spec:
          display:
            name: Per model (selected period)
            description: 'Tokens of the use case on each model, the share of its workload, the price per million tokens (external: list price at its mix; shared private: tariff with the platform coefficient)
              and the MLflow pass rates of this use case on each model. 95% and above shows blue, 90% to 95% yellow, below 90% red. Converted from USD at 1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).'
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - align: left
                enableSorting: true
                header: Model
                name: model
                width: 180
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  shortValues: true
                  unit: decimal
                header: Tokens
                name: 'value #1'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Share %
                name: 'value #2'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 2
                  unit: decimal
                header: EUR / 1M
                name: 'value #3'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Relevance %
                name: 'value #4'
                cellSettings:
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 89.999
                  textColor: '#F0561D'
                - condition:
                    kind: Range
                    spec:
                      min: 90
                      max: 94.999
                  textColor: '#B98412'
                - condition:
                    kind: Range
                    spec:
                      min: 95
                      max: 100
                  textColor: '#4394E5'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Completeness %
                name: 'value #5'
                cellSettings:
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 89.999
                  textColor: '#F0561D'
                - condition:
                    kind: Range
                    spec:
                      min: 90
                      max: 94.999
                  textColor: '#B98412'
                - condition:
                    kind: Range
                    spec:
                      min: 95
                      max: 100
                  textColor: '#4394E5'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Guidelines %
                name: 'value #6'
                cellSettings:
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 89.999
                  textColor: '#F0561D'
                - condition:
                    kind: Range
                    spec:
                      min: 90
                      max: 94.999
                  textColor: '#B98412'
                - condition:
                    kind: Range
                    spec:
                      min: 95
                      max: 100
                  textColor: '#4394E5'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Finished %
                name: 'value #7'
                cellSettings:
                - condition:
                    kind: Range
                    spec:
                      min: 0
                      max: 89.999
                  textColor: '#F0561D'
                - condition:
                    kind: Range
                    spec:
                      min: 90
                      max: 94.999
                  textColor: '#B98412'
                - condition:
                    kind: Range
                    spec:
                      min: 95
                      max: 100
                  textColor: '#4394E5'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Traces judged
                name: 'value #8'
              density: compact
              pagination: false
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range]))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: round(100 * sum by (model) (increase(authorized_hits_total{subscription="$usecase", model=~"$reference|$private"}[$__range])) / scalar(sum(increase(authorized_hits_total{subscription="$usecase",
                    model=~"$reference|$private"}[$__range]))))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: label_replace((((sum(increase(showback_external_metering_estimated_usd{subscription="$usecase", model="$reference"}[$__range]))) / (((sum(increase(showback_external_metering_input_tokens{subscription="$usecase",
