# Custom observability dashboard for the OpenShift AI Observability page (rendered as a tab because its name starts with
# dashboard-). Generated by stages/040-governed-models-as-a-service/showback/generate-dashboards.sh; edit the generator, not this file.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-6-tokenomics-break-even-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-6-tokenomics-break-even-admin
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  config:
    display:
      name: "Showback 5 \xB7 Break-even"
      description: Should an external-model workload move to a private model? Projected monthly volume and cost against the break-even volume of a private worker.
    duration: 168h
    variables:
    - kind: ListVariable
      spec:
        name: reference
        allowAllValue: false
        allowMultiple: false
        defaultValue: claude-sonnet-5-5
        display:
          name: External model in use
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_external_metering_rate_usd_per_million{category="output"}
    - kind: ListVariable
      spec:
        name: subscription
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue: $__all
        display:
          name: Subscriptions
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: subscription
            matchers:
            - showback_external_metering_events
    - kind: ListVariable
      spec:
        name: private
        allowAllValue: false
        allowMultiple: false
        defaultValue: qwen3-8-27b
        display:
          name: Private candidate
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: false
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: false
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: false
        display:
          name: Users per team
          description: Scales the observed usage; each demo team is one synthetic user.
          hidden: false
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: false
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker would run (730 = always on, 168 = working hours only).
          hidden: false
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How the decision is calculated
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: '**Question:** should the selected external-model workload move to the private candidate?


                1. **Projected monthly tokens** scale the usage in the time range to a month: usage hours per month x users per team.

                2. **External cost** prices those tokens at the provider list price, using the workload own input/output mix.

                3. **Private cost** is GPU workers x worker price x GPU hours per month. Workers needed = projected tokens / capacity of one worker (from the offer catalog).

                4. **Break-even** is the monthly volume at which one private worker costs the same as the external model. Above 100% moving to private saves money; check quality and latency before switching.


                Choose a time range that represents a typical working period, then raise users per team to see when the decision flips.'
          queries: []
      ratio:
        kind: Panel
        spec:
          display:
            name: Workload vs break-even
            description: Projected monthly tokens as a share of the break-even volume; above 100% the private candidate is cheaper.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 200
              thresholds:
                steps:
                - value: 0
                  color: '#c9190b'
                - value: 100
                  color: '#3e8635'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: 100 * (((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) / (max(showback_offer_worker_usd_per_hour{model="$private"} @ end()
                    or last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[30d] offset -30d)) * $worker_hours / (((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}))
                    * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"}
                    - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"}))
                    * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 1e6 / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) /
                    ((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 2)) * 1e6)
      volume:
        kind: Panel
        spec:
          display:
            name: Projected tokens / month
            description: Usage of the selected external workload in the time range, scaled to a month.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users
      breakeven:
        kind: Panel
        spec:
          display:
            name: Break-even tokens / month
            description: Monthly volume at which one private worker costs the same as the external model.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: max(showback_offer_worker_usd_per_hour{model="$private"} @ end() or last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[30d] offset -30d)) * $worker_hours / (((((sum((showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 1e6 / scalar(count_over_time(vector(1)[$__range:1m])
                    / 60) * $usage_hours * $users) / ((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 2)) * 1e6
      savings:
        kind: Panel
        spec:
          display:
            name: Monthly savings if moved (USD)
            description: External cost minus private cost; negative means stay external.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 1e6 / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) - ((clamp_min(ceil((((sum((showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m])
                    / 60) * $usage_hours * $users) / (max(showback_offer_capacity_tokens_per_second{model="$private"} @ end() or last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[30d]
                    offset -30d)) * 3600 * $usage_hours)), 1)) * max(showback_offer_worker_usd_per_hour{model="$private"} @ end() or last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[30d]
                    offset -30d)) * $worker_hours)
      workers:
        kind: Panel
        spec:
          display:
            name: Private workers needed
            description: Projected tokens divided by the demonstrated capacity of one worker, rounded up.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: clamp_min(ceil((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) / (max(showback_offer_capacity_tokens_per_second{model="$private"} @
                    end() or last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[30d] offset -30d)) * 3600 * $usage_hours)), 1)
      spend:
        kind: Panel
        spec:
          display:
            name: External cost / month (USD)
            description: Projected tokens at the provider list price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 1e6 / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users
      privateCost:
        kind: Panel
        spec:
          display:
            name: Private cost / month (USD)
            description: Workers needed x worker price x GPU hours per month.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (clamp_min(ceil((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) + (sum((showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) / (max(showback_offer_capacity_tokens_per_second{model="$private"} @
                    end() or last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[30d] offset -30d)) * 3600 * $usage_hours)), 1)) * max(showback_offer_worker_usd_per_hour{model="$private"}
                    @ end() or last_over_time(showback_offer_worker_usd_per_hour{model="$private"}[30d] offset -30d)) * $worker_hours
      blended:
        kind: Panel
        spec:
          display:
            name: External $/1M tokens
            description: Provider list price at the observed input/output mix of the workload.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference",
                    subscription=~"$subscription"} offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"})) * min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 1e6 / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours * $users) / ((((sum((showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}
                    - showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"} offset $__range) or showback_external_metering_input_tokens{model="$reference", subscription=~"$subscription"}))
                    + (sum((showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"} - showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"}
                    offset $__range) or showback_external_metering_output_tokens{model="$reference", subscription=~"$subscription"}))) / scalar(count_over_time(vector(1)[$__range:1m]) / 60) * $usage_hours
                    * $users) > 0) * 1e6 or (min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2)
      capacity:
        kind: Panel
        spec:
          display:
            name: Capacity of one worker (tokens / month)
            description: Demonstrated tokens per second x usage hours per month.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: max(showback_offer_capacity_tokens_per_second{model="$private"} @ end() or last_over_time(showback_offer_capacity_tokens_per_second{model="$private"}[30d] offset -30d)) * 3600 *
                    $usage_hours
      infraSpend:
        kind: Panel
        spec:
          display:
            name: Private spend (USD)
            description: Serving hours of each private model in the time range x its worker price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((label_replace(sum_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)") / 60) * on(model) group_left max by
                    (model) (showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d] offset -30d)) and on(model) (showback_offer_info @ end() or last_over_time(showback_offer_info[30d]
                    offset -30d)))
      refSpend:
        kind: Panel
        spec:
          display:
            name: Same tokens at the external price (USD)
            description: Tokens the private models served in the time range, priced at the selected external model.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(label_replace(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info @ end() or
                    last_over_time(showback_offer_info[30d] offset -30d)))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum(label_replace(sum
                    by (model_name) (increase(kserve_vllm:generation_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info @ end() or last_over_time(showback_offer_info[30d]
                    offset -30d)))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})
      fleetSavings:
        kind: Panel
        spec:
          display:
            name: Savings vs external (USD)
            description: External price minus private spend for the time range; negative means the workers were under-used.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum(label_replace(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info @ end() or
                    last_over_time(showback_offer_info[30d] offset -30d)))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum(label_replace(sum
                    by (model_name) (increase(kserve_vllm:generation_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info @ end() or last_over_time(showback_offer_info[30d]
                    offset -30d)))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) - (sum((label_replace(sum_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]),
                    "model", "$1", "model_name", "(.+)") / 60) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end() or last_over_time(showback_offer_worker_usd_per_hour[30d]
                    offset -30d)) and on(model) (showback_offer_info @ end() or last_over_time(showback_offer_info[30d] offset -30d))))
    layouts:
    - kind: Grid
      spec:
        display:
          title: How the decision is calculated
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 7
          content:
            $ref: '#/spec/panels/about'
    - kind: Grid
      spec:
        display:
          title: Recommendation
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/ratio'
        - x: 8
          y: 0
          width: 8
          height: 4
          content:
            $ref: '#/spec/panels/volume'
        - x: 16
          y: 0
          width: 8
          height: 4
          content:
            $ref: '#/spec/panels/breakeven'
        - x: 8
          y: 4
          width: 16
          height: 4
          content:
            $ref: '#/spec/panels/savings'
    - kind: Grid
      spec:
        display:
          title: Monthly comparison
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 12
          height: 5
          content:
            $ref: '#/spec/panels/spend'
        - x: 12
          y: 0
          width: 12
          height: 5
          content:
            $ref: '#/spec/panels/privateCost'
    - kind: Grid
