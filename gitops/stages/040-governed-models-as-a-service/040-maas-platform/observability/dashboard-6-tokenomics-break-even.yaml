# Custom observability dashboard for the OpenShift AI Observability page (rendered as a tab because its name starts with
# dashboard-). Generated by stages/040-governed-models-as-a-service/showback/generate-dashboards.sh; edit the generator, not this file.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-6-tokenomics-break-even-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-6-tokenomics-break-even-admin
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  config:
    display:
      name: "Tokenomics \xB7 break-even (live)"
      description: 'Self-hosting economics: infrastructure burn of the serving private models, effective cost per million tokens, and the throughput at which they beat a reference external model.'
    duration: 168h
    variables:
    - kind: ListVariable
      spec:
        name: model
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue: $__all
        display:
          name: Private model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_offer_info
    - kind: ListVariable
      spec:
        name: reference
        allowAllValue: false
        allowMultiple: false
        defaultValue: gpt-6-luna
        display:
          name: Reference external model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_external_metering_rate_usd_per_million{category="output"}
    panels:
      about:
        kind: Panel
        spec:
          display:
            name: How this is calculated
            description: ''
          plugin:
            kind: Markdown
            spec:
              text: '**Private cost** counts only GPU workers that are serving: each running model costs its worker price per hour from the offer catalog. Parked workers cost nothing.


                **Reference cost** prices the same input and output tokens at the published list price of the selected external model.


                **Break-even throughput** is the token rate at which the private workers cost the same as the reference model; above it, running privately is cheaper.'
          queries: []
      burn:
        kind: Panel
        spec:
          display:
            name: Infrastructure burn $/h
            description: Worker price of every serving private model, from the offer catalog.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((label_replace(count by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)")) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour
                    @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))
      throughput:
        kind: Panel
        spec:
          display:
            name: Live throughput (tokens/s)
            description: Prompt plus completion tokens per second across the selected private models.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum(label_replace(sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval])), "model", "$1", "model_name",
                    "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end()))
      effectiveLive:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens (live)
            description: Burn divided by live throughput; blank below 1 token per second.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum((label_replace(count by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)")) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour
                    @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))) / ((sum(label_replace(sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval])),
                    "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end())) > 1) * 3600 / 1e6)
      effectiveRange:
        kind: Panel
        spec:
          display:
            name: Effective $/1M tokens (Range)
            description: Worker spend over the Range window divided by tokens served in it.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum((label_replace(sum_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)") / 60) * on(model) group_left max by
                    (model) (showback_offer_worker_usd_per_hour @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))) / (((sum(label_replace(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total[$__range])),
                    "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end()))) + (sum(label_replace(sum by (model_name) (increase(kserve_vllm:generation_tokens_total[$__range])),
                    "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end())))) / 1e6)
      breakEven:
        kind: Panel
        spec:
          display:
            name: Break-even throughput (tokens/s)
            description: Token rate at which the serving workers cost the same as the reference model.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum((label_replace(count by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)")) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour
                    @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))) / ((min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2) * 1e6 / 3600
      utilisation:
        kind: Panel
        spec:
          display:
            name: Throughput vs break-even
            description: Live throughput as a percentage of the break-even throughput; above 100% running privately is cheaper than the reference model.
          plugin:
            kind: GaugeChart
            spec:
              calculation: last
              format:
                unit: percent
                decimalPlaces: 0
              max: 200
              thresholds:
                steps:
                - value: 0
                  color: '#c9190b'
                - value: 100
                  color: '#3e8635'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(label_replace(sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval])), "model", "$1", "model_name",
                    "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end()))) / ((sum((label_replace(count by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)"))
                    * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))) / ((min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})) / 2) * 1e6 / 3600) * 100
      apiEquivalent:
        kind: Panel
        spec:
          display:
            name: Reference-model spend (Range)
            description: What the tokens served in the Range window would cost at the list prices.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum(label_replace(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"}
                    @ end()))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum(label_replace(sum by (model_name) (increase(kserve_vllm:generation_tokens_total[$__range])),
                    "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end()))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"})
      infraSpend:
        kind: Panel
        spec:
          display:
            name: Infrastructure spend (Range)
            description: Serving hours of each private model in the Range window times its worker price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum((label_replace(sum_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)") / 60) * on(model) group_left max by
                    (model) (showback_offer_worker_usd_per_hour @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))
      savings:
        kind: Panel
        spec:
          display:
            name: Savings vs reference (Range)
            description: Reference-model spend minus infrastructure spend; negative means the workers are under-used for this price.
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: ((sum(label_replace(sum by (model_name) (increase(kserve_vllm:prompt_tokens_total[$__range])), "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"}
                    @ end()))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + (sum(label_replace(sum by (model_name) (increase(kserve_vllm:generation_tokens_total[$__range])),
                    "model", "$1", "model_name", "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end()))) / 1e6 * min(showback_external_metering_rate_usd_per_million{model="$reference", category="output"}))
                    - (sum((label_replace(sum_over_time(count by (model_name) (kserve_vllm:num_requests_running)[$__range:1m]), "model", "$1", "model_name", "(.+)") / 60) * on(model) group_left max by (model)
                    (showback_offer_worker_usd_per_hour @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end())))
      throughputTrend:
        kind: Panel
        spec:
          display:
            name: Throughput by model vs break-even
            description: Tokens per second by private model against the break-even line.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: label_replace(sum by (model_name) (rate(kserve_vllm:prompt_tokens_total[$__rate_interval]) + rate(kserve_vllm:generation_tokens_total[$__rate_interval])), "model", "$1", "model_name",
                    "(.+)") and on(model) (showback_offer_info{model=~"$model"} @ end())
                  seriesNameFormat: '{{model}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: (sum((label_replace(count by (model_name) (kserve_vllm:num_requests_running), "model", "$1", "model_name", "(.+)")) * on(model) group_left max by (model) (showback_offer_worker_usd_per_hour
                    @ end()) and on(model) (showback_offer_info{model=~"$model"} @ end()))) / ((min(showback_external_metering_rate_usd_per_million{model="$reference", category="input_uncached"}) + min(showback_external_metering_rate_usd_per_million{model="$reference",
                    category="output"})) / 2) * 1e6 / 3600
                  seriesNameFormat: break-even
      gpuUtil:
        kind: Panel
        spec:
          display:
            name: GPU utilisation
            description: Accelerator utilisation from cluster monitoring (DCGM).
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: percent
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: avg by (exported_pod) (accelerator_gpu_utilization)
                  seriesNameFormat: '{{exported_pod}}'
    layouts:
    - kind: Grid
      spec:
        display:
          title: How this is calculated
          collapse:
            open: false
        items:
        - x: 0
          y: 0
          width: 24
          height: 5
          content:
            $ref: '#/spec/panels/about'
    - kind: Grid
      spec:
        display:
          title: Live
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/burn'
        - x: 6
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/throughput'
        - x: 12
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/effectiveLive'
        - x: 18
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/breakEven'
    - kind: Grid
      spec:
        display:
          title: Break-even
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/utilisation'
        - x: 8
          y: 0
          width: 16
          height: 8
          content:
            $ref: '#/spec/panels/throughputTrend'
    - kind: Grid
      spec:
        display:
          title: Range economics
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/effectiveRange'
        - x: 6
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/infraSpend'
        - x: 12
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/apiEquivalent'
        - x: 18
          y: 0
          width: 6
          height: 5
          content:
            $ref: '#/spec/panels/savings'
        - x: 0
          y: 5
          width: 24
          height: 7
          content:
            $ref: '#/spec/panels/gpuUtil'
