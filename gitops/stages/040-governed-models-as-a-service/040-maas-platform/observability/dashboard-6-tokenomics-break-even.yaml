                  query: sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase", model=~"$reference|$private", judge="relevance"}[$__range]))
      qualityCheck:
        kind: Panel
        spec:
          display:
            name: Quality check per judge
            description: 'Pass rate of this use case on each model per MLflow judge in the selected period, and the gap in points (private minus external). Good enough: no more than 3 points lower; Check:
              3 to 8 lower; Not ready: more than 8 lower. A judge without verdicts on one of the models has no row. Different judges are not equally strict: compare with care.'
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - align: left
                enableSorting: true
                header: Judge
                name: judge
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: External %
                name: 'value #1'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
                  unit: decimal
                header: Private %
                name: 'value #2'
              - align: right
                enableSorting: true
                format:
                  decimalPlaces: 0
