# Custom observability dashboard for the OpenShift AI Observability page (rendered as a tab because its name starts with
# dashboard-). Generated by stages/040-governed-models-as-a-service/showback/generate-dashboards.sh; edit the generator, not this file.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-offer-5-break-even-admin
  namespace: redhat-ods-monitoring
  labels:
    app.kubernetes.io/name: dashboard-offer-5-break-even-admin
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  config:
    display:
      name: "Showback 5 \xB7 Break-even"
      description: 'Should a use case move from an external model to a private one? The same team subscription on both models: tokens, MLflow quality and the monthly cost of each option.'
    duration: 30d
    variables:
    - kind: ListVariable
      spec:
        name: reference
        allowAllValue: false
        allowMultiple: false
        defaultValue: claude-sonnet-5-5
        display:
          name: External model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: &id001
              kind: PrometheusDatasource
              name: data-science-prometheus-datasource
            labelName: model
            matchers:
            - showback_external_metering_events{price_state!="free_prototype"}
    - kind: ListVariable
      spec:
        name: usecase
        allowAllValue: false
        allowMultiple: false
        defaultValue: team-engineering-ci
        display:
          name: Use case
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: subscription
            matchers:
            - showback_external_metering_events{model="$reference", subscription!~"maas-quality-judge|playground-.*"}
    - kind: ListVariable
      spec:
        name: private
        allowAllValue: false
        allowMultiple: false
        defaultValue: qwen3-8-27b
        display:
          name: Private model
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource: *id001
            labelName: model
            matchers:
            - showback_offer_info
    - kind: TextVariable
      spec:
        name: usage_hours
        value: '168'
        constant: true
        display:
          name: Usage hours / month
          description: Hours a month the teams work at the pace seen in the time range (8 h x 21 working days = 168).
          hidden: true
    - kind: TextVariable
      spec:
        name: users
        value: '1'
        constant: true
        display:
          name: Users per team
          description: 'Scales the observed usage: 1 is the usage as measured.'
          hidden: true
    - kind: TextVariable
      spec:
        name: worker_hours
        value: '730'
        constant: true
        display:
          name: GPU hours / month
          description: Hours a month a private GPU worker would run (always on).
          hidden: true
    - kind: TextVariable
      spec:
        name: planning_load
        value: '70'
        constant: true
        display:
          name: Planning load %
          description: Average share of its capacity a worker is planned to carry, leaving room for peaks.
          hidden: true
    panels:
      extTokens:
        kind: Panel
        spec:
          display:
            name: Tokens on the external model (per hour)
            description: Tokens of the selected use case on its external model in each trailing hour, from MaaS metering.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.3
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
                min: 0
              querySettings:
              - queryIndex: 0
                colorMode: fixed
                colorValue: '#5E40BE'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (increase(authorized_hits_total{subscription="$usecase", model="$reference"}[1h]))
                  seriesNameFormat: '{{model}}'
      privTokens:
        kind: Panel
        spec:
          display:
            name: Tokens on the private model (per hour)
            description: Tokens of the selected use case on the selected private model in each trailing hour, from MaaS metering.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                values: []
              visual:
                areaOpacity: 0.3
                connectNulls: false
                display: line
                lineWidth: 1.5
              yAxis:
                format:
                  unit: decimal
                  shortValues: true
                min: 0
              querySettings:
              - queryIndex: 0
                colorMode: fixed
                colorValue: '#0066CC'
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: sum by (model) (increase(authorized_hits_total{subscription="$usecase", model="$private"}[1h]))
                  seriesNameFormat: '{{model}}'
      savings:
        kind: Panel
        spec:
          display:
            name: Monthly savings if moved (EUR)
            description: 'External cost of the monthly workload minus the cheapest private option. Zero is the break-even point: the private option costs as much as the external model (for a dedicated worker:
              its monthly cost divided by the external price per million tokens). Red below break-even (stay external), yellow up to 250 EUR a month (little to gain), green above. Converted from USD at
              1 EUR = 1.1179 USD (ECB reference rate, 2026-11-03).'
          plugin:
            kind: StatChart
            spec:
              calculation: last
              format:
                unit: decimal
                decimalPlaces: 0
                shortValues: false
              colorMode: background_solid
