          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: round(100 * (sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase", model=~"$reference|$private", judge="completeness", result="pass"}[$__range])) or
                    0 * sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase", model=~"$reference|$private", judge="completeness"}[$__range]))) / (sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase",
                    model=~"$reference|$private", judge="completeness"}[$__range])) > 0))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
