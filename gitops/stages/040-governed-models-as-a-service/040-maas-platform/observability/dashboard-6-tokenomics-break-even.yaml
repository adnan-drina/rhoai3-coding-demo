          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource: *id001
                  query: round(100 * (sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase", model=~"$reference|$private", judge="relevance", result="pass"}[$__range])) or 0 *
                    sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase", model=~"$reference|$private", judge="relevance"}[$__range]))) / (sum by (model) (increase(showback_quality_verdicts_total{subscription="$usecase",
