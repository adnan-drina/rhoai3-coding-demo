apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: demo-models-subscription
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  owner:
    groups:
      - name: "system:authenticated"
      - name: "system:cluster-admins"
      - name: "rhoai-users"
      - name: "rhoai-admins"
  priority: 10
  tokenMetadata:
    costCenter: "rhoai3-coding-demo"
    organizationId: "redhat-demo"
    labels:
      environment: "sandbox"
      stage: "050"
  modelRefs:
    - name: qwen3-6-35b-a3b
      namespace: maas
      tokenRateLimits:
        - limit: 1000000
          window: "1h"
    - name: nemotron-3-nano-30b-a3b
      namespace: maas
      tokenRateLimits:
        - limit: 1000000
          window: "1h"
    - name: gpt-4o
      namespace: redhat-ods-applications
      tokenRateLimits:
        - limit: 1000000
          window: "1h"
    - name: gpt-4o-mini
      namespace: redhat-ods-applications
      tokenRateLimits:
        - limit: 1000000
          window: "1h"
