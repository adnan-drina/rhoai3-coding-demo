apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-plugin-nvidia-gpu
  namespace: nvidia-gpu-operator
  labels:
    app.kubernetes.io/name: console-plugin-nvidia-gpu
    app.kubernetes.io/version: release-0.3.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: console-plugin-nvidia-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: console-plugin-nvidia-gpu
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console-plugin-nvidia-gpu
          # quay.io/edge-infrastructure/console-plugin-nvidia-gpu:release-0.3.0
          image: quay.io/edge-infrastructure/console-plugin-nvidia-gpu@sha256:24f0d12f1d66e5eaaf3ba77b13fe50445000f03de4c280769fdaa9cfba8de2da
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9443
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
      volumes:
        - name: plugin-serving-cert
          secret:
            secretName: plugin-serving-cert
            defaultMode: 420
