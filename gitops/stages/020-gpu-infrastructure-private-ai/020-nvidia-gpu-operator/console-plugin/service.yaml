apiVersion: v1
kind: Service
metadata:
  name: console-plugin-nvidia-gpu
  namespace: nvidia-gpu-operator
  annotations:
    # The service CA writes the TLS Secret the plugin's nginx serves on 9443.
    service.beta.openshift.io/serving-cert-secret-name: plugin-serving-cert
  labels:
    app.kubernetes.io/name: console-plugin-nvidia-gpu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: console-plugin-nvidia-gpu
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
