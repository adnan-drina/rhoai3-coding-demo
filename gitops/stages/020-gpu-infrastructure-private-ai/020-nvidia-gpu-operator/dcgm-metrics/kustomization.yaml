apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-gpu-operator
# ClusterPolicy dcgmExporter.config.name reads key dcgm-metrics.csv from this ConfigMap; the exporter reloads
# the file when the mounted ConfigMap changes.
configMapGenerator:
  - name: nvidia-dcgm-metrics
    files:
      - dcgm-metrics.csv
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: nvidia-dcgm-metrics
    app.kubernetes.io/part-of: gpu-infra
    app.kubernetes.io/component: gpu-observability
    app.kubernetes.io/managed-by: argocd
