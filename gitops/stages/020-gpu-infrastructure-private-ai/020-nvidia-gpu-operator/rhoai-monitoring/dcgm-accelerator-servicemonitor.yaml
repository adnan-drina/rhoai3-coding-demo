# Feeds GPU utilisation into the OpenShift AI monitoring stack for the LLM Utilization dashboard.
#
# That product dashboard queries accelerator_gpu_utilization on the data-science datasource, but the
# collector's generated DCGM job only forwards memory, power, clock and temperature (verified 2026-10-09;
# the renamed utilisation series never arrives), so the panel shows "No data". The product itself defines
# accelerator_gpu_utilization = DCGM_FI_DEV_GPU_UTIL in the PrometheusRule nvidia-gpu-operator/nvidia-dcgm-
# exporter for cluster monitoring; this ServiceMonitor applies that one mapping on the RHOAI side. It is a
# user-owned monitor carrying the documented monitoring.opendatahub.io/scrape label (RHOAI 3.5 "Collect
# metrics from user workloads"); no operator-managed workload is relabelled.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: accelerator-gpu-utilization
  namespace: redhat-ods-monitoring
  labels:
    monitoring.opendatahub.io/scrape: "true"
    app.kubernetes.io/name: accelerator-gpu-utilization
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
spec:
  namespaceSelector:
    matchNames:
      - nvidia-gpu-operator
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  endpoints:
    - port: gpu-metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
      metricRelabelings:
        # GPU utilisation only. The operator's own rule also maps DCGM_FI_DEV_MEM_COPY_UTIL (a percentage) to
        # accelerator_memory_used_bytes and FB_TOTAL (MiB) to *_bytes; those names would carry wrong units, and the
        # collector already forwards the DCGM memory series, so they are not copied here.
        - action: keep
          sourceLabels: [__name__]
          regex: DCGM_FI_DEV_GPU_UTIL
        - action: replace
          sourceLabels: [__name__]
          regex: DCGM_FI_DEV_GPU_UTIL
          targetLabel: __name__
          replacement: accelerator_gpu_utilization
        - action: replace
          targetLabel: vendor
          replacement: nvidia
        # DCGM labels the consuming pod (exported_pod); the LLM Utilization panel filters by model_name,
        # derived here from the model pod name (<llminferenceservice>-kserve-<hash>-<id>). The panel groups
        # by k8s_pod_name, which the collector sets to the scraped DCGM exporter pod; writing that label
        # from the metric side collides with the collector's resource attribute and drops the series.
        - action: replace
          sourceLabels: [exported_pod]
          regex: (.+)-kserve-[0-9a-f]+-[a-z0-9]+
          targetLabel: model_name
          replacement: $1
