# RTX PRO 6000 Blackwell pool: g7e.2xlarge (1x 96GB GPU, FP8 and NVFP4), Kueue flavor gpu-rtxpro6000.
# One MachineSet per zone; the Machine API fills in the GPU/CPU/memory annotations from DescribeInstanceTypes.
# Scale with stages/020-gpu-infrastructure-private-ai/deploy.sh --gpus N (default pool).
# Generated by stages/020-gpu-infrastructure-private-ai/machinesets/generate.sh; replicas are 0 in Git (Argo CD ignores the live count).
---
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    demo.rhoai.io/source-machineset: ocp-8h46r-worker-us-east-2a-compute
  labels:
    app.kubernetes.io/part-of: gpu-infra
    app.kubernetes.io/name: aws-gpu-machineset
    app.kubernetes.io/component: gpu-worker
    app.kubernetes.io/managed-by: argocd
    cluster-api/accelerator: nvidia-rtxpro6000
    machine.openshift.io/cluster-api-cluster: ocp-8h46r
    demo.rhoai.io/gpu-pool: rtxpro6000
  name: ocp-8h46r-gpu-rtxpro6000-us-east-2a
  namespace: openshift-machine-api
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ocp-8h46r
      machine.openshift.io/cluster-api-machineset: ocp-8h46r-gpu-rtxpro6000-us-east-2a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: ocp-8h46r
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: ocp-8h46r-gpu-rtxpro6000-us-east-2a
        cluster-api/accelerator: nvidia-rtxpro6000
        node-role.kubernetes.io/gpu: ''
        demo.rhoai.io/gpu-pool: rtxpro6000
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          cluster-api/accelerator: nvidia-rtxpro6000
          node-role.kubernetes.io/gpu: ''
          demo.rhoai.io/gpu-pool: rtxpro6000
      providerSpec:
        value:
          ami:
            id: ami-03b58703d4e9ea61a
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ''
              volumeSize: 200
              volumeType: gp3
          capacityReservationId: ''
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: ocp-8h46r-worker-profile
          instanceType: g7e.2xlarge
          kind: AWSMachineProviderConfig
          metadata: {}
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - ocp-8h46r-node
          - filters:
            - name: tag:Name
              values:
              - ocp-8h46r-lb
          subnet:
            filters:
            - name: tag:Name
              values:
              - ocp-8h46r-subnet-private-us-east-2a
          tags:
          - name: kubernetes.io/cluster/ocp-8h46r
            value: owned
          - name: Stack
            value: project openshift-cluster-vlmvn
          - name: config
            value: openshift-cluster
          - name: guid
            value: vlmvn
          - name: owner
            value: unknown
          - name: uuid
            value: 634d0b46-7ec1-5deb-96de-2dcfecbc54aa
          userDataSecret:
            name: worker-user-data
      taints:
      - effect: NoSchedule
        key: nvidia-gpu-only
