# Four ClusterQueues backing the four hardware-profile experiences. All are
# non-preemptive: RHOAI workbenches are not suspendable and may only use a
# local queue tied to a non-preemptive ClusterQueue (omitting spec.preemption
# yields the non-preemptive default).
#
# GPU quota sums to 2 (2 physical L40S cards, no time-slicing):
#   shared 0 + priority 0  (cohort "gpu-pool"; both physical cards are claimed
#                           by the private models — raise when GPU nodes are added)
#   reserved 2             (no cohort: isolated, never lent — one card per model)
# Invariant: GPU nominal totals match schedulable capacity (2 cards, no
# time-slicing) so Kueue never admits a workload the scheduler cannot place.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-cpu-default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            # CPU governance ceiling for Kueue-managed CPU workloads (workbenches
            # and any future CPU-served models). Worker allocatable is ~76 CPU, so
            # this quota is a governance ceiling, not a hardware one.
            - name: cpu
              nominalQuota: "40"
            - name: memory
              nominalQuota: "128Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-gpu-shared
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  namespaceSelector: {}
  cohortName: gpu-pool
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: "32Gi"
    - coveredResources: ["nvidia.com/gpu"]
      flavors:
        - name: gpu-l40s
          resources:
            - name: nvidia.com/gpu
              # No spare capacity: both cards are model-reserved. Raise when GPU nodes are added.
              nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-gpu-priority
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  namespaceSelector: {}
  cohortName: gpu-pool
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "8"
            - name: memory
              nominalQuota: "32Gi"
    - coveredResources: ["nvidia.com/gpu"]
      flavors:
        - name: gpu-l40s
          resources:
            - name: nvidia.com/gpu
              # No spare capacity: both cards are model-reserved. Raise when GPU nodes are added.
              nominalQuota: "0"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-gpu-reserved-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
spec:
  namespaceSelector: {}
  # No cohort: this queue's GPU is isolated and never lent out.
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "12"
            - name: memory
              # Two single-GPU models: gemma (16Gi request) + qwen (20Gi
              # request for the ~36GB FP8 modelcar page cache headroom).
              nominalQuota: "48Gi"
    - coveredResources: ["nvidia.com/gpu"]
      flavors:
        - name: gpu-l40s
          resources:
            - name: nvidia.com/gpu
              # Two L40S cards, one private model per card (no time-slicing).
              nominalQuota: "2"
