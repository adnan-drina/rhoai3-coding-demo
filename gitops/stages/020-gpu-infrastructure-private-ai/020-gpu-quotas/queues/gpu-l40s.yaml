apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-l40s
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '4'
  labels:
    app.kubernetes.io/name: gpu-l40s
    app.kubernetes.io/part-of: gpu-infra
    app.kubernetes.io/component: workload-admission
    app.kubernetes.io/managed-by: argocd
spec:
  # Stamped by the L40S MachineSet (cluster-api/accelerator); nvidia.com/gpu.present matched
  # every NVIDIA node, so L40S workloads could land on other GPU types.
  nodeLabels:
    cluster-api/accelerator: nvidia-gpu
  tolerations:
  - key: nvidia-gpu-only
    operator: Exists
    effect: NoSchedule
