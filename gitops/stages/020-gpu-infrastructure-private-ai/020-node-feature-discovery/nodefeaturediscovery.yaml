apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: nfd-instance
  namespace: openshift-nfd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app.kubernetes.io/name: nfd-instance
    app.kubernetes.io/part-of: gpu-infra
    app.kubernetes.io/component: hardware-discovery
    app.kubernetes.io/managed-by: argocd
spec:
  operand:
    imagePullPolicy: IfNotPresent
    servicePort: 12000
    # The installed operator's own operand image (CSV NODE_FEATURE_DISCOVERY_IMAGE, nfd.4.22.0-202609291750). Stage 020
    # validate fails when they differ: after an Automatic operator update, copy the new CSV image here.
    image: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9@sha256:4ec1f7326663be130417583828fa6449d725ae8c636246d00a6b931aaf89fc1b
  workerConfig:
    configData: |
      core:
        sleepInterval: 60s
      sources:
        pci:
          deviceClassWhitelist: ["0200", "03", "12"]
          deviceLabelFields: [vendor]
