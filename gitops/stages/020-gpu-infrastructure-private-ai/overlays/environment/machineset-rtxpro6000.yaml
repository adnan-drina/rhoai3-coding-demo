# RTX PRO 6000 Blackwell pool: g7e.2xlarge (1x 96GB GPU, FP8 and NVFP4), Kueue flavor gpu-rtxpro6000.
# One MachineSet per us-east-2 zone, all at zero replicas; the Machine API
# fills in the GPU/CPU/memory annotations from DescribeInstanceTypes.
---
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: ocp-wzxl7-gpu-rtxpro6000-us-east-2a
  namespace: openshift-machine-api
  labels:
    app.kubernetes.io/component: h100-worker
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: aws-gpu-machineset
    app.kubernetes.io/part-of: gpu-infra
    cluster-api/accelerator: nvidia-rtxpro6000
    machine.openshift.io/cluster-api-cluster: ocp-wzxl7
    demo.rhoai.io/gpu-pool: rtxpro6000
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    demo.rhoai.io/source-machineset: ocp-wzxl7-gpu-us-east-2a
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: ocp-wzxl7
      machine.openshift.io/cluster-api-machineset: ocp-wzxl7-gpu-rtxpro6000-us-east-2a
  template:
    metadata:
      labels:
        cluster-api/accelerator: nvidia-rtxpro6000
        machine.openshift.io/cluster-api-cluster: ocp-wzxl7
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: ocp-wzxl7-gpu-rtxpro6000-us-east-2a
        node-role.kubernetes.io/gpu: ''
        demo.rhoai.io/gpu-pool: rtxpro6000
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          cluster-api/accelerator: nvidia-rtxpro6000
          node-role.kubernetes.io/gpu: ''
          demo.rhoai.io/gpu-pool: rtxpro6000
      providerSpec:
        value:
          ami:
            id: ami-03b58703d4e9ea61a
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ''
              volumeSize: 200
              volumeType: gp3
          capacityReservationId: ''
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: ocp-wzxl7-worker-profile
          instanceType: g7e.2xlarge
          kind: AWSMachineProviderConfig
          metadata: {}
          metadataServiceOptions: {}
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - ocp-wzxl7-node
          - filters:
            - name: tag:Name
              values:
              - ocp-wzxl7-lb
          subnet:
            filters:
            - name: tag:Name
              values:
              - ocp-wzxl7-subnet-private-us-east-2a
          tags:
          - name: kubernetes.io/cluster/ocp-wzxl7
            value: owned
          - name: Stack
            value: project openshift-cluster-h275t
          - name: config
            value: openshift-cluster
          - name: guid
            value: h275t
          - name: owner
            value: unknown
          - name: uuid
            value: c9cb960c-03b8-54a1-a793-d504657163e3
          userDataSecret:
            name: worker-user-data
      taints:
      - effect: NoSchedule
        key: nvidia-gpu-only
---
