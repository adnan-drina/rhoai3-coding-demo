apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: gpu-rtxpro6000
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '5'
    opendatahub.io/display-name: NVIDIA RTX PRO 6000 Blackwell (96 GB)
    opendatahub.io/description: One RTX PRO 6000 Blackwell Server Edition per g7e.2xlarge worker; FP8 and NVFP4 capable. Kueue-admitted.
    opendatahub.io/disabled: 'false'
  labels:
    app.kubernetes.io/name: gpu-rtxpro6000
    app.kubernetes.io/part-of: gpu-infra
    app.kubernetes.io/component: hardware-profile
    app.kubernetes.io/managed-by: argocd
spec:
  identifiers:
  - identifier: cpu
    displayName: CPU
    resourceType: CPU
    defaultCount: 2
    minCount: 1
    maxCount: 7
  - identifier: memory
    displayName: Memory
    resourceType: Memory
    defaultCount: 16Gi
    minCount: 2Gi
    maxCount: 56Gi
  - identifier: nvidia.com/gpu
    displayName: NVIDIA RTX PRO 6000
    resourceType: Accelerator
    defaultCount: 1
    minCount: 1
    maxCount: 1
  # Queue profiles carry no node selector or toleration: the gpu-rtxpro6000 flavor places the
  # workload (RHOAI 3.5 Managing OpenShift AI, 8.1).
  scheduling:
    type: Queue
    kueue:
      localQueueName: lq-gpu-rtxpro6000
