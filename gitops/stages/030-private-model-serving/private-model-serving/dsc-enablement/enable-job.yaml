---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-enable-dsc-kserve
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '2'
  labels:
    app.kubernetes.io/name: enable-dsc-kserve
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: platform-configuration
    app.kubernetes.io/managed-by: argocd
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enable-dsc-kserve
        app.kubernetes.io/part-of: rhoai-platform
        app.kubernetes.io/component: platform-configuration
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: job-enable-dsc-kserve
      restartPolicy: Never
      containers:
      - name: enable
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - "/bin/bash"
        - "-ceu"
        args:
        - |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          until oc --request-timeout=10s get datasciencecluster default-dsc >/dev/null 2>&1; do
            (( SECONDS < deadline )) || { echo "DSC prerequisite timed out" >&2; exit 1; }
            sleep 3
          done
          oc --request-timeout=10s patch datasciencecluster default-dsc --type=merge -p '{"spec":{"components":{"kserve":{"managementState":"Managed"}}}}'
          [[ $(oc --request-timeout=10s get datasciencecluster default-dsc -o jsonpath='{.spec.components.kserve.managementState}') == Managed ]]
