apiVersion: batch/v1
kind: Job
metadata:
  name: enable-model-discovery
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/name: enable-model-discovery
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: platform-configuration
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enable-model-discovery
        app.kubernetes.io/part-of: rhoai-platform
        app.kubernetes.io/component: platform-configuration
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: enable-model-discovery
      restartPolicy: Never
      containers:
        - name: enable
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              oc patch datasciencecluster default-dsc --request-timeout=10s --type=merge -p '{"spec":{"components":{"modelregistry":{"managementState":"Managed","registriesNamespace":"rhoai-model-registries"}}}}'
              oc -n redhat-ods-applications patch odhdashboardconfig odh-dashboard-config --request-timeout=10s --type=merge -p '{"spec":{"dashboardConfig":{"agentsCatalog":true,"disableModelCatalog":false,"disableModelRegistry":false,"toolCalling":true,"mcpCatalog":true,"mcpRegistry":true}}}'
              deadline=$((SECONDS + 300))
              until [[ $(oc get crd modelregistries.modelregistry.opendatahub.io --request-timeout=10s -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || true) == True ]]; do
                (( SECONDS < deadline )) || { echo 'Registry API initialization timed out' >&2; exit 1; }
                sleep 5
              done
