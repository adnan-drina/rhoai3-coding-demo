apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-registry-admins
  namespace: demo-sandbox
  labels:
    app.kubernetes.io/name: mcp-registry
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "030"
  annotations:
    argocd.argoproj.io/sync-wave: "8"
rules:
  # Native MLflow Kubernetes-auth virtual resource, not MCPServer workloads.
  - apiGroups: [mlflow.kubeflow.org]
    resources: [mcpservers]
    verbs: [get, list, create, update, delete]
