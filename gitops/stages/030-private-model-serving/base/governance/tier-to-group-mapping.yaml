# Temporary tier-to-group mapping ConfigMap in redhat-ods-applications.
# This is RHOAI 3.3 tier-model compatibility debt. RHOAI 3.4 MaaS uses
# subscriptions instead of tiers, managed through custom resources instead of
# ConfigMaps. Keep this only until live 3.4 validation proves that
# LLMInferenceService publication and MaaS discovery work without the
# alpha.maas.opendatahub.io/tiers annotation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tier-to-group-mapping
  namespace: redhat-ods-applications
  labels:
    app: maas-api
    app.kubernetes.io/component: api
    app.kubernetes.io/name: maas-api
    app.kubernetes.io/part-of: models-as-a-service
    component: tier-mapping
  annotations:
    argocd.argoproj.io/sync-wave: "9"
data:
  tiers: |
    - name: free
      displayName: Free Tier
      level: 0
      groups:
        - tier-free-users
        - system:authenticated
    - name: premium
      displayName: Premium Tier
      level: 1
      groups:
        - tier-premium-users
    - name: enterprise
      displayName: Enterprise Tier
      level: 2
      groups:
        - tier-enterprise-users
        - system:cluster-admins
