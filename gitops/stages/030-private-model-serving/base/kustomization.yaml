apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Private model serving — local LLMInferenceService resources and model metadata.
# Temporary RHOAI 3.3 tier-model compatibility remains here because the
# currently validated webhook path requires tier data before tier-annotated
# LLMInferenceService resources can be accepted. The RHOAI 3.4 target design is
# subscription-based MaaS; remove this after live validation proves the model
# publication path works without tier annotations and ConfigMaps.

resources:
  - leaderworkerset/namespace.yaml
  - leaderworkerset/operatorgroup.yaml
  - leaderworkerset/subscription.yaml
  - leaderworkerset/instance.yaml
  - models/admin-rbac.yaml
  - governance/tier-to-group-mapping.yaml
  - model-registry/seed-networkpolicy.yaml
  - models/gpt-oss-20b.yaml
  - models/nemotron-3-nano-30b.yaml
  - observability/vllm-metrics-alias-prometheusrule.yaml
  - model-registry/seed-models.yaml
