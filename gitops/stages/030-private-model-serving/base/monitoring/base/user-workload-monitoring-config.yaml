apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  labels:
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/name: user-workload-monitoring
    app.kubernetes.io/component: monitoring
data:
  config.yaml: |
    prometheus:
      # Persisted + capped (2026-07-14) for the same reason as
      # cluster-monitoring-config: emptyDir TSDBs on worker disks drove
      # disk-pressure evictions. UWM scrapes the demo's high-cardinality
      # targets (limitador per-user/model series, RHOAI, Kuadrant).
      retention: 7d
      retentionSize: 5GB
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-csi
          resources:
            requests:
              storage: 20Gi
