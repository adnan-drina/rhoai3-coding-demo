# Sync hook: generates the RHDH catalog from Git plus cluster-local links.
#
# The Git-tracked catalog template intentionally contains a placeholder Dev
# Spaces URL. This job replaces that placeholder with the current cluster route
# It also replaces the placeholder RHDH URL used for TechDocs links and writes
# the generated catalog to a ConfigMap mounted into the RHDH pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: Role
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-generate-rhdh-catalog
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
- kind: ServiceAccount
  name: job-generate-rhdh-catalog
  namespace: rhdh
roleRef:
  kind: ClusterRole
  name: job-generate-rhdh-catalog
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-generate-rhdh-catalog
      containers:
      - name: generate
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "Discovering Dev Spaces route..."
          DEVSPACES_HOST=$(oc get route devspaces -n openshift-devspaces -o jsonpath='{.spec.host}' 2>/dev/null || true)
          if [ -z "$DEVSPACES_HOST" ]; then
            DEVSPACES_HOST=$(oc get route -n openshift-devspaces --no-headers 2>/dev/null \
              | awk '/devspaces/ {print $2; exit}' || true)
          fi
          if [ -z "$DEVSPACES_HOST" ]; then
            echo "ERROR: Dev Spaces route not found"
            exit 1
          fi
          DEVSPACES_URL="https://${DEVSPACES_HOST}"

          echo "Discovering RHDH route..."
          RHDH_HOST=$(oc get route -n rhdh --no-headers 2>/dev/null \
            | grep backstage | awk '{print $2}' | head -1 || true)
          if [ -z "$RHDH_HOST" ]; then
            echo "ERROR: RHDH route not found"
            exit 1
          fi
          RHDH_URL="https://${RHDH_HOST}"

          echo "Discovering catalog source from Argo CD..."
          APP_REPO_URL=$(oc get application 090-developer-portal-self-service -n openshift-gitops \
            -o jsonpath='{.spec.source.repoURL}' 2>/dev/null || true)
          APP_TARGET_REVISION=$(oc get application 090-developer-portal-self-service -n openshift-gitops \
            -o jsonpath='{.spec.source.targetRevision}' 2>/dev/null || true)
          APP_SYNC_REVISION=$(oc get application 090-developer-portal-self-service -n openshift-gitops \
            -o jsonpath='{.status.sync.revision}' 2>/dev/null || true)
          [ -z "$APP_REPO_URL" ] && APP_REPO_URL="https://github.com/adnan-drina/rhoai3-coding-demo.git"
          [ -z "$APP_TARGET_REVISION" ] && APP_TARGET_REVISION="main"
          [ -z "$APP_SYNC_REVISION" ] && APP_SYNC_REVISION="$APP_TARGET_REVISION"

          REPO_NO_GIT="${APP_REPO_URL%.git}"
          if [[ "$REPO_NO_GIT" =~ ^https://github.com/([^/]+)/([^/]+)$ ]]; then
            REPO_OWNER="${BASH_REMATCH[1]}"
            REPO_NAME="${BASH_REMATCH[2]}"
            SOURCE_CATALOG_URL="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${APP_TARGET_REVISION}/gitops/stages/090-developer-portal-self-service/base/catalog/all.yaml"
          else
            echo "ERROR: Unsupported repo URL '${APP_REPO_URL}'"
            exit 1
          fi

          echo "Fetching catalog template..."
          curl -fsSL "${SOURCE_CATALOG_URL}" -o /tmp/catalog-template.yaml

          echo "Generating runtime catalog..."
          python3 - /tmp/catalog-template.yaml /tmp/catalog-runtime.yaml "${DEVSPACES_URL}" "${RHDH_URL}" "${APP_SYNC_REVISION}" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          devspaces_url = sys.argv[3].rstrip("/")
          rhdh_url = sys.argv[4].rstrip("/")
          revision = sys.argv[5]

          content = source.read_text()
          content = content.replace("https://devspaces.placeholder.example.com", devspaces_url)
          content = content.replace("https://rhdh.placeholder.example.com", rhdh_url)
          content = content.replace("__RHOAI3_DEMO_REVISION__", revision)
          if "devspaces.placeholder.example.com" in content:
              raise SystemExit("Dev Spaces placeholder was not replaced")
          if "rhdh.placeholder.example.com" in content:
              raise SystemExit("RHDH placeholder was not replaced")
          if "__RHOAI3_DEMO_REVISION__" in content:
              raise SystemExit("Repository revision placeholder was not replaced")
          target.write_text(content)
          PY

          python3 - /tmp/catalog-runtime.yaml /tmp/catalog-patch.json <<'PY'
          import json
          import pathlib
          import sys

          content = pathlib.Path(sys.argv[1]).read_text()
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"data": {"all.yaml": content}}))
          PY

          if oc get configmap catalog-runtime-rhdh -n rhdh >/dev/null 2>&1; then
            oc patch configmap catalog-runtime-rhdh -n rhdh --type=merge -p "$(cat /tmp/catalog-patch.json)"
          else
            oc create configmap catalog-runtime-rhdh -n rhdh --from-file=all.yaml=/tmp/catalog-runtime.yaml
          fi

          echo "Runtime catalog generated with cluster-local Dev Spaces and TechDocs links"
