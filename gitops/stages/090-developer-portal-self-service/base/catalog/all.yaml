      title: MTA Analysis Exercise
      icon: docs
  tags:
    - java
    - javaee
    - eap
    - mta
    - modernization
    - brownfield
spec:
  type: service
  lifecycle: modernizing
  owner: ai-modernization-team
  system: coolstore
  dependsOn:
