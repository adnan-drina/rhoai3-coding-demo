apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coolstore
  title: MCA Coolstore
  description: |
    Brownfield Coolstore application used as the modernization source for the
    From Vibe Coding to Agentic Engineering workflow.
  annotations:
    backstage.io/source-location: url:https://github.com/rhpds/mca-coolstore
    github.com/project-slug: rhpds/mca-coolstore
    rhoai3.redhat.com/stage-100-role: brownfield-source
  links:
    - url: https://github.com/rhpds/mca-coolstore
      title: Brownfield Source Repository
      icon: github
    - url: https://github.com/adnan-drina/rhoai3-coding-demo/blob/feature/vibe-agentic-workflow-readmes/docs/developer-workflow/100-governed-developer-entry-point.md
      title: Stage 100 Entry Point
      icon: docs
    - url: https://github.com/adnan-drina/rhoai3-coding-demo/blob/feature/vibe-agentic-workflow-readmes/docs/developer-workflow/mca-coolstore-candidate-assessment.md
      title: Coolstore Candidate Assessment
      icon: docs
