apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: getting-started-ai-coding
  title: Getting Started with AI Coding
  description: |
    Onboarding workspace for Stage 100. Developers use Developer Hub, Dev
    Spaces, Continue, and MaaS for the governed vibe-coding increment before moving
    into specs, skills, and agentic engineering stages.
  annotations:
    backstage.io/source-location: url:https://github.com/adnan-drina/getting-started-ai-coding
    backstage.io/techdocs-ref: url:https://github.com/adnan-drina/rhoai3-coding-demo/tree/__RHOAI3_DEMO_REVISION__
    github.com/project-slug: adnan-drina/getting-started-ai-coding
    rhoai3.redhat.com/stage-100-role: onboarding
  links:
    - url: https://github.com/adnan-drina/getting-started-ai-coding
      title: Source Repo
      icon: github
    - url: "https://devspaces-getting-started.placeholder.example.com"
      title: Dev Spaces
      icon: docs
    - url: https://rhdh.placeholder.example.com/docs/default/component/getting-started-ai-coding
      title: Getting Started
      icon: docs
  tags:
    - onboarding
    - ai-coding
    - devspaces
    - maas
spec:
  type: documentation
  lifecycle: experimental
  owner: ai-modernization-team
  system: coolstore
  dependsOn:
    - resource:default/maas-private-code-model-nemotron
