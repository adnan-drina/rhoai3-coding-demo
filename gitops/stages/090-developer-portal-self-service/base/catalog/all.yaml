---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coolstore-inventory-service
  title: Coolstore Inventory Service
  description: |
    Quarkus inventory service used for AI-assisted engineering and golden-path
    delivery work connected to the Coolstore domain.
  annotations:
    backstage.io/source-location: url:https://github.com/adnan-drina/coolstore-inventory-service
    backstage.io/techdocs-ref: url:https://github.com/adnan-drina/rhoai3-coding-demo/tree/__RHOAI3_DEMO_REVISION__
    github.com/project-slug: adnan-drina/coolstore-inventory-service
    rhoai3.redhat.com/current-repository: adnan-drina/coolstore-inventory-service
    rhoai3.redhat.com/repository: adnan-drina/coolstore-inventory-service
    rhoai3.redhat.com/gitops-path: gitops/overlays/dev
    rhoai3.redhat.com/pipelines-as-code-path: .tekton/pull-request.yaml
    rhoai3.redhat.com/evidence-path: docs/evidence/
    rhoai3.redhat.com/stage-100-role: target-service
  links:
    - url: https://github.com/adnan-drina/coolstore-inventory-service
      title: Source Repo
      icon: github
    - url: "https://devspaces-inventory.placeholder.example.com"
      title: Dev Spaces
      icon: docs
    - url: https://rhdh.placeholder.example.com/docs/default/component/coolstore-inventory-service
      title: Getting Started
      icon: docs
  tags:
    - java
    - quarkus
    - inventory
    - coolstore
    - agentic-engineering
spec:
  type: service
  lifecycle: experimental
  owner: ai-modernization-team
  system: coolstore
  dependsOn:
    - component:default/coolstore
    - resource:default/maas-private-code-model-nemotron
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: maas-private-code-model-nemotron
  title: Nemotron Private Code Model
  description: Private MaaS model path selected for source-code work in the governed developer workflow.
  annotations:
    rhoai3.redhat.com/model-id: nemotron-3-nano-30b-a3b
    rhoai3.redhat.com/model-path: private-maas
    rhoai3.redhat.com/data-classification: source-code-context
  links:
    - url: https://docs.redhat.com/en/learn/ai-quickstarts/rh-maas-code-assistant
      title: Getting Started
      icon: docs
  tags:
    - maas
    - private-model
    - source-code
spec:
  type: ai-model
  owner: ai-modernization-team
  system: coolstore
