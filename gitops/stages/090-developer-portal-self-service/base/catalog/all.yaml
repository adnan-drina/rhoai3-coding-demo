    rhoai3.redhat.com/model-path: private-maas
    rhoai3.redhat.com/data-classification: source-code-context
  links:
    - url: https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.4/html/govern_llm_access_with_models-as-a-service/use-models-as-a-service_maas
      title: OpenShift AI MaaS Documentation
      icon: docs
    - url: https://docs.redhat.com/en/learn/ai-quickstarts/rh-maas-code-assistant
      title: MaaS Code Assistant Quickstart
      icon: docs
  tags:
    - maas
    - private-model
    - source-code
spec:
  type: ai-model
  owner: ai-modernization-team
  system: coolstore
