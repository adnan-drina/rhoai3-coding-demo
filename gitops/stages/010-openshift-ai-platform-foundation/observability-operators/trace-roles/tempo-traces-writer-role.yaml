# Tempo's OpenShift tenant gateway checks virtual-resource permissions.
# Native RHOAI collector RBAC covers discovery/scraping but not trace ingestion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-monitoring-traces-writer
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: rhoai-monitoring-traces-writer
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [tempo.grafana.com]
    resources: [redhat-ods-monitoring]
    resourceNames: [traces]
    verbs: [create]
