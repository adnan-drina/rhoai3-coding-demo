# Keeps the operator-delivered console plugins this demo relies on enabled (OCP 4.22 "Enabling console
# plugins": add the ConsolePlugin name to consoles.operator.openshift.io/cluster spec.plugins).
# gitops-plugin (OpenShift GitOps) and odf-console (OpenShift Data Foundation) ship ConsolePlugin objects but
# their operators do not register them. The Stage 010 foundation base that used to enable them is no longer
# rendered by any Application after the Stage 050 handoff, and an operator rewrite of the plugin list during
# a cluster start-up on 2026-10-12 dropped both. A Sync hook re-asserts them on every sync of this live
# Application; it only appends missing names and never removes plugins other components register.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: console-plugin-enabler
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-plugin-enabler
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [operator.openshift.io]
    resources: [consoles]
    resourceNames: [cluster]
    verbs: [get, patch]
  - apiGroups: [console.openshift.io]
    resources: [consoleplugins]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: console-plugin-enabler
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: console-plugin-enabler
subjects:
  - kind: ServiceAccount
    name: console-plugin-enabler
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-console-plugins
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: console-plugin-enabler
      containers:
        - name: enable
          # Same reviewed OpenShift CLI image as the Stage 030/050 hooks.
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command: [/bin/bash, -ceu]
          args:
            - |
              for plugin in gitops-plugin odf-console; do
                if ! oc get consoleplugin "${plugin}" -o name >/dev/null 2>&1; then
                  echo "ConsolePlugin ${plugin} not installed; skipping"; continue
                fi
                current="$(oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}')"
                if [ -z "${current}" ]; then
                  oc patch consoles.operator.openshift.io cluster --type=merge -p '{"spec":{"plugins":[]}}'
                  current="[]"
                fi
                if printf '%s' "${current}" | grep -q "\"${plugin}\""; then
                  echo "${plugin} already enabled"
                else
                  oc patch consoles.operator.openshift.io cluster --type=json -p "[{\"op\":\"add\",\"path\":\"/spec/plugins/-\",\"value\":\"${plugin}\"}]"
                  echo "${plugin} enabled"
                fi
              done
              oc get consoles.operator.openshift.io cluster -o jsonpath='{.spec.plugins}{"\n"}'
