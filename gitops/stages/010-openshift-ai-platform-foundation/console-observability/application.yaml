apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 010-console-observability
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: console-observability
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: "010"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/010-openshift-ai-platform-foundation/console-observability
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/010-openshift-ai-platform-foundation/console-observability/base
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ServerSideDiff=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
