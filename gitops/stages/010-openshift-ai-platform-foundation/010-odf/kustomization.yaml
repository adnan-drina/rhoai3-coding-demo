# OpenShift Data Foundation operator and StorageCluster (MCG object storage).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No commonAnnotations sync-options: it would overwrite the per-object retention options below.
# The Application sets SkipDryRunOnMissingResource.

resources:
  - namespace.yaml
  - operator-group.yaml
  - subscription.yaml
  - storagecluster.yaml
  # OCSInitialization is an operator-owned singleton (ocs-operator auto-creates
  # and reconciles `ocsinit`); managing it here only causes perpetual OutOfSync.
