apiVersion: v1
kind: Namespace
metadata:
  name: ai-curated-prompts
  labels:
    app.kubernetes.io/name: ai-curated-prompts
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/component: prompt-registry
    app.kubernetes.io/managed-by: argocd
    opendatahub.io/dashboard: "true"
    # The value references the native cluster-scoped MLflow resource.
    opendatahub.io/global-mlflow-workspace: mlflow
  annotations:
    openshift.io/display-name: Curated AI prompts
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
