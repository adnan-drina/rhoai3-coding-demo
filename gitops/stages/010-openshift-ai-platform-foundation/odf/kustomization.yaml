# OpenShift Data Foundation operator and StorageCluster (MCG object storage).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - namespace.yaml
  - operator-group.yaml
  - subscription.yaml
  - storagecluster.yaml
  # OCSInitialization is an operator-owned singleton (ocs-operator auto-creates
  # and reconciles `ocsinit`); managing it here only causes perpetual OutOfSync.
