apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-storage
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: sandbox-storage
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: storage-connections
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: "010"
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/010-openshift-ai-platform-foundation/sandbox-storage
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/010-openshift-ai-platform-foundation/sandbox-storage/base
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-sandbox
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: demo-sandbox
      name: rhoai-models-connection
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      namespace: demo-sandbox
      name: rhoai-workbench-connection
      jsonPointers: [/data]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      # Only the two connection skeletons opt into SSA. Do not replay their
      # runtime credentials through Argo's client-side migration annotation.
      - ClientSideApplyMigration=false
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
