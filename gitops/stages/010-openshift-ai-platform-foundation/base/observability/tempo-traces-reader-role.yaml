# Tenant trace visibility is restricted to RHOAI administrators, not every user.
# This read grant is separate from the collector's ingestion identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-monitoring-traces-reader
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: rhoai-monitoring-traces-reader
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [tempo.grafana.com]
    resources: [redhat-ods-monitoring]
    resourceNames: [traces]
    verbs: [get]
