apiVersion: v1
kind: Namespace
metadata:
  name: demo-sandbox
  labels:
    # Marks the namespace as a Red Hat OpenShift AI data science project so it
    # appears in the dashboard project list.
    opendatahub.io/dashboard: "true"
    kubernetes.io/metadata.name: demo-sandbox
    # Enables Kueue queue enforcement (stage-020): workloads must carry a
    # kueue.x-k8s.io/queue-name label, applied automatically by Kueue-enabled
    # hardware profiles.
    kueue.openshift.io/managed: "true"
  annotations:
    # Display name is coding-demo-specific; the demo-sandbox resource name stays
    # aligned with the shared rhoai3-demo foundation for diffability.
    openshift.io/display-name: "AI Coding Sandbox"
    openshift.io/description: "Shared project for platform validation and ad-hoc demos."
