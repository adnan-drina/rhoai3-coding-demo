# Lets the demo RHOAI administrator persona discover the product Perses
# dashboards without granting broad cluster-admin permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-observability-dashboard-viewer
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  labels:
    app.kubernetes.io/name: rhoai-observability-dashboard-viewer
    app.kubernetes.io/part-of: rhoai3-coding-demo
rules:
  - apiGroups:
      - perses.dev
    resources:
      - perses
      - persesdashboards
      - persesdatasources
      - persesglobaldatasources
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-admins-observability-dashboard-viewer
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    app.kubernetes.io/name: rhoai-observability-dashboard-viewer
    app.kubernetes.io/part-of: rhoai3-coding-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-observability-dashboard-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhoai-admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-admins-observability-dashboard-viewer
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    app.kubernetes.io/name: rhoai-observability-dashboard-viewer
    app.kubernetes.io/part-of: rhoai3-coding-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-observability-dashboard-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhoai-admins
