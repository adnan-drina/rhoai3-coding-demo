# Allows the Perses operator to sync product dashboards into the RHOAI
# observability Perses backend when OLM installs the operator in openshift-operators.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perses-backend-operator-access
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    app.kubernetes.io/name: perses-backend-operator-access
    app.kubernetes.io/part-of: rhoai3-coding-demo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: perses-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
          podSelector:
            matchLabels:
              app.kubernetes.io/name: perses-operator
      ports:
        - protocol: TCP
          port: 8080
