# The product requires PostgreSQL but does not provide a database operator.
# This single-instance demo database is project-owned; its PVC survives pruning.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-postgresql
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: mlflow-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    app.openshift.io/runtime: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  replicas: 1
  serviceName: mlflow-postgresql
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: rhoai-platform
        app.kubernetes.io/name: mlflow-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/managed-by: argocd
        app.openshift.io/runtime: postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          # RHOAI 3.5.1 RELATED_IMAGE_POSTGRESQL_16_IMAGE; do not track latest.
          image: registry.redhat.io/rhel9/postgresql-16@sha256:510ac645787b2ba27f6ab8bb8488656d025d8c2ddcbf8cc5b15447dac941687b
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mlflow-db-credentials
                  key: database-name
          readinessProbe:
            exec:
              command: [/usr/libexec/check-container]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/libexec/check-container, --live]
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-postgresql
