# Exact naming lets the native MLflow CR reference the bucket without rendering.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: rhoai-mlflow-artifacts
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: rhoai-platform
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  bucketName: rhoai-mlflow-artifacts
  storageClassName: openshift-storage.noobaa.io
