apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
spec:
  channel: patch-me-see-overlays-dir
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # Suppress operator bootstrap of the default DSCI; GitOps creates it.
  # Self-managed RHOAI does not auto-create a DSC in this bootstrap path.
  config:
    env:
      - name: DISABLE_DSC_CONFIG
        value: "true"
