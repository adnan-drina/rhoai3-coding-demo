apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: datasciencecluster
  name: default-dsc
spec:
  components:
    # ---- Base platform (stage-010) ----
    dashboard:
      managementState: Managed
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
    # Stage 030 enables registry and both catalog backends.
    modelregistry:
      managementState: Removed
      registriesNamespace: rhoai-model-registries

    # ---- Shared workload management integration (used by stage-020) ----
    kueue:
      # Stage 020 enables the standalone Red Hat build of Kueue integration.
      managementState: Removed

    # ---- Deferred to future stages via DSC patches ----
    aipipelines:
      managementState: Removed
    feastoperator:
      managementState: Removed
    kserve:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    # New 3.5 components remain outside foundation scope.
    ogx:
      managementState: Removed
    aigateway:
      managementState: Removed
    mcplifecycleoperator:
      managementState: Removed
    sparkoperator:
      managementState: Removed
    trainer:
      managementState: Removed
