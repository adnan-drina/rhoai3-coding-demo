apiVersion: v1
kind: ConfigMap
metadata:
  name: enable-odf-console-plugin
  namespace: openshift-storage
data:
  enable-console-plugin.sh: |
    #!/bin/bash
    set -euo pipefail

    function noisy {
        set -x
        "${@}"
        { set +x; } 2>/dev/null
    }
    PLUGIN_NAME="${PLUGIN_NAME:-odf-console}"

    echo "Ensuring ${PLUGIN_NAME} plugin is enabled"
    echo ""

    # A failed read must never be interpreted as an absent plugin list.
    snapshot=$(oc get consoles.operator.openshift.io cluster --request-timeout=10s -o=jsonpath='{.metadata.resourceVersion}{"\n"}{.spec.plugins}')
    resource_version=${snapshot%%$'\n'*}
    installed_plugins=${snapshot#*$'\n'}
    if [[ "$snapshot" != *$'\n'* ]]; then installed_plugins=""; fi
    [[ -n "$resource_version" ]] || { echo "Console resource version missing" >&2; exit 1; }
    if [[ -z "$installed_plugins" ]]; then
        # The version test refuses a concurrent change; never replace an existing list.
        noisy oc patch consoles.operator.openshift.io cluster --request-timeout=10s --type=json --patch '[{"op":"test","path":"/metadata/resourceVersion","value":"'"$resource_version"'"},{"op":"add","path":"/spec/plugins","value":[]}]'
        installed_plugins=$(oc get consoles.operator.openshift.io cluster --request-timeout=10s -o=jsonpath='{.spec.plugins}')
    fi

    echo "Current plugins:"
    echo "${installed_plugins}"

    if [[ "${installed_plugins}" == *"${PLUGIN_NAME}"* ]]; then
        echo "${PLUGIN_NAME} is already enabled"
    else
        echo "Enabling plugin: ${PLUGIN_NAME}"
        noisy oc patch consoles.operator.openshift.io cluster --type=json --patch '[{"op": "add", "path": "/spec/plugins/-", "value": "'"${PLUGIN_NAME}"'"}]'
    fi

    sleep 6
    noisy oc get consoles.operator.openshift.io cluster -o=jsonpath='{.spec.plugins}'
