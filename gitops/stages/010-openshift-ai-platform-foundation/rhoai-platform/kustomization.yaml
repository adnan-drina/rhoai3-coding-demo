# Shared OpenShift AI singletons: DSCInitialization, DataScienceCluster, Auth and OdhDashboardConfig.
# Later stages own selected DSC components and dashboard fields (ignoreDifferences on the Application).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - monitoring-namespace.yaml
  - dsc-init.yaml
  - datasciencecluster.yaml
  - auth.yaml
  - odhdashboardconfig.yaml
  - image-registry-default-route.yaml
