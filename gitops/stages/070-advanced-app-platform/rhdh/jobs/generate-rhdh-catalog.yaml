apiVersion: batch/v1
kind: Job
metadata:
  name: job-generate-rhdh-catalog
  namespace: rhdh
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '17'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-generate-rhdh-catalog
      volumes:
      - name: bundle
        configMap:
          name: rhdh-catalog-bundle
      - name: gitlab-reader
        secret:
          secretName: gitlab-catalog-reader
      - name: gitlab-config
        configMap:
          name: gitlab-platform-config
      containers:
      - name: generate
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - /bin/bash
        - /bundle/jobs__catalog__generate.sh
        volumeMounts:
        - name: bundle
          mountPath: /bundle
        - name: gitlab-reader
          mountPath: /gitlab-reader
          readOnly: true
        - name: gitlab-config
          mountPath: /gitlab-config
          readOnly: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-rhdh-catalog
  namespace: rhdh
  annotations:
    # A failed refresh is unhealthy in Argo. Do not let it gate the mirror
    # bootstrap (14), initial catalog (17), or portal configuration (18).
    argocd.argoproj.io/sync-wave: '19'
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: job-generate-rhdh-catalog
          volumes:
          - name: bundle
            configMap:
              name: rhdh-catalog-bundle
          - name: gitlab-reader
            secret:
              secretName: gitlab-catalog-reader
          - name: gitlab-config
            configMap:
              name: gitlab-platform-config
          containers:
          - name: refresh
            image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
            command:
            - /bin/bash
            - /bundle/jobs__catalog__generate.sh
            env:
            - name: SKIP_IF_CURRENT
              value: 'true'
            volumeMounts:
            - name: bundle
              mountPath: /bundle
            - name: gitlab-reader
              mountPath: /gitlab-reader
              readOnly: true
            - name: gitlab-config
              mountPath: /gitlab-config
              readOnly: true
