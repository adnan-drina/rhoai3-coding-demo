# ServiceAccount for the RHDH Kubernetes/Topology/Tekton plugins.
# The kubernetes.io/service-account-token Secret is populated by the token
# controller with a long-lived token; the configure-rhdh PostSync job copies
# it into rhdh-secrets as RHDH_KUBERNETES_SA_TOKEN for app-config env
# substitution. The 'view' ClusterRole covers workloads, routes, and the
# Tekton CRs (aggregated to view by the Pipelines operator).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhdh-kubernetes-reader
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-kubernetes-reader-token
  namespace: rhdh
  annotations:
    kubernetes.io/service-account.name: rhdh-kubernetes-reader
    argocd.argoproj.io/sync-wave: "5"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhdh-kubernetes-reader-view
  annotations:
    argocd.argoproj.io/sync-wave: "5"
subjects:
  - kind: ServiceAccount
    name: rhdh-kubernetes-reader
    namespace: rhdh
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
