apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rhbk-instance/oauthclient.yaml
- rhbk-instance/realm-platform.yaml
- jobs/configure-platform-identity.yaml
- jobs/scm-identity-role.yaml
- jobs/scm-identity-binding.yaml
- jobs/platform-clients.yaml
configMapGenerator:
- name: stage070-scm-identity
  namespace: keycloak
  files:
  - secret_writer.py
  - jobs/configure-scm-identity.py
  - jobs/configure-base-sso.py

# Only declarative Secret placeholders use Argo's argocd-controller SSA manager.
# The Application disables the client-apply migration bridge; runtime writers
# remain named create/merge-patch and ignored data stays with its producer.
patches:
- target:
    kind: Secret
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-options
      value: ServerSideApply=true
