apiVersion: v1
kind: ServiceAccount
metadata:
  name: configure-signing
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-wave: '3'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-signing
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-wave: '3'
rules:
- apiGroups:
  - rhtas.redhat.com
  resources:
  - securesigns
  resourceNames:
  - platform
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - stage070-signing-provisioner
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-signing
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-wave: '3'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configure-signing
subjects:
- kind: ServiceAccount
  name: configure-signing
  namespace: trusted-artifact-signer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configure-signing
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '3'
rules:
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  resourceNames:
  - keycloak
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configure-signing
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '3'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configure-signing
subjects:
- kind: ServiceAccount
  name: configure-signing
  namespace: trusted-artifact-signer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-signing
  namespace: trusted-artifact-signer
  annotations:
    argocd.argoproj.io/sync-wave: '10'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: configure-signing
      restartPolicy: Never
      containers:
      - name: configure
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - python3
        - /scripts/configure-signing.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: signing-bootstrap
