apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-project-applications
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-project-applications
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - argoproj.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - applications
  matchConditions:
  - name: enrollment-principals
    expression: (request.userInfo.username == 'system:serviceaccount:app-platform-build:project-provisioner')
      || (request.userInfo.username.startsWith('system:serviceaccount:') && request.userInfo.username.endsWith(':project-enrollment'))
  validations:
  - expression: "'ready' in params.data && params.data['ready'] == 'true'"
    message: Project enrollment release parameters are not initialized
  - expression: object.spec.destination.server == 'https://kubernetes.default.svc'
      && object.spec.destination.namespace.endsWith('-dev')
    message: Project Application exceeds its platform-owned source or scope
  - expression: '(request.userInfo.username == ''system:serviceaccount:app-platform-build:project-provisioner'')
      ? (object.metadata.name.startsWith(''project-'') && object.spec.project == ''platform-projects''
      && (object.spec.destination.namespace == object.metadata.name.substring(8) +
      ''-dev'' || (object.metadata.name == ''project-coolstore-inventory-service''
      && object.spec.destination.namespace == ''coolstore-dev''))) : (object.metadata.name
      == ''runtime-'' + variables.projectName && object.spec.project == ''runtime-projects''
      && object.spec.destination.namespace == request.userInfo.username.split('':'')[2])'
    message: Project Application exceeds its platform-owned source or scope
  - expression: object.spec.project != 'platform-projects' || (object.spec.source.repoURL
      == params.data['repo_url'] && (object.spec.source.targetRevision == params.data['revision']
      || (oldObject != null && object.spec.source == oldObject.spec.source)) && object.spec.source.path
      == 'gitops/stages/070-advanced-app-platform/base/pipelines/project-enrollment')
    message: Project Application exceeds its platform-owned source or scope
  - expression: object.spec.project != 'runtime-projects' || (object.spec.source.repoURL
      == params.data['delivery_base_url'] + object.metadata.name.substring(8) + '-deployment.git'
      && object.spec.source.targetRevision == 'main' && object.spec.source.path ==
      '.')
    message: Project Application exceeds its platform-owned source or scope
  - expression: '!has(object.spec.sources) && !has(object.spec.source.helm) && !has(object.spec.source.plugin)
      && !has(object.spec.source.directory)'
    message: Project Application exceeds its platform-owned source or scope
  - expression: object.spec.project != 'platform-projects' || (has(object.spec.source.kustomize)
      && !has(object.spec.source.kustomize.namespace) && !has(object.spec.source.kustomize.patches)
      && !has(object.spec.source.kustomize.images) && !has(object.spec.source.kustomize.components)
      && !has(object.spec.source.kustomize.replicas) && !has(object.spec.source.kustomize.namePrefix)
      && !has(object.spec.source.kustomize.nameSuffix) && !has(object.spec.source.kustomize.commonLabels)
      && object.spec.source.kustomize.commonAnnotations.size() == 3 && object.spec.source.kustomize.commonAnnotations['rhoai3.io/project-name']
      == object.metadata.name.substring(8) && object.spec.source.kustomize.commonAnnotations['rhoai3.io/project-namespace']
      == object.spec.destination.namespace)
    message: Project Application exceeds its platform-owned source or scope
  - expression: object.spec.project != 'runtime-projects' || !has(object.spec.source.kustomize)
    message: Project Application exceeds its platform-owned source or scope
  variables:
  - name: projectName
    expression: 'request.userInfo.username.split('':'')[2] == ''coolstore-dev'' ?
      ''coolstore-inventory-service'' : request.userInfo.username.split('':'')[2].substring(0,
      request.userInfo.username.split('':'')[2].size()-4)'
