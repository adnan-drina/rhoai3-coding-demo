# RBAC cannot limit create by name; this policy limits which Secrets system:serviceaccount:app-platform-build:project-provisioner may create or update.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-workspace-scanner-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-workspace-scanner-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
  matchConditions:
  - name: principal
    expression: request.userInfo.username == 'system:serviceaccount:app-platform-build:project-provisioner'
  validations:
  - expression: "!(object.metadata.namespace in ['wksp-ai-developer', 'wksp-ai-admin']) || object.metadata.name.endsWith('-sonar-credentials')"
    message: In persona workspaces the coordinator writes only project scanner mirrors (*-sonar-credentials)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: stage070-workspace-scanner-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-workspace-scanner-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  policyName: stage070-workspace-scanner-secrets
  validationActions: [Deny]
