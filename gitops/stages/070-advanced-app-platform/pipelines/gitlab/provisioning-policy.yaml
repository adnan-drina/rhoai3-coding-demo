apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-project-provisioning
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-project-provisioning
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - tekton.dev
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pipelineruns
  matchConditions:
  - name: project-bootstrap-in-platform
    expression: request.namespace == 'app-platform-build' && request.userInfo.username.startsWith('system:serviceaccount:')
      && request.userInfo.username.endsWith(':project-enrollment')
  # Tekton params and inline specs are preserved unknown fields, unavailable to
  # CEL. Do not grant project bootstraps access to this privileged dispatcher.
  validations:
  - expression: 'false'
    message: Only the platform coordinator may dispatch migration provisioning
