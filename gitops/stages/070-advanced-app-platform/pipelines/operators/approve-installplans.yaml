apiVersion: batch/v1
kind: Job
metadata:
  name: approve-trusted-delivery-installplans
  namespace: openshift-operators
  labels:
    app.kubernetes.io/name: approve-trusted-delivery-installplans
    app.kubernetes.io/component: trusted-delivery
    app.kubernetes.io/part-of: rhoai3-coding-demo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: approve-trusted-delivery-installplans
      restartPolicy: Never
      containers:
      - name: approve
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - /bin/bash
        - -ec
        - "set -euo pipefail\nallowed=' devworkspace-operator.v0.43.0 devspacesoperator.v3.30.2 rhdh-operator.v1.10.5 mta-operator.v8.3.1 openshift-pipelines-operator-rh.v1.24.0 rhtas-operator.v1.5.0 '\nfor attempt in $(seq 1 90); do\n  ready=0\n  for pair in openshift-devspaces:devspaces:devspacesoperator.v3.30.2 rhdh-operator:rhdh:rhdh-operator.v1.10.5 openshift-mta:mta-operator:mta-operator.v8.3.1; do\n    ns=${pair%%:*}; rest=${pair#*:}; sub=${rest%%:*}; expected=${rest#*:}\n    installed=$(oc get subscription \"$sub\" -n \"$ns\" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)\n    if [ \"$installed\" = \"$expected\" ]; then ready=$((ready+1)); continue; fi\n    plan=$(oc get subscription \"$sub\" -n \"$ns\" -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null || true)\n    [ -n \"$plan\" ] || continue\n    csvs=$(oc get installplan \"$plan\" -n \"$ns\"\
          \ -o jsonpath='{.spec.clusterServiceVersionNames[*]}')\n    [ -n \"$csvs\" ] || continue\n    safe=true\n    for csv in $csvs; do\n      case \"$allowed\" in *\" $csv \"*) ;; *) safe=false ;; esac\n    done\n    if [ \"$safe\" != true ]; then echo \"REFUSE: InstallPlan $ns/$plan includes unreviewed CSVs\" >&2; exit 1; fi\n    case \" $csvs \" in *\" $expected \"*) ;; *) continue ;; esac\n    oc patch installplan \"$plan\" -n \"$ns\" --type=merge -p '{\"spec\":{\"approved\":true}}'\n  done\n  [ \"$ready\" -eq 3 ] && exit 0\n  sleep 10\ndone\necho 'Reviewed Stage 070 operators did not install before deadline' >&2\nexit 1\n"
