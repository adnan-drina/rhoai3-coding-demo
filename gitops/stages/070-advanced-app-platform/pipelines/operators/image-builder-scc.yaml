# Only the build Task may use OCP's documented nested-container SCC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-userns-builder
  annotations:
    argocd.argoproj.io/sync-wave: '3'
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [nested-container]
    verbs: [use]
