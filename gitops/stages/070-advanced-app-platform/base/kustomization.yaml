apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- identity
- gitlab
- devspaces
- pipelines
- sonarqube
- rhdh
- mta
- coolstore
- network-policies.yaml

# Only declarative Secret placeholders use Argo's argocd-controller SSA manager.
# The Application disables the client-apply migration bridge; runtime writers
# remain named create/merge-patch and ignored data stays with its producer.
patches:
- target:
    kind: Secret
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-options
      value: ServerSideApply=true

# Reuse the same typed writer in each existing script bundle.
configMapGenerator:
- name: gitlab-bootstrap
  namespace: gitlab-system
  behavior: merge
  files:
  - secret_writer.py=pipelines/gitlab/secret_writer.py
- name: stage070-scm-identity
  namespace: keycloak
  behavior: merge
  files:
  - secret_writer.py=pipelines/gitlab/secret_writer.py
- name: mta-ai-bootstrap
  namespace: openshift-mta
  behavior: merge
  files:
  - secret_writer.py=pipelines/gitlab/secret_writer.py
- name: sonarqube-admin-bootstrap
  namespace: sonarqube
  behavior: merge
  files:
  - secret_writer.py=pipelines/gitlab/secret_writer.py
- name: stage070-secret-writer
  namespace: wksp-ai-developer
  files:
  - secret_writer.py=pipelines/gitlab/secret_writer.py
