        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - python3
        - /scripts/configure-base-sso.py
        volumeMounts:
        - name: scm
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scm
        configMap:
          name: stage070-scm-identity
