    argocd.argoproj.io/sync-wave: '1'
subjects:
- kind: ServiceAccount
  name: job-configure-platform-identity
  namespace: keycloak
roleRef:
  kind: ClusterRole
  name: job-configure-platform-identity
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-configure-platform-identity
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: job-configure-platform-identity
      containers:
