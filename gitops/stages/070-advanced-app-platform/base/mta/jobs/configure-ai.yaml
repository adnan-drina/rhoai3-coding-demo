apiVersion: batch/v1
kind: Job
metadata:
  name: configure-mta-ai
  namespace: openshift-mta
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    # Write the runtime endpoint after its Gateway resource has been applied.
    argocd.argoproj.io/sync-wave: '11'
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: mta-maas-provisioner
      restartPolicy: Never
      containers:
      - name: configure
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - python3
        - /scripts/configure-ai.py
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mta-ai-bootstrap
