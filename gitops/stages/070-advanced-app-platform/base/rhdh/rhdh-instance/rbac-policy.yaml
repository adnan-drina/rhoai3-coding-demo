apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdh-rbac-policies
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: '5'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: rhdh-rbac-policies
    app.kubernetes.io/component: project-enrollment
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
data:
  rbac-policies.csv: |
    g, user:default/ai-developer, role:default/developer
    p, role:default/developer, catalog-entity, read, allow
    p, role:default/developer, catalog.location.read, read, allow
    p, role:default/developer, scaffolder-template, read, allow
    p, role:default/developer, scaffolder-action, use, allow
    p, role:default/developer, scaffolder.task.create, create, allow
    p, role:default/developer, scaffolder.task.read, read, allow
    p, role:default/developer, catalog.location.create, create, deny
    p, role:default/developer, catalog.entity.create, create, deny
    p, role:default/developer, catalog.entity.delete, delete, deny
