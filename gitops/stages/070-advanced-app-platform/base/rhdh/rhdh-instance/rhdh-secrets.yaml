# Runtime secrets for RHDH — patched by the PostSync Job with real values.
# SESSION_SECRET: random session signing key
# RHDH_OIDC_CLIENT_SECRET: RHBK client secret for the rhdh OIDC client
# RHDH_BASE_URL: cluster-specific RHDH route URL
# RHBK_METADATA_URL: platform RHBK realm OIDC discovery URL (identity component)
# RHDH_CATALOG_URL: runtime catalog file mounted into the RHDH pod
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
# Non-secret bootstrap placeholders use data so the Application's /data
# ignore rule preserves runtime credentials on every subsequent sync.
# stringData would overwrite that preserved data at the Kubernetes API.
data:
  SESSION_SECRET: UExBQ0VIT0xERVJfV0lMTF9CRV9QQVRDSEVE
  RHDH_OIDC_CLIENT_SECRET: UExBQ0VIT0xERVJfV0lMTF9CRV9QQVRDSEVE
  RHDH_BASE_URL: aHR0cHM6Ly9yaGRoLnBsYWNlaG9sZGVyLmV4YW1wbGUuY29t
  RHBK_METADATA_URL: aHR0cHM6Ly9yaGJrLnBsYWNlaG9sZGVyLmV4YW1wbGUuY29tL3JlYWxtcy9wbGF0Zm9ybQ==
  RHDH_CATALOG_URL: L29wdC9hcHAtcm9vdC9zcmMvY2F0YWxvZy9hbGwueWFtbA==
