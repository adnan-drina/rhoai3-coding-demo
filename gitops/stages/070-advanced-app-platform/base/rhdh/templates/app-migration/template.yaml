apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: app-migration
  title: Application migration
  description: 'Provisions a migration working set for a legacy application: a Quarkus

    destination repository carrying corporate migration standards

    (AGENTS.md) and a Dev Spaces workspace

    that clones the legacy code next to it (/projects/legacy, read-only,

    workspace-only) with the MTA analysis extension preconfigured. The

    destination repository is registered in the catalog and provisioned

    with its own namespace and delivery pipeline (SonarQube quality gate

    included); the legacy application is not cataloged.

    '
  tags:
  - golden-path
  - migration
  - quarkus
  - mta
spec:
  owner: ai-modernization-team
  type: service
  parameters:
  - title: Migration input
    required:
    - name
    - legacyRepoUrl
    properties:
      name:
        title: Project name
        type: string
        description: 'Name for the migration project (e.g. coolstore-cart-v6). It

          becomes the destination repository, namespace, and workspace

          name. Lowercase letters, numbers, and hyphens.

          '
        pattern: ^[a-z][a-z0-9-]{2,40}$
        ui:autofocus: true
      legacyRepoUrl:
        title: Legacy repository URL
        type: string
        description: HTTPS Git URL of the legacy application. Use its GitLab mirror for platform-owned demo sources. The source is cloned read-only into the workspace.
        pattern: ^https://.+
      autoStartMigration:
        title: Auto-start migration (M1 ANALYZE)
        type: boolean
        default: true
        description: 'When on (demo default), dest-init mints M1 ANALYZE, and M2 PLAN

          (child of M1) only when the scaffold''s .hermes/pins.json

          pins.planner.activation is "activated" (Operator GO after the

          planner activation gate). Never M3/M4 at dest-init.

          Turn off to inspect the workspace before agents touch it.

          '
      boardProtocol:
        title: Board protocol
        type: string
        default: outcome-board/v2
        enum:
        - serial-loop/v1
        - outcome-board/v2
        description: 'How the run''s work is organised after M2. outcome-board/v2

          (default) publishes every known outcome at M2 as a native Hermes

          Kanban task; Hermes owns the lifecycle (runs, dependencies,

          review and rework) under a cooperative local-worker model, and

          the migration''s domain checks guard each native action. It runs

          only when the platform has enabled it for this run (the

          migration-run provisioner records the selection and its execution

          state in the read-only run control), and a run that requested it

          never falls back to the serial loop: until the platform enables

          it, the launch refuses. serial-loop/v1 is the one-card-at-a-time

          loop, kept for explicit compatibility only. (outcome-board/v1,

          the protected-authority sidecar, is no longer offered to new runs.)

          Recorded once, in the destination''s initial commit; a run never

          changes protocol.

          '
      model:
        title: Worker model
        type: string
        default: qwen3-8-27b
        enum:
        - qwen3-8-27b
        enumNames:
        - Qwen 3.8 27B (NVFP4, 262K window, loop escalation)
        description: 'The model every worker of this run uses. Recorded once, in the

          destination''s initial commit (run-budget.json model); the

          migration-run provisioner pins that model''s profile in the run''s

          read-only run control, and dest-init generates the worker

          configuration from the pin (sampling, context, compression, and for

          Qwen 3.8 the loop escalation to a thinking turn). A model the

          platform''s profile table does not serve is refused at provisioning.

          A run never changes model.

          '
  steps:
  - id: platform-entity
    name: Read platform link endpoints from the catalog
    action: catalog:fetch
    input:
      entityRef: component:default/coolstore-inventory-service
  - id: fetch-golden
    name: Fetch Quarkus migration scaffold golden repository
    action: fetch:plain
    input:
      url: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/migration-golden-url'] }}
  - id: require-maas-route
    name: MaaS route present (this step runs only to refuse with FACTORY_MAAS_ROUTE_MISSING)
    if: ${{ not steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-host'] or not steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-internal-ip'] or ('_' in steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-host']) or ('_' in steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-internal-ip']) }}
    action: fetch:plain
    input:
      url: ./refusals/FACTORY_MAAS_ROUTE_MISSING
      targetPath: ./.refusal
  - id: require-mta-hub
    name: MTA Hub endpoint present (refuse with FACTORY_MTA_HUB_MISSING)
    if: ${{ not steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/mta-hub-url'] or not steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/mta-hub-url'].startsWith('https://') or ('_' in steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/mta-hub-url']) }}
    action: fetch:plain
    input:
      url: ./refusals/FACTORY_MTA_HUB_MISSING
      targetPath: ./.refusal
  - id: add-catalog-info
    name: Add catalog metadata and stamp the migration working set
    action: fetch:template
    input:
      url: ./skeleton
      replace: true
      values:
        name: ${{ parameters.name }}
        legacyRepoUrl: ${{ parameters.legacyRepoUrl }}
        autoStartMigration: ${{ parameters.autoStartMigration }}
        boardProtocol: ${{ parameters.boardProtocol }}
        model: ${{ parameters.model }}
        scaffolderTaskId: ${{ context.task.id }}
        mtaHubUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/mta-hub-url'] }}
        maasHost: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-host'] }}
        maasInternalIp: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/maas-internal-ip'] }}
        sonarqubeUrl: ${{ steps['platform-entity'].output.entity.metadata.links[3].url | replace('coolstore-inventory-service', parameters.name) }}
        devspacesUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/devspaces-base-url'] }}/#${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-base-url'] }}/${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}/${{ parameters.name }}?revision=main&existing=${{ parameters.name }}
        gitlabBaseUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-base-url'] }}
        gitlabGroup: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}
  - id: publish
    name: Publish private repository to GitLab
    action: publish:gitlab
    input:
      repoUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-host'] }}?owner=${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}&repo=${{ parameters.name }}
      defaultBranch: main
      settings:
        description: 'Quarkus migration destination (golden path: AI-autonomous migration)'
        visibility: private
        topics:
        - rhoai3-golden-path
        - rhoai3-scaffolded
        - rhoai3-migration-run
  - id: enroll
    name: Request platform enrollment of the immutable first commit
    action: gitlab:issues:create
    input:
      repoUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-host'] }}?owner=rhoai-platform&repo=platform-enrollment
      projectId: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-registration-project-id'] | int }}
      title: Enroll ${{ parameters.name }}
      labels: platform-enrollment
      confidential: true
      description: '{"project_id": ${{ steps.publish.output.projectId }}, "initial_commit": "${{ steps.publish.output.commitHash }}", "kind": "migration", "requester": "${{ user.ref }}"}'
  output:
    links:
    - title: Destination repository
      url: ${{ steps.publish.output.remoteUrl }}
    - title: Open in catalog
      icon: catalog
      entityRef: component:default/${{ parameters.name }}
    text:
    - title: Next steps
      content: "The publish above requested platform enrollment. The catalog discovers your project automatically; Argo CD is\ncreating the `<name>-dev` namespace with the project's own\ndelivery pipeline, and build credentials arrive within two\nminutes.\n\nOpen the destination repository in Dev Spaces: the workspace\nclones the legacy application to `/projects/legacy` (read-only,\nworkspace-only) next to `/projects/modernized` (this repository),\nwith the MTA analysis extension preconfigured against the\nplatform hub. Run the MTA analysis of the legacy project first \u2014\nits findings are the migration's ground truth \u2014 then build the\nmodernized service in `/projects/modernized`. Every push to\n`main` runs the project's own pipeline in `<name>-dev` with the\nSonarQube quality gate.\n"
