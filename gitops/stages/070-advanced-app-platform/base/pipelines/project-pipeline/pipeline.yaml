apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-push
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  params:
  - name: repo-url
    type: string
    description: Clone URL of the repository that triggered the run
  - name: repo-name
    type: string
    description: Repository name (used as SonarQube project key and image name)
  - name: revision
    type: string
    description: Git revision to build (webhook head SHA)
  results:
  - name: SOURCE_COMMIT
    value: $(tasks.clone-source.results.COMMIT)
  - name: IMAGE_DIGEST
    value: $(tasks.build-and-push.results.IMAGE_DIGEST)
  - name: IMAGE_URL
    value: $(tasks.build-and-push.results.IMAGE_URL)
  - name: DEPLOYMENT_COMMIT
    value: $(tasks.deploy.results.DEPLOYMENT_COMMIT)
  workspaces:
  - name: source
  - name: basic-auth
  - name: maven-cache
  tasks:
  - name: resolve-image-registry
    taskRef:
      name: resolve-image-registry
    params:
    - name: IMAGE_NAME
      value: $(params.repo-name)
  - name: clone-source
    taskRef:
      name: gitlab-clone
    params:
    - name: URL
      value: $(params.repo-url)
    - name: REVISION
      value: $(params.revision)
    workspaces:
    - name: output
      workspace: source
    - name: basic-auth
      workspace: basic-auth
  - name: maven-build
    runAfter:
    - clone-source
    taskRef:
      name: maven-build
    workspaces:
    - name: source
      workspace: source
    - name: maven-cache
      workspace: maven-cache
  - name: sonar-scan
    runAfter:
    - maven-build
    taskRef:
      name: sonar-scan
    params:
    - name: SONAR_PROJECT_KEY
      value: $(params.repo-name)
    workspaces:
    - name: source
      workspace: source
    - name: maven-cache
      workspace: maven-cache
  - name: build-and-push
    runAfter:
    - sonar-scan
    - resolve-image-registry
    taskRef:
      name: build-internal-image
    params:
    - name: IMAGE
      value: $(tasks.resolve-image-registry.results.registry)/$(params.repo-name):$(tasks.clone-source.results.COMMIT)
    workspaces:
    - name: source
      workspace: source
  - name: deploy
    runAfter:
    - build-and-push
    taskRef:
      name: promote-gitlab-runtime
    params:
    - name: IMAGE
      value: $(tasks.build-and-push.results.IMAGE_URL)
    - name: SOURCE_COMMIT
      value: $(tasks.clone-source.results.COMMIT)
    workspaces:
    - name: source
      workspace: source
