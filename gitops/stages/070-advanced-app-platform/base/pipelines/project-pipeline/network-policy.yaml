apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-ingress
  namespace: unassigned-dev
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: project-ingress
    app.kubernetes.io/component: network-boundary
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ''
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
