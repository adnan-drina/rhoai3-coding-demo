# Ordinary builds have one declared destination. An unreadable policy or absent
# ImageStream refuses the build rather than selecting a different registry.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-image-registry
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  params:
    - name: IMAGE_NAME
      type: string
  results:
    - name: registry
      description: Registry/namespace prefix for the built image
  steps:
    - name: resolve
      image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
      env:
        - name: IMAGE_NAME
          value: $(params.IMAGE_NAME)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        MODE=$(oc get configmap app-platform-build-config \
          -n "${NS}" -o jsonpath='{.data.REGISTRY_MODE}')
        if [[ "${MODE}" != internal ]]; then
          echo "Project registry policy must declare REGISTRY_MODE=internal" >&2
          exit 2
        fi
        [[ "${IMAGE_NAME}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || exit 2
        oc get imagestream "${IMAGE_NAME}" -n "${NS}" >/dev/null
        REGISTRY="image-registry.openshift-image-registry.svc:5000/${NS}"
        printf '%s' "${REGISTRY}" > "$(results.registry.path)"
