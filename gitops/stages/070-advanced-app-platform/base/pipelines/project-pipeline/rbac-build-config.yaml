apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-read-build-config
  annotations:
    argocd.argoproj.io/sync-wave: '20'
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - app-platform-build-config
  verbs:
  - get
- apiGroups:
  - image.openshift.io
  resources:
  - imagestreams
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-read-build-config
  annotations:
    argocd.argoproj.io/sync-wave: '20'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-read-build-config
subjects:
- kind: ServiceAccount
  name: app-builder
