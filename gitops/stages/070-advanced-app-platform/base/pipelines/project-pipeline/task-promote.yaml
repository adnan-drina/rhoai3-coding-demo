apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote-gitlab-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  params:
    - name: IMAGE
      type: string
    - name: SOURCE_COMMIT
      type: string
  results:
    - name: DEPLOYMENT_COMMIT
      type: string
  workspaces:
    - name: source
  steps:
    - name: promote
      image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
      command: [python3, /scripts/promote.py]
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: SOURCE_COMMIT
          value: $(params.SOURCE_COMMIT)
        - name: SOURCE_DIR
          value: $(workspaces.source.path)
        - name: RESULT_PATH
          value: $(results.DEPLOYMENT_COMMIT.path)
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: delivery
          mountPath: /config
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: argo
          mountPath: /argo
          readOnly: true
  volumes:
    - name: scripts
      configMap:
        name: project-promotion-scripts
    - name: delivery
      configMap:
        name: project-delivery-config
    - name: credentials
      secret:
        secretName: gitlab-delivery-writer
    - name: argo
      secret:
        secretName: argocd-delivery-reader
