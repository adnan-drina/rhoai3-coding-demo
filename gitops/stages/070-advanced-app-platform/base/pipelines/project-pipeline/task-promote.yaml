apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote-gitlab-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  params:
    - name: IMAGE
      type: string
    - name: SOURCE_COMMIT
      type: string
  results:
    - name: DEPLOYMENT_COMMIT
      type: string
  steps:
    - name: promote
      image: quay.io/rhoai3-coding-demo/rhoai3-ws-080@sha256:0a69b62aff536713184641d409a7a8c13b3bce9d041cbdf3f63a7f0f4d2b5b30
      command: [python3, /scripts/promote.py]
      env:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: SOURCE_COMMIT
          value: $(params.SOURCE_COMMIT)
        - name: RESULT_PATH
          value: $(results.DEPLOYMENT_COMMIT.path)
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: delivery
          mountPath: /config
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: source-credentials
          mountPath: /source-credentials
          readOnly: true
  volumes:
    - name: scripts
      configMap:
        name: project-promotion-scripts
    - name: delivery
      configMap:
        name: project-delivery-config
    - name: credentials
      secret:
        secretName: gitlab-delivery-writer
    - name: source-credentials
      secret:
        secretName: gitlab-read-source
