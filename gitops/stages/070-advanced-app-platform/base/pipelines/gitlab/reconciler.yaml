apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-provisioner
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: '13'
spec:
  schedule: '*/2 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: project-provisioner
          restartPolicy: Never
          containers:
          - name: enroll
            image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
            command:
            - python3
            - /scripts/reconcile.py
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          volumes:
          - name: scripts
            configMap:
              name: gitlab-project-reconciler
