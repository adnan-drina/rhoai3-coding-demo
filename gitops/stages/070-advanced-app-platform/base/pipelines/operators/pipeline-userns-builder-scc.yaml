# Buildah runs as UID0 inside an OCP4.22 pod user namespace, never host UID0.
# Only image-builder receives use; the constraint refuses host-level users.
# Ref: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/security_apis/securitycontextconstraints-security-openshift-io-v1
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: pipeline-userns-builder
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: pipeline-userns-builder
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
allowPrivilegedContainer: false
allowPrivilegeEscalation: false
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
userNamespaceLevel: RequirePodLevel
allowedCapabilities: [SETFCAP]
requiredDropCapabilities: []
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
    - min: 0
      max: 0
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 0
      max: 0
seccompProfiles: [runtime/default]
volumes: [configMap, downwardAPI, emptyDir, persistentVolumeClaim, projected, secret]
readOnlyRootFilesystem: false
