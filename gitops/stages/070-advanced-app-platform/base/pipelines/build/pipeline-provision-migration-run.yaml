apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: provision-migration-run
  namespace: app-platform-build
  labels:
    app.kubernetes.io/part-of: developer-hub
    app.kubernetes.io/component: migration-run-provisioner
  annotations:
    argocd.argoproj.io/sync-wave: '12'
spec:
  description: Provision or retire one Stage 080 migration run's own resources.
  params:
  - name: run-name
    type: string
  - name: scaffold-commit
    type: string
  - name: mode
    type: string
    default: provision
  - name: workspace-namespace
    type: string
    default: wksp-ai-developer
  - name: request-provider
    type: string
    default: gitlab
  - name: request-project-id
    type: string
    default: ''
  - name: request-repository-owner
    type: string
    default: rhoai-workloads
  - name: request-raw-base
    type: string
    default: ''
  results:
  - name: receipt
    value: $(tasks.provision.results.receipt)
  - name: outcome
    value: $(tasks.provision.results.outcome)
  tasks:
  - name: provision
    taskRef:
      name: provision-migration-run
    params:
    - name: run-name
      value: $(params.run-name)
    - name: scaffold-commit
      value: $(params.scaffold-commit)
    - name: mode
      value: $(params.mode)
    - name: workspace-namespace
      value: $(params.workspace-namespace)
    - name: request-provider
      value: $(params.request-provider)
    - name: request-project-id
      value: $(params.request-project-id)
    - name: request-repository-owner
      value: $(params.request-repository-owner)
    - name: request-raw-base
      value: $(params.request-raw-base)
