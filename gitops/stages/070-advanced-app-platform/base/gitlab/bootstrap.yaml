---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-bootstrap
  namespace: gitlab-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '6'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: gitlab-bootstrap
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - python3
        - /bootstrap/bootstrap.py
        - prepare
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: bootstrap
        configMap:
          name: gitlab-bootstrap
      - name: runtime
        configMap:
          name: gitlab-runtime-templates
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-record-release
  namespace: gitlab-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '12'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: gitlab-bootstrap
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - python3
        - /bootstrap/bootstrap.py
        - record-version
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: runtime
          mountPath: /runtime
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: bootstrap
        configMap:
          name: gitlab-bootstrap
      - name: runtime
        configMap:
          name: gitlab-runtime-templates
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
