# Generated by scripts/platform/render-stage070-charts.py; edit values/renderer, then regenerate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-toolbox
  namespace: gitlab-system
  labels:
    app: toolbox
    chart: toolbox-10.4.2
    release: gitlab
    heritage: Helm
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: developer-platform
  annotations:
    argocd.argoproj.io/sync-wave: '3'
data:
  database.yml.erb: "\nproduction:\n  main:\n    adapter: postgresql\n    encoding: unicode\n    database: gitlabhq_production\n    username: gitlab\n    password: <%= File.read('/etc/gitlab/postgres/psql-password-main').strip.to_json %>\n    host: \"gitlab-postgresql\"\n    port: 5432\n    connect_timeout: \n    keepalives: \n    keepalives_idle: \n    keepalives_interval: \n    keepalives_count: \n    tcp_user_timeout: \n    application_name: \n    prepared_statements: false\n    database_tasks: true\n    \n    \n  ci:\n    adapter: postgresql\n    encoding: unicode\n    database: gitlabhq_production\n    username: gitlab\n    password: <%= File.read('/etc/gitlab/postgres/psql-password-ci').strip.to_json %>\n    host: \"gitlab-postgresql\"\n    port: 5432\n    connect_timeout: \n    keepalives: \n    keepalives_idle: \n    keepalives_interval: \n    keepalives_count: \n    tcp_user_timeout: \n    application_name: \n    prepared_statements: false\n    database_tasks: false\n    \n    \n"
  session_store.yml.erb: |
    production:
        session_cookie_token_prefix: ""
  krb5.conf: ''
  smtp_settings.rb: ''
  resque.yml.erb: "production:\n  url: redis://:<%= ERB::Util::url_encode(File.read(\"/etc/gitlab/redis/redis-password\").strip) %>@gitlab-valkey:6379/0\n  \n  \n  id:\n"
  cable.yml.erb: "production:\n  url: redis://:<%= ERB::Util::url_encode(File.read(\"/etc/gitlab/redis/redis-password\").strip) %>@gitlab-valkey:6379/0\n  \n  \n  id:\n  adapter: redis\n"
  configure: |
    # BEGIN gitlab.scripts.configure.secrets
    set -e
    config_dir="/init-config"
    secret_dir="/init-secrets"
    # required
    for secret in shell gitaly registry rails-secrets ; do
      mkdir -p "${secret_dir}/${secret}"
      cp -f -v -r -L "${config_dir}/${secret}/." "${secret_dir}/${secret}/"
    done
    # optional
    for secret in redis redis-sentinel objectstorage postgres ldap duo omniauth smtp kas pages oauth-secrets mailroom gitlab-exporter microsoft_graph_mailer amazon_ses_mailer mobile_push zoekt clickhouse openbao knowledge_graph iam-auth iam-data-access artifact-registry ; do
      if [ -e "${config_dir}/${secret}" ]; then
        mkdir -p "${secret_dir}/${secret}"
        cp -f -v -r -L "${config_dir}/${secret}/." "${secret_dir}/${secret}/"
      fi
    done
    # END gitlab.scripts.configure.secrets



    # Mount point for registry DB secrets. Needs to be pre-created as later the
    # volume is remounted read-only
    mkdir "/${secret_dir}/registry-db/"

    # Mount point for OpenBao DB secrets. Needs to be pre-created as later the
    # volume is remounted read-only
    mkdir "/${secret_dir}/openbao-db/"
    if [ -f "/${secret_dir}/objectstorage/.s3cfg" ]; then
      mv "/${secret_dir}/objectstorage/.s3cfg" "/${secret_dir}/.s3cfg"
    fi
  configure-gcloud-storage: |
    set -e
    if command -v gcloud > /dev/null 2>&1; then
      if [ -e "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        # Activate the service account using the provided key file for gcloud storage
        gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project=""
      fi
      # If GOOGLE_APPLICATION_CREDENTIALS is not set, gcloud storage will use
      # Application Default Credentials (e.g. GKE Workload Identity Federation) automatically.
    fi
    if command -v gsutil > /dev/null 2>&1; then
      if [ -e "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
        # The following script is used to configure gsutil when creating backups
        # It provides inputs to the `gsutil config -e` prompt as follows:
        # 1) Path to service account JSON key file
        # 2) Do not set permissions for key file
        # 3) GCP Project ID
        # 4) Decline anonymous usage statistics
        printf "$GOOGLE_APPLICATION_CREDENTIALS\nN\n\nN\n" | gsutil config -e
      else
        # If the backup config is not configured, assume that
        # Application Default Credentials are used with a service account.
        # This enables GKE Workload Identity Federation to work.
        printf "[GoogleCompute]\nservice_account = default\n" > ~/.boto
      fi
    fi
