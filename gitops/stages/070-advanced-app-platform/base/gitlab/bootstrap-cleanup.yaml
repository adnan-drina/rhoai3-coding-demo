apiVersion: batch/v1
kind: Job
metadata:
  name: stage070-bootstrap-cleanup
  namespace: gitlab-system
  annotations:
    argocd.argoproj.io/hook: PostSync,SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '99'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: stage070-bootstrap-cleanup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - /bin/bash
        - -c
        - |
          set -eu
          oc delete rolebinding gitlab-integrations-bootstrap -n gitlab-system --ignore-not-found
          oc delete rolebinding gitlab-bootstrap-exec -n gitlab-system --ignore-not-found
          oc delete rolebinding gitlab-integrations-bootstrap -n rhdh --ignore-not-found
          oc delete rolebinding gitlab-integrations-bootstrap -n app-platform-build --ignore-not-found
          oc delete rolebinding gitlab-integrations-bootstrap -n openshift-devspaces --ignore-not-found
          oc delete rolebinding gitlab-integrations-bootstrap -n openshift-gitops --ignore-not-found
          oc delete rolebinding gitlab-integrations-mta -n openshift-mta --ignore-not-found
          oc delete rolebinding gitlab-standing-workspace-source -n wksp-ai-developer --ignore-not-found
          oc delete rolebinding gitlab-standing-workspace-source -n wksp-ai-admin --ignore-not-found
          oc delete rolebinding gitlab-integrations-personas -n keycloak --ignore-not-found
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
