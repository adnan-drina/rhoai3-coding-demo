metadata:
  name: workspace-sonar-credentials-source-reader
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: '17'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-source-reader
subjects:
- kind: ServiceAccount
  name: workspace-sonar-credentials-provisioner
  namespace: wksp-ai-developer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '17'
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '17'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-writer
subjects:
- kind: ServiceAccount
  name: workspace-sonar-credentials-provisioner
  namespace: wksp-ai-developer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: provision-workspace-sonar-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '18'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: workspace-sonar-credentials-provisioner
      restartPolicy: Never
      containers:
      - name: provision
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - "set -euo pipefail\n# shared body with CronJob (keep in sync)\nif ! oc get secret sonarqube-credentials -n app-platform-build >/dev/null 2>&1; then\n  echo \"source sonarqube-credentials absent \u2014 skipping\"\n  exit 0\nfi\nHOST=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.host}')\nTOKEN=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.token}')\nPREV=\"\"\nif oc get secret workspace-sonar-credentials -n wksp-ai-developer >/dev/null 2>&1; then\n  PREV=$(oc get secret workspace-sonar-credentials -n wksp-ai-developer \\\n    -o jsonpath='{.data.SONAR_TOKEN}' || true)\nfi\ncat <<EOF | oc apply -f -\napiVersion: v1\nkind: Secret\nmetadata:\n  name: workspace-sonar-credentials\n  namespace: wksp-ai-developer\n  labels:\n    controller.devfile.io/mount-to-devworkspace: \"true\"\n    controller.devfile.io/watch-secret: \"true\"\n  annotations:\n    controller.devfile.io/mount-as: env\ntype: Opaque\ndata:\n  SONAR_HOST:\
          \ ${HOST}\n  SONAR_TOKEN: ${TOKEN}\nEOF\necho \"workspace-sonar-credentials provisioned\"\nif [ -n \"${PREV}\" ] && [ \"${PREV}\" != \"${TOKEN}\" ]; then\n  echo \"O-SONARMIRROR: token updated; existing workspaces continue until their normal restart\"\nfi\n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-workspace-sonar-credentials
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '18'
spec:
  schedule: '*/10 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: workspace-sonar-credentials-provisioner
          restartPolicy: Never
          containers:
          - name: provision
            image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - -c
            - "set -euo pipefail\nif ! oc get secret sonarqube-credentials -n app-platform-build >/dev/null 2>&1; then\n  echo \"source sonarqube-credentials absent \u2014 skipping\"\n  exit 0\nfi\nHOST=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.host}')\nTOKEN=$(oc get secret sonarqube-credentials -n app-platform-build -o jsonpath='{.data.token}')\nPREV=\"\"\nif oc get secret workspace-sonar-credentials -n wksp-ai-developer >/dev/null 2>&1; then\n  PREV=$(oc get secret workspace-sonar-credentials -n wksp-ai-developer \\\n    -o jsonpath='{.data.SONAR_TOKEN}' || true)\nfi\ncat <<EOF | oc apply -f -\napiVersion: v1\nkind: Secret\nmetadata:\n  name: workspace-sonar-credentials\n  namespace: wksp-ai-developer\n  labels:\n    controller.devfile.io/mount-to-devworkspace: \"true\"\n    controller.devfile.io/watch-secret: \"true\"\n  annotations:\n    controller.devfile.io/mount-as: env\ntype: Opaque\ndata:\n  SONAR_HOST: ${HOST}\n  SONAR_TOKEN: ${TOKEN}\nEOF\n\
              if [ \"${PREV}\" = \"${TOKEN}\" ]; then\n  echo \"O-SONARMIRROR: workspace token already matches platform \u2014 no bounce\"\n  exit 0\nfi\necho \"O-SONARMIRROR: token updated; existing workspaces continue until their normal restart\"\n"
