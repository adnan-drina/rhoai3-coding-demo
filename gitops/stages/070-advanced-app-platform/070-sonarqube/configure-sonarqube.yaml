---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-configure-sonarqube
  namespace: sonarqube
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '11'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1200
  template:
    spec:
      serviceAccountName: job-configure-sonarqube
      restartPolicy: Never
      containers:
      - name: configure
        image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          SONAR="http://sonarqube.sonarqube.svc:9000"
          GATE="AI Platform Gate"

          echo "Waiting for SonarQube API..."
          up=""
          for i in $(seq 1 60); do
            status=$(curl -s "${SONAR}/api/system/status" | grep -o '"status":"[A-Z]*"' || true)
            if [ "${status}" = '"status":"UP"' ]; then up=yes; break; fi
            echo "  not up yet (${i}/60): ${status:-no response}"
            sleep 10
          done
          [ -n "${up}" ] || { echo "ERROR: SonarQube did not come up"; exit 1; }

          # --- 1. Admin password ---
          ADMIN_PASS=$(python3 /scripts/bootstrap-admin.py)
          echo "Admin password verified against its preserved secret"
          AUTH="admin:${ADMIN_PASS}"

          # --- 2. Control token of the platform-provisioner technical user (Create Projects + Execute Analysis only) ---
          ADMIN_PASS="${ADMIN_PASS}" python3 /scripts/ensure-provisioner.py ADMIN_PASS

          # --- 3. Custom quality gate: fail on any new issue ---
          curl -s -u "${AUTH}" -X POST "${SONAR}/api/qualitygates/create" \
            --data-urlencode "name=${GATE}" >/dev/null || true
          conditions=$(curl -s -u "${AUTH}" \
            "${SONAR}/api/qualitygates/show?name=$(echo ${GATE} | sed 's/ /%20/g')")
          if ! echo "${conditions}" | grep -q '"metric":"new_violations"'; then
            curl -s -u "${AUTH}" -X POST "${SONAR}/api/qualitygates/create_condition" \
              --data-urlencode "gateName=${GATE}" \
              --data-urlencode "metric=new_violations" \
              --data-urlencode "op=GT" \
              --data-urlencode "error=0" >/dev/null
            echo "Gate condition added: new issues > 0 fails"
          else
            echo "Gate condition already present"
          fi
          curl -s -u "${AUTH}" -X POST "${SONAR}/api/qualitygates/set_as_default" \
            --data-urlencode "name=${GATE}" >/dev/null
          echo "'${GATE}' set as default quality gate"

          python3 /scripts/configure-sso.py
        volumeMounts:
        - name: admin-bootstrap
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: admin-bootstrap
        configMap:
          name: sonarqube-admin-bootstrap
