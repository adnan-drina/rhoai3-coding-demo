apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Slim variant of the Advanced Application Platform: everything except the
# MTA migration stack. Use when the autonomous-migration rung (stage 080)
# is not part of the demo — MTA is the heaviest single-rung component.
# RHDH OIDC brokers through the identity component's platform RHBK, so
# this overlay carries full RHDH sign-in without MTA.

resources:
  - ../../base/identity
  - ../../base/devspaces
  - ../../base/pipelines
  - ../../base/sonarqube
  - ../../base/rhdh
  - ../../base/coolstore
