apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-integrations-bootstrap
  namespace: gitlab-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '14'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: gitlab-integrations-bootstrap
      restartPolicy: Never
      containers:
      - name: configure
        image: quay.io/rhoai3-coding-demo/rhoai3-ws-080@sha256:0a69b62aff536713184641d409a7a8c13b3bce9d041cbdf3f63a7f0f4d2b5b30
        command:
        - python3
        - /bootstrap/bootstrap-scm.py
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      volumes:
      - name: bootstrap
        configMap:
          name: gitlab-bootstrap
