apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- network-policy.yaml
- argocd-reader.yaml
- buckets.yaml
- database-cache.yaml
- bootstrap.yaml
- integrations-bootstrap.yaml
- bootstrap-cleanup.yaml
- route.yaml
- generated
- serviceaccount-gitlab-app-nonroot.yaml
- role-gitlab-use-nonroot.yaml
- rolebinding-gitlab-use-nonroot.yaml
configMapGenerator:
- name: stage070-argocd-reader-setup
  namespace: openshift-gitops
  files:
  - configure-argocd-reader.py
- name: gitlab-bootstrap
  namespace: gitlab-system
  files:
  - secret_writer.py
  - bootstrap.py
  - bootstrap-oidc.py
  - bootstrap-scm.py
  - coolstore-runtime.json
