# RBAC cannot limit create by name; this policy limits which Secrets system:serviceaccount:gitlab-system:gitlab-integrations-bootstrap may create or update.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-integrations-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '11'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-integrations-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
  matchConditions:
  - name: principal
    expression: request.userInfo.username == 'system:serviceaccount:gitlab-system:gitlab-integrations-bootstrap'
  validations:
  - expression: "object.metadata.namespace + '/' + object.metadata.name in ['rhdh/gitlab-publisher', 'rhdh/gitlab-catalog-reader', 'rhdh/rhdh-gitlab', 'app-platform-build/gitlab-enroller', 'openshift-devspaces/gitlab-oauth-config', 'openshift-gitops/gitlab-platform-reader']"
    message: The GitLab integration hub writes only its named integration credentials
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: stage070-integrations-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '11'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-integrations-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  policyName: stage070-integrations-secrets
  validationActions: [Deny]
