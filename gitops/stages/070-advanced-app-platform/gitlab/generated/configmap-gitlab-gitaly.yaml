apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-gitaly
  namespace: gitlab-system
  labels:
    app: gitaly
    chart: gitaly-10.4.2
    release: gitlab
    heritage: Helm
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: developer-platform
  annotations:
    argocd.argoproj.io/sync-wave: '3'
data:
  configure: |
    set -e
    mkdir -p /init-secrets/gitaly /init-secrets/shell
    cp -v -r -L /init-config/.gitlab_shell_secret  /init-secrets/shell/.gitlab_shell_secret
    cp -v -r -L /init-config/gitaly_token  /init-secrets/gitaly/gitaly_token
  config.toml.tpl: |
    prometheus_listen_addr = ":9236"
    {% (`{"bin_dir":"/usr/local/bin","git":{"ignore_gitconfig":true,"use_bundled_binaries":true},"gitlab":{"secret_file":"/etc/gitlab-secrets/shell/.gitlab_shell_secret","url":"http://gitlab-webservice-default.gitlab-system.svc:8181/"},"gitlab-shell":{"dir":"/srv/gitlab-shell"},"graceful_restart_timeout":"25s","hooks":{"custom_hooks_dir":"/home/git/custom_hooks"},"listen_addr":":8075","logging":{"dir":"/var/log/gitaly","format":"json"}}` | data.JSON | data.ToTOML) %}

    # Storage configuration
    {% $storages := coll.Slice  "default" %}
    {% $hostid := index (.Env.HOSTNAME | strings.Split "-" | coll.Reverse) 0 %}
    {% $index := 0 %}
    {% if regexp.Match "^[0-9]+$" $hostid %}
      {% $index = conv.ToInt64 $hostid %}
    {% end %}
    {% if len $storages | lt $index %}
    [[storage]]
    name = "{% index $storages $index %}"
    path = "/home/git/repositories"
    {% else %}
    {% printf "Storage for node %d is not present in the storageNames array. Did you use kubectl to scale up? You need to solely use helm for this purpose." $index | fail %}
    {% end %}

    [auth]
    token = {% file.Read "/etc/gitlab-secrets/gitaly/gitaly_token" | strings.TrimSpace | data.ToJSON %}
