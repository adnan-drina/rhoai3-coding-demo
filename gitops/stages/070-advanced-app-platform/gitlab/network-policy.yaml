# Namespace ingress boundaries; egress is deliberately not changed.
# Ref: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/network_security/network-policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ingress
  namespace: gitlab-system
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: platform-ingress
    app.kubernetes.io/component: network-boundary
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ''
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
