# Project analysis tokens are mirrored by the trusted enrollment coordinator,
# targeted to one workspace. No namespace-wide administrator token automount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '13'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: workspace-sonar-credentials-writer
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
rules:
# Writes are limited by the stage070-workspace-scanner-secrets admission policy (*-sonar-credentials).
# get stays namespace-wide: `oc patch` reads the object first, and per-project names cannot be listed
# in resourceNames. Residual risk: the coordinator can read other Secrets in the persona namespaces.
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: '13'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: workspace-sonar-credentials-writer
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-writer
subjects:
- kind: ServiceAccount
  name: project-provisioner
  namespace: app-platform-build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-admin
  annotations:
    argocd.argoproj.io/sync-wave: '13'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: workspace-sonar-credentials-writer
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
rules:
# Writes are limited by the stage070-workspace-scanner-secrets admission policy (*-sonar-credentials).
# get stays namespace-wide: `oc patch` reads the object first, and per-project names cannot be listed
# in resourceNames. Residual risk: the coordinator can read other Secrets in the persona namespaces.
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sonar-credentials-writer
  namespace: wksp-ai-admin
  annotations:
    argocd.argoproj.io/sync-wave: '13'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: workspace-sonar-credentials-writer
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-sonar-credentials-writer
subjects:
- kind: ServiceAccount
  name: project-provisioner
  namespace: app-platform-build
