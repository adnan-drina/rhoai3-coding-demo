apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: '10'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/component: backend
spec:
  components:
    cheServer:
      debug: false
      logLevel: INFO
    dashboard: {}
    devWorkspace: {}
    devfileRegistry: {}
    pluginRegistry:
      openVSXURL: https://open-vsx.org
    metrics:
      enable: true
  containerRegistry: {}
  devEnvironments:
    startTimeoutSeconds: 1200
    secondsOfInactivityBeforeIdling: -1
    maxNumberOfRunningWorkspacesPerUser: 3
    allowedSources:
      urls:
      - https://gitlab.pending.invalid/rhoai-workloads/*
    storage:
      pvcStrategy: per-workspace
      perWorkspaceStrategyPvcConfig:
        claimSize: 20Gi
        storageClass: gp3-csi
    defaultNamespace:
      autoProvision: true
    persistUserHome:
      enabled: true
    containerResourceCaps:
      limits:
        cpu: '6'
        memory: 12Gi
  networking: {}
