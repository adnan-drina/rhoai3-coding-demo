apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev Spaces component (moved from the former assisted-development stage
# base). OpenShift Dev Spaces with Kilo Code AI code assistant, persona
# namespaces, the Stage 070 `agentic-coolstore` catalog seat, and MaaS API
# key provisioning. Stages 070/080 factory workspaces come from RHDH
# templates, not standing GitOps DevWorkspaces.
# Ref: https://docs.redhat.com/en/documentation/red_hat_openshift_dev_spaces/

resources:
  - subscription.yaml
  - maas-key-secret-policy.yaml
  - wait-for-operator-webhook.yaml
  - checluster.yaml
  - repair-devworkspace-sync-options.yaml
  - maas-api-key-provisioning.yaml
  - workspace-maas-model-endpoint.yaml
  - migration-workspace-maas-egress-networkpolicy.yaml
  - workspace-api-egress-adminnetworkpolicy.yaml
  - workspace-sonar-credentials.yaml
  - migration-run-resources-rbac.yaml
  - migration-workspace-name-policy.yaml
  - migration-workspace-name-binding.yaml
  # Specimen fixture identities (ADR-014). Never automounted: the platform
  # provisioner copies its keys into each run's own exactly-bound secret.
  - migration-fixture-credentials-source.yaml
  # Per-run migration resources are not declared here; they are rendered by
  # pipelines/build/task-provision-migration-run.yaml.
  - vscode-editor-configurations.yaml
  - workspaces.yaml
  - agentic-workspace.yaml

# B4 / R1: the ONE declared model profile table (model-profiles.json). dest-init
# generates every model-dependent worker setting from it; the migration-run
# provisioner copies it, per run, into that run's read-only run control as the
# run's PINNED profile, so a later change here never alters a run in flight.
# Mounted read-only into workspaces at /etc/rhoai3/model-profiles; mount-on-start
# keeps a change from restarting running workspaces. A fixed name (no hash
# suffix) because the provisioner reads it by name.
configMapGenerator:
- name: migration-model-profiles
  namespace: wksp-ai-developer
  files:
  - model-profiles.json
  options:
    disableNameSuffixHash: true
    labels:
      controller.devfile.io/mount-to-devworkspace: "true"
      controller.devfile.io/watch-configmap: "true"
      rhoai3.io/purpose: model-profiles
    annotations:
      argocd.argoproj.io/sync-wave: "17"
      controller.devfile.io/mount-as: file
      controller.devfile.io/mount-path: /etc/rhoai3/model-profiles
      controller.devfile.io/mount-on-start: "true"
# The typed Secret writer the MaaS key provisioner pipes into (copy of pipelines/gitlab/secret_writer.py).
- name: stage070-secret-writer
  namespace: wksp-ai-developer
  files:
  - secret_writer.py

# Only declarative Secret placeholders use Argo's argocd-controller SSA manager.
# The Application disables the client-apply migration bridge; runtime writers
# remain named create/merge-patch and ignored data stays with its producer.
patches:
- target:
    kind: Secret
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-options
      value: ServerSideApply=true
