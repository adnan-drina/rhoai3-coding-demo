# RBAC cannot limit create by name; this policy limits which Secrets system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner may create or update.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-workspace-maas-key-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '16'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: stage070-workspace-maas-key-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ['']
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [secrets]
  matchConditions:
  - name: principal
    expression: request.userInfo.username == 'system:serviceaccount:wksp-ai-developer:devspace-maas-key-provisioner'
  validations:
  - expression: "object.metadata.name == 'maas-devspace-api-keys'"
    message: The Dev Spaces key provisioner writes only maas-devspace-api-keys
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: stage070-workspace-maas-key-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '16'
  labels:
    app.kubernetes.io/part-of: devspaces
    app.kubernetes.io/name: stage070-workspace-maas-key-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  policyName: stage070-workspace-maas-key-secrets
  validationActions: [Deny]
