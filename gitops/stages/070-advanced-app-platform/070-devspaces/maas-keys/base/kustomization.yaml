apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-neutral base: the overlays (../developer, ../admin) set the persona namespace.
resources:
  - maas-key-provisioner.yaml
  - workspace-maas-model-endpoint.yaml
# The typed Secret writer the MaaS key provisioner pipes into (copy of pipelines/gitlab/secret_writer.py).
configMapGenerator:
  - name: stage070-secret-writer
    files:
      - secret_writer.py
