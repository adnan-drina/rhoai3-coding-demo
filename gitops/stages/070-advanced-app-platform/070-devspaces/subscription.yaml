# OpenShift Dev Spaces 3.30 "Deploy using GitOps and Argo CD": the Subscription lives in openshift-operators
# (AllNamespaces) with Automatic approval on `stable`; the CheCluster stays in openshift-devspaces.
# scripts/platform/check-operator-policy.py holds the qualified channel and minimum version.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devspaces
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  channel: stable
  installPlanApproval: Automatic
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
