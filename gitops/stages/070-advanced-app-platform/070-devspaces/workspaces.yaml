# Per-user workspace namespaces and RBAC.
#
# GitOps pre-provisions only the Stage 070 catalog seat
# (`agentic-workspace.yaml`: `coolstore-inventory-service` in wksp-ai-developer and
# wksp-ai-admin). Stages 070 and 080 create workspaces from RHDH factory
# templates at demo time. Standing getting-started-ai-coding and mca-coolstore
# DevWorkspaces were retired; agentic-coolstore became coolstore-inventory-service.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-kubeadmin
  namespace: wksp-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: "b64:a3ViZTphZG1pbg=="
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-ai-admin
  namespace: wksp-ai-admin
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ai-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wksp-edit-ai-developer
  namespace: wksp-ai-developer
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ai-developer
