  podSelector:
    matchExpressions:
      - key: controller.devfile.io/devworkspace_name
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-devspaces
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: internal-models
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-mta
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-servers
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector: {}
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
