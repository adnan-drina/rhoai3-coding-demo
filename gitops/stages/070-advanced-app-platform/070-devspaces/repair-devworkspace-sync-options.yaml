# Reconciles only the platform workspaces' declared sync option, replacing
# legacy Force/Replace values without deleting the valid GitOps annotation.
# DevWorkspace IDs and user start/stop lifecycle remain controller/user-owned.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-repair-devworkspace-sync-options
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "17"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-repair-devworkspace-sync-options
  annotations:
    argocd.argoproj.io/sync-wave: "17"
rules:
  - apiGroups: ["workspace.devfile.io"]
    resources: ["devworkspaces"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-repair-devworkspace-sync-options
  annotations:
    argocd.argoproj.io/sync-wave: "17"
subjects:
  - kind: ServiceAccount
    name: job-repair-devworkspace-sync-options
    namespace: openshift-devspaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: job-repair-devworkspace-sync-options
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-repair-devworkspace-sync-options
  namespace: openshift-devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "19"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    spec:
      serviceAccountName: job-repair-devworkspace-sync-options
      restartPolicy: Never
      containers:
        - name: repair
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              for namespace in wksp-ai-developer wksp-ai-admin; do
                for workspace in coolstore-inventory-service; do
                  identity=$(oc get devworkspace "$workspace" -n "$namespace" --ignore-not-found \
                    -o jsonpath='{.metadata.uid}')
                  if [ -z "$identity" ]; then
                    echo "No existing DevWorkspace ${namespace}/${workspace}; nothing to repair"
                    continue
                  fi
                  current=$(oc get devworkspace "$workspace" -n "$namespace" \
                    -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/sync-options}')
                  desired="SkipDryRunOnMissingResource=true"
                  if [ "$current" != "$desired" ]; then
                    echo "Reconciling declared DevWorkspace sync option for ${namespace}/${workspace}"
                    oc annotate devworkspace "$workspace" -n "$namespace" \
                      "argocd.argoproj.io/sync-options=${desired}" --overwrite
                  else
                    echo "DevWorkspace sync option already current for ${namespace}/${workspace}"
                  fi
                done
              done
