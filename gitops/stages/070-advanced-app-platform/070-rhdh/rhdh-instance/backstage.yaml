# RHDH Backstage instance — references app-config, dynamic plugins, and secrets.
# The operator creates the Route automatically (route.enabled defaults to true).
# Ref: https://docs.redhat.com/en/documentation/red_hat_developer_hub/1.10/html-single/configuring_red_hat_developer_hub/index
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # No LLM provider is configured for Developer Lightspeed: disable its flavour, which removes the chat UI and stops
  # the Operator from injecting the unconfigured lightspeed-core sidecar (RHDH 1.10, "Disable Developer Lightspeed for
  # RHDH by using the Operator").
  flavours:
    - name: lightspeed
      enabled: false
  # Prevent the RHDH first-boot migration surge-race. The operator's default
  # Deployment uses RollingUpdate with maxSurge 25% — which rounds UP to 1 extra
  # pod for this single replica. On a fresh/empty database that surge brings up
  # TWO backend pods that race each other's Backstage per-plugin DB migrations
  # and BOTH crash with `relation "casbin_rule" already exists` /
  # `…public_keys…migrations_lock already exists`; RHDH then sits 0/1 (route 503)
  # indefinitely (liveness passes, readiness never does — k8s never restarts it).
  # maxSurge:0 removes the old pod before starting the new one, so only ONE
  # migrator ever runs. (strategy.type: Recreate would also fix it, but the
  # operator keeps its base rollingUpdate block and yields an invalid Deployment
  # — "rollingUpdate may not be specified when type is Recreate".)
  deployment:
    patch:
      spec:
        strategy:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        # The OIDC auth provider reads the platform realm's discovery document once at startup and keeps a failed
        # read: when Keycloak is still starting (cluster resume), every sign-in returns 500 until the pod restarts.
        # Start the backend only after discovery answers 200 three times in a row.
        template:
          spec:
            initContainers:
              - name: wait-for-sso
                image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
                command:
                  - /bin/bash
                  - -c
                  - |
                    url="${RHBK_METADATA_URL%/}/.well-known/openid-configuration" ok=0
                    until (( ok >= 3 )); do
                      code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
                      if [[ "$code" == 200 ]]; then ok=$((ok + 1)); else ok=0; echo "waiting for ${url}: HTTP ${code}"; fi
                      sleep 5
                    done
                env:
                  - name: RHBK_METADATA_URL
                    valueFrom:
                      secretKeyRef:
                        name: rhdh-secrets
                        key: RHBK_METADATA_URL
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    extraFiles:
      mountPath: /opt/app-root/src
      configMaps:
        - name: rhdh-rbac-policies
          mountPath: /opt/app-root/src/rbac
          containers:
            - backstage-backend
        - name: catalog-runtime-rhdh
          mountPath: /opt/app-root/src/catalog
          containers:
            - backstage-backend
        # Cluster CA for the kubernetes plugin's caFile: the operator sets
        # automountServiceAccountToken false, so the usual
        # /var/run/secrets/... path does not exist in the pod.
        - name: kube-root-ca.crt
          mountPath: /opt/app-root/src/k8s-ca
          containers:
            - backstage-backend
    extraEnvs:
      envs:
        # RHDH bootstraps global-agent, which forces every https request
        # through its own agent and DROPS the kubernetes plugin's custom
        # agent (and its caFile CA) — observed live: "self-signed
        # certificate in certificate chain" on all Topology/CI/Kubernetes
        # queries despite correct caFile config. Adding the cluster CA to
        # Node's trust store fixes every path without disabling TLS
        # (the upstream reference project used NODE_TLS_REJECT_UNAUTHORIZED=0
        # instead — a global TLS off-switch we deliberately avoid).
        - name: NODE_EXTRA_CA_CERTS
          value: /opt/app-root/src/k8s-ca/ca.crt
      secrets:
        - name: rhdh-secrets
        - name: rhdh-gitlab
