apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: migrate-with-mta
  title: Migrate an application with MTA
  description: "Migrates a Java application built with Maven to the target you choose\n(Quarkus, Spring Boot on Red Hat Runtimes, Jakarta EE 9, OpenJDK 21, Camel 4\nor containerization). Copies your repository into a new one of your own and\nopens it in a Dev Spaces workspace with the migration toolkit for\napplications (MTA) 8.3 extension and an analysis profile for that target;\nDeveloper Lightspeed for MTA proposes fixes in agent mode with your own\nModels-as-a-Service key. Registered in the catalog and provisioned with its\nown namespace and delivery pipeline (SonarQube quality gate included).\n"
  tags:
  - golden-path
  - migration
  - mta
  - java
  - maven
spec:
  owner: ai-modernization-team
  type: service
  parameters:
  - title: Migration project
    required:
    - repoUrl
    - name
    - target
    properties:
      repoUrl:
        title: Git repository URL
        type: string
        description: 'HTTPS URL of a Java application built with Maven that packages as a
          runnable jar, on GitHub or the platform GitLab (e.g.
          https://github.com/my-org/my-service.git). Its default branch is copied; the source
          repository stays unchanged.

          '
        pattern: ^https://[A-Za-z0-9.-]+(:[0-9]+)?/[A-Za-z0-9._~/-]*[A-Za-z0-9_~-]$
        ui:autofocus: true
      name:
        title: Project name
        type: string
        description: 'Name of the new repository, workspace and namespace for the migrated
          service. Lowercase letters, numbers, and hyphens.

          '
        pattern: ^[a-z][a-z0-9-]{2,40}$
      target:
        title: Migration target
        type: string
        description: 'Where the application should go. The template writes an MTA analysis
          profile with the rules for this target (MTA 8.3 supported migration paths).

          '
        default: quarkus
        enum:
        - quarkus
        - rhr
        - jakarta-ee9
        - openjdk21
        - camel4
        - cloud-readiness
        enumNames:
        - Quarkus
        - Spring Boot on Red Hat Runtimes
        - Jakarta EE 9
        - OpenJDK 21
        - Camel 4
        - Containerization (cloud readiness)
  steps:
  - id: platform-entity
    name: Read platform link endpoints from the catalog
    action: catalog:fetch
    input:
      entityRef: component:default/coolstore-inventory-service
  - id: fetch-legacy
    name: Copy the application (default branch)
    action: fetch:plain
    input:
      url: ${{ parameters.repoUrl.slice(0, -4) if parameters.repoUrl.endsWith('.git') else parameters.repoUrl }}
  - id: add-catalog-info
    name: Add the workspace, catalog and delivery files
    action: fetch:template
    input:
      url: ./skeleton
      replace: true
      values:
        name: ${{ parameters.name }}
        target: ${{ parameters.target }}
        legacyRepoUrl: ${{ parameters.repoUrl.slice(0, -4) if parameters.repoUrl.endsWith('.git') else parameters.repoUrl }}
        sonarqubeUrl: ${{ steps['platform-entity'].output.entity.metadata.links[3].url | replace('coolstore-inventory-service', parameters.name) }}
        devspacesUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/devspaces-base-url'] }}/#${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-base-url'] }}/${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}/${{ parameters.name }}?revision=main&existing=${{ parameters.name }}
        gitlabBaseUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-base-url'] }}
        gitlabGroup: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}
  - id: publish
    name: Publish private repository to GitLab
    action: publish:gitlab
    input:
      repoUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-host'] }}?owner=${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-workload-group'] }}&repo=${{ parameters.name }}
      defaultBranch: main
      settings:
        description: 'Java application migrated with MTA'
        visibility: private
        topics:
        - rhoai3-golden-path
        - rhoai3-scaffolded
        - rhoai3-mta-migration
  - id: enroll
    name: Request platform enrollment of the immutable first commit
    action: gitlab:issues:create
    input:
      repoUrl: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-host'] }}?owner=rhoai-platform&repo=platform-enrollment
      projectId: ${{ steps['platform-entity'].output.entity.metadata.annotations['rhoai3.redhat.com/gitlab-registration-project-id'] | int }}
      title: Enroll ${{ parameters.name }}
      labels: platform-enrollment
      confidential: true
      description: '{"project_id": ${{ steps.publish.output.projectId }}, "initial_commit": "${{ steps.publish.output.commitHash }}", "kind": "application", "requester": "${{ user.ref }}"}'
  output:
    links:
    - title: Source repository
      url: ${{ steps.publish.output.remoteUrl }}
    - title: Open in catalog
      icon: catalog
      entityRef: component:default/${{ parameters.name }}
    text:
    - title: Next steps
      content: "The publish above requested platform enrollment. The catalog discovers your project automatically; Argo CD is\ncreating the `<name>-dev` namespace with the project's own delivery\npipeline, and the first build runs the application as it is.\n\nOpen the repository from the component page's **Dev Spaces** link. The\nworkspace opens this repository as its only folder, with MTA Core, the\nMTA Java extension, the analyzer and Developer Lightspeed for MTA ready:\nagent mode is on and uses your Models-as-a-Service key, with no sign-in.\nIn the MTA view select the **Migrate to ...** profile (added to the repository\nby this template for your target), click **Start**, then **Run Analysis**,\nand ask for fixes. Every push to `main` runs the project's own\npipeline in `<name>-dev` with the SonarQube quality gate.\n"
