schemaVersion: 2.2.2
metadata:
  name: ${{ values.name }}
attributes:
  # Per-workspace PVC, like the other golden-path workspaces: the per-user
  # claim is RWO and multi-attaches when a second workspace starts.
  controller.devfile.io/storage-type: per-workspace
# The project is this repository (the Dev Spaces link clones it). It is the
# only folder in the workspace: MTA analyzes the first workspace folder and
# writes its output under .vscode/ there, so it must be writable. Che Code
# opens the repository's own .code-workspace (one project), which carries
# the MTA and Java settings.
components:
  - name: development-tooling
    container:
      # Stage 140 workspace image: Dev Spaces UDI 3.29.1 with MTA Core 8.3.3,
      # MTA Java 8.3.3, Language Support for Java 1.58.0 and the MTA 8.3.3
      # analyzer RPC, checksum-verified at build time
      # (stages/140-mta-assisted-migration/workspace-image). Public repository.
      image: quay.io/rhoai3-coding-demo/rhoai3-ws-140@sha256:9666903d63e6db7a7e86d839211f3d8bf452e4acc17195cf5d66c439d6a265e9
      mountSources: true
      # MTA documents 8 GB of RAM for the extension, analyzer and Java
      # language server together.
      memoryRequest: 2Gi
      memoryLimit: 12Gi
      cpuRequest: 500m
      cpuLimit: 2500m
      env:
        - name: MAVEN_OPTS
          value: "-Dmaven.repo.local=/home/user/.m2/repository"
        - name: QUARKUS_ANALYTICS_DISABLED
          value: "true"
        # Install MTA Core and the Java language extension from the baked,
        # checksum-verified files (MTA 8.3: Core plus one language extension).
        - name: DEFAULT_EXTENSIONS
          value: "/opt/rhoai3/extensions/mta-core.vsix;/opt/rhoai3/extensions/java.vsix;/opt/rhoai3/extensions/mta-java.vsix"
        # Developer Lightspeed for MTA calls the platform's Models-as-a-Service
        # endpoint directly with the developer's own MaaS key (MTA 8.3 "agent
        # AI mode without the LLM proxy"); no MTA Hub sign-in. The key comes
        # from the workspace-maas-credentials Secret that Stage 070 mounts
        # into every workspace as environment variables; the kubelet expands
        # $(MAAS_API_KEY) because mounted Secrets load before env entries.
        # The extension merges the workspace environment into the provider
        # settings, so the key is never written to a file.
        - name: OPENAI_API_KEY
          value: "$(MAAS_API_KEY)"
      volumeMounts:
        - name: m2
          path: /home/user/.m2
      endpoints:
        - name: app
          targetPort: 8080
          exposure: public
          secure: false
          protocol: https
        - name: debug
          targetPort: 5005
          exposure: none
          secure: false
          protocol: tcp
  - name: m2
    volume:
      size: 2G
commands:
  - id: java21-default
    exec:
      component: development-tooling
      commandLine: |
        # Terminals default to Java 21, the newest JDK in the image: the
        # supported MTA 8.3 targets run on it.
        if [ -x "${JAVA_HOME_21}/bin/java" ] && ! grep -q "rhoai3-coding-demo: java 21 default" "${HOME}/.bashrc" 2>/dev/null; then
          printf '\n# rhoai3-coding-demo: java 21 default\nexport JAVA_HOME="%s"\nexport PATH="$JAVA_HOME/bin:$PATH"\n' \
            "${JAVA_HOME_21}" >> "${HOME}/.bashrc"
        fi
  - id: mta-provider-settings
    exec:
      component: development-tooling
      commandLine: |
        # Developer Lightspeed for MTA reads its model from
        # provider-settings.yaml in the extension's global storage (MTA 8.3,
        # "LLM provider setting configurations"). Write it at every start,
        # before the editor activates the extension, with the MaaS endpoint
        # and model from the workspace environment. The API key stays in the
        # environment (OPENAI_API_KEY); CA_BUNDLE is the cluster trust bundle.
        settings=/checode/remote/data/User/globalStorage/redhat.mta-core/settings
        mkdir -p "$settings"
        printf '%s\n' \
          '# Written by the workspace at every start (devfile command mta-provider-settings).' \
          'models:' \
          '  maas: &active' \
          '    environment:' \
          '      CA_BUNDLE: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem' \
          '    provider: ChatOpenAI' \
          '    args:' \
          "      model: \"${MAAS_MODEL_NAME}\"" \
          '      configuration:' \
          "        baseURL: \"${MAAS_API_BASE_URL}\"" \
          'active: *active' > "$settings/provider-settings.yaml"
  - id: package
    exec:
      label: "Package"
      component: development-tooling
      workingDir: ${PROJECT_SOURCE}
      commandLine: 'export JAVA_HOME="${JAVA_HOME_21:-${JAVA_HOME}}" && export PATH="${JAVA_HOME}/bin:${PATH}" && mvn -q -DskipTests package'
      group:
        kind: build
        isDefault: true
  - id: test
    exec:
      label: "1. Run tests"
      component: development-tooling
      workingDir: ${PROJECT_SOURCE}
      commandLine: 'export JAVA_HOME="${JAVA_HOME_21:-${JAVA_HOME}}" && export PATH="${JAVA_HOME}/bin:${PATH}" && mvn -q test'
      group:
        kind: test
        isDefault: true
  - id: run-jar
    exec:
      label: "2. Package and run the application"
      component: development-tooling
      workingDir: ${PROJECT_SOURCE}
      # Runs what the pipeline image runs (see Containerfile): a Quarkus
      # fast-jar once there is one, otherwise the single jar in target/.
      commandLine: |
        export JAVA_HOME="${JAVA_HOME_21:-${JAVA_HOME}}" && export PATH="${JAVA_HOME}/bin:${PATH}"
        mvn -q -DskipTests package || exit 1
        if [ -f target/quarkus-app/quarkus-run.jar ]; then
          exec java -jar target/quarkus-app/quarkus-run.jar
        fi
        set -- target/*.jar
        [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one application jar in target/" >&2; exit 1; }
        exec java -jar "$1"
      group:
        kind: run
{%- if values.target == "quarkus" %}
        isDefault: false
  - id: start-dev
    exec:
      label: "3. Run in Quarkus dev mode"
      component: development-tooling
      workingDir: ${PROJECT_SOURCE}
      commandLine: 'export JAVA_HOME="${JAVA_HOME_21:-${JAVA_HOME}}" && export PATH="${JAVA_HOME}/bin:${PATH}" && mvn quarkus:dev -Dquarkus.http.host=0.0.0.0'
      group:
        kind: run
        isDefault: true
{%- else %}
        isDefault: true
{%- endif %}
events:
  postStart:
    - java21-default
    - mta-provider-settings
