# MTA analysis profile for the migration target chosen in the Developer Hub
# template. The label selector uses the target labels of the MTA 8.3 rule
# sets; a label without a version matches every versioned rule of that
# target (quarkus matches quarkus3+). "discovery" adds the technology tags.
# A target label can name a small rule set: rhr holds only the Spring Boot
# version checks, so Red Hat Runtimes also selects the spring-boot rules
# (Spring Boot 2 to 3 and 3 to 4).
{%- set titles = {
  "quarkus": "Quarkus",
  "rhr": "Spring Boot on Red Hat Runtimes",
  "spring-boot2-to-spring-boot3": "Spring Boot 2 to Spring Boot 3",
  "jakarta-ee9": "Jakarta EE 9",
  "openjdk21": "OpenJDK 21",
  "camel4": "Camel 4",
  "cloud-readiness": "Containerization (cloud readiness)"
} %}
{%- set selectors = {
  "quarkus": "konveyor.io/target=quarkus || konveyor.io/target=jakarta-ee",
  "rhr": "konveyor.io/target=rhr || konveyor.io/target=spring-boot",
  "spring-boot2-to-spring-boot3": "konveyor.io/target=spring-boot2-to-spring-boot3",
  "jakarta-ee9": "konveyor.io/target=jakarta-ee9",
  "openjdk21": "konveyor.io/target=openjdk21",
  "camel4": "konveyor.io/target=camel4",
  "cloud-readiness": "konveyor.io/target=cloud-readiness"
} %}
metadata:
  name: "Migrate to ${{ titles[values.target] }}"
  id: "migration-target"
  readonly: false
  source: local
spec:
  labelSelector: "(${{ selectors[values.target] }}) || (discovery)"
  customRules: []
  useDefaultRules: true
