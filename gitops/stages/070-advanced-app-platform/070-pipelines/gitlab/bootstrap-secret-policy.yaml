apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: stage070-bootstrap-secrets
  annotations:
    argocd.argoproj.io/sync-wave: '12'
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: stage070-bootstrap-secrets
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - secrets
  matchConditions:
  - name: bootstrap-principal
    expression: request.userInfo.username.startsWith('system:serviceaccount:') &&
      request.userInfo.username.endsWith(':project-enrollment')
  validations:
  - expression: (object.metadata.namespace == request.userInfo.username.split(':')[2]
      && object.metadata.name in ['gitlab-read-source','gitlab-webhook','gitlab-delivery-writer','sonarqube-credentials'])
      || (object.metadata.namespace == 'openshift-gitops' && object.metadata.name
      == 'gitlab-delivery-reader-' + variables.projectName) || (object.metadata.namespace
      == 'app-platform-build' && object.metadata.name == 'migration-source-' + variables.projectName)
    message: Bootstrap can write only its own registered project credentials
  variables:
  - name: projectName
    expression: 'request.userInfo.username.split('':'')[2] == ''coolstore-dev'' ?
      ''coolstore-inventory-service'' : request.userInfo.username.split('':'')[2].substring(0,
      request.userInfo.username.split('':'')[2].size()-4)'
