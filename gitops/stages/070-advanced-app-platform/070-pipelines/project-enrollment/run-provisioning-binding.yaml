apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: unassigned.runs
  annotations:
    argocd.argoproj.io/sync-wave: '20'
  namespace: app-platform-build
  labels:
    app.kubernetes.io/part-of: developer-platform
    app.kubernetes.io/name: unassigned.runs
    app.kubernetes.io/component: authorization
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: unassigned.runs
subjects:
- kind: ServiceAccount
  name: project-enrollment
  namespace: unassigned-dev
# The provisioning PipelineRun runs as migration-run-provisioner and reads this run's declaration through the
# migration-source-<run> reader token; without this subject the request is unreadable and no board protocol is selected.
- kind: ServiceAccount
  name: migration-run-provisioner
  namespace: app-platform-build
