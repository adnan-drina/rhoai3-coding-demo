# Demo persona access to the build namespace.
# ai-developer (via the GitOps-managed rhoai-developers group) can watch
# pipeline runs and logs in the console — the demo's "gate catches the AI"
# beat happens here. ai-admin administers the namespace (re-runs, secrets,
# troubleshooting during a live demo).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-developers-view
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: rhoai-developers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-admin-admin
  namespace: app-platform-build
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ai-admin
