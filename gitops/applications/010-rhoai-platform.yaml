---
# OpenShift AI DSCI, DSC, Auth and dashboard configuration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 010-rhoai-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    app.kubernetes.io/name: rhoai-platform
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '010'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/010-openshift-ai-platform-foundation"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-order: '2'
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/010-openshift-ai-platform-foundation/010-rhoai-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # Stage 010 creates the shared DSC. Later stages enable these component
    # fields with GitOps hook jobs so the base platform can validate cleanly
    # before GPU, model serving, and MaaS stages are deployed.
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      name: default-dsc
      jsonPointers:
        - /spec/components/mcplifecycleoperator
        - /spec/components/kueue
        - /spec/components/kserve
        - /spec/components/modelregistry
        - /spec/components/trustyai
        - /spec/components/mlflowoperator
        - /spec/components/aipipelines
        - /spec/components/aigateway
        - /spec/components/ogx
    # Later stages own selected discovery, Studio and evaluation fields;
    # foundation retains the shared CR and all undelegated configuration.
    - group: opendatahub.io
      kind: OdhDashboardConfig
      name: odh-dashboard-config
      namespace: redhat-ods-applications
      jsonPointers:
        - /spec/dashboardConfig/agentsCatalog
        - /spec/dashboardConfig/disableModelCatalog
        - /spec/dashboardConfig/disableModelRegistry
        - /spec/dashboardConfig/toolCalling
        - /spec/dashboardConfig/mcpCatalog
        - /spec/dashboardConfig/mcpRegistry
        - /spec/dashboardConfig/agentOps
        - /spec/dashboardConfig/genAiStudio
        - /spec/dashboardConfig/genAiTracing
        - /spec/dashboardConfig/modelAsService
        - /spec/dashboardConfig/vLLMDeploymentOnMaaS
        - /spec/dashboardConfig/externalModels
        - /spec/dashboardConfig/llmdTemplates
        - /spec/dashboardConfig/guardrails
        - /spec/dashboardConfig/agentConfigManagement
        - /spec/dashboardConfig/promptManagement
        - /spec/dashboardConfig/aiAssetCustomEndpoints
        - /spec/genAiStudioConfig
        - /spec/dashboardConfig/disableLMEval
        - /spec/dashboardConfig/globalProjectPrompts
        - /spec/globalMLflowNamespaces
