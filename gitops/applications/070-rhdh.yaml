# Red Hat Developer Hub with the generated software catalog and templates. Synced last: its catalog hook needs the GitLab mirror.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 070-rhdh
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    app.kubernetes.io/name: rhdh
    app.kubernetes.io/component: rhdh
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
  annotations:
    argocd.argoproj.io/sync-wave: '8'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/070-advanced-app-platform"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-order: '8'
    demo.rhoai.io/deploy-mode: sequential
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/070-advanced-app-platform/070-rhdh
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    - ClientSideApplyMigration=false
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: operators.coreos.com
    kind: OperatorGroup
    jsonPointers:
    - "/metadata/annotations/olm.providedAPIs"
  - group: operators.coreos.com
    kind: Subscription
    jsonPointers:
    - "/spec/startingCSV"
  - group: ''
    kind: Secret
    name: rhdh-secrets
    namespace: rhdh
    jsonPointers:
    - "/data"
  - group: console.openshift.io
    kind: ConsoleLink
    name: rhdh
    jsonPointers:
    - "/spec/href"
    - "/spec/applicationMenu/imageURL"
