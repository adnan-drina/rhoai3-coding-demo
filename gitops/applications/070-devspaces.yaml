# OpenShift Dev Spaces operator, CheCluster, persona workspaces and workspace model access.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 070-devspaces
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    app.kubernetes.io/name: devspaces
    app.kubernetes.io/component: devspaces
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '070'
  annotations:
    argocd.argoproj.io/sync-wave: '3'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/070-advanced-app-platform"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-order: '3'
    demo.rhoai.io/deploy-mode: sequential
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/070-advanced-app-platform/070-devspaces
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    - ClientSideApplyMigration=false
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: workspace.devfile.io
    kind: DevWorkspace
    jsonPointers:
    - "/spec/started"
    jqPathExpressions:
    - .spec.template.components[]?.container?.env[]? | select(.name == "HOST_USERS")
    - .spec.template.attributes."controller.devfile.io/devworkspace-config"
    - .spec.template.attributes."controller.devfile.io/scc"
  - group: org.eclipse.che
    kind: CheCluster
    name: devspaces
    namespace: openshift-devspaces
    jsonPointers:
    - "/spec/devEnvironments/allowedSources/urls"
    jqPathExpressions:
    - .spec.gitServices.gitlab[]? | select(.secretName == "gitlab-oauth-config") | .endpoint
  - group: workspace.devfile.io
    kind: DevWorkspace
    name: coolstore-inventory-service
    namespace: wksp-ai-developer
    jsonPointers:
    - "/spec/template/projects/0/git/remotes/origin"
  - group: workspace.devfile.io
    kind: DevWorkspace
    name: coolstore-inventory-service
    namespace: wksp-ai-admin
    jsonPointers:
    - "/spec/template/projects/0/git/remotes/origin"
