---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 040-maas-database
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    app.kubernetes.io/name: maas-database
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '4'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/040-governed-models-as-a-service"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-order: '2'
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/040-governed-models-as-a-service/040-maas-database
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: ''
    kind: Secret
    name: maas-postgres-credentials
    namespace: models-as-a-service-db
    jsonPointers:
    - "/data"
  - group: ''
    kind: Secret
    name: maas-db-config
    namespace: redhat-ai-gateway-infra
    jsonPointers:
    - "/data"
