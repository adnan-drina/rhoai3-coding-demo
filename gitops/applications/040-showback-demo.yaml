apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 040-showback-demo
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: showback-demo
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: argocd
    demo.rhoai.io/stage: '040'
  annotations:
    argocd.argoproj.io/sync-wave: '4'
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/040-governed-models-as-a-service/040-showback-demo
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-script: stages/040-governed-models-as-a-service/deploy.sh --component 040-showback-demo
    demo.rhoai.io/optional: 'true'
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/040-governed-models-as-a-service/040-showback-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  ignoreDifferences:
    # The OpenShift image trigger resolves the metering image to the digest of each in-cluster build.
    - group: apps
      kind: Deployment
      name: showback-external-metering
      namespace: redhat-ods-monitoring
      jqPathExpressions:
        - .spec.template.spec.containers[] | select(.name == "metering") | .image
  # A published source change must not activate this optional demo unattended.
  syncPolicy:
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
