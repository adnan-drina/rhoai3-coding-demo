---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 050-evaluation-content
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: '050'
    app.kubernetes.io/name: evaluation-content
    app.kubernetes.io/component: evaluation-content
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    argocd.argoproj.io/sync-wave: '5'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/050-model-evaluation"
    demo.rhoai.io/deploy-order: '4'
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/050-model-evaluation/evaluation-content
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
