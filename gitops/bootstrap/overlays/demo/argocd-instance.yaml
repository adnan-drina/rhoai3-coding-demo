apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # Project constraint: all demo Applications must use annotation-based resource tracking.
  # Source: AGENTS.md — resourceTrackingMethod MUST be annotation.
  resourceTrackingMethod: annotation
  # The expanded platform exceeded the earlier 4Gi controller limit during
  # Stage 070 reconciliation (OOMKilled, 2026-10-14). Reserve capacity for
  # its CRD-heavy cache; this sizing does not claim a memory-leak fix.
  controller:
    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi
  # Developer Hub's read-only Argo CD account. The operator creates it, stores its API token in the Secret
  # rhdh-local-user (key apiToken) and renews it (OpenShift GitOps "Managing local users in Argo CD").
  # Rotate with stages/070-advanced-app-platform/rotate-credentials.py --component argo; after an automatic renewal,
  # re-run the 070-rhdh hooks (stage-apps.sh sync 070 --app 070-rhdh --resync) so Developer Hub copies the new token.
  localUsers:
    - name: rhdh
      apiKey: true
      tokenLifetime: 2160h
      autoRenewToken: true
  extraConfig:
    # gp3-csi (default) uses WaitForFirstConsumer: PVCs stay Pending until a
    # pod mounts them, but consumers are scheduled in later sync waves. Treat
    # Pending as healthy so waves do not deadlock on unbound PVCs.
    resource.customizations.health.PersistentVolumeClaim: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Bound" then
          hs.status = "Healthy"
          hs.message = "Bound"
          return hs
        end
        -- Limitation: every Pending claim reads Healthy, including a missing StorageClass or failed provisioning
        -- (Lua cannot read the class's binding mode). Those failures surface on the consuming workload, which
        -- never becomes Healthy; storage readiness is never inferred from PVC health alone.
        if obj.status.phase == "Pending" then
          hs.status = "Healthy"
          hs.message = "Pending; WaitForFirstConsumer binds on first pod"
          return hs
        end
        if obj.status.phase == "Lost" then
          hs.status = "Degraded"
          hs.message = "Lost"
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for PVC status"
      return hs
    resource.customizations.health.operators.coreos.com_Subscription: |
      hs = {status = "Progressing", message = "Waiting for native OLM resolution"}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if (c.type == "CatalogSourcesUnhealthy" or c.type == "ResolutionFailed") and c.status == "True" then
              return {status = "Degraded", message = c.message or c.type}
            end
          end
        end
        if obj.status.installedCSV ~= nil and obj.status.installedCSV == obj.status.currentCSV and obj.status.state == "AtLatestKnown" then
          return {status = "Healthy", message = "Current native CSV resolved; stage validator checks Succeeded/version"}
        end
      end
      return hs
    # Native MLflow health requires availability and current operator/migration reconciliation.
    resource.customizations.health.mlflow.opendatahub.io_MLflow: |
      hs = {status = "Progressing", message = "Waiting for Available and current MLflowOperatorReady conditions"}
      local available = false
      local current = false
      local migrated = false
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Available" then
            available = condition.status == "True"
          elseif condition.type == "Migration" then
            migrated = condition.status == "True" and (condition.observedGeneration or 0) >= obj.metadata.generation
          elseif condition.type == "MLflowOperatorReady" then
            current = condition.status == "True" and (condition.observedGeneration or 0) >= obj.metadata.generation
          end
        end
      end
      if available and current and migrated then
        hs.status = "Healthy"
        hs.message = "MLflow Available with current operator reconciliation"
      end
      return hs
  rbac:
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, rhoai-gitops-admins, role:admin
      p, role:rhdh-reader, applications, get, rhoai-demo/*, allow
      p, role:rhdh-reader, applications, get, runtime-projects/*, allow
      p, role:rhdh-reader, applications, get, platform-projects/*, allow
      g, rhdh, role:rhdh-reader
    scopes: '[groups]'
  server:
    route:
      enabled: true
  sso:
    dex:
      openShiftOAuth: true
    provider: dex
