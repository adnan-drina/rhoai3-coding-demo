apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 050-advanced-app-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: "050"
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/manifest-generate-paths: gitops/stages/050-advanced-app-platform
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/050-advanced-app-platform/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideDiff=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Namespace
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /metadata/annotations
        - /spec/startingCSV
    - group: ""
      kind: Secret
      name: rhdh-secrets
      namespace: rhdh
      jsonPointers:
        - /data
    - group: console.openshift.io
      kind: ConsoleLink
      name: rhdh
      jsonPointers:
        - /spec/href
        - /spec/applicationMenu/imageURL
    # Developers and Dev Spaces toggle started at runtime. Keep the rest of the
    # DevWorkspace spec GitOps-owned so workspace definitions can be updated.
    # The devworkspace-controller also injects a HOST_USERS=true env var into the
    # tooling container while the workspace is RUNNING (and removes it when
    # stopped), so it can be declared in neither state without drifting the other.
    # Ignore just that one controller-owned entry — by value, not list index, so
    # it holds for every workspace regardless of component/env ordering.
    # HUB_URL is set directly to the stable internal cluster service URL
    # (http://mta-ui.openshift-mta.svc.cluster.local:8080) in workspaces.yaml,
    # so no PostSync patching or ignoreDifferences for HUB_URL is needed.
    - group: workspace.devfile.io
      kind: DevWorkspace
      jsonPointers:
        - /spec/started
      jqPathExpressions:
        - '.spec.template.components[]?.container?.env[]? | select(.name == "HOST_USERS")'
    # The patch-coolstore-image PostSync hook rewrites this deployment's image to
    # the deployer's ${IMAGE_REGISTRY}. Ignore the field so Argo keeps the hook's
    # value instead of reverting to the git default (portable installs).
    - group: apps
      kind: Deployment
      name: coolstore-inventory-service
      namespace: coolstore-dev
      jsonPointers:
        - /spec/template/spec/containers/0/image
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
    - group: ""
      kind: Secret
      name: kai-api-keys
      namespace: openshift-mta
      jsonPointers:
        - /data
    - group: tackle.konveyor.io
      kind: Tackle
      name: mta
      namespace: openshift-mta
      jsonPointers:
        - /spec/kai_llm_baseurl
    - group: console.openshift.io
      kind: ConsoleLink
      name: mta
      jsonPointers:
        - /spec/href
        - /spec/applicationMenu/imageURL
    - group: oauth.openshift.io
      kind: OAuthClient
      name: mta-keycloak
      jsonPointers:
        - /secret
        - /redirectURIs
