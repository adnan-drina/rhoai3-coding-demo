---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 020-gpu-machinesets
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: '020'
    app.kubernetes.io/name: gpu-machinesets
    app.kubernetes.io/component: machine-pools
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/manifest-generate-paths: "/gitops/stages/020-gpu-infrastructure-private-ai"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
    demo.rhoai.io/deploy-order: '3'
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/020-gpu-infrastructure-private-ai/gpu-machinesets
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-h100-us-east-2a
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-h100-us-east-2b
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-h100-us-east-2c
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-rtxpro6000-us-east-2a
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-rtxpro6000-us-east-2b
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-rtxpro6000-us-east-2c
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
  - group: machine.openshift.io
    kind: MachineSet
    name: ocp-wzxl7-gpu-us-east-2a
    namespace: openshift-machine-api
    jsonPointers:
    - "/spec/replicas"
