apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-gateway-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "040"
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/040-governed-models-as-a-service/mcp-gateway-platform
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/040-governed-models-as-a-service/mcp-gateway-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-gateway-system
  syncPolicy:
    syncOptions: [RespectIgnoreDifferences=true]
    retry:
      limit: 10
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
