apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 040-governed-models-as-a-service
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: "040"
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: gitops/stages/040-governed-models-as-a-service/base
spec:
  project: rhoai-demo
  source:
    # repoURL and targetRevision are set by deploy.sh from .env (GIT_REPO_URL, GIT_REPO_BRANCH)
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/040-governed-models-as-a-service/base
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideDiff=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: maas-postgres-credentials
      namespace: models-as-a-service-db
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: maas-db-config
      namespace: redhat-ods-applications
      jsonPointers:
        - /data
    # Intentional scale operations (cost shutdown per env-manage-resources)
    # set spec.replicas live; selfHeal must not restart the GPU model.
    - group: serving.kserve.io
      kind: LLMInferenceService
      name: gemma-4-26b-a4b
      namespace: models-as-a-service
      jsonPointers:
        - /spec/replicas
