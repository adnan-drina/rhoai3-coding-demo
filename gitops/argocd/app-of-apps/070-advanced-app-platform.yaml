apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 070-advanced-app-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    app.kubernetes.io/instance: openshift-gitops
    demo.rhoai.io/stage: '070'
  annotations:
    argocd.argoproj.io/sync-wave: '70'
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/070-advanced-app-platform
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/070-advanced-app-platform/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideDiff=true
    - SkipDryRunOnMissingResource=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: ''
    kind: ConfigMap
    name: pipeline-registry-ca
    jsonPointers:
    - /data
  - group: ''
    kind: Namespace
    jsonPointers:
    - /metadata/annotations
    - /metadata/labels
  - group: operators.coreos.com
    kind: OperatorGroup
    jsonPointers:
    - /metadata/annotations
  - group: operators.coreos.com
    kind: Subscription
    jsonPointers:
    - /metadata/annotations
    - /spec/startingCSV
  - group: ''
    kind: Secret
    name: rhdh-secrets
    namespace: rhdh
    jsonPointers:
    - /data
  - group: console.openshift.io
    kind: ConsoleLink
    name: rhdh
    jsonPointers:
    - /spec/href
    - /spec/applicationMenu/imageURL
  - group: workspace.devfile.io
    kind: DevWorkspace
    jsonPointers:
    - /spec/started
    jqPathExpressions:
    - .spec.template.components[]?.container?.env[]? | select(.name == "HOST_USERS")
    - .spec.template.attributes."controller.devfile.io/devworkspace-config"
    - .spec.template.attributes."controller.devfile.io/scc"
  - group: ''
    kind: PersistentVolumeClaim
    jsonPointers:
    - /spec
  - group: console.openshift.io
    kind: ConsoleLink
    name: mta
    jsonPointers:
    - /spec/href
    - /spec/applicationMenu/imageURL
  - group: oauth.openshift.io
    kind: OAuthClient
    name: platform-keycloak
    jsonPointers:
    - /secret
    - /redirectURIs
  - group: ''
    kind: ConfigMap
    namespace: gitlab-system
    name: gitlab-migrations
    jsonPointers:
    - /data/gitlab.yml.erb
    - /data/pages_redirect_uri
  - group: ''
    kind: ConfigMap
    namespace: gitlab-system
    name: gitlab-sidekiq
    jsonPointers:
    - /data/gitlab.yml.erb
  - group: ''
    kind: ConfigMap
    namespace: gitlab-system
    name: gitlab-toolbox
    jsonPointers:
    - /data/gitlab.yml.erb
  - group: ''
    kind: ConfigMap
    namespace: gitlab-system
    name: gitlab-webservice
    jsonPointers:
    - /data/gitlab.yml.erb
  - group: ''
    kind: ConfigMap
    name: gitlab-runtime-buckets
    namespace: gitlab-system
    jsonPointers:
    - /data/lfs
    - /data/artifacts
    - /data/uploads
    - /data/packages
    - /data/backups
    - /data/backup-tmp
  - group: org.eclipse.che
    kind: CheCluster
    name: devspaces
    namespace: openshift-devspaces
    jsonPointers:
    - /spec/devEnvironments/allowedSources/urls
    - /spec/gitServices/gitlab
  - group: tackle.konveyor.io
    kind: Tackle
    name: mta
    namespace: openshift-mta
    jsonPointers:
    - /spec/kai_llm_baseurl
  - group: konveyor.io
    kind: Gateway
    name: maas-qwen
    namespace: openshift-mta
    jsonPointers:
    - /spec/endpoint
  - group: rhtas.redhat.com
    kind: Securesign
    name: platform
    namespace: trusted-artifact-signer
    jsonPointers:
    - /spec/fulcio/config/oidcIssuers
  - group: workspace.devfile.io
    kind: DevWorkspace
    name: agentic-coolstore
    namespace: wksp-ai-developer
    jsonPointers:
    - /spec/template/projects/0/git/remotes/origin
  - group: workspace.devfile.io
    kind: DevWorkspace
    name: agentic-coolstore
    namespace: wksp-ai-admin
    jsonPointers:
    - /spec/template/projects/0/git/remotes/origin
