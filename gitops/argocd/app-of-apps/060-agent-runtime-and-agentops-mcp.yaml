apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-tools
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai3-coding-demo
    demo.rhoai.io/stage: "060"
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/060-agent-runtime-and-agentops/native-mcp
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: rhoai-demo
  source:
    repoURL: https://github.com/adnan-drina/rhoai3-coding-demo.git
    targetRevision: main
    path: gitops/stages/060-agent-runtime-and-agentops/native-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-servers
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
