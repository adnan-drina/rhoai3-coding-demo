      # OpenShift itself is not installed from Git. The NFD operator ships per OpenShift
      # minor, so its qualified minimum in the operator policy carries the platform minor.
      file: scripts/lib.sh
      field: OPERATOR_POLICY["nfd"]
      pattern: "\"nfd\": \\[\"[^\"]*\", \"(\\d+\\.\\d+)\\.\\d+"
