# Products cited by skills or component READMEs that have no skill family of
# their own. Their links are checked against docs_version like any product.
cited_products:
  monitoring_stack:
    name: Monitoring stack for Red Hat OpenShift
    docs_slug: monitoring_stack_for_red_hat_openshift
    docs_version: "4.22"
    pin:
      file: scripts/lib.sh
      field: OPERATOR_POLICY["nfd"]
      pattern: "\"nfd\": \\[\"[^\"]*\", \"(\\d+\\.\\d+)\\.\\d+"
  cluster_observability_operator:
    name: Red Hat OpenShift Cluster Observability Operator
    docs_slug: red_hat_openshift_cluster_observability_operator
    docs_version: "1-latest"
    pin:
      none: Rolling `stable` channel; Red Hat publishes this documentation only as 1-latest.
  opentelemetry:
    name: Red Hat build of OpenTelemetry
    docs_slug: red_hat_build_of_opentelemetry
    docs_version: "3.11"
    pin:
      none: Rolling `stable` channel; operator 0.158 maps to product 3.11 (bundle CPE metadata).
  distributed_tracing:
    name: Red Hat OpenShift distributed tracing platform
    docs_slug: red_hat_openshift_distributed_tracing_platform
    docs_version: "3.11"
    pin:
      none: Rolling `stable` channel; Tempo operator 0.22 maps to product 3.11 (bundle CPE metadata).
  openshift_gitops:
    name: Red Hat OpenShift GitOps
    docs_slug: red_hat_openshift_gitops
    docs_version: "1.21"
    pin:
      # JSON patch on the bootstrap Subscription; the operator policy repeats the channel.
      file: gitops/bootstrap/overlays/operator/patch-channel.yaml
      pattern: 'gitops-(\d+\.\d+)'
  keycloak:
    name: Red Hat build of Keycloak
    docs_slug: red_hat_build_of_keycloak
    docs_version: "26.4"
    pin:
      none: The Keycloak operator is not installed from a Git Subscription.
  trusted_artifact_signer:
    name: Red Hat Trusted Artifact Signer
    docs_slug: red_hat_trusted_artifact_signer
    docs_version: "1.5"
    pin:
      file: gitops/stages/070-advanced-app-platform/070-pipelines/operators/rhtas-subscription.yaml
      field: spec.channel
      pattern: 'stable-v(\d+\.\d+)'
  red_hat_ai:
    name: Red Hat AI
    docs_slug: red_hat_ai
    docs_version: "3"
    pin:
      none: Portfolio-level documentation; versioned by major release only.

route_update_rules:
  when_adding_skill:
    - Add a route with product, category, book, status, skill, sections and reviewed.
    - Keep the skill path flat under .agents/skills/<skill-name>/.
    - Update AGENTS.md only if it explicitly lists skill names.
  when_upgrading_product:
    - Change the Git pin (Subscription channel, startingCSV or operator policy) first.
    - Set docs_version here to the same minor; the checker fails until both agree.
    - Run .agents/tools/check-doc-links.py; it lists every skill and README link behind.
    - Re-read the release notes and each cited section, adjust repo decisions and
      pitfalls, fix renamed book slugs and anchors, then bump each skill's docs-version.
    - Prefer updating existing skills over creating versioned skill names.
