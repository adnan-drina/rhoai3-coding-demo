route_update_rules:
  when_adding_skill:
    - Add a route with product, category, book, status, skill, sections and reviewed.
    - Keep the skill path flat under .agents/skills/<skill-name>/.
    - Update AGENTS.md only if it explicitly lists skill names.
  when_upgrading_product:
    - Change the Git pin (Subscription channel, startingCSV or operator policy) first.
    - Set docs_version here to the same minor; the checker fails until both agree.
    - Run scripts/shared/check-doc-links.py; it lists every skill and README link behind.
    - Re-read the release notes and each cited section, adjust repo decisions and
      pitfalls, fix renamed book slugs and anchors, then bump each skill's docs-version.
    - Prefer updating existing skills over creating versioned skill names.
