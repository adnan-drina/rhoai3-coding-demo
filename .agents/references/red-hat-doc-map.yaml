schema_version: 2
owner: project-red-hat-doc-skill-authoring
checker: scripts/shared/check-doc-links.py
purpose: >
  The single registry of Red Hat product documentation versions for this
  repository, and the route from official documentation books to flat repo
  skills. Each product has exactly one docs_version. Its pin names the Git
  file and field that must agree with it. Skills and component READMEs link
  to sections of that version; they do not copy documentation text.

usage:
  - Look up the product, its docs_version and the book or section you need.
  - Build links from docs_url_template; never use /latest/ or another version.
  - Prefer an existing routed skill before creating a new one.
  - Record provenance here (route `reviewed` and `sections`), not in skill
    reference files.
  - Do not create nested skill folders to match documentation categories.
  - Run scripts/shared/check-doc-links.py after changing this file, a skill,
    or a component README.

docs_url_template: "https://docs.redhat.com/en/documentation/{docs_slug}/{docs_version}/"

# Families whose skills follow the thin-skill contract (no copied documentation,
# no official-doc-extraction.md, no source-capture.md, frontmatter product and
# docs-version). The checker fails on findings in these families and only
# reports findings in the others.
converted_families:
  - odf
  - rhcl

# Backticked names on skill lines that look like skill names but are not skills.
skill_reference_ignore: [rhcl-operator, ocp-baseline]

status_values:
  active: Skill exists and is the preferred route.
  planned: Skill does not exist yet but the route is expected.
  blocked-baseline: Do not create until the product version is pinned here.

source_types:
  docs_redhat_com: Versioned Red Hat product documentation on docs.redhat.com.
  customer_portal_article: Red Hat Customer Portal article or lifecycle policy
    outside docs.redhat.com.
  external_redhat_product_docs: Versioned docs.redhat.com documentation for a
    Red Hat product outside the current product family.
  repo_specific: Repo-owned guidance that is grounded in official docs but is
    not itself a Red Hat documentation book.

# Product fields:
#   docs_slug      path segment on docs.redhat.com
#   docs_version   the documentation version every link and skill must use
#   deployed       false when no stage installs the product
#   pin            file + field (+ pattern whose group 1 is the version) that must
#                  equal docs_version; `none: <reason>` when Git holds no pin
#   routes         book -> skill; `sections` are anchor ids in that book;
#                  `reviewed` records the version and date a skill was checked against it

