  rhcl:
    name: Red Hat Connectivity Link
    baseline_component: Red Hat Connectivity Link
    skill_prefix: rhcl-
    docs_slug: red_hat_connectivity_link
    docs_version: "1.4"
    deployed: true
    pin:
      # The Subscription in gitops/stages/040-governed-models-as-a-service/040-maas-operators/rhcl/
      # follows the unversioned `stable` channel; the operator policy holds the qualified minor line.
      file: scripts/lib.sh
      field: OPERATOR_POLICY["rhcl-operator"]
      pattern: "\"rhcl-operator\": \\[\"[^\"]*\", \"(\\d+\\.\\d+)\\.\\d+"
    note: >
