  ocp:
    name: Red Hat OpenShift Container Platform
    baseline_component: Red Hat OpenShift Container Platform
    skill_prefix: ocp-
    rule: .agents/rules/ocp.md
    docs_slug: openshift_container_platform
    docs_version: "4.22"
    deployed: true
