# Continue configuration for DevSpaces workspace
# Placed at ~/.continue/config.yaml (or project .continue/config.yaml)
#
# IMPORTANT: Continue reads environment variables using the syntax below.
# Plain ${VAR} shell interpolation does NOT work in Continue's YAML config.
# Continue supports reading env vars via the `env:` key on provider configs
# starting from v0.9+, or via a wrapper script that generates this file.
#
# DEPLOYMENT STRATEGY: The DevWorkspace init container generates this file
# from the template using envsubst at workspace startup. The template lives
# at .continue/config.yaml.template in the repo; the init script renders it
# to ~/.continue/config.yaml with actual values from the DevWorkspace env.
# See: devworkspace-parasol-insurance.yaml initContainers section.
models:
  - title: "Code Assistant (MaaS)"
    provider: openai
    model: granite-3.3-8b-instruct
    apiBase: "${MAAS_API_BASE_URL}/v1"
    apiKey: "${MAAS_IDE_API_KEY}"

tabAutocompleteModel:
  title: "Code Completion (MaaS)"
  provider: openai
  model: granite-3.3-8b-instruct
  apiBase: "${MAAS_API_BASE_URL}/v1"
  apiKey: "${MAAS_IDE_API_KEY}"

completionOptions:
  temperature: 0.1
  maxTokens: 2048
